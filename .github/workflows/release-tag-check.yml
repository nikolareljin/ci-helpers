name: release-tag-check
#
# The create event has no `branches:` filter — GitHub ignores one silently
# rather than rejecting it, so the filter that used to be here did nothing and
# this workflow started on every branch and every tag created in the repository.
# The push half is filtered properly; the create half is filtered in the job
# below, where an expression actually works.
#
# create is kept rather than dropped: a branch made through the web UI or the
# API fires create and no push, so dropping it would stop checking exactly the
# release branches nobody made from a terminal.
on:
  create:
  push:
    branches:
      - "release/*"

permissions:
  contents: read

jobs:
  check:
    # push arrives pre-filtered; create does not.
    if: >-
      github.event_name != 'create' ||
      (github.event.ref_type == 'branch' &&
      startsWith(github.event.ref, 'release/'))
    runs-on: ubuntu-latest
    # Without this a hung job bills until GitHub's six-hour default (see #132).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check release VERSION matches branch
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check_release_version.sh --branch "${GITHUB_REF_NAME:-}" --repo "${GITHUB_WORKSPACE:-}"

      - name: Check release tag availability
        uses: ./.github/actions/check-release-tag
        with:
          release_branch: ${{ github.ref_name }}
          repo_dir: ${{ github.workspace }}
          fetch_tags: true
