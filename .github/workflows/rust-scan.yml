name: rust-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      rust_toolchain:
        type: string
        default: "stable"
      rust_components:
        type: string
        default: "rustfmt, clippy"
      lint_command:
        type: string
        # `--all-targets`, because without it clippy checks the library and
        # nothing else: not tests, not benches, not examples. Measured on
        # 2026-09-28 with one `len_zero` violation placed in test code --
        #
        #   cargo clippy -- -D warnings                 exit 0
        #   cargo clippy --all-targets -- -D warnings   exit 101
        #
        # A lint that cannot see most of what a repository writes is the kind
        # that reports clean for years.
        default: "cargo fmt -- --check && cargo clippy --all-targets -- -D warnings"
      test_command:
        type: string
        default: "cargo fetch && cargo test"
      audit_command:
        type: string
        default: "cargo audit"

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers scripts commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is empty"; exit 1; }
          [[ "$(git -C .ci-helpers-scripts rev-parse HEAD)" == "$WF_SHA" ]] || { echo "::error::ci-helpers checkout is not $WF_SHA"; exit 1; }
          if git rev-parse --git-dir >/dev/null 2>&1; then
            printf '\n/.ci-helpers-scripts/\n' >> "$(git rev-parse --git-path info/exclude)"
          fi

      # The runner's rustup; a runner without one gets rustup-init pinned by
      # version and sha256 in the library's toolchain-pins.env.
      - name: Setup Rust
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          RUST_COMPONENTS: ${{ inputs.rust_components }}
        run: bash .ci-helpers-scripts/scripts/setup_rust.sh

      - name: Rust lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Rust tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Install cargo-audit
        if: ${{ inputs.audit_command != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-audit --locked

      - name: Cargo audit
        if: ${{ inputs.audit_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.audit_command }}
