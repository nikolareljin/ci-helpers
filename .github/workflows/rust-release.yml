name: rust-release
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      rust_toolchain:
        type: string
        default: "stable"
      bin_name:
        type: string
        required: true
      artifact_dir:
        type: string
        default: "artifacts"
      apt_packages:
        type: string
        default: "build-essential mingw-w64 musl-tools"
      install_deps:
        type: boolean
        default: true
      build_windows:
        type: boolean
        default: true
      build_linux_gnu:
        type: boolean
        default: true
      build_linux_musl:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: true
      linux_gnu_aliases:
        type: string
        default: ""
      release_tag:
        type: string
        default: ""
      binary_links:
        type: string
        default: ""
      binary_base_url:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_notes:
        type: string
        default: ""
      generate_release_notes:
        type: boolean
        default: true

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-10
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Install build dependencies
        if: ${{ inputs.install_deps }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ${{ inputs.apt_packages }}

      - name: Add Rust targets
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_windows }}" = "true" ]; then
            rustup target add x86_64-pc-windows-gnu
          fi
          if [ "${{ inputs.build_linux_gnu }}" = "true" ]; then
            rustup target add x86_64-unknown-linux-gnu
          fi
          if [ "${{ inputs.build_linux_musl }}" = "true" ]; then
            rustup target add x86_64-unknown-linux-musl
          fi
          if [ "${{ inputs.build_macos }}" = "true" ]; then
            rustup target add x86_64-apple-darwin
          fi

      - name: Build release binaries
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bin="${{ inputs.bin_name }}"
          artifact_dir="${{ inputs.artifact_dir }}"
          mkdir -p "$artifact_dir"

          cargo build --release

          if [ "${{ inputs.build_windows }}" = "true" ]; then
            cargo build --release --target=x86_64-pc-windows-gnu
            if [ -f "target/x86_64-pc-windows-gnu/release/${bin}.exe" ]; then
              cp "target/x86_64-pc-windows-gnu/release/${bin}.exe" "${artifact_dir}/${bin}-windows.exe"
            else
              echo "Windows binary not found!" >&2
              exit 1
            fi
          fi

          if [ "${{ inputs.build_linux_gnu }}" = "true" ]; then
            cargo build --release --target=x86_64-unknown-linux-gnu
            if [ -f "target/x86_64-unknown-linux-gnu/release/${bin}" ]; then
              cp "target/x86_64-unknown-linux-gnu/release/${bin}" "${artifact_dir}/${bin}-linux"
            else
              echo "Linux GNU binary not found!" >&2
              exit 1
            fi

            aliases="${{ inputs.linux_gnu_aliases }}"
            if [ -n "$aliases" ]; then
              IFS=',' read -r -a alias_list <<< "$aliases"
              for alias in "${alias_list[@]}"; do
                cp "target/x86_64-unknown-linux-gnu/release/${bin}" "${artifact_dir}/${bin}-${alias}"
              done
            fi
          fi

          if [ "${{ inputs.build_linux_musl }}" = "true" ]; then
            cargo build --release --target=x86_64-unknown-linux-musl
            if [ -f "target/x86_64-unknown-linux-musl/release/${bin}" ]; then
              cp "target/x86_64-unknown-linux-musl/release/${bin}" "${artifact_dir}/${bin}-musl"
            else
              echo "Linux MUSL binary not found!" >&2
              exit 1
            fi
          fi

          if [ "${{ inputs.build_macos }}" = "true" ]; then
            if command -v x86_64-apple-darwin-gcc >/dev/null 2>&1; then
              export CARGO_BUILD_TARGET_X86_64_APPLE_DARWIN_LINKER=x86_64-apple-darwin-gcc
              cargo build --release --target=x86_64-apple-darwin
              if [ -f "target/x86_64-apple-darwin/release/${bin}" ]; then
                cp "target/x86_64-apple-darwin/release/${bin}" "${artifact_dir}/${bin}-mac"
              else
                echo "macOS binary not found!" >&2
              fi
            else
              echo "macOS cross-compiler not found, skipping macOS build."
            fi
          fi

          ls -al "$artifact_dir"

      - name: Collect binary links
        id: binaries
        shell: bash
        env:
          INPUT_BINARY_LINKS: ${{ inputs.binary_links }}
          INPUT_BIN_NAME: ${{ inputs.bin_name }}
          INPUT_BUILD_WINDOWS: ${{ inputs.build_windows }}
          INPUT_BUILD_LINUX_GNU: ${{ inputs.build_linux_gnu }}
          INPUT_LINUX_GNU_ALIASES: ${{ inputs.linux_gnu_aliases }}
          INPUT_BUILD_LINUX_MUSL: ${{ inputs.build_linux_musl }}
          INPUT_BUILD_MACOS: ${{ inputs.build_macos }}
        run: |
          set -euo pipefail
          # A fixed delimiter such as EOF ends the output early when a line of
          # the value is exactly that word, and the rest is parsed as more outputs.
          write_multiline_output() {
            local key="$1"
            local value="$2"
            local delimiter
            delimiter="GH_OUTPUT_${RANDOM}_${RANDOM}_$(date +%s)"
            while [[ "$value" == *"$delimiter"* ]]; do
              delimiter="GH_OUTPUT_${RANDOM}_${RANDOM}_$(date +%s)"
            done
            {
              printf '%s<<%s\n' "$key" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          }

          binary_links="${INPUT_BINARY_LINKS}"
          if [ -n "$binary_links" ]; then
            write_multiline_output "links" "$binary_links"
            exit 0
          fi

          links=()
          bin="${INPUT_BIN_NAME}"

          if [ "${INPUT_BUILD_WINDOWS}" = "true" ]; then
            links+=("Windows (.exe)|${bin}-windows.exe")
          fi
          if [ "${INPUT_BUILD_LINUX_GNU}" = "true" ]; then
            links+=("Linux GNU|${bin}-linux")
            aliases="${INPUT_LINUX_GNU_ALIASES}"
            if [ -n "$aliases" ]; then
              IFS=',' read -r -a alias_list <<< "$aliases"
              for alias in "${alias_list[@]}"; do
                case "$alias" in
                  deb) label="Debian (.deb)";;
                  pacman) label="Arch (.pacman)";;
                  yum) label="Yum (.yum)";;
                  redhat) label="RedHat";;
                  *) label="Linux (${alias})";;
                esac
                links+=("${label}|${bin}-${alias}")
              done
            fi
          fi
          if [ "${INPUT_BUILD_LINUX_MUSL}" = "true" ]; then
            links+=("Linux MUSL|${bin}-musl")
          fi
          if [ "${INPUT_BUILD_MACOS}" = "true" ]; then
            links+=("macOS|${bin}-mac")
          fi

          write_multiline_output "links" "$(printf "%s\n" "${links[@]}")"

      # Check out script-helpers only when the producer is actually needed --
      # not when the caller supplied its own release_notes. Pinned to the commit
      # vendored at vendor/.script-helpers-sha (tag 0.28.0); keep the two in step.
      - name: Checkout script-helpers for release notes
        if: ${{ inputs.generate_release_notes && inputs.release_notes == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: nikolareljin/script-helpers
          ref: c9aa9f6340772232d0ffda06c9eb08255bfe4b0d # 0.34.0
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        if: ${{ inputs.generate_release_notes || inputs.release_notes != '' }}
        shell: bash
        env:
          # Everything reaches the shell through the environment, never spliced
          # into the script: a CHANGELOG line or commit subject carrying ${{ }}
          # or a backtick cannot execute.
          RN_VERSION: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          RN_RELEASE_TAG: ${{ inputs.release_tag }}
          RN_OVERRIDE: ${{ inputs.release_notes }}
          # The collected table, not the raw input: it equals binary_links when
          # one was given and is generated from the build targets otherwise.
          RN_BINARY_LINKS: ${{ steps.binaries.outputs.links }}
          RN_BINARY_BASE_URL: ${{ inputs.binary_base_url }}
          RN_REPOSITORY: ${{ github.repository }}
          RN_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"

          release_tag="${RN_RELEASE_TAG:-}"
          [ -n "$release_tag" ] || release_tag="${RN_REF_NAME:-}"
          version="${RN_VERSION:-}"
          [ -n "$version" ] || version="$release_tag"

          if [ -n "${RN_OVERRIDE:-}" ]; then
            # Caller-supplied body, verbatim (binary links still appended below).
            printf '%s\n' "$RN_OVERRIDE" > "$notes_file"
          else
            # A non-version ref (a branch, or workflow_dispatch with no
            # release_tag) has no release to describe. Skip with no body rather
            # than fail the job -- GitHub then uses its own default.
            if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
              echo "release notes: '$version' is not a version; skipping (no body)."
              exit 0
            fi
            producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
            if [ ! -f "$producer" ]; then
              echo "release notes: $producer not found (script-helpers checkout failed)" >&2
              exit 1
            fi
            bash "$producer" --version "$version" --repo "$GITHUB_WORKSPACE" --output "$notes_file"
          fi

          binary_base_url="${RN_BINARY_BASE_URL:-}"
          if [ -z "$binary_base_url" ] && [ -n "$release_tag" ]; then
            binary_base_url="https://github.com/${RN_REPOSITORY}/releases/download/${release_tag}"
          fi
          if [ -n "${RN_BINARY_LINKS:-}" ] && [ -n "$binary_base_url" ]; then
            {
              echo ""
              echo "## Download Binaries"
              echo ""
              echo "| Platform | Binary |"
              echo "|----------|--------|"
            } >> "$notes_file"
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [ -n "$trimmed" ] || continue
              label="${trimmed%%|*}"
              filename="${trimmed#*|}"
              if [ -z "$label" ] || [ -z "$filename" ] || [ "$label" = "$filename" ]; then
                continue
              fi
              printf "| %s | [%s](%s/%s) |\n" "$label" "$filename" "$binary_base_url" "$filename" >> "$notes_file"
            done <<< "$RN_BINARY_LINKS"
          fi

          # A single-line path only -- the body itself never passes through an
          # output, so no heredoc and no delimiter to collide with.
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 @ 2026-09-10
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          # The action's input is `name`; it never had a `release_name`, so this
          # was ignored and every release was named after its tag. An empty
          # release_name keeps that (the action falls back to the existing
          # release's name, then the tag).
          name: ${{ inputs.release_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: ${{ inputs.working_directory }}/${{ inputs.artifact_dir }}/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
