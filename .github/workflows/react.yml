name: preset-react
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      concurrency_key:
        type: string
        default: ""
      fetch_depth:
        type: number
        default: 0
      node_version:
        type: string
        default: "22"
      install_command:
        type: string
        default: ""
      lint_command:
        type: string
        default: "npm ci && npm run --if-present lint"
      test_command:
        type: string
        default: "npm ci && npm test"
      build_command:
        type: string
        default: "npm run build"
      e2e_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      extra_command:
        type: string
        default: ""
      # Forwarded to the engine, which applies it as the job timeout. Without
      # one a hung job bills until GitHub's six-hour default (#132).
      timeout_minutes:
        type: number
        default: 20

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      concurrency_key: ${{ inputs.concurrency_key }}
      fetch_depth: ${{ inputs.fetch_depth }}
      node_version: ${{ inputs.node_version }}
      install_command: ${{ inputs.install_command }}
      lint_command: ${{ inputs.lint_command }}
      test_command: ${{ inputs.test_command }}
      build_command: ${{ inputs.build_command }}
      e2e_command: ${{ inputs.e2e_command }}
      docker_command: ${{ inputs.docker_command }}
      extra_command: ${{ inputs.extra_command }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
