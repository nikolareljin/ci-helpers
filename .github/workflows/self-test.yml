# REPO-LOCAL. Not a reusable workflow.
#
# Calls this repository's own presets by RELATIVE path against committed
# fixtures, so a pull request editing a preset runs the edited file rather than
# whatever @production happens to hold. Same reasoning as docs-site.yml, which
# publishes this repository's site through its own pages preset.
#
# No `paths:` filter, deliberately: a filter that never matches the files under
# test reports green without having run.
name: self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Overrides lint_command only. If installation still lived in that default,
  # the dependency would be missing and the import in the fixture would fail.
  python-install-survives-lint-override:
    uses: ./.github/workflows/python.yml
    with:
      working_directory: tests/fixtures/python-install
      python_version: "3.13"
      lint_command: "python -c 'print(\"lint overridden; install must still have run\")'"
      test_command: "python -m pip install pytest && python -m pytest -q"

  # The C# defaults could not pass anywhere: the lint default installed the
  # standalone dotnet-format tool and handed it --verify-no-changes, a flag only
  # the SDK built-in accepts, so it read the flag as a file name and exited 1.
  # Nothing noticed because no repository had ever called this preset.
  #
  # The fixture holds Solution.sln beside App.csproj. That combination fails a
  # bare `dotnet build` with MSB1011 -- and only because the base names differ;
  # with App.sln it would silently succeed and prove nothing. Passing `project`
  # is what resolves it, so this leg exercises the input and the repaired lint
  # default at once.
  csharp-defaults-can-pass:
    uses: ./.github/workflows/csharp.yml
    with:
      working_directory: tests/fixtures/csharp-project
      project: Solution.sln

  # The other direction. A gate that only ever passes is not a gate, and this
  # one had been green-by-never-running; asserting that unformatted source still
  # fails is what makes the passing leg above mean something.
  csharp-lint-still-fails-on-bad-input:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: "8.0.x"
      - name: Unformatted source must fail the lint default
        shell: bash
        working-directory: tests/fixtures/csharp-project
        run: |
          set -euo pipefail
          printf 'namespace App;\npublic class Bad {   public int X  =>  1; }\n' > Bad.cs
          trap 'rm -f Bad.cs' EXIT
          if dotnet format "Solution.sln" --verify-no-changes; then
            echo "::error::lint passed on deliberately unformatted source; the gate is blind"
            exit 1
          fi
          echo "lint correctly rejected unformatted source"

  # The guard itself, called the way a preset calls it. Asserting it through a
  # copy of its regex is what let csharp-scan.yml drift to having no check at
  # all while the self-test stayed green.
  csharp-guard-accepts-a-real-path:
    uses: ./.github/workflows/validate-dotnet-project.yml
    with:
      project: "src/My App/App.csproj"

  # And the refusals, which cannot be asserted by calling the workflow: a
  # reusable workflow that fails fails the run. This drives the same script the
  # workflow runs, from the workflow file, so there is no second copy of the
  # rule to drift.
  csharp-guard-refuses-bad-projects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Every refusal case is refused, every real path is not
        shell: bash
        run: |
          set -euo pipefail
          # Extract the guard body from the workflow that owns it, so this test
          # cannot pass against a rule that has since changed.
          python3 - <<'PY' > /tmp/guard.sh
          import re, pathlib
          t = pathlib.Path('.github/workflows/validate-dotnet-project.yml').read_text()
          body = t.split('run: |', 1)[1]
          lines = []
          for line in body.split('\n'):
              if line.strip() and not line.startswith('          '):
                  break
              lines.append(line[10:])
          pathlib.Path('/tmp/guard.sh').write_text('\n'.join(lines))
          PY
          test -s /tmp/guard.sh || { echo "::error::could not extract the guard"; exit 1; }
          for bad in '-p:X=Y' 'a.csproj; id' 'a.csproj && id' 'a.csproj$(id)' 'a"b.csproj' "a'b.csproj"; do
            if PROJECT="$bad" bash /tmp/guard.sh >/dev/null 2>&1; then
              echo "::error::guard accepted '$bad'"; exit 1
            fi
          done
          for good in 'App.csproj' 'src/My App/App.csproj' 'a-b/c.sln' ''; do
            if ! PROJECT="$good" bash /tmp/guard.sh >/dev/null 2>&1; then
              echo "::error::guard refused a legitimate value '$good'"; exit 1
            fi
          done
          echo "guard accepts real paths and refuses the rest"

  # The anti-drift gate, driven against a tree built to be broken. A gate whose
  # failing direction is never exercised is the same shape as the C# preset that
  # looked correct because nothing had ever called it -- so this asserts the
  # refusal, not just the pass. The real tree's passing direction is asserted by
  # workflow-yaml-check.yml on every pull request.
  engine-inputs-gate-refuses-a-dropped-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: A preset that stops forwarding an input is refused
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/engine-inputs"
          # The fixture is written by Python, not by a heredoc: a workflow
          # expression written literally in a run: block is substituted by Actions
          # before bash ever sees it, so a heredoc could not emit one. Building
          # the string from parts keeps the sequence out of this file.
          python3 - "$root" <<'PY'
          import pathlib, subprocess, sys, yaml
          root = pathlib.Path(sys.argv[1])
          wf = root / ".github" / "workflows"
          wf.mkdir(parents=True, exist_ok=True)
          (root / "docs").mkdir(exist_ok=True)
          (root / "docs" / "workflows.md").write_text(
              pathlib.Path("docs/workflows.md").read_text(encoding="utf-8"), encoding="utf-8")

          # The fixture's inputs are taken from the gate's own set and the real
          # engine's declarations. Writing them out by hand here made this test a
          # second copy of the list, which went stale the first time the set grew
          # -- the exact failure the gate exists to catch, in the gate's own test.
          names = subprocess.run(
              [sys.executable, "scripts/check_engine_inputs.py", "--print-pass-through"],
              capture_output=True, text=True, check=True).stdout.split()
          engine_doc = yaml.safe_load(pathlib.Path(".github/workflows/ci.yml").read_text())
          engine_inputs = (engine_doc.get("on") or engine_doc.get(True))["workflow_call"]["inputs"]
          decls = {n: dict(engine_inputs[n]) for n in names}

          def dump(doc):
              return yaml.safe_dump(doc, sort_keys=False, default_flow_style=False)

          def engine():
              return dump({"name": "engine",
                           "on": {"workflow_call": {"inputs": decls}},
                           "jobs": {"ci": {"runs-on": "ubuntu-latest",
                                           "steps": [{"run": "true"}]}}})

          def preset(drop=None, diverge=None):
              # Assembled from parts so this file never contains a workflow
              # expression, which Actions would substitute before bash ran.
              expr = lambda n: "$" + "{{ inputs.%s }}" % n
              d = {n: dict(v) for n, v in decls.items()}
              if diverge:
                  d[diverge] = dict(d[diverge], default=987)
              with_ = {n: expr(n) for n in names if n != drop}
              return dump({"name": "preset",
                           "on": {"workflow_call": {"inputs": d}},
                           "jobs": {"ci": {"uses": "./.github/workflows/ci.yml",
                                           "with": with_}}})

          for name in ("ci", "pr-gate"):
              (wf / (name + ".yml")).write_text(engine(), encoding="utf-8")
          (wf / "preset.yml").write_text(preset(), encoding="utf-8")
          (wf / "preset-good.yml.keep").write_text(preset(), encoding="utf-8")
          (wf / "preset-drops.yml").write_text(preset(drop="timeout_minutes"), encoding="utf-8")
          (wf / "preset-diverges.yml").write_text(preset(diverge="timeout_minutes"), encoding="utf-8")
          PY

          gate() { python3 scripts/check_engine_inputs.py --root "$root"; }

          # Sound before broken: if the intact tree did not pass, every refusal
          # below would prove nothing.
          mv "$root/.github/workflows/preset-good.yml.keep" "$root/good.yml"
          mv "$root/.github/workflows/preset-drops.yml" "$root/drops.yml"
          mv "$root/.github/workflows/preset-diverges.yml" "$root/diverges.yml"
          gate

          # 1. a hop that stops forwarding one input
          mv "$root/drops.yml" "$root/.github/workflows/preset.yml"
          if gate; then
            echo "::error::the gate accepted a preset that drops timeout_minutes"; exit 1
          fi

          # 2. a default that disagrees with the engine
          mv "$root/diverges.yml" "$root/.github/workflows/preset.yml"
          if gate; then
            echo "::error::the gate accepted a default that disagrees with the engine"; exit 1
          fi

          # 3. an engine input nobody documented
          python3 - "$root" <<'PY'
          import pathlib, sys, yaml
          root = pathlib.Path(sys.argv[1])
          wf = root / ".github" / "workflows"
          doc = yaml.safe_load((wf / "ci.yml").read_text())
          (doc.get("on") or doc.get(True))["workflow_call"]["inputs"]["undocumented_input"] = {
              "type": "string", "default": ""}
          (wf / "ci.yml").write_text(yaml.safe_dump(doc, sort_keys=False), encoding="utf-8")
          (wf / "preset.yml").write_text(
              (root / "good.yml").read_text(encoding="utf-8"), encoding="utf-8")
          PY
          if gate; then
            echo "::error::the gate accepted an engine input missing from docs/workflows.md"; exit 1
          fi
          echo "refuses a dropped forward, a diverging default and an undocumented input"

  # The submodule input, against a tree that actually has one. Calls the engine
  # directly: what is under test is its checkout, and a preset's stack defaults
  # would only add a Go or Python toolchain to the failure surface. That every
  # preset forwards the input is asserted statically by check_engine_inputs.py,
  # which is cheaper and covers all fourteen rather than one.
  submodules-recursive-checks-out-the-tree:
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: submodules-recursive-checks-out-the-tree
      submodules: recursive
      test_command: test -f tests/fixtures/submodule-consumer/shared/script-helpers/VERSION

  # The other direction, which is the one that can rot silently: if checkout
  # started pulling submodules regardless of the input, the leg above would stay
  # green while the input did nothing.
  submodules-default-leaves-the-tree-absent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Without the input the submodule must be absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tests/fixtures/submodule-consumer/shared/script-helpers/VERSION ]]; then
            echo "::error::the submodule is present without being asked for; the recursive leg proves nothing"
            exit 1
          fi
          echo "default checkout leaves the submodule absent, as expected"

  # The guard, driven from the workflow that owns it rather than through a copy
  # of its case statement -- the same reasoning as the dotnet project guard
  # below. Its refusals cannot be asserted by calling the engine, because a
  # reusable workflow that fails fails the whole run.
  submodules-guard-refuses-values-checkout-would-ignore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Every value checkout would read as false is refused
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/guard.sh"
          import yaml, pathlib, sys
          doc = yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text())
          steps = doc['jobs']['ci']['steps']
          body = next((s['run'] for s in steps if s.get('name') == 'Validate submodules input'), None)
          if not body:
              sys.exit('could not find the validate step in ci.yml')
          sys.stdout.write(body)
          PY
          test -s "${RUNNER_TEMP}/guard.sh" || { echo "::error::could not extract the guard"; exit 1; }
          for bad in yes no 1 0 Recursiv "true " on; do
            if SUBMODULES="$bad" bash "${RUNNER_TEMP}/guard.sh" >/dev/null 2>&1; then
              echo "::error::guard accepted '$bad', which checkout reads as false"
              exit 1
            fi
          done
          for good in false true recursive False TRUE Recursive; do
            if ! SUBMODULES="$good" bash "${RUNNER_TEMP}/guard.sh" >/dev/null 2>&1; then
              echo "::error::guard refused a legitimate value '$good'"
              exit 1
            fi
          done
          echo "guard accepts the three states in any case, refuses everything else"

  # The cache probe, driven against generated trees rather than through a run.
  # What this library owns is the mapping from lockfile to cache setting -- not
  # GitHub's cache service -- and every wrong answer in that mapping is a hard
  # job failure, because setup-node and setup-dotnet fail when told to cache a
  # toolchain whose lockfile is absent. Extracted from ci.yml so there is no
  # second copy of the rule to drift.
  cache-probe-maps-every-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Each fixture tree produces the expected cache settings
        shell: bash
        run: |
          set -uo pipefail
          export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          probe="${RUNNER_TEMP}/probe.sh"
          python3 - <<'PY' > "$probe"
          import yaml, pathlib, sys
          doc = yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text())
          body = next((s['run'] for s in doc['jobs']['ci']['steps']
                       if s.get('name') == 'Detect dependency lockfiles'), None)
          if not body:
              sys.exit('could not find the probe step in ci.yml')
          sys.stdout.write(body)
          PY
          test -s "$probe" || { echo "could not extract the probe"; exit 1; }

          failures=0
          run_case() {           # run_case <name> <cache> <workdir> <expected k=v ...>
            local name="$1" cache="$2" workdir="$3"; shift 3
            local out="${RUNNER_TEMP}/out-$RANDOM"
            : > "$out"
            ( cd "${RUNNER_TEMP}/tree" && CACHE="$cache" WORKDIR="$workdir" \
                GITHUB_OUTPUT="$out" bash "$probe" >/dev/null 2>&1 )
            local rc=$?
            if (( rc != 0 )); then echo "  FAIL $name: probe exited $rc"; failures=$((failures+1)); return; fi
            local pair key want got
            for pair in "$@"; do
              key="${pair%%=*}"; want="${pair#*=}"
              got="$(grep "^${key}=" "$out" | head -1 | cut -d= -f2-)"
              if [[ "$got" != "$want" ]]; then
                echo "  FAIL $name: $key is '$got', expected '$want'"; failures=$((failures+1))
              fi
            done
            [[ $failures -eq 0 ]] && echo "  ok   $name"
          }
          tree() { rm -rf "${RUNNER_TEMP}/tree"; mkdir -p "${RUNNER_TEMP}/tree/$1"; }

          tree .;            : > "${RUNNER_TEMP}/tree/package-lock.json"
          run_case "npm lockfile"          true "." node=npm node_path=./package-lock.json go=false dotnet=false
          tree .;            : > "${RUNNER_TEMP}/tree/yarn.lock"
          run_case "yarn lockfile"         true "." node=yarn node_path=./yarn.lock
          tree .;            : > "${RUNNER_TEMP}/tree/package-lock.json"; : > "${RUNNER_TEMP}/tree/yarn.lock"
          run_case "both lockfiles"        true "." node=npm node_path=./package-lock.json
          tree .
          run_case "empty tree"            true "." node= python= go=false java= dotnet=false
          tree .;            : > "${RUNNER_TEMP}/tree/poetry.lock"
          run_case "poetry only"           true "." python= python_path=
          tree .;            : > "${RUNNER_TEMP}/tree/requirements-dev.txt"
          run_case "requirements-dev only" true "." python=pip 'python_path=./requirements*.txt'
          tree apps/web;     : > "${RUNNER_TEMP}/tree/apps/web/package-lock.json"
          run_case "monorepo path"         true "apps/web" node=npm node_path=apps/web/package-lock.json
          run_case "trailing slash"        true "apps/web/" node=npm node_path=apps/web/package-lock.json
          tree .;            : > "${RUNNER_TEMP}/tree/go.sum"; : > "${RUNNER_TEMP}/tree/packages.lock.json"
          run_case "go and dotnet"         true "." go=true go_path=./go.sum dotnet=true dotnet_path=./packages.lock.json
          run_case "cache disabled"        false "." go=false dotnet=false node= python= java=
          tree .;            : > "${RUNNER_TEMP}/tree/pom.xml"
          run_case "maven"                 true "." java=maven java_path=./pom.xml
          tree .;            : > "${RUNNER_TEMP}/tree/build.gradle.kts"
          run_case "gradle"                true "." java=gradle 'java_path=./*.gradle*'

          if (( failures )); then echo "$failures probe assertion(s) failed"; exit 1; fi
          echo "probe maps every fixture correctly"

  # And once for real, because the unit leg cannot prove that setup-node accepts
  # what the probe emits. It asserts the decision, not a cache hit: "cold" is
  # false on any re-run, so asserting a hit would flake on the second push.
  cache-npm-is-accepted-on-a-real-run:
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: cache-npm-is-accepted-on-a-real-run
      working_directory: tests/fixtures/cache-node
      node_version: "22"
      test_command: |
        grep -q 'node: npm' "${RUNNER_TEMP}/cache-decisions.txt"
        echo "the probe chose npm and setup-node accepted it"

  # pr-gate.yml has no caller in this repository, so everything this change adds to it --
  # the lockfile probe, the cache option on five setup steps, the summary -- would ship
  # having never run once. That is exactly the shape that let the C# preset stay broken
  # for months: a file nobody calls looks correct indefinitely. Twenty-nine repositories
  # call this workflow on @production, which is a poor place to find out.
  # godot_version rides along here rather than in a leg of its own: pr-gate.yml
  # got the same Setup Godot step as ci.yml, and in #186 a block of pr-gate
  # additions reached main with nothing calling them at all. One extra input
  # proves the step runs rather than merely parses.
  pr-gate-probes-and-caches:
    uses: ./.github/workflows/pr-gate.yml
    with:
      concurrency_key: pr-gate-probes-and-caches
      working_directory: tests/fixtures/cache-node
      node_version: "22"
      godot_version: "4.3.0"
      test_command: |
        grep -q 'node: npm' "${RUNNER_TEMP}/cache-decisions.txt"
        command -v godot >/dev/null || { echo "::error::pr-gate declared godot_version and did not install Godot"; exit 1; }
        echo "pr-gate ran the probe, setup-node accepted its answer, and its Setup Godot step ran"

  # Go, on a real runner, through its preset.
  #
  # The self-test exercised node and python only, so the Go cache path had never run --
  # and Go is the fleet's most-used preset. setup-go already defaults its own `cache` to
  # true, so a wrong cache-dependency-path here does not degrade gracefully: it fails
  # every Go consumer at once, on the first push after `production` moves.
  cache-go-is-accepted-on-a-real-run:
    uses: ./.github/workflows/go.yml
    with:
      concurrency_key: cache-go-is-accepted-on-a-real-run
      working_directory: tests/fixtures/cache-go
      go_version: "1.24"
      test_command: |
        grep -q 'go: enabled' "${RUNNER_TEMP}/cache-decisions.txt"
        echo "the probe enabled the Go cache, and setup-go accepted its dependency path"

  # Maven, the last cache branch that could fail hard and had no leg.
  #
  # setup-java's cache is opt-in, so `cache: maven` is new behaviour for every Java
  # consumer -- and a wrong cache-dependency-path fails the step rather than quietly
  # skipping the cache. The commands are stubbed because what is under test is the cache
  # wiring, not Maven.
  cache-maven-is-accepted-on-a-real-run:
    uses: ./.github/workflows/java.yml
    with:
      concurrency_key: cache-maven-is-accepted-on-a-real-run
      working_directory: tests/fixtures/cache-maven
      java_version: "17"
      lint_command: echo "lint is not what this leg proves"
      build_command: echo "build is not what this leg proves"
      test_command: |
        grep -q 'java: maven' "${RUNNER_TEMP}/cache-decisions.txt"
        echo "the probe chose maven, and setup-java accepted its dependency path"

  # Godot, proven rather than asserted. The fixture's test runner refers to a
  # `class_name`, which only resolves after an import -- so if the preset ever
  # stops importing, this leg fails to parse and (because Godot exits 0 anyway)
  # is caught by the log check, not by the exit status.
  godot-imports-and-tests-a-real-project:
    uses: ./.github/workflows/godot.yml
    with:
      concurrency_key: godot-imports-and-tests-a-real-project
      working_directory: tests/fixtures/godot-project
      godot_version: "4.3.0"
      test_command: |
        set -uo pipefail
        log="$(mktemp)"
        godot --headless --import
        godot --headless --script res://tests/TestRunner.gd 2>&1 | tee "$log"
        if grep -nE "ERROR:|Failed to load|Parse Error" "$log" | grep -vE 'Parameter "m" is null'; then
          echo "::error::the fixture produced engine errors while exiting 0"
          exit 1
        fi
        grep -q "all tests passed" "$log" || { echo "::error::the runner never reported success"; exit 1; }

  # The default test_command must FAIL. A Godot preset whose default passes is
  # a gate that cannot fail, because Godot exits 0 after an error -- so this
  # runs the default the preset actually declares, read out of the file rather
  # than copied, and fails the leg if it succeeds.
  godot-default-test-command-refuses-to-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: The declared default must refuse to pass
        shell: bash
        run: |
          set -euo pipefail
          default="$(python3 -c "
          import yaml, sys
          doc = yaml.safe_load(open('.github/workflows/godot.yml'))
          on = doc.get('on', doc.get(True))
          print(on['workflow_call']['inputs']['test_command']['default'])
          ")"
          [ -n "$default" ] || { echo "::error::godot.yml declares no test_command default"; exit 1; }
          if bash -c "$default"; then
            echo "::error::the default test_command succeeded; a Godot preset that passes by default cannot fail"
            exit 1
          fi
          echo "the default test_command refused to pass, as it must"

  # `godot --headless --import` exits 0 over a project whose scripts do not
  # parse -- it prints `SCRIPT ERROR: Parse Error` and returns success. The
  # obvious lint default is therefore a gate that cannot fail, and this repo
  # shipped exactly that for one commit. The default now reads the log; this
  # leg runs the default **as declared in godot.yml** against a fixture that
  # deliberately does not parse, and fails if it passes.
  godot-lint-default-rejects-a-project-that-does-not-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - uses: chickensoft-games/setup-godot@c233594225991af5aec714e52457cc76d6df8fa2 # v2.4.2 @ 2026-09-20
        with:
          version: "4.3.0"
          use-dotnet: false
      - name: The declared lint default must reject it, and accept the good one
        shell: bash
        run: |
          set -euo pipefail
          default="$(python3 -c "
          import yaml
          doc = yaml.safe_load(open('.github/workflows/godot.yml'))
          on = doc.get('on', doc.get(True))
          print(on['workflow_call']['inputs']['lint_command']['default'])
          ")"
          [ -n "$default" ] || { echo "::error::godot.yml declares no lint_command default"; exit 1; }

          if (cd tests/fixtures/godot-broken && bash -c "$default"); then
            echo "::error::the lint default passed on a project that does not parse; it is trusting Godot's exit status"
            exit 1
          fi
          echo "the lint default rejected the broken project"

          if ! (cd tests/fixtures/godot-project && bash -c "$default"); then
            echo "::error::the lint default failed on a project that imports cleanly"
            exit 1
          fi
          echo "the lint default accepted the clean project"

  # govulncheck must FAIL on a module with a reachable advisory. A vulnerability
  # checker is easy to write so that it finds none, and nothing about a green
  # scan distinguishes "no advisories" from "never looked".
  #
  # govulncheck exits 3, not 1, when it finds something. The step relies on
  # non-zero, not on a specific code.
  govulncheck-fails-on-a-known-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: "1.25"
      - name: The pinned govulncheck must reject the fixture
        shell: bash
        run: |
          set -euo pipefail
          ver="$(python3 -c "
          import yaml
          d = yaml.safe_load(open('.github/workflows/go-scan.yml'))
          on = d.get('on', d.get(True))
          print(on['workflow_call']['inputs']['govulncheck_version']['default'])
          ")"
          echo "pinned version from go-scan.yml: $ver"
          go install "golang.org/x/vuln/cmd/govulncheck@${ver}"
          cd tests/fixtures/go-vuln
          if "$(go env GOPATH)/bin/govulncheck" ./...; then
            echo "::error::govulncheck passed on a module with a reachable advisory"
            exit 1
          fi
          echo "govulncheck rejected the fixture, as it must"

  # Three modules, one holding go.mod and nothing else. The empty one is the
  # point: `go vet ./...` and `go test ./...` both exit 1 on "no packages", so
  # until the preset guarded its commands a repository with one such module
  # could not adopt it at all. The other two prove a leg runs in its own module
  # -- each test asserts its own module's name, so a leg that ran in the
  # repository root or in its neighbour fails rather than passes.
  go-modules-runs-every-module:
    uses: ./.github/workflows/go.yml
    with:
      working_directory: tests/fixtures/go-modules
      modules: '["api", "worker", "empty"]'

  # The refusals, which cannot be asserted by calling the workflow: a reusable
  # workflow that fails fails the run. This drives the resolver the preset owns,
  # extracted from the preset, so there is no second copy of the rule to drift.
  go-modules-resolver-refuses-bad-input:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Every refusal is refused, and every accepted value normalises
        shell: bash
        run: |
          set -euo pipefail
          script="${RUNNER_TEMP}/resolve.sh"
          python3 - "$script" <<'PY'
          import pathlib, sys, yaml
          doc = yaml.safe_load(pathlib.Path('.github/workflows/go.yml').read_text())
          step = doc['jobs']['resolve-modules']['steps'][0]
          pathlib.Path(sys.argv[1]).write_text(step['run'])
          PY
          test -s "$script" || { echo "::error::could not extract the resolver"; exit 1; }

          resolve() {
            local out="${RUNNER_TEMP}/resolve-out"
            : > "$out"
            MODULES="$1" WORKDIR="${2:-.}" GITHUB_OUTPUT="$out" \
              bash "$script" >/dev/null 2>&1 || return 1
            sed -n 's/^modules=//p' "$out"
          }

          # Each of these must fail loudly. A value that resolved to nothing
          # would expand to a zero-leg matrix, which reports as a skipped job,
          # and a skipped job reads like a pass.
          for bad in '' '[]' 'not json' '{"a":1}' '["  "]' '["/etc"]' \
                     '["../escape"]' '["a", "./a"]' '["api", "api"]'; do
            if resolve "$bad" >/dev/null 2>&1; then
              echo "::error::resolver accepted '${bad}'"; exit 1
            fi
          done

          # And the accepted direction, with the value each must produce.
          # '["a", "./a"]' above is refused only because both normalise to `a`;
          # an incomplete normalisation would let it through as two legs for
          # one directory, so these two cases hold each other up.
          while IFS='|' read -r modules workdir want; do
            [ -n "$modules" ] || continue
            got="$(resolve "$modules" "$workdir")"
            if [ "$got" != "$want" ]; then
              echo "::error::resolve(${modules}, ${workdir}) = ${got}, want ${want}"
              exit 1
            fi
          done <<'CASES'
          ["api"]|.|["api"]
          ["./api"]|.|["api"]
          ["api/"]|src|["src/api"]
          ["."]|.|["."]
          ["api", "worker", "empty"]|tests/fixtures/go-modules|["tests/fixtures/go-modules/api","tests/fixtures/go-modules/worker","tests/fixtures/go-modules/empty"]
          CASES
          echo "the resolver refuses what it cannot expand and normalises the rest"

  # go.yml's fan-out job derives working_directory and concurrency_key per leg,
  # so the engine-inputs gate exempts that one job. An exemption naming a job
  # that no longer exists would go on excusing whatever is written in its place,
  # which is the silent widening the exemption dict was shaped to prevent.
  engine-inputs-exemption-must-name-a-real-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: A stale exemption is refused, not honoured
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, sys

          spec = importlib.util.spec_from_file_location(
              "gate", "scripts/check_engine_inputs.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          sys.argv = ["check_engine_inputs.py"]

          # Sound before broken: if the real exemption set did not pass here,
          # every refusal below would prove nothing.
          if gate.main() != 0:
              print("::error::the gate does not pass on this tree")
              raise SystemExit(1)

          for key in (("go.yml", "no-such-job", "working_directory"),
                      ("no-such-file.yml", "go", "working_directory"),
                      ("go.yml", "go", "not_a_pass_through")):
              saved = dict(gate.EXEMPT)
              gate.EXEMPT[key] = "deliberately stale"
              rc = gate.main()
              gate.EXEMPT.clear()
              gate.EXEMPT.update(saved)
              if rc != 2:
                  print(f"::error::exemption {key} was honoured (exit {rc})")
                  raise SystemExit(1)
          print("a stale exemption is refused")
          PY

  # The preset defaulted to ubuntu-latest while the fleet's one production C#
  # application targets a Windows-only framework, so the preset could not serve
  # it at all. This is the acceptance for the runner input: the fixture builds
  # where it can build, through the preset rather than around it.
  csharp-windows-fixture-builds-on-a-windows-runner:
    uses: ./.github/workflows/csharp.yml
    with:
      runner: windows-latest
      working_directory: tests/fixtures/csharp-windows
      project: WindowsApp.csproj

  # And the direction that makes the leg above mean something. "It builds on
  # Windows" would pass just as well if the fixture's target were not
  # Windows-only at all, which is the shape of every gate here that turned out
  # to be blind to its own subject.
  #
  # This drives `dotnet build` directly rather than calling the preset, for the
  # same reason csharp-guard-refuses-bad-projects drives its script directly: a
  # reusable workflow that fails fails the run, so a refusal cannot be asserted
  # by calling it. What is proved here is the fixture's Windows-only target, on
  # which the preset's Linux behaviour then rests.
  csharp-windows-fixture-fails-clearly-on-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      # Guarantees an SDK is present. It does not pin which one builds: the
      # runner image ships newer SDKs and the observed run resolved
      # /usr/share/dotnet/sdk/10.0.400. The assertion below does not depend on
      # the version -- every SDK that can target Windows refuses to do it here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: "8.0.x"
      - name: A Windows-only target must fail on Linux, and say why
        shell: bash
        working-directory: tests/fixtures/csharp-windows
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/linux-build.log"
          if dotnet build "WindowsApp.csproj" -c Release > "$out" 2>&1; then
            echo "::error::a Windows-only target built on Linux; the fixture proves nothing"
            cat "$out"
            exit 1
          fi
          echo "--- it failed, as it must; full output follows ---"
          cat "$out"
          # Failing is not enough. A missing SDK or a restore error would fail
          # too, and this test would read as a pass while proving nothing about
          # Windows targeting.
          if ! grep -qEi "NETSDK1100|EnableWindowsTargeting|target Windows" "$out"; then
            echo "::error::the build failed for some other reason; see the output above"
            exit 1
          fi
          {
            echo "### Windows-only target on Linux"
            echo ""
            echo "Refused, as it must:"
            echo ""
            echo '```'
            grep -Ei "NETSDK1100|EnableWindowsTargeting|target Windows" "$out" | head -3
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Unity cannot be exercised here: an editor run needs a licence this
  # repository does not have and bills by the minute, which is the whole reason
  # the preset is armed by a repository variable. What can be exercised, and is
  # the part that protects the bill, is the gate that decides whether any of it
  # runs. It is driven from the workflow that owns it, so this cannot pass
  # against a gate that has since changed.
  unity-gate-refuses-and-disarms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: The gate refuses bad input, and stays off unless armed
        shell: bash
        run: |
          set -euo pipefail
          script="${RUNNER_TEMP}/decide.sh"
          python3 - "$script" <<'PY'
          import pathlib, sys, yaml
          doc = yaml.safe_load(pathlib.Path('.github/workflows/unity.yml').read_text())
          pathlib.Path(sys.argv[1]).write_text(doc['jobs']['decide']['steps'][0]['run'])
          PY
          test -s "$script" || { echo "::error::could not extract the gate"; exit 1; }

          # enabled | test_mode | project_path | license | serial | email | password
          decide() {
            local out="${RUNNER_TEMP}/decide-out"
            : > "$out"
            IN_ENABLED="" VAR_ENABLED="$1" IN_TEST_MODE="$2" IN_PROJECT_PATH="$3" \
            HAS_LICENSE="$4" HAS_SERIAL="$5" HAS_EMAIL="$6" HAS_PASSWORD="$7" \
            GITHUB_OUTPUT="$out" GITHUB_STEP_SUMMARY="${RUNNER_TEMP}/decide-sum" \
              bash "$script" >/dev/null 2>&1 || return 1
            sed -n 's/^mode=//p' "$out"
          }

          # Each of these must fail before anything bills.
          while IFS='|' read -r en tm pp lic ser em pw why; do
            [ -n "${en}${tm}" ] || continue
            if decide "$en" "$tm" "$pp" "$lic" "$ser" "$em" "$pw" >/dev/null 2>&1; then
              echo "::error::gate accepted what it must refuse: ${why}"
              exit 1
            fi
          done <<'REFUSE'
          true|bogus|.|true|false|true|true|an unknown test_mode
          |all|/abs|false|false|false|false|an absolute project_path
          |all|a/../b|false|false|false|false|a project_path containing ..
          true|all|.|false|false|false|false|armed with no licence and no serial
          true|all|.|true|false|false|true|armed with a licence but no email
          REFUSE

          # And the accepted direction. The first two are the ones that protect
          # the bill: an unarmed repository is inert and is never asked for a
          # credential it has no reason to hold.
          while IFS='|' read -r en tm pp lic ser em pw want; do
            [ -n "${tm}" ] || continue
            got="$(decide "$en" "$tm" "$pp" "$lic" "$ser" "$em" "$pw")"
            if [ "$got" != "$want" ]; then
              echo "::error::gate(enabled=${en:-<unset>}) = ${got}, want ${want}"
              exit 1
            fi
          done <<'ACCEPT'
          |all|.|false|false|false|false|disabled
          false|all|.|false|false|false|false|disabled
          true|all|.|true|false|true|true|test
          true|editmode|.|false|true|true|true|test
          ACCEPT
          echo "the gate refuses bad input and stays off unless armed"

  # The gate that would have caught a real defect on 2026-09-21: a second
  # `## Unreleased` added above the existing one, which drops everything under
  # the lower heading from the release notes while the file still appears to
  # contain it. Asserting the refusals is the point -- a structure check is easy
  # to write so that it finds nothing.
  changelog-structure-gate-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
      - name: Sound before broken, then each refusal
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/changelog"
          mkdir -p "$tmp"

          # Sound before broken: this repository's own CHANGELOG must pass, or
          # every refusal below proves nothing. It also keeps the gate honest
          # about the four heading shapes this file's history actually holds.
          python3 scripts/check_changelog_structure.py

          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## Unreleased\n\n- b\n' > "$tmp/two.md"
          printf '# Changelog\n\n## 2026-09-21 — v0.31.0\n\n- c\n\n## Unreleased\n\n- a\n' > "$tmp/buried.md"
          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## 2026-09-21 — v0.31.0\n\n- c\n\n## 2026-09-20 — 0.31.0\n\n- d\n' > "$tmp/dupver.md"

          for bad in two buried dupver; do
            if python3 scripts/check_changelog_structure.py --file "$tmp/${bad}.md" >/dev/null 2>&1; then
              echo "::error::the gate accepted ${bad}.md"
              exit 1
            fi
          done

          # And the files that must still pass. A false duplicate fails a correct
          # changelog, and a gate that cries wolf gets switched off -- so these
          # matter as much as the refusals above.
          #
          # old-shapes: date-only headings and a missing `v`, both in this
          #   repository's history. A gate rejecting them could not pass here.
          # dotted-date: read as a SemVer by the first version of this check.
          # prose-version: a dependency named in two headings, likewise.
          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## 2026-09-17 — 0.27.0\n\n- c\n\n## 2026-04-11\n\n- old\n' > "$tmp/old-shapes.md"
          printf '# Changelog\n\n## 2026.09.21\n\n- a\n\n## 2026.09.20\n\n- b\n' > "$tmp/dotted-date.md"
          printf '# Changelog\n\n## 2026-05-01 — bump Node 20.1.0\n\n- a\n\n## 2026-04-01 — pin Node 20.1.0\n\n- b\n' > "$tmp/prose-version.md"
          for good in old-shapes dotted-date prose-version; do
            if ! python3 scripts/check_changelog_structure.py --file "$tmp/${good}.md" >/dev/null 2>&1; then
              echo "::error::the gate refused a correct file: ${good}.md"
              python3 scripts/check_changelog_structure.py --file "$tmp/${good}.md" || true
              exit 1
            fi
          done

          echo "the gate refuses a second Unreleased, a buried one, and a repeated version"

  # The PR gate had no Go preset, so a Go caller either pinned a version locally
  # or got no Go setup at all. These two legs together are what prove the preset
  # sets Go up: asserting only the default would pass even if setup never ran,
  # because the runner image already ships a 1.25.
  #
  # This leg takes the default and asserts the version it names.
  go-pr-gate-uses-the-shared-default:
    uses: ./.github/workflows/go-pr-gate.yml
    with:
      working_directory: tests/fixtures/go-modules/api
      test_command: 'go version && go version | grep -q "go1\.25\." && echo "the shared default is in force"'
      build_command: ""

  # And this leg names a version the image does not ship, so it can only pass if
  # the gate actually ran its Setup Go step.
  go-pr-gate-honours-a-named-version:
    uses: ./.github/workflows/go-pr-gate.yml
    with:
      working_directory: tests/fixtures/go-modules/api
      go_version: "1.24"
      lint_command: ""
      test_command: 'go version && go version | grep -q "go1\.24\." && echo "Setup Go ran; the image ships a different version"'
      build_command: ""

  assert-ran:
    needs:
      - engine-inputs-gate-refuses-a-dropped-forward
      - submodules-recursive-checks-out-the-tree
      - submodules-default-leaves-the-tree-absent
      - submodules-guard-refuses-values-checkout-would-ignore
      - cache-probe-maps-every-lockfile
      - cache-npm-is-accepted-on-a-real-run
      - pr-gate-probes-and-caches
      - cache-go-is-accepted-on-a-real-run
      - cache-maven-is-accepted-on-a-real-run
      - python-install-survives-lint-override
      - csharp-defaults-can-pass
      - csharp-lint-still-fails-on-bad-input
      - csharp-guard-accepts-a-real-path
      - csharp-guard-refuses-bad-projects
      - godot-imports-and-tests-a-real-project
      - godot-default-test-command-refuses-to-pass
      - godot-lint-default-rejects-a-project-that-does-not-parse
      - govulncheck-fails-on-a-known-advisory
      - go-modules-runs-every-module
      - go-modules-resolver-refuses-bad-input
      - engine-inputs-exemption-must-name-a-real-job
      - csharp-windows-fixture-builds-on-a-windows-runner
      - csharp-windows-fixture-fails-clearly-on-linux
      - unity-gate-refuses-and-disarms
      - changelog-structure-gate-refuses-what-it-must
      - go-pr-gate-uses-the-shared-default
      - go-pr-gate-honours-a-named-version
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A skipped leg is not a pass
        env:
          RESULTS: >-
            engine-inputs-gate-refuses-a-dropped-forward=${{ needs.engine-inputs-gate-refuses-a-dropped-forward.result }}
            submodules-recursive-checks-out-the-tree=${{ needs.submodules-recursive-checks-out-the-tree.result }}
            submodules-default-leaves-the-tree-absent=${{ needs.submodules-default-leaves-the-tree-absent.result }}
            submodules-guard-refuses-values-checkout-would-ignore=${{ needs.submodules-guard-refuses-values-checkout-would-ignore.result }}
            cache-probe-maps-every-lockfile=${{ needs.cache-probe-maps-every-lockfile.result }}
            cache-npm-is-accepted-on-a-real-run=${{ needs.cache-npm-is-accepted-on-a-real-run.result }}
            pr-gate-probes-and-caches=${{ needs.pr-gate-probes-and-caches.result }}
            cache-go-is-accepted-on-a-real-run=${{ needs.cache-go-is-accepted-on-a-real-run.result }}
            cache-maven-is-accepted-on-a-real-run=${{ needs.cache-maven-is-accepted-on-a-real-run.result }}
            python-install-survives-lint-override=${{ needs.python-install-survives-lint-override.result }}
            csharp-defaults-can-pass=${{ needs.csharp-defaults-can-pass.result }}
            csharp-lint-still-fails-on-bad-input=${{ needs.csharp-lint-still-fails-on-bad-input.result }}
            csharp-guard-accepts-a-real-path=${{ needs.csharp-guard-accepts-a-real-path.result }}
            csharp-guard-refuses-bad-projects=${{ needs.csharp-guard-refuses-bad-projects.result }}
            godot-imports-and-tests-a-real-project=${{ needs.godot-imports-and-tests-a-real-project.result }}
            godot-default-test-command-refuses-to-pass=${{ needs.godot-default-test-command-refuses-to-pass.result }}
            godot-lint-default-rejects-a-project-that-does-not-parse=${{ needs.godot-lint-default-rejects-a-project-that-does-not-parse.result }}
            govulncheck-fails-on-a-known-advisory=${{ needs.govulncheck-fails-on-a-known-advisory.result }}
            go-modules-runs-every-module=${{ needs.go-modules-runs-every-module.result }}
            go-modules-resolver-refuses-bad-input=${{ needs.go-modules-resolver-refuses-bad-input.result }}
            engine-inputs-exemption-must-name-a-real-job=${{ needs.engine-inputs-exemption-must-name-a-real-job.result }}
            csharp-windows-fixture-builds-on-a-windows-runner=${{ needs.csharp-windows-fixture-builds-on-a-windows-runner.result }}
            csharp-windows-fixture-fails-clearly-on-linux=${{ needs.csharp-windows-fixture-fails-clearly-on-linux.result }}
            unity-gate-refuses-and-disarms=${{ needs.unity-gate-refuses-and-disarms.result }}
            changelog-structure-gate-refuses-what-it-must=${{ needs.changelog-structure-gate-refuses-what-it-must.result }}
            go-pr-gate-uses-the-shared-default=${{ needs.go-pr-gate-uses-the-shared-default.result }}
            go-pr-gate-honours-a-named-version=${{ needs.go-pr-gate-honours-a-named-version.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in $RESULTS; do
            leg="${pair%%=*}"
            result="${pair#*=}"
            case "$result" in
              success) echo "$leg passed" ;;
              skipped) echo "::error::$leg was skipped; a skip is not a pass"; failed=1 ;;
              *)       echo "::error::$leg result: $result"; failed=1 ;;
            esac
          done
          exit "$failed"