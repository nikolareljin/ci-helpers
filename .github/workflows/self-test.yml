# REPO-LOCAL. Not a reusable workflow.
#
# Calls this repository's own presets by RELATIVE path against committed
# fixtures, so a pull request editing a preset runs the edited file rather than
# whatever @production happens to hold. Same reasoning as docs-site.yml, which
# publishes this repository's site through its own pages preset.
#
# No `paths:` filter, deliberately: a filter that never matches the files under
# test reports green without having run.
name: self-test (engine)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-inputs-gate-refuses-a-dropped-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: A preset that stops forwarding an input is refused
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/engine-inputs"
          # The fixture is written by Python, not by a heredoc: a workflow
          # expression written literally in a run: block is substituted by Actions
          # before bash ever sees it, so a heredoc could not emit one. Building
          # the string from parts keeps the sequence out of this file.
          python3 - "$root" <<'PY'
          import pathlib, subprocess, sys, yaml
          root = pathlib.Path(sys.argv[1])
          wf = root / ".github" / "workflows"
          wf.mkdir(parents=True, exist_ok=True)
          (root / "docs").mkdir(exist_ok=True)
          (root / "docs" / "workflows.md").write_text(
              pathlib.Path("docs/workflows.md").read_text(encoding="utf-8"), encoding="utf-8")

          # The fixture's inputs are taken from the gate's own set and the real
          # engine's declarations. Writing them out by hand here made this test a
          # second copy of the list, which went stale the first time the set grew
          # -- the exact failure the gate exists to catch, in the gate's own test.
          names = subprocess.run(
              [sys.executable, "scripts/check_engine_inputs.py", "--print-pass-through"],
              capture_output=True, text=True, check=True).stdout.split()
          engine_doc = yaml.safe_load(pathlib.Path(".github/workflows/ci.yml").read_text())
          engine_inputs = (engine_doc.get("on") or engine_doc.get(True))["workflow_call"]["inputs"]
          decls = {n: dict(engine_inputs[n]) for n in names}

          def dump(doc):
              return yaml.safe_dump(doc, sort_keys=False, default_flow_style=False)

          def engine():
              return dump({"name": "engine",
                           "on": {"workflow_call": {"inputs": decls}},
                           "jobs": {"ci": {"runs-on": "ubuntu-latest",
                                           "steps": [{"run": "true"}]}}})

          def preset(drop=None, diverge=None):
              # Assembled from parts so this file never contains a workflow
              # expression, which Actions would substitute before bash ran.
              expr = lambda n: "$" + "{{ inputs.%s }}" % n
              d = {n: dict(v) for n, v in decls.items()}
              if diverge:
                  d[diverge] = dict(d[diverge], default=987)
              with_ = {n: expr(n) for n in names if n != drop}
              return dump({"name": "preset",
                           "on": {"workflow_call": {"inputs": d}},
                           "jobs": {"ci": {"uses": "./.github/workflows/ci.yml",
                                           "with": with_}}})

          for name in ("ci", "pr-gate"):
              (wf / (name + ".yml")).write_text(engine(), encoding="utf-8")
          (wf / "preset.yml").write_text(preset(), encoding="utf-8")
          (wf / "preset-good.yml.keep").write_text(preset(), encoding="utf-8")
          (wf / "preset-drops.yml").write_text(preset(drop="timeout_minutes"), encoding="utf-8")
          (wf / "preset-diverges.yml").write_text(preset(diverge="timeout_minutes"), encoding="utf-8")
          PY

          gate() { python3 scripts/check_engine_inputs.py --root "$root"; }

          # Sound before broken: if the intact tree did not pass, every refusal
          # below would prove nothing.
          mv "$root/.github/workflows/preset-good.yml.keep" "$root/good.yml"
          mv "$root/.github/workflows/preset-drops.yml" "$root/drops.yml"
          mv "$root/.github/workflows/preset-diverges.yml" "$root/diverges.yml"
          gate

          # 1. a hop that stops forwarding one input
          mv "$root/drops.yml" "$root/.github/workflows/preset.yml"
          if gate; then
            echo "::error::the gate accepted a preset that drops timeout_minutes"; exit 1
          fi

          # 2. a default that disagrees with the engine
          mv "$root/diverges.yml" "$root/.github/workflows/preset.yml"
          if gate; then
            echo "::error::the gate accepted a default that disagrees with the engine"; exit 1
          fi

          # 3. an engine input nobody documented
          python3 - "$root" <<'PY'
          import pathlib, sys, yaml
          root = pathlib.Path(sys.argv[1])
          wf = root / ".github" / "workflows"
          doc = yaml.safe_load((wf / "ci.yml").read_text())
          (doc.get("on") or doc.get(True))["workflow_call"]["inputs"]["undocumented_input"] = {
              "type": "string", "default": ""}
          (wf / "ci.yml").write_text(yaml.safe_dump(doc, sort_keys=False), encoding="utf-8")
          (wf / "preset.yml").write_text(
              (root / "good.yml").read_text(encoding="utf-8"), encoding="utf-8")
          PY
          if gate; then
            echo "::error::the gate accepted an engine input missing from docs/workflows.md"; exit 1
          fi
          echo "refuses a dropped forward, a diverging default and an undocumented input"

  # The submodule input, against a tree that actually has one. Calls the engine
  # directly: what is under test is its checkout, and a preset's stack defaults
  # would only add a Go or Python toolchain to the failure surface. That every
  # preset forwards the input is asserted statically by check_engine_inputs.py,
  # which is cheaper and covers all fourteen rather than one.
  submodules-recursive-checks-out-the-tree:
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: submodules-recursive-checks-out-the-tree
      submodules: recursive
      test_command: test -f tests/fixtures/submodule-consumer/shared/script-helpers/VERSION

  # The other direction, which is the one that can rot silently: if checkout
  # started pulling submodules regardless of the input, the leg above would stay
  # green while the input did nothing.
  submodules-default-leaves-the-tree-absent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Without the input the submodule must be absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tests/fixtures/submodule-consumer/shared/script-helpers/VERSION ]]; then
            echo "::error::the submodule is present without being asked for; the recursive leg proves nothing"
            exit 1
          fi
          echo "default checkout leaves the submodule absent, as expected"

  # The guard, driven from the workflow that owns it rather than through a copy
  # of its case statement -- the same reasoning as the dotnet project guard
  # below. Its refusals cannot be asserted by calling the engine, because a
  # reusable workflow that fails fails the whole run.
  submodules-guard-refuses-values-checkout-would-ignore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Every value checkout would read as false is refused
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "${RUNNER_TEMP}/guard.sh"
          import yaml, pathlib, sys
          doc = yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text())
          steps = doc['jobs']['ci']['steps']
          body = next((s['run'] for s in steps if s.get('name') == 'Validate submodules input'), None)
          if not body:
              sys.exit('could not find the validate step in ci.yml')
          sys.stdout.write(body)
          PY
          test -s "${RUNNER_TEMP}/guard.sh" || { echo "::error::could not extract the guard"; exit 1; }
          for bad in yes no 1 0 Recursiv "true " on; do
            if SUBMODULES="$bad" bash "${RUNNER_TEMP}/guard.sh" >/dev/null 2>&1; then
              echo "::error::guard accepted '$bad', which checkout reads as false"
              exit 1
            fi
          done
          for good in false true recursive False TRUE Recursive; do
            if ! SUBMODULES="$good" bash "${RUNNER_TEMP}/guard.sh" >/dev/null 2>&1; then
              echo "::error::guard refused a legitimate value '$good'"
              exit 1
            fi
          done
          echo "guard accepts the three states in any case, refuses everything else"

  # The cache probe, driven against generated trees rather than through a run.
  # What this library owns is the mapping from lockfile to cache setting -- not
  # GitHub's cache service -- and every wrong answer in that mapping is a hard
  # job failure, because setup-node and setup-dotnet fail when told to cache a
  # toolchain whose lockfile is absent. Extracted from ci.yml so there is no
  # second copy of the rule to drift.
  cache-probe-maps-every-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Each fixture tree produces the expected cache settings
        shell: bash
        run: |
          set -uo pipefail
          export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          probe="${RUNNER_TEMP}/probe.sh"
          python3 - <<'PY' > "$probe"
          import yaml, pathlib, sys
          doc = yaml.safe_load(pathlib.Path('.github/workflows/ci.yml').read_text())
          body = next((s['run'] for s in doc['jobs']['ci']['steps']
                       if s.get('name') == 'Detect dependency lockfiles'), None)
          if not body:
              sys.exit('could not find the probe step in ci.yml')
          sys.stdout.write(body)
          PY
          test -s "$probe" || { echo "could not extract the probe"; exit 1; }

          failures=0
          run_case() {           # run_case <name> <cache> <workdir> <expected k=v ...>
            local name="$1" cache="$2" workdir="$3"; shift 3
            local out="${RUNNER_TEMP}/out-$RANDOM"
            : > "$out"
            ( cd "${RUNNER_TEMP}/tree" && CACHE="$cache" WORKDIR="$workdir" \
                GITHUB_OUTPUT="$out" bash "$probe" >/dev/null 2>&1 )
            local rc=$?
            if (( rc != 0 )); then echo "  FAIL $name: probe exited $rc"; failures=$((failures+1)); return; fi
            local pair key want got
            for pair in "$@"; do
              key="${pair%%=*}"; want="${pair#*=}"
              got="$(grep "^${key}=" "$out" | head -1 | cut -d= -f2-)"
              if [[ "$got" != "$want" ]]; then
                echo "  FAIL $name: $key is '$got', expected '$want'"; failures=$((failures+1))
              fi
            done
            [[ $failures -eq 0 ]] && echo "  ok   $name"
          }
          tree() { rm -rf "${RUNNER_TEMP}/tree"; mkdir -p "${RUNNER_TEMP}/tree/$1"; }

          tree .;            : > "${RUNNER_TEMP}/tree/package-lock.json"
          run_case "npm lockfile"          true "." node=npm node_path=./package-lock.json go=false dotnet=false
          tree .;            : > "${RUNNER_TEMP}/tree/yarn.lock"
          run_case "yarn lockfile"         true "." node=yarn node_path=./yarn.lock
          tree .;            : > "${RUNNER_TEMP}/tree/package-lock.json"; : > "${RUNNER_TEMP}/tree/yarn.lock"
          run_case "both lockfiles"        true "." node=npm node_path=./package-lock.json
          tree .
          run_case "empty tree"            true "." node= python= go=false java= dotnet=false
          tree .;            : > "${RUNNER_TEMP}/tree/poetry.lock"
          run_case "poetry only"           true "." python= python_path=
          tree .;            : > "${RUNNER_TEMP}/tree/requirements-dev.txt"
          run_case "requirements-dev only" true "." python=pip 'python_path=./requirements*.txt'
          tree apps/web;     : > "${RUNNER_TEMP}/tree/apps/web/package-lock.json"
          run_case "monorepo path"         true "apps/web" node=npm node_path=apps/web/package-lock.json
          run_case "trailing slash"        true "apps/web/" node=npm node_path=apps/web/package-lock.json
          tree .;            : > "${RUNNER_TEMP}/tree/go.sum"; : > "${RUNNER_TEMP}/tree/packages.lock.json"
          run_case "go and dotnet"         true "." go=true go_path=./go.sum dotnet=true dotnet_path=./packages.lock.json
          run_case "cache disabled"        false "." go=false dotnet=false node= python= java=
          tree .;            : > "${RUNNER_TEMP}/tree/pom.xml"
          run_case "maven"                 true "." java=maven java_path=./pom.xml
          tree .;            : > "${RUNNER_TEMP}/tree/build.gradle.kts"
          run_case "gradle"                true "." java=gradle 'java_path=./*.gradle*'

          if (( failures )); then echo "$failures probe assertion(s) failed"; exit 1; fi
          echo "probe maps every fixture correctly"

  # And once for real, because the unit leg cannot prove that setup-node accepts
  # what the probe emits. It asserts the decision, not a cache hit: "cold" is
  # false on any re-run, so asserting a hit would flake on the second push.
  cache-npm-is-accepted-on-a-real-run:
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: cache-npm-is-accepted-on-a-real-run
      working_directory: tests/fixtures/cache-node
      node_version: "22"
      test_command: |
        grep -q 'node: npm' "${RUNNER_TEMP}/cache-decisions.txt"
        echo "the probe chose npm and setup-node accepted it"

  # pr-gate.yml has no caller in this repository, so everything this change adds to it --
  # the lockfile probe, the cache option on five setup steps, the summary -- would ship
  # having never run once. That is exactly the shape that let the C# preset stay broken
  # for months: a file nobody calls looks correct indefinitely. Twenty-nine repositories
  # call this workflow on @production, which is a poor place to find out.
  # godot_version rides along here rather than in a leg of its own: pr-gate.yml
  # got the same Setup Godot step as ci.yml, and in #186 a block of pr-gate
  # additions reached main with nothing calling them at all. One extra input
  # proves the step runs rather than merely parses.
  pr-gate-probes-and-caches:
    uses: ./.github/workflows/pr-gate.yml
    with:
      concurrency_key: pr-gate-probes-and-caches
      working_directory: tests/fixtures/cache-node
      node_version: "22"
      godot_version: "4.3.0"
      test_command: |
        grep -q 'node: npm' "${RUNNER_TEMP}/cache-decisions.txt"
        command -v godot >/dev/null || { echo "::error::pr-gate declared godot_version and did not install Godot"; exit 1; }
        echo "pr-gate ran the probe, setup-node accepted its answer, and its Setup Godot step ran"

  # Go, on a real runner, through its preset.
  #
  # The self-test exercised node and python only, so the Go cache path had never run --
  # and Go is the fleet's most-used preset. setup-go already defaults its own `cache` to
  # true, so a wrong cache-dependency-path here does not degrade gracefully: it fails
  # every Go consumer at once, on the first push after `production` moves.
  engine-inputs-exemption-must-name-a-real-job:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: A stale exemption is refused, not honoured
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, sys

          spec = importlib.util.spec_from_file_location(
              "gate", "scripts/check_engine_inputs.py")
          gate = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gate)
          sys.argv = ["check_engine_inputs.py"]

          # Sound before broken: if the real exemption set did not pass here,
          # every refusal below would prove nothing.
          if gate.main() != 0:
              print("::error::the gate does not pass on this tree")
              raise SystemExit(1)

          for key in (("go.yml", "no-such-job", "working_directory"),
                      ("no-such-file.yml", "go", "working_directory"),
                      ("go.yml", "go", "not_a_pass_through")):
              saved = dict(gate.EXEMPT)
              gate.EXEMPT[key] = "deliberately stale"
              rc = gate.main()
              gate.EXEMPT.clear()
              gate.EXEMPT.update(saved)
              if rc != 2:
                  print(f"::error::exemption {key} was honoured (exit {rc})")
                  raise SystemExit(1)
          print("a stale exemption is refused")
          PY

  # The preset defaulted to ubuntu-latest while the fleet's one production C#
  # application targets a Windows-only framework, so the preset could not serve
  # it at all. This is the acceptance for the runner input: the fixture builds
  # where it can build, through the preset rather than around it.
  # Every reusable workflow is exercised by a leg or says why not. Added after
  # counting: 73 reusable workflows, 22 of them exercised. The other 51 were
  # invisible -- not listed anywhere, not counted anywhere, and three defects
  # this month were in workflows nothing had ever run.
  # Docker. `docker.yml`'s default is `docker build .`, so the fixture is a
  # Dockerfile that asserts its own contents at build time -- a green build
  # then means the image is right, not merely that a build ran.
  docker-defaults-can-pass:
    uses: ./.github/workflows/docker.yml
    with:
      working_directory: tests/fixtures/docker-image
      concurrency_key: docker-defaults-can-pass

  # docker-scan with the pinned Trivy binary. Snyk is disabled; its warning
  # step is driven in docker-refuses-what-it-must, as
  # tests/workflow-coverage.yaml records.
  docker-scan-defaults-can-pass:
    uses: ./.github/workflows/docker-scan.yml
    with:
      dockerfile: tests/fixtures/docker-image/Dockerfile
      context: tests/fixtures/docker-image
      image_name: ci-helpers-selftest:latest
      # The one default this leg overrides, and why: Trivy found CVEs in the
      # Alpine base the first time this ran, which is the preset working. The
      # leg is here to prove the build and the scan execute, and a public base
      # image's CVE count changes without us -- an assertion resting on it
      # would go red on somebody else's schedule, for no defect of ours.
      fail_on_findings: false

  docker-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: A Dockerfile whose own assertion fails fails the build
        shell: bash
        working-directory: tests/fixtures/docker-image
        run: |
          set -uo pipefail
          # The preset's default is `docker build .`, so this is what stands
          # between a broken image and a green run.
          cp Dockerfile /tmp/Dockerfile.orig
          printf '\nRUN test "$(total 1 2)" = "99"\n' >> Dockerfile
          built=0
          docker build -q . > /tmp/broken-build.log 2>&1 || built=$?
          cp /tmp/Dockerfile.orig Dockerfile
          if [[ "$built" -eq 0 ]]; then
            echo "::error::a Dockerfile with a false assertion built successfully"
            exit 1
          fi
          docker build -q . > /tmp/clean-build.log 2>&1 || {
            echo "::error::the fixture itself no longer builds"
            tail -20 /tmp/clean-build.log
            exit 1
          }
          echo "a false assertion fails the build, and the fixture builds"

      - name: Snyk is disabled, says so, and sends nothing
        shell: bash
        run: |
          set -uo pipefail
          # Snyk is a cloud service: `snyk test --docker` uploads the image's
          # dependency graph and metadata, and the call mounted the docker
          # socket and the workspace into a container. It is disabled, and
          # `run_snyk: true` must say so rather than read as a scan that found
          # nothing. Driven by running the workflow's own step, so this cannot
          # drift from what ships.
          # `if` and `|| rc=$?` rather than a bare call and `$?`, because this
          # runs under the runner's `bash -e`: a failing command ends the step
          # at that line, so every check below it would be a silent exit 1
          # reported as "the step simply did not run".
          if ! python3 - <<'PYTHON' > /tmp/snyk-step.sh 2> /tmp/snyk-step.err
          import yaml
          doc = yaml.safe_load(open(".github/workflows/docker-scan.yml"))
          text = open(".github/workflows/docker-scan.yml").read()
          steps = [s for j in doc["jobs"].values() for s in j.get("steps", [])]
          step = next((s for s in steps if s.get("id") == "snyk_disabled"), None)
          if step is None:
              raise SystemExit("no step with id `snyk_disabled` in docker-scan.yml")
          if "uses" in step:
              raise SystemExit("the Snyk step is an action again; Snyk is disabled")
          # Nothing in the workflow runs Snyk or reads its token: no container,
          # no image, no `secrets.snyk_token` outside the declaration.
          for banned in ("docker run", "docker.sock", "snyk test", "snyk/actions", "SNYK_TOKEN", "secrets.snyk_token"):
              if banned in text:
                  raise SystemExit(f"docker-scan.yml contains `{banned}`; Snyk is disabled and its token is never read")
          print(step["run"])
          PYTHON
          then
            echo "::error::$(cat /tmp/snyk-step.err)"
            exit 1
          fi
          summary="$(mktemp)"
          rc=0
          GITHUB_STEP_SUMMARY="$summary" \
            bash --noprofile --norc -e -o pipefail /tmp/snyk-step.sh > /tmp/snyk-out.log 2>&1 \
            || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::the disabled step failed; it was asked to warn"
            cat /tmp/snyk-out.log
            exit 1
          fi
          grep -q "::warning title=Snyk scan disabled" /tmp/snyk-out.log || {
            echo "::error::no warning was emitted"; cat /tmp/snyk-out.log; exit 1; }
          grep -q "was not scanned by Snyk" "$summary" || {
            echo "::error::the job summary does not say the scan did not run"; cat "$summary"; exit 1; }
          echo "run_snyk: warns, does not fail, says so in the summary, and nothing left the runner"

      - name: The image refuses what is not a number
        shell: bash
        working-directory: tests/fixtures/docker-image
        run: |
          set -uo pipefail
          # In ash, $((sum + not-a-number)) is 0 and exits 0, so without the
          # guard in total.sh the image would answer 0 to `total abc` -- a
          # fixture that lies about its own arithmetic proves nothing about the
          # preset that builds it.
          image="$(docker build -q .)"
          answer="$(docker run --rm "$image" 1 2 39)"
          if [[ "$answer" != "42" ]]; then
            echo "::error::the image answered ${answer}, not 42"
            exit 1
          fi
          rc=0
          docker run --rm "$image" abc > /dev/null 2>&1 || rc=$?
          if [[ "$rc" -eq 0 ]]; then
            echo "::error::the image accepted a non-numeric amount"
            exit 1
          fi
          echo "the image adds correctly and refuses what is not a number"

  # The release tag gate, end to end: called on this pull request, whose head is
  # not a release branch, so the gate should decide not to check and pass.
  release-tag-gate-defaults-can-pass:
    uses: ./.github/workflows/release-tag-gate.yml

  # And its decision table. Three of the four paths skip the tag check, and
  # until now nothing tested which path a branch takes.
  release-tag-gate-decides-correctly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 @ 2026-10-22
        with:
          python-version: '3.12'
      - name: Install PyYAML
        shell: bash
        run: python -m pip install --quiet pyyaml

      - name: Every branch takes the path it should
        shell: bash
        run: python3 tests/release_tag_gate_decisions.py

      - name: The table is read from the workflow, not copied from it
        shell: bash
        run: |
          set -uo pipefail
          # If the step is renamed or removed, the table must fail loudly rather
          # than silently testing nothing -- which is what a copied script does.
          cp .github/workflows/release-tag-gate.yml /tmp/gate.yml.orig
          python3 - <<'PYTHON'
          import pathlib
          p = pathlib.Path(".github/workflows/release-tag-gate.yml")
          p.write_text(p.read_text().replace(
              "name: Decide whether to check release tag",
              "name: Decide whether to check the release tag",
          ))
          PYTHON
          rc=0
          python3 tests/release_tag_gate_decisions.py > /tmp/renamed.log 2>&1 || rc=$?
          cp /tmp/gate.yml.orig .github/workflows/release-tag-gate.yml
          if [[ "$rc" -eq 0 ]]; then
            echo "::error::the table passed against a workflow whose step it could not find"
            exit 1
          fi
          grep -q "not found" /tmp/renamed.log || {
            echo "::error::it failed for some other reason"; cat /tmp/renamed.log; exit 1; }
          python3 tests/release_tag_gate_decisions.py > /dev/null || {
            echo "::error::the restored workflow no longer passes its own table"; exit 1; }
          echo "the table reads the shipped step, and says so when it cannot find it"

  production-guard-refuses-bad-moves:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=/usr/bin/git; [[ -x "$git" ]] || git=/mingw64/bin/git.exe
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          submodules: recursive
      - name: create_production.sh refuses off-main, pre-release and older tags
        shell: bash
        run: bash tests/create_production_guard_test.sh

  docs-cover-the-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 @ 2026-10-22
        with:
          python-version: '3.12'
      - name: Install PyYAML
        shell: bash
        run: python -m pip install --quiet pyyaml
      - name: Every workflow, input and action is documented
        shell: bash
        run: python3 scripts/check_docs_coverage.py
      - name: The gate refuses what it must
        shell: bash
        run: bash tests/docs_coverage_test.sh
      - name: Published pages describe current behaviour
        shell: bash
        run: python3 scripts/check_docs_tense.py
      - name: The tense gate refuses what it must
        shell: bash
        run: bash tests/docs_tense_test.sh

  workflow-coverage-is-declared:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 @ 2026-10-22
        with:
          python-version: '3.12'
      - name: Install PyYAML
        shell: bash
        run: python -m pip install --quiet pyyaml

      - name: The tree agrees with the coverage list
        shell: bash
        run: python3 scripts/check_workflow_coverage.py

      - name: The gate refuses what it must
        shell: bash
        run: |
          set -uo pipefail
          # Three ways to be wrong, each driven rather than asserted. A gate
          # that has never failed is a gate nobody has tested.
          root="$(mktemp -d)"
          mkdir -p "$root/.github/workflows" "$root/tests"
          cp .github/workflows/*.yml "$root/.github/workflows/"
          cp tests/workflow-coverage.yaml "$root/tests/"

          printf 'name: brand-new\non:\n  workflow_call:\njobs:\n  a:\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo hi\n' \
            > "$root/.github/workflows/brand-new.yml"
          if python3 scripts/check_workflow_coverage.py --root "$root" > /tmp/unlisted.txt 2>&1; then
            echo "::error::a reusable workflow nobody listed passed the gate"
            exit 1
          fi
          grep -q "brand-new.yml is a reusable workflow that nothing exercises" /tmp/unlisted.txt || {
            echo "::error::the refusal does not name the unlisted workflow"; cat /tmp/unlisted.txt; exit 1; }
          rm "$root/.github/workflows/brand-new.yml"

          # Read a name out of the list rather than naming one here. The
          # hard-coded `rust.yml` broke the moment that workflow gained a leg
          # and left the list -- the gate's own test carrying a second copy of
          # the gate's data, which is the failure this repository keeps
          # finding in other people's code.
          listed="$(python3 -c "
          import yaml
          groups = yaml.safe_load(open('tests/workflow-coverage.yaml'))['groups']
          print(next(w for g in groups.values() for w in g['workflows']))
          ")"
          echo "using the first listed workflow: ${listed}"
          rm "$root/.github/workflows/${listed}"
          if python3 scripts/check_workflow_coverage.py --root "$root" > /tmp/stale.txt 2>&1; then
            echo "::error::an entry naming a workflow that is gone passed the gate"
            exit 1
          fi
          grep -q "${listed} is listed but is not a reusable workflow" /tmp/stale.txt || {
            echo "::error::the refusal does not name the stale entry"; cat /tmp/stale.txt; exit 1; }
          cp ".github/workflows/${listed}" "$root/.github/workflows/"

          # printf, not a heredoc: a heredoc terminator has to sit at column 0,
          # which ends the YAML block scalar this step is written in.
          printf '\n  probe-leg:\n    uses: ./.github/workflows/%s\n    with:\n      working_directory: tests/fixtures/x\n' \
            "${listed}" >> "$root/.github/workflows/self-test-web.yml"
          if python3 scripts/check_workflow_coverage.py --root "$root" > /tmp/covered.txt 2>&1; then
            echo "::error::a listed workflow that gained a leg passed the gate"
            exit 1
          fi
          grep -q "${listed} is listed as .* but a self-test leg calls it" /tmp/covered.txt || {
            echo "::error::the refusal does not name the newly covered workflow"; cat /tmp/covered.txt; exit 1; }

          echo "the gate refuses an unlisted workflow, a stale entry, and a list that has fallen behind"

  # The gate that would have caught a real defect on 2026-09-21: a second
  # `## Unreleased` added above the existing one, which drops everything under
  # the lower heading from the release notes while the file still appears to
  # contain it. Asserting the refusals is the point -- a structure check is easy
  # to write so that it finds nothing.
  changelog-structure-gate-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Sound before broken, then each refusal
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/changelog"
          mkdir -p "$tmp"

          # Sound before broken: this repository's own CHANGELOG must pass, or
          # every refusal below proves nothing. It also keeps the gate honest
          # about the four heading shapes this file's history actually holds.
          python3 scripts/check_changelog_structure.py

          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## Unreleased\n\n- b\n' > "$tmp/two.md"
          printf '# Changelog\n\n## 2026-09-21 — v0.31.0\n\n- c\n\n## Unreleased\n\n- a\n' > "$tmp/buried.md"
          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## 2026-09-21 — v0.31.0\n\n- c\n\n## 2026-09-20 — 0.31.0\n\n- d\n' > "$tmp/dupver.md"

          for bad in two buried dupver; do
            if python3 scripts/check_changelog_structure.py --file "$tmp/${bad}.md" >/dev/null 2>&1; then
              echo "::error::the gate accepted ${bad}.md"
              exit 1
            fi
          done

          # And the files that must still pass. A false duplicate fails a correct
          # changelog, and a gate that cries wolf gets switched off -- so these
          # matter as much as the refusals above.
          #
          # old-shapes: date-only headings and a missing `v`, both in this
          #   repository's history. A gate rejecting them could not pass here.
          # dotted-date: read as a SemVer by the first version of this check.
          # prose-version: a dependency named in two headings, likewise.
          printf '# Changelog\n\n## Unreleased\n\n- a\n\n## 2026-09-17 — 0.27.0\n\n- c\n\n## 2026-04-11\n\n- old\n' > "$tmp/old-shapes.md"
          printf '# Changelog\n\n## 2026.09.21\n\n- a\n\n## 2026.09.20\n\n- b\n' > "$tmp/dotted-date.md"
          printf '# Changelog\n\n## 2026-05-01 — bump Node 20.1.0\n\n- a\n\n## 2026-04-01 — pin Node 20.1.0\n\n- b\n' > "$tmp/prose-version.md"
          for good in old-shapes dotted-date prose-version; do
            if ! python3 scripts/check_changelog_structure.py --file "$tmp/${good}.md" >/dev/null 2>&1; then
              echo "::error::the gate refused a correct file: ${good}.md"
              python3 scripts/check_changelog_structure.py --file "$tmp/${good}.md" || true
              exit 1
            fi
          done

          echo "the gate refuses a second Unreleased, a buried one, and a repeated version"

  shell-checks-this-repository:
    uses: ./.github/workflows/shell.yml
    with:
      concurrency_key: shell-checks-this-repository

  # The fixture, with bats and a clean tree. scripts/script-helpers/vendored.sh
  # trips a warning, so this passes only while the default exclude works on a
  # populated vendored directory.
  shell-runs-bats-and-a-clean-tree:
    uses: ./.github/workflows/shell.yml
    with:
      working_directory: tests/fixtures/shell-project
      shellcheck_paths: "scripts"
      bats_command: "bats tests"
      concurrency_key: shell-runs-bats-and-a-clean-tree

  # The refusals. A `uses:` job cannot carry continue-on-error, so a case that
  # must fail is driven directly, as the other refusal legs here are.
  #
  # The fixture trips SC2044 and passes at `error`, so the assertions are about
  # the default severity rather than about shellcheck.
  shell-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Install shellcheck and bats
        shell: bash
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends shellcheck; }
          command -v bats       >/dev/null 2>&1 || { sudo apt-get update -qq; sudo apt-get install -y --no-install-recommends bats; }

      - name: A warning-severity finding fails at the shipped default
        shell: bash
        working-directory: tests/fixtures/shell-project
        run: |
          set -uo pipefail
          if shellcheck -S warning bad/warns.sh; then
            echo "::error::the fixture no longer trips a warning; the default gates nothing"
            exit 1
          fi
          if ! shellcheck -S error bad/warns.sh; then
            echo "::error::the fixture trips at error too, so it proves nothing about severity"
            exit 1
          fi
          echo "the fixture fails at warning and passes at error, as intended"

      - name: The vendored fixture trips a warning, so the green leg proves the exclusion
        shell: bash
        working-directory: tests/fixtures/shell-project
        run: |
          set -uo pipefail
          # shell-runs-bats-and-a-clean-tree checks scripts/ at the default
          # exclude. It passes only because scripts/script-helpers/vendored.sh is
          # excluded; if the file stopped tripping, that pass would prove nothing.
          if shellcheck -S warning scripts/script-helpers/vendored.sh; then
            echo "::error::the vendored fixture trips nothing; the green leg no longer tests the exclusion"
            exit 1
          fi
          echo "the vendored fixture fails at warning, so the green leg passing means it was excluded"

      - name: A failing bats test fails
        shell: bash
        working-directory: tests/fixtures/shell-project
        run: |
          set -uo pipefail
          if bats tests-failing; then
            echo "::error::the failing bats fixture passed; the bats step gates nothing"
            exit 1
          fi
          bats tests
          echo "bats fails on the failing fixture and passes on the passing one"

      - name: The exclusion is reported, and can be turned off
        shell: bash
        run: |
          set -uo pipefail
          # An exclusion can hide most of a tree, so the count belongs in the
          # log rather than only in the input.
          root="$(mktemp -d)"
          mkdir -p "$root/scripts/script-helpers/scripts"
          printf '#!/usr/bin/env bash\nset -euo pipefail\necho ok\n' > "$root/scripts/mine.sh"
          printf '#!/usr/bin/env bash\nfor f in $(find . -name "*.t"); do echo "$f"; done\n' \
            > "$root/scripts/script-helpers/scripts/vendored.sh"

          kept=$(find "$root/scripts" -type f -name '*.sh' -not -path '*/script-helpers/*' | wc -l)
          all=$(find "$root/scripts" -type f -name '*.sh' | wc -l)
          if [[ "$kept" -ne 1 || "$all" -ne 2 ]]; then
            echo "::error::the fixture does not exercise the exclusion (kept=$kept all=$all)"
            exit 1
          fi

          # With the exclusion off, the vendored warning must be found -- or
          # the exclusion is not what is hiding it.
          if shellcheck -S warning "$root/scripts/script-helpers/scripts/vendored.sh"; then
            echo "::error::the vendored fixture trips nothing, so the exclusion hides nothing"
            exit 1
          fi
          # A top-level directory: find prints "a/x.sh", which no leading */
          # can match, so `*/a/*` used to exclude nothing and say nothing.
          mkdir -p "$root/top"
          printf '#!/usr/bin/env bash\nset -euo pipefail\necho ok\n' > "$root/top/x.sh"
          cand="top/x.sh"
          [[ "$cand" == /* || "$cand" == ./* ]] || cand="./top/x.sh"
          # shellcheck disable=SC2053
          if [[ "$cand" != */top/* ]]; then
            echo "::error::a top-level directory still cannot be excluded"
            exit 1
          fi
          echo "the exclusion hides a real finding, matches a top-level directory, and the count is printed"

      - name: An empty path set is a failure, not a pass
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/no-shell-here
          # The preset refuses when no *.sh is found: a green run that checked
          # nothing looks exactly like one that passed.
          files=()
          while IFS= read -r f; do files+=("$f"); done \
            < <(find /tmp/no-shell-here -type f -name '*.sh' | sort)
          if [[ ${#files[@]} -ne 0 ]]; then
            echo "::error::the empty-path probe found files; it proves nothing"
            exit 1
          fi
          echo "an empty path set is detectable, which is what the preset acts on"

  # Secret and filesystem scanning. Both presets write a SARIF report, and the
  # half that uploads it needs `security-events: write`, which a fork's pull
  # request does not get -- so the scan is driven here and the upload is not.
  #
  # `gitleaks-scan.yml` checks the library out at `job.workflow_sha` and runs
  # the action from there, so this leg runs the preset and the action as this
  # branch has them, and fails if that commit cannot be checked out.
  # `gitleaks-refuses-what-it-must` drives the action directly on a planted key.
  gitleaks-scan-defaults-can-pass:
    uses: ./.github/workflows/gitleaks-scan.yml

  # `foxguard-scan.yml` checks the library out at `job.workflow_sha` the same
  # way. The fixture is a file foxguard parses and reports nothing on; a
  # directory it cannot read is refused, so an empty one would not do.
  # `foxguard-refuses-what-it-must` drives the action on a planted finding.
  foxguard-scan-defaults-can-pass:
    uses: ./.github/workflows/foxguard-scan.yml
    with:
      scan_path: tests/fixtures/foxguard-clean

  # The diff workflows review this repository's own pull request: the base
  # is the PR's base commit, or `before` on a push to main. On a manual run
  # of this suite there is no event base and the run would be refused, so
  # this job hands them the previous commit, as a full sha (the only form
  # of a commit base_ref accepts). `*-diff-refuses-what-it-must` below drive
  # the actions on planted fixtures.
  diff-base-for-a-manual-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base_ref: ${{ steps.pick.outputs.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: pick
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            base="$(git rev-parse HEAD~1)"
          fi
          echo "base_ref=$base" >> "$GITHUB_OUTPUT"
          echo "base_ref: '${base:-from the event}'"

  gitleaks-new-findings-defaults-can-pass:
    needs: diff-base-for-a-manual-run
    uses: ./.github/workflows/gitleaks-new-findings.yml
    with:
      base_ref: ${{ needs.diff-base-for-a-manual-run.outputs.base_ref }}

  foxguard-new-findings-defaults-can-pass:
    needs: diff-base-for-a-manual-run
    uses: ./.github/workflows/foxguard-new-findings.yml
    with:
      base_ref: ${{ needs.diff-base-for-a-manual-run.outputs.base_ref }}

  scan-new-findings-defaults-can-pass:
    needs: diff-base-for-a-manual-run
    uses: ./.github/workflows/scan-new-findings.yml
    with:
      base_ref: ${{ needs.diff-base-for-a-manual-run.outputs.base_ref }}

  # tauri-release.yml runs its signing actions from a checkout of the library
  # at job.workflow_sha, on macOS and Windows runners, and needs signing
  # credentials, so no leg runs it. These are the same four steps with an
  # action that needs no secrets, on each OS that tauri-release.yml uses.
  library-actions-run-from-workflow-commit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: A JSON file with a sensitive key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/probe"
          echo '{"password":"x"}' > "${RUNNER_TEMP}/probe/a.json"

      - name: Check out ci-helpers actions at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers actions commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=/usr/bin/git; [[ -x "$git" ]] || git=/mingw64/bin/git.exe
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }

      # data-safety-scan runs a script that sits beside its action.yml, so a
      # refusal also proves the sparse checkout carries the action's files.
      - name: Run an action from that checkout
        id: scan
        continue-on-error: true
        uses: ./.ci-helpers-actions/.github/actions/data-safety-scan
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          scan_path: ${{ runner.temp }}/probe

      - name: Remove ci-helpers actions checkout
        if: ${{ always() }}
        shell: bash
        run: rm -rf .ci-helpers-actions

      - name: The action ran and the checkout is gone
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]] || { echo "::error::data-safety-scan outcome '$OUTCOME', expected failure on a sensitive key"; exit 1; }
          [[ ! -e .ci-helpers-actions ]] || { echo "::error::.ci-helpers-actions still exists"; exit 1; }

  # windows-sign pfx mode, end to end, with a throwaway self-signed PFX made
  # here: it signs and timestamps a real exe (also one in a nested folder
  # with spaces), refuses a folder with nothing to sign, a wrong password, a
  # timestamp server that does not answer, and an untrusted chain when
  # verify_trust is on, and leaves no PFX file in RUNNER_TEMP and no key in
  # the certificate store, on failure too.
  windows-sign-pfx-signs-a-real-exe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Make a throwaway code-signing PFX and an exe to sign
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $pw = [guid]::NewGuid().ToString()
          Write-Output "::add-mask::$pw"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=ci-helpers windows-sign self-test" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $pfx = Join-Path $env:RUNNER_TEMP "selftest.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          Remove-Item -LiteralPath $pfx
          Add-Content -Path $env:GITHUB_ENV -Value "SELFTEST_PFX_B64=$b64"
          Add-Content -Path $env:GITHUB_ENV -Value "SELFTEST_PFX_PW=$pw"
          Add-Content -Path $env:GITHUB_ENV -Value "SELFTEST_THUMB=$($cert.Thumbprint)"
          foreach ($d in "sign", "untrusted", "nots", "badpw") {
            New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $d) | Out-Null
            # Not a System32 file: those are catalog-signed, and
            # Get-AuthenticodeSignature reports the catalog signer for them,
            # whatever is embedded. pwsh.exe carries only an embedded signature.
            Copy-Item (Join-Path $PSHOME "pwsh.exe") (Join-Path $env:RUNNER_TEMP "$d\app.exe")
          }
          # A nested folder and a name with spaces, as the artifact may carry.
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "sign\nsis dir") | Out-Null
          Copy-Item (Join-Path $PSHOME "pwsh.exe") (Join-Path $env:RUNNER_TEMP "sign\nsis dir\My App_1.0_x64-setup.exe")
          New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "empty") | Out-Null

      - name: Sign with pfx mode
        uses: ./.github/actions/windows-sign
        with:
          sign_mode: pfx
          certificate_base64: ${{ env.SELFTEST_PFX_B64 }}
          certificate_password: ${{ env.SELFTEST_PFX_PW }}
          files_folder: ${{ runner.temp }}/sign
          verify_trust: "false"

      - name: Each exe carries this signature and a timestamp
        shell: pwsh
        env:
          EXE: ${{ runner.temp }}/sign/app.exe
          NESTED_EXE: ${{ runner.temp }}/sign/nsis dir/My App_1.0_x64-setup.exe
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $n = Get-AuthenticodeSignature -LiteralPath $env:NESTED_EXE
          if (-not $n.SignerCertificate -or $n.SignerCertificate.Thumbprint -ne $env:SELFTEST_THUMB -or -not $n.TimeStamperCertificate) {
            Write-Output "::error::the exe in a nested folder with spaces was not signed and timestamped"; exit 1
          }
          $sig = Get-AuthenticodeSignature -LiteralPath $env:EXE
          if (-not $sig.SignerCertificate) { Write-Output "::error::app.exe is not signed"; exit 1 }
          if ($sig.SignerCertificate.Subject -ne "CN=ci-helpers windows-sign self-test") {
            Write-Output "::error::signer is $($sig.SignerCertificate.Subject)"; exit 1
          }
          if ($sig.SignerCertificate.Thumbprint -ne $env:SELFTEST_THUMB) { Write-Output "::error::wrong signer thumbprint"; exit 1 }
          if (-not $sig.TimeStamperCertificate) { Write-Output "::error::app.exe has no timestamp"; exit 1 }
          if (Test-Path "Cert:\CurrentUser\My\$($env:SELFTEST_THUMB)") { Write-Output "::error::the certificate is in the store"; exit 1 }
          if (Get-ChildItem -Path $env:RUNNER_TEMP -Filter "sign-*.pfx" -ErrorAction SilentlyContinue) { Write-Output "::error::a PFX file is left in RUNNER_TEMP"; exit 1 }
          Write-Output "signed by $($sig.SignerCertificate.Subject), timestamped by $($sig.TimeStamperCertificate.Subject)"

      - name: verify_trust on refuses a self-signed chain
        id: untrusted
        continue-on-error: true
        uses: ./.github/actions/windows-sign
        with:
          sign_mode: pfx
          certificate_base64: ${{ env.SELFTEST_PFX_B64 }}
          certificate_password: ${{ env.SELFTEST_PFX_PW }}
          files_folder: ${{ runner.temp }}/untrusted

      - name: A timestamp server that does not answer fails the step
        id: nots
        continue-on-error: true
        uses: ./.github/actions/windows-sign
        with:
          sign_mode: pfx
          certificate_base64: ${{ env.SELFTEST_PFX_B64 }}
          certificate_password: ${{ env.SELFTEST_PFX_PW }}
          timestamp_server: http://127.0.0.1:9/
          files_folder: ${{ runner.temp }}/nots
          verify_trust: "false"

      - name: A wrong password fails the step
        id: badpw
        continue-on-error: true
        uses: ./.github/actions/windows-sign
        with:
          sign_mode: pfx
          certificate_base64: ${{ env.SELFTEST_PFX_B64 }}
          certificate_password: not-the-password
          files_folder: ${{ runner.temp }}/badpw
          verify_trust: "false"

      - name: A folder with nothing to sign fails the step
        id: empty
        continue-on-error: true
        uses: ./.github/actions/windows-sign
        with:
          sign_mode: pfx
          certificate_base64: ${{ env.SELFTEST_PFX_B64 }}
          certificate_password: ${{ env.SELFTEST_PFX_PW }}
          files_folder: ${{ runner.temp }}/empty
          verify_trust: "false"

      - name: Each refusal failed, and left no key behind
        shell: pwsh
        env:
          UNTRUSTED: ${{ steps.untrusted.outcome }}
          NOTS: ${{ steps.nots.outcome }}
          BADPW: ${{ steps.badpw.outcome }}
          EMPTY: ${{ steps.empty.outcome }}
          BADPW_EXE: ${{ runner.temp }}/badpw/app.exe
          UNTRUSTED_EXE: ${{ runner.temp }}/untrusted/app.exe
          NOTS_EXE: ${{ runner.temp }}/nots/app.exe
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $bad = 0
          foreach ($n in "UNTRUSTED", "NOTS", "BADPW", "EMPTY") {
            $o = [Environment]::GetEnvironmentVariable($n)
            if ($o -ne "failure") { Write-Output "::error::$n outcome '$o', expected failure"; $bad = 1 }
          }
          # pwsh.exe arrives signed by Microsoft, so "ours" means our thumbprint.
          function Ours($sig) { $sig.SignerCertificate -and $sig.SignerCertificate.Thumbprint -eq $env:SELFTEST_THUMB }
          # The first two must fail at their own check, not earlier: the
          # untrusted exe is signed and timestamped, the other only signed.
          $u = Get-AuthenticodeSignature -LiteralPath $env:UNTRUSTED_EXE
          if (-not (Ours $u) -or -not $u.TimeStamperCertificate) {
            Write-Output "::error::verify_trust refused before signing and timestamping"; $bad = 1
          }
          $t = Get-AuthenticodeSignature -LiteralPath $env:NOTS_EXE
          if (-not (Ours $t) -or $t.TimeStamperCertificate) {
            Write-Output "::error::the dead timestamp server run did not stop at the timestamp"; $bad = 1
          }
          if (Ours (Get-AuthenticodeSignature -LiteralPath $env:BADPW_EXE)) {
            Write-Output "::error::a wrong password still signed the exe"; $bad = 1
          }
          if (Test-Path "Cert:\CurrentUser\My\$($env:SELFTEST_THUMB)") { Write-Output "::error::a failed run left the certificate in the store"; $bad = 1 }
          if (Get-ChildItem -Path $env:RUNNER_TEMP -Filter "sign-*.pfx" -ErrorAction SilentlyContinue) { Write-Output "::error::a failed run left a PFX file in RUNNER_TEMP"; $bad = 1 }
          exit $bad

  # The action pins a digest per archive; only a real download on each
  # platform proves the pin is that archive's. linux x64 runs above.
  gitleaks-pins-match-each-platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: A directory with one clean file
        shell: bash
        # Not empty: the action refuses a scan that read 0 bytes.
        run: |
          mkdir -p "${RUNNER_TEMP}/clean"
          echo "nothing secret here" > "${RUNNER_TEMP}/clean/README.txt"

      - name: Install against the pinned digest and scan
        id: scan
        uses: ./.github/actions/gitleaks-scan
        with:
          scan_path: ${{ runner.temp }}/clean
          output: ${{ runner.temp }}/clean.sarif

      - name: The verified binary is the pinned release
        shell: bash
        env:
          GL_BIN: ${{ steps.scan.outputs.gl_bin }}
        run: |
          set -euo pipefail
          got="$("$GL_BIN" version)"
          if [[ "$got" != *8.30.1* ]]; then
            echo "::error::expected gitleaks 8.30.1, got '$got'"
            exit 1
          fi
          echo "gitleaks $got on $RUNNER_OS/$RUNNER_ARCH"

  # The action pins a digest per binary; only a real download on each
  # platform proves the pin is that binary's. linux x64 runs above. foxguard
  # publishes no Windows arm64 binary, so that runner is not in the matrix.
  foxguard-pins-match-each-platform:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      # The fixture is inside the checkout, so a pull request scan reads its
      # config from the base commit, which a depth-1 checkout does not hold.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install against the pinned digest and scan
        id: scan
        uses: ./.github/actions/foxguard-scan
        with:
          scan_path: tests/fixtures/foxguard-clean

      - name: The verified binary is the pinned release
        shell: bash
        env:
          FG_BIN: ${{ steps.scan.outputs.fg_bin }}
        run: |
          set -euo pipefail
          got="$("$FG_BIN" --version)"
          if [[ "$got" != *0.14.1* ]]; then
            echo "::error::expected foxguard 0.14.1, got '$got'"
            exit 1
          fi
          echo "foxguard $got on $RUNNER_OS/$RUNNER_ARCH"

  # The diff actions on repositories built at run time (tests/scan_diff_fixture.sh):
  # a base with one old key and one old command injection, and a branch per
  # case. Each case names its own base_ref: the suite's own event is a pull
  # request of this repository, whose base commit is not in the fixture.
  gitleaks-diff-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Repositories with generated keys, nothing committed here
        shell: bash
        run: |
          set -euo pipefail
          bash tests/scan_diff_fixture.sh "${RUNNER_TEMP}/fixture"
          echo "FIXTURE=${RUNNER_TEMP}/fixture" >> "$GITHUB_ENV"

      - name: A clean branch passes (the old key on the base is not reported)
        id: clean
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/clean
          base_ref: main

      - name: A new command injection is not gitleaks' to report
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/new-shell
          base_ref: main

      - name: A renamed file with the old key is not new
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/renamed
          base_ref: main

      - name: A new key fails
        id: new_secret
        continue-on-error: true
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/new-secret
          base_ref: main

      - name: A key added then removed inside the review fails
        id: added_removed
        continue-on-error: true
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/added-removed
          base_ref: main

      - name: A config the branch adds does not silence it
        id: head_config
        continue-on-error: true
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/head-config
          base_ref: main

      - name: An ignore list the branch adds for its own key does not silence it
        id: head_ignore
        continue-on-error: true
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/head-ignore
          base_ref: main

      - name: A base that is not there fails, it does not pass
        id: no_base
        continue-on-error: true
        uses: ./.github/actions/gitleaks-diff
        with:
          scan_path: ${{ env.FIXTURE }}/clean
          base_ref: nosuch-branch

      # The same content the diff passed fails the full scan: the old key is
      # in the tree. Outside a work tree so the full scan reads the files,
      # not this repository's pull request event.
      - name: The old key fails the full scan of the same content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${FIXTURE}/clean-export"
          git -C "${FIXTURE}/clean" archive HEAD | tar -x -C "${FIXTURE}/clean-export"
      - id: full_scan
        continue-on-error: true
        uses: ./.github/actions/gitleaks-scan
        with:
          scan_path: ${{ env.FIXTURE }}/clean-export

      - name: Every verdict is the expected one
        shell: bash
        env:
          NEW_SECRET: ${{ steps.new_secret.outcome }}
          ADDED_REMOVED: ${{ steps.added_removed.outcome }}
          HEAD_CONFIG: ${{ steps.head_config.outcome }}
          HEAD_IGNORE: ${{ steps.head_ignore.outcome }}
          NO_BASE: ${{ steps.no_base.outcome }}
          FULL_SCAN: ${{ steps.full_scan.outcome }}
        run: |
          set -euo pipefail
          bad=0
          for pair in "new key:$NEW_SECRET" "key added then removed:$ADDED_REMOVED" "config on the branch:$HEAD_CONFIG" "ignore list on the branch:$HEAD_IGNORE" "missing base:$NO_BASE" "full scan of the old key:$FULL_SCAN"; do
            [[ "${pair##*:}" == failure ]] || { echo "::error::${pair%:*} did not fail (${pair##*:})"; bad=1; }
          done
          exit "$bad"

      # The job cannot read its own step log, so the action's script is run
      # once more on the failing case with the verified binary, its output
      # kept in a private file and checked, then deleted. The check is then
      # shown to fire on a log that does name the finding.
      - name: The failure names the tool and the branch, nothing of the finding
        shell: bash
        env:
          GL_BIN: ${{ steps.clean.outputs.gl_bin }}
          GITLEAKS_BIN: ${{ steps.clean.outputs.gl_bin }}
          SCAN_PATH: ${{ env.FIXTURE }}/both
          BASE_REF: main
          ACTION_PATH: ${{ github.workspace }}/.github/actions/gitleaks-diff
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp "$RUNNER_TEMP/gitleaks-log.XXXXXX")"
          forbidden="$(mktemp "$RUNNER_TEMP/forbidden.XXXXXX")"
          # Fixture root, file names, rule ids, key material (every line of
          # the planted key but the BEGIN/END markers), counts.
          {
            echo "$FIXTURE"; echo new_key; echo old_key; echo handler.py; echo old.py
            echo private-key; echo no-command-injection; echo CWE; echo "leaks found"
            echo subprocess; echo shell=True
            grep -v -- '-----' "$SCAN_PATH/new_key.pem"
          } > "$forbidden"
          check() {  # $1 = log; exits 1 when the log names the finding
            local hits
            hits="$(grep -c -F -f "$forbidden" "$1" || true)"
            [[ "$hits" -eq 0 ]]
          }
          rc=0
          bash "$ACTION_PATH/run.sh" > "$log" 2>&1 || rc=$?
          bad=0
          [[ "$rc" -eq 1 ]] || { echo "::error::run.sh exited $rc, expected 1"; bad=1; }
          grep -q '^Gitleaks check failed\.$' "$log" || { echo "::error::the failure does not name the tool"; bad=1; }
          grep -q 'https://nikolareljin.github.io/leak-lock/' "$log" || { echo "::error::the failure does not link Leak-Lock"; bad=1; }
          grep -q 'run Scan Repository' "$log" || { echo "::error::the failure does not say what to run"; bad=1; }
          grep -q -E '^Branch: ' "$log" || { echo "::error::the failure does not name the branch"; bad=1; }
          check "$log" || { echo "::error::the failure log names the finding"; bad=1; }
          [[ "$(wc -l < "$log")" -eq 4 ]] || { echo "::error::expected the four notice lines, got $(wc -l < "$log")"; bad=1; }
          # The check fires: a log with one line of the key in it is refused.
          planted="$(mktemp "$RUNNER_TEMP/planted-log.XXXXXX")"
          { cat "$log"; sed -n 2p "$SCAN_PATH/new_key.pem"; } > "$planted"
          if check "$planted"; then echo "::error::the log check passed a log holding key material"; bad=1; fi
          { cat "$log"; echo "Finding: private-key in new_key.pem"; } > "$planted"
          if check "$planted"; then echo "::error::the log check passed a log naming the rule and file"; bad=1; fi
          rm -f "$log" "$planted" "$forbidden"
          exit "$bad"

  foxguard-diff-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Repositories with planted command injections, nothing committed here
        shell: bash
        run: |
          set -euo pipefail
          bash tests/scan_diff_fixture.sh "${RUNNER_TEMP}/fixture"
          echo "FIXTURE=${RUNNER_TEMP}/fixture" >> "$GITHUB_ENV"

      - name: A clean branch passes (the old finding on the base is not reported)
        id: clean
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/clean
          base_ref: main

      - name: A new key is not foxguard's to report
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/new-secret
          base_ref: main

      - name: The old finding moving down the file is not new
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/moved
          base_ref: main

      - name: Renamed files keep their old findings old
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/renamed
          base_ref: main

      - name: A deletion that leaves nothing to read passes
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/deleted
          base_ref: main

      - name: A file moved under a dot directory keeps its old finding old
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/hidden-moved
          base_ref: main

      - name: Old findings moved into or kept in vendor/ stay old
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/noise-moved
          base_ref: main

      - name: An old finding in an edited UTF-16 file stays old
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/utf16-old
          base_ref: main

      - name: A file that did not parse on the base and now does passes
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/broken-old
          base_ref: main

      - name: A minified file allow_unscanned names passes
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/allowed-min
          base_ref: main
          allow_unscanned: |
            docs/**
            static/**/*.min.js

      - name: The same minified file fails without allow_unscanned
        id: allowed_default
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/allowed-min
          base_ref: main

      - name: The same minified file fails when no pattern names it
        id: allowed_other
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/allowed-min
          base_ref: main
          allow_unscanned: other/**/*.min.js,static/*.min.js

      - name: A new command injection in a file allow_unscanned names fails
        id: allowed_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/allowed-new
          base_ref: main
          allow_unscanned: static/**

      - name: A new command injection under vendor/ and build/ fails
        id: noise_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/noise-new
          base_ref: main

      - name: Insecure TLS in vendor/Dockerfile.dev and vendor/nginx.conf fails
        id: named_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/named-new
          base_ref: main

      - name: A new command injection in a.min.js fails
        id: minified_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/minified-new
          base_ref: main

      - name: New command injections in files named like pathspecs fail
        id: magic_names
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/magic-names
          base_ref: main

      - name: A new command injection in a file with a long line fails
        id: long_line
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/long-line
          base_ref: main

      - name: A new command injection in a latin-1 file fails
        id: latin1
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/latin1
          base_ref: main

      - name: A new command injection in a UTF-16 file fails
        id: utf16_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/utf16-new
          base_ref: main

      - name: A UTF-16 byte order mark before plain ASCII fails
        id: bom_ascii
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/bom-ascii
          base_ref: main

      - name: A new command injection in a file that does not parse fails
        id: broken_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/broken-new
          base_ref: main

      - name: A changed file over foxguard's size limit fails
        id: too_large
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/too-large
          base_ref: main

      - name: A new command injection under a dot directory fails
        id: hidden_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/hidden-new
          base_ref: main

      - name: A new file its own .gitignore names fails
        id: ignored
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/ignored
          base_ref: main

      - name: A new file its own .ignore names fails
        id: ignored_dot
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/ignored-dot
          base_ref: main

      - name: A new command injection in a renamed file fails
        id: renamed_new
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/renamed-new
          base_ref: main

      - name: A new command injection fails
        id: new_shell
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/new-shell
          base_ref: main

      - name: A config the branch adds does not silence it
        id: head_config
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/head-config
          base_ref: main

      - name: A base that is not there fails, it does not pass
        id: no_base
        continue-on-error: true
        uses: ./.github/actions/foxguard-diff
        with:
          scan_path: ${{ env.FIXTURE }}/clean
          base_ref: nosuch-branch

      - name: The old finding fails the full scan of the same content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${FIXTURE}/clean-export"
          git -C "${FIXTURE}/clean" archive HEAD | tar -x -C "${FIXTURE}/clean-export"
      - id: full_scan
        continue-on-error: true
        uses: ./.github/actions/foxguard-scan
        with:
          scan_path: ${{ env.FIXTURE }}/clean-export

      - name: Every verdict is the expected one
        shell: bash
        env:
          NEW_SHELL: ${{ steps.new_shell.outcome }}
          RENAMED_NEW: ${{ steps.renamed_new.outcome }}
          IGNORED: ${{ steps.ignored.outcome }}
          IGNORED_DOT: ${{ steps.ignored_dot.outcome }}
          HIDDEN_NEW: ${{ steps.hidden_new.outcome }}
          NOISE_NEW: ${{ steps.noise_new.outcome }}
          MINIFIED_NEW: ${{ steps.minified_new.outcome }}
          TOO_LARGE: ${{ steps.too_large.outcome }}
          LONG_LINE: ${{ steps.long_line.outcome }}
          LATIN1: ${{ steps.latin1.outcome }}
          UTF16_NEW: ${{ steps.utf16_new.outcome }}
          BROKEN_NEW: ${{ steps.broken_new.outcome }}
          BOM_ASCII: ${{ steps.bom_ascii.outcome }}
          MAGIC_NAMES: ${{ steps.magic_names.outcome }}
          NAMED_NEW: ${{ steps.named_new.outcome }}
          HEAD_CONFIG: ${{ steps.head_config.outcome }}
          NO_BASE: ${{ steps.no_base.outcome }}
          FULL_SCAN: ${{ steps.full_scan.outcome }}
          ALLOWED_DEFAULT: ${{ steps.allowed_default.outcome }}
          ALLOWED_OTHER: ${{ steps.allowed_other.outcome }}
          ALLOWED_NEW: ${{ steps.allowed_new.outcome }}
        run: |
          set -euo pipefail
          bad=0
          for pair in "new command injection:$NEW_SHELL" "new injection in a renamed file:$RENAMED_NEW" "file its .gitignore names:$IGNORED" "file its .ignore names:$IGNORED_DOT" "file under a dot directory:$HIDDEN_NEW" "file under vendor/ and build/:$NOISE_NEW" "file named a.min.js:$MINIFIED_NEW" "file over the size limit:$TOO_LARGE" "file with a long line:$LONG_LINE" "latin-1 file:$LATIN1" "UTF-16 file:$UTF16_NEW" "file that does not parse:$BROKEN_NEW" "mark before plain ASCII:$BOM_ASCII" "files named like pathspecs:$MAGIC_NAMES" "files foxguard knows by name:$NAMED_NEW" "config on the branch:$HEAD_CONFIG" "missing base:$NO_BASE" "full scan of the old finding:$FULL_SCAN" "minified file, no allow_unscanned:$ALLOWED_DEFAULT" "minified file no pattern names:$ALLOWED_OTHER" "new injection in an allowed file:$ALLOWED_NEW"; do
            [[ "${pair##*:}" == failure ]] || { echo "::error::${pair%:*} did not fail (${pair##*:})"; bad=1; }
          done
          exit "$bad"

      - name: The failure names the tool and the branch, nothing of the finding
        shell: bash
        env:
          FG_BIN: ${{ steps.clean.outputs.fg_bin }}
          SCAN_PATH: ${{ env.FIXTURE }}/both
          BASE_REF: main
          ACTION_PATH: ${{ github.workspace }}/.github/actions/foxguard-diff
        run: |
          set -euo pipefail
          umask 077
          log="$(mktemp "$RUNNER_TEMP/foxguard-log.XXXXXX")"
          forbidden="$(mktemp "$RUNNER_TEMP/forbidden.XXXXXX")"
          {
            echo "$FIXTURE"; echo new_key; echo old_key; echo handler.py; echo old.py
            echo private-key; echo no-command-injection; echo CWE; echo "new issue"
            echo subprocess; echo shell=True
            grep -v -- '-----' "$SCAN_PATH/new_key.pem"
          } > "$forbidden"
          check() {  # $1 = log; exits 1 when the log names the finding
            local hits
            hits="$(grep -c -F -f "$forbidden" "$1" || true)"
            [[ "$hits" -eq 0 ]]
          }
          rc=0
          bash "$ACTION_PATH/run.sh" > "$log" 2>&1 || rc=$?
          bad=0
          [[ "$rc" -eq 1 ]] || { echo "::error::run.sh exited $rc, expected 1"; bad=1; }
          grep -q '^Foxguard check failed\.$' "$log" || { echo "::error::the failure does not name the tool"; bad=1; }
          grep -q 'https://nikolareljin.github.io/leak-lock/' "$log" || { echo "::error::the failure does not link Leak-Lock"; bad=1; }
          grep -q 'run Scan Repository' "$log" || { echo "::error::the failure does not say what to run"; bad=1; }
          grep -q -E '^Branch: ' "$log" || { echo "::error::the failure does not name the branch"; bad=1; }
          check "$log" || { echo "::error::the failure log names the finding"; bad=1; }
          [[ "$(wc -l < "$log")" -eq 4 ]] || { echo "::error::expected the four notice lines, got $(wc -l < "$log")"; bad=1; }
          planted="$(mktemp "$RUNNER_TEMP/planted-log.XXXXXX")"
          { cat "$log"; echo "handler.py:4 py/no-command-injection"; } > "$planted"
          if check "$planted"; then echo "::error::the log check passed a log naming the rule and file"; bad=1; fi
          rm -f "$log" "$planted" "$forbidden"
          exit "$bad"

  foxguard-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: A directory with a command injection in it
        shell: bash
        # Written here, not committed: this repository's own scan has nothing
        # to find and no suppression is needed.
        run: |
          set -euo pipefail
          planted="${RUNNER_TEMP}/planted"
          mkdir -p "$planted"
          printf 'import subprocess\nimport sys\n\nsubprocess.run(sys.argv[1], shell=True)\n' > "$planted/handler.py"
          echo "PLANTED=$planted" >> "$GITHUB_ENV"

      - name: Security failures remain local
        id: fails
        continue-on-error: true
        uses: ./.github/actions/foxguard-scan
        with:
          scan_path: ${{ env.PLANTED }}

      - name: The same binary passes the clean fixture
        id: clean
        uses: ./.github/actions/foxguard-scan
        with:
          scan_path: tests/fixtures/foxguard-clean

      # The job cannot read its own step log, so the action's script is run
      # once more with the verified binary and its output kept in a private
      # file, checked for what it must and must not say, then deleted.
      - name: The failure names the tool and the branch, nothing else
        shell: bash
        env:
          OUTCOME: ${{ steps.fails.outcome }}
          FG_BIN: ${{ steps.clean.outputs.fg_bin }}
          SCAN_PATH: ${{ env.PLANTED }}
          ACTION_PATH: ${{ github.workspace }}/.github/actions/foxguard-scan
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]] || { echo "::error::the planted finding did not fail the action"; exit 1; }
          umask 077
          log="$(mktemp "$RUNNER_TEMP/foxguard-log.XXXXXX")"
          rc=0
          bash "$ACTION_PATH/run.sh" > "$log" 2>&1 || rc=$?
          bad=0
          [[ "$rc" -eq 1 ]] || { echo "::error::run.sh exited $rc, expected 1"; bad=1; }
          grep -q '^Foxguard check failed\.$' "$log" || { echo "::error::the failure does not name the tool"; bad=1; }
          grep -q 'https://nikolareljin.github.io/leak-lock/' "$log" || { echo "::error::the failure does not link Leak-Lock"; bad=1; }
          grep -q 'run Scan Repository' "$log" || { echo "::error::the failure does not say what to run"; bad=1; }
          # The fixture's path, file, rule, CWE, snippet and count must all stay out.
          if grep -q -E 'planted|handler\.py|no-command-injection|CWE|subprocess|shell=True|[0-9]+ (issue|finding)' "$log"; then
            echo "::error::the failure log names the finding"; bad=1
          fi
          [[ "$(wc -l < "$log")" -eq 4 ]] || { echo "::error::expected the four notice lines, got $(wc -l < "$log")"; bad=1; }
          rm -f "$log"
          exit "$bad"

      - name: Refusal and publication boundary tests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          check_rc=0
          bash tests/foxguard_no_publication_test.sh > "$RUNNER_TEMP/local-checks.log" 2>&1 || check_rc=$?
          rm -f "$RUNNER_TEMP/local-checks.log"
          if [[ "$check_rc" -ne 0 ]]; then
            source vendor/script-helpers/scripts/security_notice.sh
            security_notice Foxguard
            exit "$check_rc"
          fi

  gitleaks-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: A directory with a real key in it
        shell: bash
        run: |
          set -euo pipefail
          # Generated, not written down. Nothing is committed, so this
          # repository's own secret scan has nothing to find and no allowlist
          # is needed -- and a generated key cannot be on anyone's list of
          # known example values.
          #
          # The first version of this used AWS's documented example key, and
          # gitleaks 8.30.1 reported it clean: well-known example credentials
          # are allowlisted on purpose. A planted secret the scanner is meant
          # to ignore proves nothing, so the probe has to be run with the
          # pinned version rather than with whatever is on the machine.
          leaky="${RUNNER_TEMP}/leaky"
          mkdir -p "$leaky"
          openssl genrsa -out "$leaky/id_rsa" 2048
          echo "LEAKY=$leaky" >> "$GITHUB_ENV"

      - name: Security failures remain local
        id: fails
        continue-on-error: true
        uses: ./.github/actions/gitleaks-scan
        with:
          scan_path: ${{ env.LEAKY }}

      - name: Refusal and publication boundary tests
        shell: bash
        env:
          OUTCOME: ${{ steps.fails.outcome }}
        run: |
          set -euo pipefail
          [[ "$OUTCOME" == failure ]] || exit 1
          umask 077
          check_rc=0
          bash tests/gitleaks_no_publication_test.sh > "$RUNNER_TEMP/local-checks.log" 2>&1 || check_rc=$?
          rm -f "$RUNNER_TEMP/local-checks.log"
          if [[ "$check_rc" -ne 0 ]]; then
            source vendor/script-helpers/scripts/security_notice.sh
            security_notice Gitleaks
            exit "$check_rc"
          fi

  # trivy-scan.yml against the fixture pinned to an advisory for the
  # govulncheck leg. `upload_sarif` is off: a self-test that uploaded would
  # file code-scanning alerts against this repository for a dependency that is
  # vulnerable on purpose. The caller still has to grant the permission the
  # called workflow declares, or the run is refused before any job starts.
  trivy-scan-defaults-can-pass:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/trivy-scan.yml
    with:
      scan_path: tests/fixtures/go-vuln
      upload_sarif: false
      upload_artifact: false
      artifact_name: trivy-selftest

  trivy-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      # Through this repository's action, which downloads the binary pinned in
      # scanner-pins.env and verifies it: that is what ships, and what a
      # repointed release would break.
      - name: An advisory fails the scan when asked
        id: vulnerable
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: tests/fixtures/go-vuln
          format: json
          output: ${{ runner.temp }}/vuln.json
          severity: CRITICAL,HIGH
          ignore_unfixed: "true"
          vuln_type: os,library
          fail_on_findings: "true"
          upload_sarif: "false"

      - name: A clean tree does not
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: tests/fixtures/shell-project
          format: json
          output: ${{ runner.temp }}/clean.json
          severity: CRITICAL,HIGH
          ignore_unfixed: "true"
          vuln_type: os,library
          fail_on_findings: "true"
          upload_sarif: "false"

      - name: It failed on the pinned advisory, not on something passing
        shell: bash
        env:
          VULNERABLE_OUTCOME: ${{ steps.vulnerable.outcome }}
        run: |
          set -euo pipefail
          if [[ "$VULNERABLE_OUTCOME" != "failure" ]]; then
            echo "::error::the fixture pinned to an advisory did not fail at exit-code 1"
            exit 1
          fi
          python3 - "${RUNNER_TEMP}/vuln.json" <<'PYTHON'
          import json, sys
          data = json.load(open(sys.argv[1]))
          found = [
              (v["PkgName"], v["InstalledVersion"], v["VulnerabilityID"])
              for r in (data.get("Results") or [])
              for v in (r.get("Vulnerabilities") or [])
          ]
          # Named, not counted: a scan failing for some other reason would
          # satisfy a count and prove nothing about what was scanned. The
          # fixture's go.mod says not to bump this module.
          if not any(pkg == "golang.org/x/text" for pkg, _, _ in found):
              raise SystemExit(f"the failure is not the pinned advisory; found {found}")
          print(f"failed on {len(found)} finding(s) in golang.org/x/text, as pinned")
          PYTHON

  # Trivy scans Dockerfiles, compose files, Kubernetes manifests and Terraform
  # with `--scanners misconfig`, using rulesets that ship with the binary this
  # repository already downloads twice. The capability was one flag away and
  # unused.
  trivy-finds-misconfiguration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      # Through this repository's action: the binary pinned in
      # scanner-pins.env, run offline with the checks that ship inside it
      # (`--skip-check-update`), which is what a caller gets.
      - name: A Dockerfile that runs as root fails
        id: bad
        continue-on-error: true
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: tests/fixtures/iac-misconfig/bad
          scanners: misconfig
          format: json
          output: ${{ runner.temp }}/misconfig-bad.json
          severity: CRITICAL,HIGH
          # The vulnerability-only flags the action always sends, so this leg
          # reproduces what a caller setting `scanners: misconfig` gets.
          # Measured with trivy 0.74.0 and 0.76.2: they make no difference to
          # a misconfiguration scan, and this is what keeps that true rather
          # than assumed.
          vuln_type: os,library
          ignore_unfixed: "true"
          fail_on_findings: "true"
          upload_sarif: "false"

      - name: The same Dockerfile with a USER does not
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: tests/fixtures/iac-misconfig/good
          scanners: misconfig
          format: json
          output: ${{ runner.temp }}/misconfig-good.json
          severity: CRITICAL,HIGH
          vuln_type: os,library
          ignore_unfixed: "true"
          fail_on_findings: "true"
          upload_sarif: "false"

      - name: It failed on the rule the fixture exists for
        shell: bash
        env:
          BAD_OUTCOME: ${{ steps.bad.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BAD_OUTCOME" != "failure" ]]; then
            echo "::error::the root Dockerfile passed a misconfiguration scan"
            exit 1
          fi
          python3 - "${RUNNER_TEMP}/misconfig-bad.json" "${RUNNER_TEMP}/misconfig-good.json" <<'PYTHON'
          import json, sys

          def results(path):
              return json.load(open(path)).get("Results") or []

          found = [
              (m["ID"], m["Severity"], m["Title"])
              for r in results(sys.argv[1])
              for m in (r.get("Misconfigurations") or [])
          ]
          # Named, not counted. A scan failing for another reason satisfies a
          # count and says nothing about what was read.
          if not any(i == "DS-0002" for i, _, _ in found):
              raise SystemExit(f"the failure is not DS-0002; found {found}")

          # And the passing half has to have been *read*. An empty directory
          # exits 0 from this scan exactly as a clean one does -- the only
          # difference is in the report, where an empty one has no results at
          # all. Without this, deleting good/Dockerfile would leave the leg
          # green and proving nothing about the passing direction.
          clean = [r for r in results(sys.argv[2]) if r.get("Type") == "dockerfile"]
          if not clean:
              raise SystemExit(
                  "the passing scan read no Dockerfile at all, so its exit 0 "
                  "means 'nothing to scan' rather than 'nothing wrong'"
              )
          still_wrong = [m["ID"] for r in clean for m in (r.get("Misconfigurations") or [])]
          if still_wrong:
              raise SystemExit(f"the passing fixture is no longer clean: {still_wrong}")
          print(
              f"DS-0002 among {len(found)} finding(s) in bad/, and good/ was read "
              f"and clean"
          )
          PYTHON

      # Both scans report rather than gate: `exit-code: 0`, with the assertion
      # below doing the work. Gating here would fail this leg the day this
      # repository gains a real advisory of its own, which is a finding worth
      # having and not a reason for the skip test to go red.
      # Through the composite action, not the upstream one: that is what
      # `security-weekly.yml` calls, and the forwarding between them is the
      # part that can quietly stop working. Driving Trivy directly here would
      # prove Trivy skips directories, which was never in doubt.
      - name: This repository's own fixtures are findings, until they are skipped
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: "."
          format: json
          output: ${{ runner.temp }}/repo-unskipped.json
          severity: CRITICAL,HIGH
          ignore_unfixed: "true"
          fail_on_findings: "false"
          upload_sarif: "false"

      - name: The same scan, with tests/fixtures left out
        uses: ./.github/actions/trivy-scan
        with:
          scan_path: "."
          format: json
          output: ${{ runner.temp }}/repo-skipped.json
          severity: CRITICAL,HIGH
          ignore_unfixed: "true"
          skip_dirs: tests/fixtures
          fail_on_findings: "false"
          upload_sarif: "false"

      - name: The weekly run skips them, and skipping is what does it
        shell: bash
        run: |
          set -euo pipefail
          # `skip_dirs` is the kind of fix that can silently stop working:
          # nothing goes red when a directory quietly starts being scanned
          # again, the findings just reappear in the Security tab. So the
          # difference is measured, and the configuration that relies on it is
          # checked for still asking.
          python3 - <<'PYTHON'
          import json, os, yaml

          def findings(name):
              path = os.path.join(os.environ["RUNNER_TEMP"], name)
              data = json.load(open(path))
              return [
                  (r.get("Target"), v["VulnerabilityID"])
                  for r in (data.get("Results") or [])
                  for v in (r.get("Vulnerabilities") or [])
              ]

          before, after = findings("repo-unskipped.json"), findings("repo-skipped.json")
          fixture_hits = [t for t, _ in before if t.startswith("tests/fixtures/")]
          if not fixture_hits:
              raise SystemExit(
                  "a scan of this repository no longer finds its own fixtures, so "
                  "this leg proves nothing about skipping them. Either the pins "
                  "were bumped -- they are pinned to advisories on purpose -- or "
                  "the scan is not reading them."
              )
          still = [t for t, _ in after if t.startswith("tests/fixtures/")]
          if still:
              raise SystemExit(f"skip-dirs did not skip them: {sorted(set(still))}")

          weekly = yaml.safe_load(open(".github/workflows/security-weekly.yml"))
          step = next(
              s
              for job in weekly["jobs"].values()
              for s in (job.get("steps") or [])
              if isinstance(s, dict) and str(s.get("uses", "")).endswith("actions/trivy-scan")
          )
          if "tests/fixtures" not in str((step.get("with") or {}).get("skip_dirs", "")):
              raise SystemExit(
                  "the weekly scan no longer skips tests/fixtures, so every "
                  "deliberately vulnerable pin goes back into the Security tab"
              )
          print(
              f"{len(fixture_hits)} finding(s) in tests/fixtures before, "
              f"0 after, and the weekly run still asks for the skip"
          )
          PYTHON

      - name: The two implementations of this scan expose the same inputs
        shell: bash
        run: |
          set -euo pipefail
          # `trivy-scan.yml` and `.github/actions/trivy-scan` both wrap the same
          # action. An input added to one and not the other is invisible until
          # somebody sets it on the wrong one and it is silently ignored --
          # which is how `scanners` came to be added to both in one change.
          python3 - <<'PYTHON'
          import yaml

          action = yaml.safe_load(open(".github/actions/trivy-scan/action.yml"))
          workflow = yaml.safe_load(open(".github/workflows/trivy-scan.yml"))
          triggers = workflow.get(True) or workflow.get("on")

          # The workflow has three of its own: where to run, and whether to
          # upload the report as an artifact. Neither is the action's business.
          workflow_only = {"runner", "upload_artifact", "artifact_name"}

          a = set(action["inputs"])
          w = set(triggers["workflow_call"]["inputs"]) - workflow_only
          if a != w:
              raise SystemExit(
                  f"the preset and the action have drifted:\n"
                  f"  only in the action:   {sorted(a - w)}\n"
                  f"  only in the preset:   {sorted(w - a)}"
              )
          # And both refuse the same thing. An empty `scanners` is accepted by
          # Trivy, scans nothing and exits 0, so a guard that exists in only
          # one of these two leaves the other reporting success on a scan that
          # never happened.
          import pathlib
          for path in (
              ".github/workflows/trivy-scan.yml",
              ".github/actions/trivy-scan/action.yml",
          ):
              if "scanners is empty" not in pathlib.Path(path).read_text():
                  raise SystemExit(
                      f"{path} no longer refuses an empty `scanners`, so a caller "
                      f"passing one gets a green run that scanned nothing"
                  )
          print(f"both expose the same {len(a)} scan inputs, and both refuse an empty one")
          PYTHON

  # CodeQL. There was none in this repository: the `codeql-action` references
  # elsewhere are `upload-sarif` only, for other tools' reports.
  #
  # `upload: false` because a self test must not file code-scanning alerts, and
  # a config file because analysing the whole tree would cost minutes to prove
  # something two files prove. The caller grants the permissions the called
  # workflow declares, or the run is refused before any job starts.
  codeql-scan-analyses-what-it-is-given:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql-scan.yml
    with:
      languages: python
      upload: false
      config_file: tests/fixtures/codeql/python-only.yml
      # Off, or this leg only passes on the pull request that adds the fixture.
      # It found the planted vulnerability on #251 and nothing on the release
      # branch that followed, because there the file is not in the diff.
      diff_informed: false

  # The preset reports its own counts, so the leg can tell "clean" from
  # "analysed nothing". The first run of this leg said `0 result(s), 0 rule(s)`
  # and passed, which is the state the preset was written to make visible --
  # so the fixture now contains something CodeQL's default suite must find.
  codeql-found-what-was-planted:
    needs: [codeql-scan-analyses-what-it-is-given]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The analysis read the fixture and reported it
        shell: bash
        env:
          RESULTS: ${{ needs.codeql-scan-analyses-what-it-is-given.outputs.results }}
          RULES: ${{ needs.codeql-scan-analyses-what-it-is-given.outputs.rules }}
        run: |
          set -euo pipefail
          if [[ "${RULES:-0}" -lt 1 ]]; then
            echo "::error::the analysis ran ${RULES:-0} rules, so it analysed nothing -- a report with no rules is not a clean report"
            exit 1
          fi
          if [[ "${RESULTS:-0}" -lt 1 ]]; then
            echo "::error::CodeQL found nothing in tests/fixtures/python-vuln, which contains a request parameter reaching os.system. Either the fixture was fixed or the analysis did not read it."
            exit 1
          fi
          echo "$RESULTS result(s) from $RULES rule(s): the planted vulnerability was found"

  codeql-refuses-what-it-must:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: An empty languages is refused, by the preset's own step
        shell: bash
        run: |
          set -uo pipefail
          # Driven out of the workflow rather than reimplemented, so the leg
          # cannot pass against a guard that no longer ships.
          if ! python3 - <<'PYTHON' > /tmp/codeql-guard.sh 2> /tmp/codeql-guard.err
          import yaml

          doc = yaml.safe_load(open(".github/workflows/codeql-scan.yml"))
          steps = [s for j in doc["jobs"].values() for s in j.get("steps", [])]
          guard = next(
              (s for s in steps if s.get("name") == "An analysis has to analyse something"),
              None,
          )
          if guard is None:
              raise SystemExit("codeql-scan.yml no longer refuses an empty `languages`")
          print(guard["run"])
          PYTHON
          then
            echo "::error::$(cat /tmp/codeql-guard.err)"
            exit 1
          fi

          for value in "" "   "; do
            rc=0
            LANGUAGES="$value" bash --noprofile --norc -e -o pipefail /tmp/codeql-guard.sh \
              > /tmp/codeql-guard.log 2>&1 || rc=$?
            if [[ "$rc" -eq 0 ]]; then
              echo "::error::languages='$value' was accepted; an analysis of nothing reports no findings"
              exit 1
            fi
            grep -q "languages is empty" /tmp/codeql-guard.log || {
              echo "::error::it failed, but not with the message that explains why"
              cat /tmp/codeql-guard.log
              exit 1
            }
          done

          rc=0
          LANGUAGES="python" bash --noprofile --norc -e -o pipefail /tmp/codeql-guard.sh > /dev/null 2>&1 || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::a real language was refused, so the guard refuses everything"
            exit 1
          fi
          echo "empty and whitespace are refused with a reason, a real language is not"

  # docker-multiarch's build path, without a registry: the binfmt image
  # pinned in toolchain-pins.env, a docker-container builder on the pinned
  # BuildKit, and docker_build.sh for linux/amd64 and linux/arm64 with the
  # Actions cache both ways. The fixture's RUN asserts its own output, so the
  # arm64 half built under emulation. The result is an OCI layout, read
  # back: its index must carry both platforms.
  docker-multiarch-builds-both-platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Set up QEMU from the pinned binfmt image
        id: qemu
        shell: bash
        env:
          QEMU_PLATFORMS: linux/arm64
        run: bash scripts/setup_qemu.sh

      - name: The kernel now runs arm64 binaries
        shell: bash
        env:
          PLATFORMS: ${{ steps.qemu.outputs.platforms }}
        run: |
          set -euo pipefail
          case ",$PLATFORMS," in
            *,linux/arm64,*) echo "linux/arm64 is in: $PLATFORMS" ;;
            *) echo "::error::binfmt reports '$PLATFORMS', without linux/arm64"; exit 1 ;;
          esac

      - name: Set up a builder on the pinned BuildKit
        id: buildx
        shell: bash
        run: bash scripts/setup_buildx.sh

      - name: Expose the Actions cache to buildx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 @ 2026-09-10
        with:
          script: |
            const token = process.env.ACTIONS_RUNTIME_TOKEN || '';
            if (!token) {
              core.setFailed('ACTIONS_RUNTIME_TOKEN is not set; the build cache (type=gha) needs it');
              return;
            }
            core.setSecret(token);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', token);
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }

      - name: Build the fixture for both platforms into an OCI layout
        id: build
        shell: bash
        env:
          CONTEXT: tests/fixtures/docker-image
          PLATFORMS: linux/amd64,linux/arm64
          TAGS: ci-helpers-selftest/multiarch:test
          BUILDER: ${{ steps.buildx.outputs.name }}
          OUTPUTS: type=oci,dest=${{ runner.temp }}/multiarch.tar
          CACHE_FROM: type=gha,scope=self-test-multiarch
          CACHE_TO: type=gha,mode=max,scope=self-test-multiarch
          PUSH: "false"
        run: bash scripts/docker_build.sh

      - name: The index carries linux/amd64 and linux/arm64
        shell: bash
        env:
          TARBALL: ${{ runner.temp }}/multiarch.tar
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          [[ -s "$TARBALL" ]] || { echo "::error::no OCI layout at $TARBALL"; exit 1; }
          python3 - "$TARBALL" <<'PY'
          import json, sys, tarfile
          tar = tarfile.open(sys.argv[1])
          def read(name):
              return json.load(tar.extractfile(name))
          index = read("index.json")
          # A multi-platform OCI output nests the image index under the top one.
          if len(index["manifests"]) == 1 and index["manifests"][0]["mediaType"].endswith("image.index.v1+json"):
              index = read("blobs/" + index["manifests"][0]["digest"].replace(":", "/"))
          platforms = sorted(f"{m['platform']['os']}/{m['platform']['architecture']}"
                             for m in index["manifests"] if m.get("platform", {}).get("os") not in (None, "unknown"))
          print("platforms in the index:", ", ".join(platforms))
          missing = {"linux/amd64", "linux/arm64"} - set(platforms)
          if missing:
              raise SystemExit(f"the index lacks {sorted(missing)}")
          PY
          echo "image id: ${IMAGE_ID:-none}"

      - name: Remove the builder
        if: ${{ always() && steps.buildx.outputs.name != '' }}
        shell: bash
        env:
          BUILDX_NAME: ${{ steps.buildx.outputs.name }}
        run: bash scripts/setup_buildx.sh --remove

  # docker-multiarch's registry path, against a registry of this job's own:
  # a digest-pinned registry container on 127.0.0.1:5000 with password auth.
  # The wrong password is refused at login and not later; the right one gets
  # a push whose digest the registry confirms, and the logout leaves no
  # credential behind. Single platform: emulation is the leg above's.
  docker-multiarch-logs-in-and-pushes-to-a-local-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY: 127.0.0.1:5000
      REGISTRY_USERNAME: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Start a registry that asks for a password
        shell: bash
        env:
          TEST_LOGIN: this-is-the-self-test-login
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends apache2-utils
          mkdir -p "$RUNNER_TEMP/auth"
          htpasswd -Bbn ci "$TEST_LOGIN" > "$RUNNER_TEMP/auth/htpasswd"
          docker run -d --name self-test-registry -p 127.0.0.1:5000:5000 \
            -v "$RUNNER_TEMP/auth:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd \
            -e REGISTRY_AUTH_HTPASSWD_REALM=self-test \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd \
            docker.io/library/registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/v2/ || true)"
            [[ "$code" == 401 ]] && break
            sleep 1
          done
          [[ "$code" == 401 ]] || { echo "::error::the registry answers $code, not 401"; docker logs self-test-registry; exit 1; }
          echo "registry up and asking for a password"

      - name: The wrong password is refused at login
        shell: bash
        env:
          REGISTRY_PASSWORD: not-the-one
        run: |
          set -uo pipefail
          rc=0
          bash scripts/docker_login.sh > "$RUNNER_TEMP/login.log" 2>&1 || rc=$?
          if [[ "$rc" -ne 1 ]]; then
            echo "::error::login with the wrong password exited $rc, expected 1"; cat "$RUNNER_TEMP/login.log"; exit 1
          fi
          grep -q "docker login 127.0.0.1:5000 as ci failed" "$RUNNER_TEMP/login.log" || {
            echo "::error::it failed, but not at the login"; cat "$RUNNER_TEMP/login.log"; exit 1
          }
          grep -q "not-the-one" "$RUNNER_TEMP/login.log" && { echo "::error::the password is in the log"; exit 1; }
          echo "refused at login, password not logged"

      - name: The right password logs in and is stored for the registry only
        shell: bash
        env:
          REGISTRY_PASSWORD: this-is-the-self-test-login
        run: |
          set -euo pipefail
          bash scripts/docker_login.sh
          python3 - <<'PY'
          import json, os
          auths = json.load(open(os.path.expanduser("~/.docker/config.json"))).get("auths", {})
          if "127.0.0.1:5000" not in auths:
              raise SystemExit(f"no credential stored for 127.0.0.1:5000; auths has {sorted(auths)}")
          print("credential stored for 127.0.0.1:5000")
          PY

      # The builder runs in a container, so 127.0.0.1 is the host only with
      # the host network, and the registry speaks plain HTTP.
      - name: Set up a builder that can reach the registry
        id: buildx
        shell: bash
        env:
          BUILDX_DRIVER_OPTS: network=host
        run: |
          set -euo pipefail
          printf '[registry."127.0.0.1:5000"]\n  http = true\n' > "$RUNNER_TEMP/buildkitd.toml"
          BUILDKITD_CONFIG="$RUNNER_TEMP/buildkitd.toml" bash scripts/setup_buildx.sh

      - name: Build and push two tags
        id: build
        shell: bash
        env:
          CONTEXT: tests/fixtures/docker-image
          PLATFORMS: linux/amd64
          TAGS: 127.0.0.1:5000/ci-helpers/selftest:1.0,127.0.0.1:5000/ci-helpers/selftest:latest
          BUILDER: ${{ steps.buildx.outputs.name }}
          PUSH: "true"
          LABELS: org.opencontainers.image.title=ci-helpers self-test
        run: bash scripts/docker_build.sh

      - name: The registry holds both tags at the reported digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REGISTRY_PASSWORD: this-is-the-self-test-login
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest output is '$DIGEST'"; exit 1; }
          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'
          for tag in 1.0 latest; do
            got="$(curl -fsS -u "ci:$REGISTRY_PASSWORD" -H "Accept: $accept" -o /dev/null -D - \
                     "http://127.0.0.1:5000/v2/ci-helpers/selftest/manifests/$tag" \
                   | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')"
            [[ "$got" == "$DIGEST" ]] || { echo "::error::tag $tag is at '$got', the build reported $DIGEST"; exit 1; }
            echo "tag $tag is at $DIGEST"
          done

      - name: Log out, and the credential is gone
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/docker_login.sh --logout
          python3 - <<'PY'
          import json, os
          auths = json.load(open(os.path.expanduser("~/.docker/config.json"))).get("auths", {})
          if "127.0.0.1:5000" in auths:
              raise SystemExit("the credential for 127.0.0.1:5000 is still stored after logout")
          print("no credential left for 127.0.0.1:5000")
          PY

      - name: Remove the builder and the registry
        if: ${{ always() }}
        shell: bash
        env:
          BUILDX_NAME: ${{ steps.buildx.outputs.name }}
        run: |
          set -uo pipefail
          [[ -n "$BUILDX_NAME" ]] && bash scripts/setup_buildx.sh --remove
          docker rm -f self-test-registry > /dev/null 2>&1 || true

  assert-ran:
    needs:
      - release-tag-gate-defaults-can-pass
      - release-tag-gate-decides-correctly
      - docker-defaults-can-pass
      - docker-scan-defaults-can-pass
      - docker-refuses-what-it-must
      - docker-multiarch-builds-both-platforms
      - docker-multiarch-logs-in-and-pushes-to-a-local-registry
      - workflow-coverage-is-declared
      - docs-cover-the-tree
      - engine-inputs-gate-refuses-a-dropped-forward
      - submodules-recursive-checks-out-the-tree
      - submodules-default-leaves-the-tree-absent
      - submodules-guard-refuses-values-checkout-would-ignore
      - cache-probe-maps-every-lockfile
      - cache-npm-is-accepted-on-a-real-run
      - pr-gate-probes-and-caches
      - engine-inputs-exemption-must-name-a-real-job
      - changelog-structure-gate-refuses-what-it-must
      - shell-checks-this-repository
      - shell-runs-bats-and-a-clean-tree
      - shell-refuses-what-it-must
      - gitleaks-scan-defaults-can-pass
      - gitleaks-refuses-what-it-must
      - gitleaks-pins-match-each-platform
      - foxguard-scan-defaults-can-pass
      - foxguard-refuses-what-it-must
      - foxguard-pins-match-each-platform
      - diff-base-for-a-manual-run
      - gitleaks-new-findings-defaults-can-pass
      - foxguard-new-findings-defaults-can-pass
      - scan-new-findings-defaults-can-pass
      - gitleaks-diff-refuses-what-it-must
      - foxguard-diff-refuses-what-it-must
      - trivy-scan-defaults-can-pass
      - trivy-refuses-what-it-must
      - trivy-finds-misconfiguration
      - codeql-scan-analyses-what-it-is-given
      - codeql-found-what-was-planted
      - codeql-refuses-what-it-must
      - windows-sign-pfx-signs-a-real-exe
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A skipped leg is not a pass
        # `needs` itself, not a hand-written list of the same job names. The
        # two drifted the moment a job was added: the laravel legs were in
        # `needs` and absent from the list, so this step reported success
        # while one of them had been cancelled. toJSON(needs) cannot fall
        # behind what the job actually waits on.
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS=$'\t' read -r leg result; do
            count=$((count + 1))
            case "$result" in
              success) echo "$leg passed" ;;
              skipped) echo "::error::$leg was skipped; a skip is not a pass"; failed=1 ;;
              *)       echo "::error::$leg result: $result"; failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$RESULTS_JSON")
          # Zero legs examined is the failure this gate is most likely to have:
          # a malformed object loops no times and reports success having checked
          # nothing.
          #
          # Zero, not a floor of ten. A floor is a second copy of how many legs
          # the file holds, and the suite was split into three files of 12, 19
          # and 21 -- the next move of a leg between them would have made this
          # fail on a correct suite, which is the false alarm this repository
          # keeps removing elsewhere.
          if (( count == 0 )); then
            echo "::error::no legs examined; needs is not being read"
            failed=1
          fi
          exit "$failed"
