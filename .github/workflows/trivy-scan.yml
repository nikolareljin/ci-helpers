name: trivy-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      scan_path:
        type: string
        default: "."
      format:
        type: string
        default: sarif
      output:
        type: string
        default: trivy-results.sarif
      severity:
        type: string
        default: CRITICAL,HIGH
      ignore_unfixed:
        type: string
        default: "true"
      vuln_type:
        type: string
        default: os,library
      scanners:
        description: >
          Comma-separated Trivy scanners. `vuln` is the default and was all
          this ever ran; `misconfig` reads Dockerfiles, compose files,
          Kubernetes manifests and Terraform, and `secret` is Trivy's own
          secret scanner (`gitleaks-scan.yml` already covers that ground). The
          rulesets ship with the binary that is already downloaded here, so
          `misconfig` costs a flag, not a tool.
        type: string
        default: vuln
      skip_dirs:
        description: >
          Comma-separated directories to leave out, passed to Trivy's
          `--skip-dirs`. Use it for fixtures that are wrong on purpose: a
          Security tab full of findings nobody is going to act on is one people
          stop reading.
        type: string
        default: ""
      fail_on_findings:
        type: boolean
        default: false
      upload_sarif:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: trivy-results

permissions:
  contents: read
  security-events: write

# The caller must grant `security-events: write` **whether or not it uploads**.
# GitHub compares a called workflow's declared `permissions:` against the
# caller's when it resolves the call, before any job starts, so a caller that
# sets `upload_sarif: false` and grants only `contents: read` is refused --
# and the refusal arrives as a `startup_failure` with no annotation while every
# other check stays green. (The note here used to say "when they enable SARIF
# upload", which is the reading that produces that failure.) Measured on the
# same mechanism in #239, where a missing `checks: write` did exactly this.
jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      # An unknown scanner name is a FATAL error from Trivy, which is loud and
      # fine. An empty one is not: Trivy accepts it, scans nothing and exits 0,
      # so the job goes green having looked at nothing. Every other input here
      # treats "" as "skip this stage", which is exactly the expectation that
      # makes it dangerous.
      - name: A scan has to scan something
        shell: bash
        env:
          SCANNERS: ${{ inputs.scanners }}
        run: |
          set -euo pipefail
          if [[ -z "${SCANNERS// /}" ]]; then
            echo "::error::scanners is empty. Trivy accepts that, scans nothing and exits 0, so the run would report success having looked at nothing. Name at least one of vuln, misconfig, secret, license -- or drop the call if you do not want a scan." >&2
            exit 1
          fi

      # The library's own files at the commit of this workflow file: the
      # Trivy installer, its pins and the publication check. `./scripts` would
      # resolve in the caller's checkout, so the library is checked out beside
      # it. Before the scan, because the scan needs the installer.
      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            scripts
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=/usr/bin/git; [[ -x "$git" ]] || git=/mingw64/bin/git
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(/usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if "$git" rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$("$git" rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Isolate ci-helpers scripts
        id: ci_lib_publication
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-publication/scripts/lib_isolate.sh .ci-helpers-publication --keep

      # The Trivy binary, not the vendor's action: a release pinned by version
      # and sha256 in the library's scanner-pins.env, downloaded and checked
      # here. The vulnerability database is fetched in this step, so the scan
      # below has no network call of its own.
      - name: Install Trivy
        id: trivy
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib_publication.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_publication.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /bin/bash "$run_lib/scripts/install_trivy.sh" --download-db
          CI_HELPERS_RUN
          )"

      - name: Trivy scan
        shell: bash
        env:
          TRIVY_BIN: ${{ steps.trivy.outputs.trivy_bin }}
          CACHE_DIR: ${{ steps.trivy.outputs.cache_dir }}
          SCAN_PATH: ${{ inputs.scan_path }}
          FORMAT: ${{ inputs.format }}
          OUTPUT: ${{ inputs.output }}
          SEVERITY: ${{ inputs.severity }}
          IGNORE_UNFIXED: ${{ inputs.ignore_unfixed }}
          PKG_TYPES: ${{ inputs.vuln_type }}
          SCANNERS: ${{ inputs.scanners }}
          SKIP_DIRS: ${{ inputs.skip_dirs }}
          EXIT_CODE: ${{ inputs.fail_on_findings && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--skip-db-update --skip-check-update --offline-scan
                --format "$FORMAT" --output "$OUTPUT" --severity "$SEVERITY"
                --pkg-types "$PKG_TYPES" --scanners "$SCANNERS" --exit-code "$EXIT_CODE")
          if [[ "$IGNORE_UNFIXED" == "true" ]]; then args+=(--ignore-unfixed); fi
          if [[ -n "$SKIP_DIRS" ]]; then args+=(--skip-dirs "$SKIP_DIRS"); fi
          # The library checkout is untracked in the caller's tree and would
          # otherwise be scanned as part of it.
          args+=(--skip-dirs .ci-helpers-publication)
          "$TRIVY_BIN" --cache-dir "$CACHE_DIR" --disable-telemetry --skip-version-check fs "${args[@]}" "$SCAN_PATH"

      # Also after a failed scan (findings are what fail it), but only when a
      # report was written and the run was not cancelled.
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles(inputs.output) != '' && inputs.upload_sarif && inputs.format == 'sarif' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1 @ 2026-10-21
        with:
          sarif_file: ${{ inputs.output }}

      # The steps since the checkout above could rewrite it; take a fresh one.
      - name: Remove the .ci-helpers-publication checkout
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: /bin/rm -rf -- .ci-helpers-publication

      - name: Check out trusted publication action
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            scripts
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=/usr/bin/git; [[ -x "$git" ]] || git=/mingw64/bin/git
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(/usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if "$git" rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$("$git" rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}
          mode: artifact
          paths: ${{ inputs.output }}

      - name: Upload artifact
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          if-no-files-found: warn

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB_0: ${{ steps.ci_lib_publication.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
