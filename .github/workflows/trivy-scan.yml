name: trivy-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      scan_path:
        type: string
        default: "."
      format:
        type: string
        default: sarif
      output:
        type: string
        default: trivy-results.sarif
      severity:
        type: string
        default: CRITICAL,HIGH
      ignore_unfixed:
        type: string
        default: "true"
      vuln_type:
        type: string
        default: os,library
      scanners:
        description: >
          Comma-separated Trivy scanners. `vuln` is the default and was all
          this ever ran; `misconfig` reads Dockerfiles, compose files,
          Kubernetes manifests and Terraform, and `secret` is Trivy's own
          secret scanner (`gitleaks-scan.yml` already covers that ground). The
          rulesets ship with the binary that is already downloaded here, so
          `misconfig` costs a flag, not a tool.
        type: string
        default: vuln
      skip_dirs:
        description: >
          Comma-separated directories to leave out, passed to Trivy's
          `--skip-dirs`. Use it for fixtures that are wrong on purpose: a
          Security tab full of findings nobody is going to act on is one people
          stop reading.
        type: string
        default: ""
      fail_on_findings:
        type: boolean
        default: false
      upload_sarif:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: trivy-results

permissions:
  contents: read
  security-events: write

# NOTE: Because this workflow is reusable (`workflow_call`), callers still need to
# grant `security-events: write` in the calling workflow when they enable SARIF upload.
jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10

      # An unknown scanner name is a FATAL error from Trivy, which is loud and
      # fine. An empty one is not: Trivy accepts it, scans nothing and exits 0,
      # so the job goes green having looked at nothing. Every other input here
      # treats "" as "skip this stage", which is exactly the expectation that
      # makes it dangerous.
      - name: A scan has to scan something
        shell: bash
        env:
          SCANNERS: ${{ inputs.scanners }}
        run: |
          set -euo pipefail
          if [[ -z "${SCANNERS// /}" ]]; then
            echo "::error::scanners is empty. Trivy accepts that, scans nothing and exits 0, so the run would report success having looked at nothing. Name at least one of vuln, misconfig, secret, license -- or drop the call if you do not want a scan." >&2
            exit 1
          fi

      - name: Trivy scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master @ 2026-08-24
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan_path }}
          format: ${{ inputs.format }}
          output: ${{ inputs.output }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore_unfixed }}
          vuln-type: ${{ inputs.vuln_type }}
          scanners: ${{ inputs.scanners }}
          skip-dirs: ${{ inputs.skip_dirs }}
          exit-code: ${{ inputs.fail_on_findings && '1' || '0' }}

      # Also after a failed scan (findings are what fail it), but only when a
      # report was written and the run was not cancelled.
      - name: Upload SARIF
        if: ${{ !cancelled() && hashFiles(inputs.output) != '' && inputs.upload_sarif && inputs.format == 'sarif' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2 @ 2026-09-28
        with:
          sarif_file: ${{ inputs.output }}

      - name: Upload artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 @ 2026-09-10
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.output }}
          if-no-files-found: warn
