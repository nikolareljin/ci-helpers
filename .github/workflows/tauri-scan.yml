name: tauri-scan
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label — must be a Linux runner. 24.04 carries libwebkit2gtk-4.1, which is what Tauri v2 links; 22.04 was needed only by v1, which linked 4.0
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Cargo workspace root (relative to repo root)
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      rust_toolchain:
        type: string
        default: "stable"
      rust_components:
        description: Comma-separated rustup components to install
        type: string
        default: "rustfmt,clippy"
      apt_packages:
        description: Space-separated system packages required by Tauri on Linux
        type: string
        default: >-
          libwebkit2gtk-4.1-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libgtk-3-dev
          build-essential
          curl
          wget
          file
      lint_command:
        description: Lint command (fmt check + clippy)
        type: string
        default: "cargo fmt -- --check && cargo clippy -- -D warnings"
      check_command:
        description: Compile-check command (no full build — keeps scan fast)
        type: string
        default: "cargo check"
      node_version:
        description: Node.js version to install for frontend type-checking (empty = skip)
        type: string
        default: ""
      frontend_dir:
        description: Frontend directory relative to working_directory (empty = skip)
        type: string
        default: ""
      frontend_install_command:
        description: Command to install frontend dependencies
        type: string
        default: "npm ci"

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Install Tauri Linux system dependencies
        env:
          APT_PKGS: ${{ inputs.apt_packages }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # Normalize newlines/CRs to spaces so callers can pass either
          # space-separated or newline-separated package lists.
          _pkgs="${APT_PKGS//$'\r'}"
          read -r -a pkgs <<< "${_pkgs//$'\n'/ }"
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -- "${pkgs[@]}"
          fi

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 @ 2026-07-21
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-10
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: ${{ inputs.rust_components }}

      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 @ 2026-08-08
        with:
          workspaces: ${{ inputs.working_directory }}
          # Keyed on the runner label: both Ubuntu versions are `Linux` to the
          # cache, so a 22.04 target cache is an exact hit on 24.04 otherwise.
          key: ${{ inputs.runner }}

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          FRONTEND_INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$FRONTEND_INSTALL_CMD"

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        env:
          LINT_CMD: ${{ inputs.lint_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bash -c "$LINT_CMD"

      - name: Check (no full build)
        if: ${{ inputs.check_command != '' }}
        env:
          CHECK_CMD: ${{ inputs.check_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bash -c "$CHECK_CMD"
