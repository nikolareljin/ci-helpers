name: gitleaks-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      scan_path:
        description: Path to scan (relative to repo root)
        type: string
        default: "."
      report_format:
        description: "Report format: sarif (default) or json"
        type: string
        default: sarif
      output:
        description: Report output file path
        type: string
        default: results.sarif
      config_path:
        description: Optional path to a .gitleaks.toml config file (relative to repo root)
        type: string
        default: ""
      gitleaks_version:
        description: >
          Gitleaks release tag to download (e.g. "v8.30.1"). Pin this explicitly
          for reproducible scans and supply-chain safety.
        type: string
        default: "v8.30.1"
      fail_on_findings:
        description: Exit non-zero when findings are detected
        type: boolean
        default: false
      upload_artifact:
        description: Upload the report as a workflow artifact
        type: boolean
        default: false
      artifact_name:
        description: Artifact name when uploading the report
        type: string
        default: gitleaks-report

permissions:
  contents: read

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The library's own action, at the commit of this workflow file. A
      # `uses: <owner>/ci-helpers/...@production` here ran whatever production
      # is today, even for a caller pinned to a SHA; `./.github/actions` would
      # resolve in the caller's checkout, so the action is checked out beside it.
      - name: Check out ci-helpers actions at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's actions after all; refuse instead.
      - name: Verify ci-helpers actions commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers actions at $WF_SHA"

      # The checkout above is untracked in the caller's work tree, and gitleaks
      # reads git history there, so the library's files are not scanned.
      - name: Gitleaks scan
        uses: ./.ci-helpers-actions/.github/actions/gitleaks-scan
        with:
          scan_path: ${{ inputs.scan_path }}
          report_format: ${{ inputs.report_format }}
          output: ${{ inputs.output }}
          config_path: ${{ inputs.config_path }}
          gitleaks_version: ${{ inputs.gitleaks_version }}
          fail_on_findings: ${{ inputs.fail_on_findings }}
          upload_artifact: ${{ inputs.upload_artifact }}
          artifact_name: ${{ inputs.artifact_name }}

      - name: Remove ci-helpers actions checkout
        if: ${{ always() }}
        shell: bash
        run: rm -rf .ci-helpers-actions
