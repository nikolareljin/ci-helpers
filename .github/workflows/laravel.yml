name: preset-laravel

# Preset for Laravel apps. Builds assets, boots a MySQL service, runs Pint
# style + the PHPUnit/artisan test suite against it.
#
# Minimal usage (app at repo root):
#   uses: nikolareljin/ci-helpers/.github/workflows/laravel.yml@production
#
# Typical usage (app in a subdirectory, custom test DB):
#   uses: nikolareljin/ci-helpers/.github/workflows/laravel.yml@production
#   with:
#     working_directory: "my-app"
#     php_version: "8.4.1"
#     db_database: "my_app_test"
#
# Built on php.yml -> ci.yml. The DB is started via ci.yml's optional db_image
# mechanism; the discrete db_* inputs below are composed into that for you.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      php_version:
        type: string
        default: "8.4"
      node_version:
        type: string
        default: "22"
      # Pint style check by default; override to phpcs/phpstan/etc.
      lint_command:
        type: string
        default: "composer install --no-interaction --prefer-dist && vendor/bin/pint --test"
      # Asset build. Set to "" to skip for API-only apps.
      build_command:
        type: string
        default: "npm ci --include=optional && npm run build"
      # Test suite. The DB connection is written to .env before running so both
      # `migrate` and `test` use the CI MySQL service. phpunit.xml may still
      # force its own DB_DATABASE (e.g. *_test) — set db_database to match.
      test_command:
        type: string
        default: "php artisan test"
      # MySQL service (set db_image: "" to run without a database).
      db_image:
        type: string
        default: "mysql:8.0"
      db_database:
        type: string
        default: "laravel_test"
      db_username:
        type: string
        default: "laravel"
      db_password:
        type: string
        default: "secret"
      db_root_password:
        type: string
        default: "root"
      db_port:
        type: string
        default: "3306"
      db_wait_seconds:
        type: string
        default: "60"

jobs:
  laravel:
    uses: nikolareljin/ci-helpers/.github/workflows/php.yml@production
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      fetch_depth: ${{ inputs.fetch_depth }}
      php_version: ${{ inputs.php_version }}
      node_version: ${{ inputs.node_version }}
      lint_command: ${{ inputs.lint_command }}
      build_command: ${{ inputs.build_command }}
      # Prepare .env, key, point Laravel at the CI MySQL service, migrate, test.
      test_command: |
        cp -n .env.example .env 2>/dev/null || true
        php artisan key:generate --force
        {
          echo "DB_CONNECTION=mysql"
          echo "DB_HOST=127.0.0.1"
          echo "DB_PORT=${{ inputs.db_port }}"
          echo "DB_DATABASE=${{ inputs.db_database }}"
          echo "DB_USERNAME=${{ inputs.db_username }}"
          echo "DB_PASSWORD=${{ inputs.db_password }}"
        } >> .env
        php artisan config:clear
        php artisan migrate --force
        ${{ inputs.test_command }}
      db_image: ${{ inputs.db_image }}
      db_ports: ${{ format('{0}:3306', inputs.db_port) }}
      db_env: |
        MYSQL_DATABASE=${{ inputs.db_database }}
        MYSQL_USER=${{ inputs.db_username }}
        MYSQL_PASSWORD=${{ inputs.db_password }}
        MYSQL_ROOT_PASSWORD=${{ inputs.db_root_password }}
      db_health_cmd: ${{ format('mysqladmin ping -h 127.0.0.1 -uroot -p{0} --silent', inputs.db_root_password) }}
      db_wait_seconds: ${{ inputs.db_wait_seconds }}
