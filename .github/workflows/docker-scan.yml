name: docker-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      image_name:
        type: string
        default: "ci-image:latest"
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      trivy_severity:
        type: string
        default: "CRITICAL,HIGH"
      trivy_ignore_unfixed:
        type: string
        default: "true"
      fail_on_findings:
        type: boolean
        default: true
      # Off by default: Snyk needs an account and an API token -- there is no
      # anonymous mode, and the free plan still issues a key -- so a preset that
      # ran it by default would ask every adopter for a credential to get a
      # green build. Trivy runs on every call, needs no credential, and covers
      # the same CVE ground for container images.
      #
      # Turned on with `run_snyk: true` plus the `snyk_token` secret. Turned on
      # *without* the secret, it warns and skips rather than failing: a scan
      # that cannot run should say so, and never read as a scan that found
      # nothing.
      run_snyk:
        type: boolean
        default: false
      snyk_severity_threshold:
        type: string
        default: "high"
    secrets:
      snyk_token:
        required: false

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Build image
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DS_DOCKERFILE: ${{ inputs.dockerfile }}
          DS_IMAGE_NAME: ${{ inputs.image_name }}
          DS_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          docker build -f "$DS_DOCKERFILE" -t "$DS_IMAGE_NAME" "$DS_CONTEXT"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master @ 2026-10-21
        with:
          image-ref: ${{ inputs.image_name }}
          format: table
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: ${{ inputs.fail_on_findings && '1' || '0' }}

      # Read once, into an output, so the Snyk step's `if:` does not have to
      # test a secret -- a secret is not available to a job-level `if:` and is
      # masked in logs, so testing it there fails in ways that read as "the
      # step simply did not run".
      - name: Is there a Snyk credential
        id: snyk_token
        if: ${{ inputs.run_snyk }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        run: |
          set -euo pipefail
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Snyk scan skipped::run_snyk is on but no snyk_token was passed, so the Snyk scan did not run. Pass the secret to enable it, or set run_snyk: false to stop asking."
            {
              echo "### Snyk scan skipped"
              echo
              echo "\`run_snyk\` is on and no \`snyk_token\` was passed, so **the image was not scanned by Snyk**."
              echo "Trivy still ran. Pass the secret to enable Snyk, or set \`run_snyk: false\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # `snyk/actions/docker` is a Docker-container action, and the runner
      # pulls a container action's image during job setup -- before any step's
      # `if:` is evaluated. So with Snyk off, which is the default, every job
      # still pulled `snyk/snyk:docker` and then skipped the step that wanted
      # it: measured at 9 to 19 seconds a job, 76 seconds across the six
      # docker-scan jobs of one consumer's Security Checks run on 2026-09-28.
      #
      # The same call, run by hand, is not pulled unless this step runs. The
      # action is three lines of `runs:` -- `snyk test <args> --docker <image>`
      # with two SNYK_INTEGRATION_* variables -- and the rest of what is below
      # is what the runner gives a container action for free and what this has
      # to do for itself:
      #
      #   * the docker socket, without which Snyk cannot read an image from
      #     the local daemon
      #   * the workspace, mounted and made the working directory. Snyk reads
      #     its `.snyk` policy file -- a consumer's ignore rules -- from the
      #     working directory, and a container action's was the workspace. At
      #     the image's own `/app` those rules would be silently dropped.
      #
      # `snyk test` is left as the command rather than modernised to
      # `snyk container test`: this is a fix for the pull, and the exit codes
      # a consumer already gates on are not its to change.
      - name: Snyk scan
        if: ${{ inputs.run_snyk && steps.snyk_token.outputs.present == 'true' }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SEVERITY_THRESHOLD: ${{ inputs.snyk_severity_threshold }}
        run: |
          set -euo pipefail
          # The runner mounts /var/run/docker.sock into a container action, but
          # a host that moved its socket exports DOCKER_HOST; prefer it, so
          # this does not mount an empty directory and report a missing image.
          socket="${DOCKER_HOST:-}"; socket="${socket#unix://}"
          [[ -S "$socket" ]] || socket=/var/run/docker.sock
          workspace="${GITHUB_WORKSPACE:-$PWD}"
          docker run --rm \
            -e SNYK_TOKEN \
            -e SNYK_INTEGRATION_NAME=GITHUB_ACTIONS \
            -e SNYK_INTEGRATION_VERSION=docker \
            -v "$socket":/var/run/docker.sock \
            -v "$workspace":/github/workspace \
            -w /github/workspace \
            snyk/snyk:docker@sha256:d6595337edef7ce37eded247b8bb47ebb60681fd802c49e64c1b80b3a6963187 \
            snyk test --severity-threshold="$SEVERITY_THRESHOLD" --docker "$IMAGE_NAME"
