name: docker-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      image_name:
        type: string
        default: "ci-image:latest"
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      trivy_severity:
        type: string
        default: "CRITICAL,HIGH"
      trivy_ignore_unfixed:
        type: string
        default: "true"
      fail_on_findings:
        type: boolean
        default: true
      # Off by default: Snyk needs an account and an API token -- there is no
      # anonymous mode, and the free plan still issues a key -- so a preset that
      # ran it by default would ask every adopter for a credential to get a
      # green build. Trivy runs on every call, needs no credential, and covers
      # the same CVE ground for container images.
      #
      # Turned on with `run_snyk: true` plus the `snyk_token` secret. Turned on
      # *without* the secret, it warns and skips rather than failing: a scan
      # that cannot run should say so, and never read as a scan that found
      # nothing.
      run_snyk:
        type: boolean
        default: false
      snyk_severity_threshold:
        type: string
        default: "high"
    secrets:
      snyk_token:
        required: false

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Build image
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          docker build -f "${{ inputs.dockerfile }}" -t "${{ inputs.image_name }}" "${{ inputs.context }}"

      - name: Trivy scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master @ 2026-08-24
        with:
          image-ref: ${{ inputs.image_name }}
          format: table
          severity: ${{ inputs.trivy_severity }}
          ignore-unfixed: ${{ inputs.trivy_ignore_unfixed }}
          exit-code: ${{ inputs.fail_on_findings && '1' || '0' }}

      # Read once, into an output, so the Snyk step's `if:` does not have to
      # test a secret -- a secret is not available to a job-level `if:` and is
      # masked in logs, so testing it there fails in ways that read as "the
      # step simply did not run".
      - name: Is there a Snyk credential
        id: snyk_token
        if: ${{ inputs.run_snyk }}
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        run: |
          set -euo pipefail
          if [[ -n "${SNYK_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Snyk scan skipped::run_snyk is on but no snyk_token was passed, so the Snyk scan did not run. Pass the secret to enable it, or set run_snyk: false to stop asking."
            {
              echo "### Snyk scan skipped"
              echo
              echo "\`run_snyk\` is on and no \`snyk_token\` was passed, so **the image was not scanned by Snyk**."
              echo "Trivy still ran. Pass the secret to enable Snyk, or set \`run_snyk: false\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Snyk scan
        if: ${{ inputs.run_snyk && steps.snyk_token.outputs.present == 'true' }}
        uses: snyk/actions/docker@12140f4059e244892ae643824a95459a102120dd # master @ 2026-08-08
        env:
          SNYK_TOKEN: ${{ secrets.snyk_token }}
        with:
          image: ${{ inputs.image_name }}
          args: --severity-threshold=${{ inputs.snyk_severity_threshold }}
