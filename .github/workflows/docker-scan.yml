name: docker-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      image_name:
        type: string
        default: "ci-image:latest"
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      trivy_severity:
        type: string
        default: "CRITICAL,HIGH"
      trivy_ignore_unfixed:
        type: string
        default: "true"
      fail_on_findings:
        type: boolean
        default: true
      # Snyk is disabled: it is a cloud service that receives the image's
      # dependency graph and metadata, and a scan job here must send code and
      # data to nobody. The three Snyk inputs stay declared so a caller's
      # `with:` and `secrets:` keep parsing; `run_snyk: true` emits a warning
      # and a summary line and does nothing else. The token is never read.
      # Trivy runs on every call, needs no credential, and covers the same
      # CVE ground for container images.
      run_snyk:
        type: boolean
        default: false
      snyk_severity_threshold:
        type: string
        default: "high"
    secrets:
      snyk_token:
        description: Unused; Snyk is disabled. Kept so existing callers keep parsing.
        required: false

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Build image
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DS_DOCKERFILE: ${{ inputs.dockerfile }}
          DS_IMAGE_NAME: ${{ inputs.image_name }}
          DS_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          docker build -f "$DS_DOCKERFILE" -t "$DS_IMAGE_NAME" "$DS_CONTEXT"

      # The library's own files at the commit of this workflow file: the
      # Trivy installer and its pins. `./scripts` would resolve in the
      # caller's checkout, so the library is checked out beside it.
      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: |
            scripts
            vendor/script-helpers
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's scripts after all; refuse instead.
      - name: Isolate ci-helpers scripts
        id: ci_lib_actions
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-actions/scripts/lib_isolate.sh .ci-helpers-actions

      # The Trivy binary, not the vendor's action: a release pinned by version
      # and sha256 in the library's scanner-pins.env, downloaded and checked
      # here. The vulnerability database is fetched in this step, so the scan
      # below has no network call of its own.
      - name: Install Trivy
        id: trivy
        shell: sh
        env:
          LIB: ${{ steps.ci_lib_actions.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_actions.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /bin/bash "$run_lib/scripts/install_trivy.sh" --download-db
          CI_HELPERS_RUN
          )"

      - name: Trivy scan
        shell: bash
        env:
          TRIVY_BIN: ${{ steps.trivy.outputs.trivy_bin }}
          CACHE_DIR: ${{ steps.trivy.outputs.cache_dir }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SEVERITY: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          EXIT_CODE: ${{ inputs.fail_on_findings && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--skip-db-update --offline-scan --format table
                --severity "$SEVERITY" --exit-code "$EXIT_CODE")
          if [[ "$IGNORE_UNFIXED" == "true" ]]; then args+=(--ignore-unfixed); fi
          "$TRIVY_BIN" --cache-dir "$CACHE_DIR" --disable-telemetry --skip-version-check image "${args[@]}" "$IMAGE_NAME"

      # Snyk is disabled. It is a cloud service: its container scan sends the
      # image's dependency graph and metadata to snyk.io, and the call ran a
      # container with the docker socket and the whole workspace mounted. The
      # inputs stay so a caller's `with:` and `secrets:` keep parsing, but
      # `run_snyk: true` only says so; the token is never read.
      - name: Snyk is disabled
        id: snyk_disabled
        if: ${{ inputs.run_snyk }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Snyk scan disabled::run_snyk is on, but Snyk is disabled in docker-scan: it uploads image metadata to snyk.io. Nothing was sent. Trivy ran. Set run_snyk: false to stop asking."
          {
            echo "### Snyk scan disabled"
            echo
            echo "\`run_snyk\` is on, but Snyk is disabled in this workflow: it sends image metadata to snyk.io."
            echo "**Nothing was sent and the image was not scanned by Snyk.** Trivy ran. Set \`run_snyk: false\` to stop asking."
          } >> "$GITHUB_STEP_SUMMARY"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib_actions.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
