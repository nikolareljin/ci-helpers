name: docker-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      image_name:
        type: string
        default: "ci-image:latest"
      dockerfile:
        type: string
        default: "Dockerfile"
      context:
        type: string
        default: "."
      trivy_severity:
        type: string
        default: "CRITICAL,HIGH"
      trivy_ignore_unfixed:
        type: string
        default: "true"
      fail_on_findings:
        type: boolean
        default: true
      # Snyk is disabled: it is a cloud service that receives the image's
      # dependency graph and metadata, and a scan job here must send code and
      # data to nobody. The three Snyk inputs stay declared so a caller's
      # `with:` and `secrets:` keep parsing; `run_snyk: true` emits a warning
      # and a summary line and does nothing else. The token is never read.
      # Trivy runs on every call, needs no credential, and covers the same
      # CVE ground for container images.
      run_snyk:
        type: boolean
        default: false
      snyk_severity_threshold:
        type: string
        default: "high"
    secrets:
      snyk_token:
        description: Unused; Snyk is disabled. Kept so existing callers keep parsing.
        required: false

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Build image
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DS_DOCKERFILE: ${{ inputs.dockerfile }}
          DS_IMAGE_NAME: ${{ inputs.image_name }}
          DS_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          docker build -f "$DS_DOCKERFILE" -t "$DS_IMAGE_NAME" "$DS_CONTEXT"

      # The library's own files at the commit of this workflow file: the
      # Trivy installer and its pins. `./scripts` would resolve in the
      # caller's checkout, so the library is checked out beside it.
      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: |
            scripts
            vendor/script-helpers
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's scripts after all; refuse instead.
      - name: Verify ci-helpers scripts commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers scripts at $WF_SHA"

      # The Trivy binary, not the vendor's action: a release pinned by version
      # and sha256 in the library's scanner-pins.env, downloaded and checked
      # here. The vulnerability database is fetched in this step, so the scan
      # below has no network call of its own.
      - name: Install Trivy
        id: trivy
        shell: bash
        run: bash .ci-helpers-actions/scripts/install_trivy.sh --download-db

      - name: Trivy scan
        shell: bash
        env:
          TRIVY_BIN: ${{ steps.trivy.outputs.trivy_bin }}
          CACHE_DIR: ${{ steps.trivy.outputs.cache_dir }}
          IMAGE_NAME: ${{ inputs.image_name }}
          SEVERITY: ${{ inputs.trivy_severity }}
          IGNORE_UNFIXED: ${{ inputs.trivy_ignore_unfixed }}
          EXIT_CODE: ${{ inputs.fail_on_findings && '1' || '0' }}
        run: |
          set -euo pipefail
          args=(--skip-db-update --offline-scan --format table
                --severity "$SEVERITY" --exit-code "$EXIT_CODE")
          if [[ "$IGNORE_UNFIXED" == "true" ]]; then args+=(--ignore-unfixed); fi
          "$TRIVY_BIN" --cache-dir "$CACHE_DIR" image "${args[@]}" "$IMAGE_NAME"

      # Snyk is disabled. It is a cloud service: `snyk test --docker` sends the
      # image's dependency graph and metadata to snyk.io, and the call ran a
      # container with the docker socket and the whole workspace mounted. The
      # inputs stay so a caller's `with:` and `secrets:` keep parsing, but
      # `run_snyk: true` only says so; the token is never read.
      - name: Snyk is disabled
        id: snyk_disabled
        if: ${{ inputs.run_snyk }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning title=Snyk scan disabled::run_snyk is on, but Snyk is disabled in docker-scan: it uploads image metadata to snyk.io. Nothing was sent. Trivy ran. Set run_snyk: false to stop asking."
          {
            echo "### Snyk scan disabled"
            echo
            echo "\`run_snyk\` is on, but Snyk is disabled in this workflow: it sends image metadata to snyk.io."
            echo "**Nothing was sent and the image was not scanned by Snyk.** Trivy ran. Set \`run_snyk: false\` to stop asking."
          } >> "$GITHUB_STEP_SUMMARY"
