name: create-github-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (e.g. 0.12.1)"
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        description: "Version tag to release (e.g. 0.12.1)"
        type: string
        required: true

permissions:
  contents: write

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! printf '%s' "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?$'; then
            echo "::error::release_tag '${tag}' is not a valid semver (expected X.Y.Z, X.Y.Z-rcN, or X.Y.Z-rc.N)"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

          # The accepted tags are X.Y.Z and X.Y.Z-rcN / X.Y.Z-rc.N, so a hyphen
          # is exactly the pre-release marker. A candidate is cut to be tried
          # out, not to be what people land on: left unmarked it would be
          # published as a normal release AND become the repository's "Latest",
          # which is the same mistake as letting a candidate advance a floating
          # production ref. Both flags are emitted here so the rule has one
          # definition, and as plain strings rather than an Actions expression
          # -- `x && 'a' || 'b'` is a trap when either branch can be falsy.
          if [ "${tag#*-}" != "$tag" ]; then
            printf 'is_prerelease=true\n'  >> "$GITHUB_OUTPUT"
            printf 'make_latest=false\n'   >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is a release candidate; publishing it as a pre-release and not marking it Latest."
          else
            printf 'is_prerelease=false\n' >> "$GITHUB_OUTPUT"
            printf 'make_latest=true\n'    >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - name: Extract CHANGELOG notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
        run: |
          set -euo pipefail
          body=""
          if [[ -f CHANGELOG.md ]]; then
            # Escape dots for awk regex so "0.12.1" matches literally, not "0X12Y1"
            escaped=$(printf '%s' "$RELEASE_TAG" | sed 's/[.]/\\./g')
            body=$(awk -v ver="$escaped" '
              /^## / {
                if (found) exit
                if (match($0, "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] — v?" ver "([[:space:]]|$)")) found = 1
                next
              }
              found { lines[++n] = $0 }
              END {
                first = 0; last = 0
                for (i = 1; i <= n; i++) {
                  if (lines[i] ~ /[^[:space:]]/) {
                    if (!first) first = i
                    last = i
                  }
                }
                if (first > 0)
                  for (i = first; i <= last; i++) print lines[i]
              }
            ' CHANGELOG.md)
          fi
          if [[ -n "$body" ]]; then
            # A random delimiter: a fixed one ends the body at any CHANGELOG line
            # that happens to spell it, and the rest is parsed as more outputs.
            delimiter="GH_OUTPUT_${RANDOM}_${RANDOM}_$(date +%s)"
            while [[ "$body" == *"$delimiter"* ]]; do
              delimiter="GH_OUTPUT_${RANDOM}_${RANDOM}_$(date +%s)"
            done
            {
              printf 'body<<%s\n' "$delimiter"
              printf '%s\n' "$body"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_OUTPUT"
          else
            # No CHANGELOG section found; fall back to GitHub auto-generated notes
            printf 'body=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (CHANGELOG notes)
        if: steps.notes.outputs.body != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 @ 2026-09-10
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.resolve_tag.outputs.is_prerelease }}
          make_latest: ${{ steps.resolve_tag.outputs.make_latest }}

      - name: Create GitHub Release (auto-generated notes)
        if: steps.notes.outputs.body == ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 @ 2026-09-10
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.resolve_tag.outputs.is_prerelease }}
          make_latest: ${{ steps.resolve_tag.outputs.make_latest }}
