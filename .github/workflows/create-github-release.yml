name: create-github-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Version tag to release (e.g. 0.12.1)"
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        description: "Version tag to release (e.g. 0.12.1)"
        type: string
        required: true

permissions:
  contents: write

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - name: Resolve tag
        id: resolve_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! printf '%s' "$tag" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?$'; then
            echo "::error::release_tag is not a valid semver (expected X.Y.Z, X.Y.Z-rcN, or X.Y.Z-rc.N)"
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

          # The accepted tags are X.Y.Z and X.Y.Z-rcN / X.Y.Z-rc.N, so a hyphen
          # is exactly the pre-release marker. A candidate is cut to be tried
          # out, not to be what people land on: left unmarked it would be
          # published as a normal release AND become the repository's "Latest",
          # which is the same mistake as letting a candidate advance a floating
          # production ref. Both flags are emitted here so the rule has one
          # definition, and as plain strings rather than an Actions expression
          # -- `x && 'a' || 'b'` is a trap when either branch can be falsy.
          if [ "${tag#*-}" != "$tag" ]; then
            printf 'is_prerelease=true\n'  >> "$GITHUB_OUTPUT"
            printf 'make_latest=false\n'   >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} is a release candidate; publishing it as a pre-release and not marking it Latest."
          else
            printf 'is_prerelease=false\n' >> "$GITHUB_OUTPUT"
            printf 'make_latest=true\n'    >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.resolve_tag.outputs.tag }}

      - name: Extract CHANGELOG notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.resolve_tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=""
          if [[ -f CHANGELOG.md ]]; then
            # Escape dots for awk regex so "0.12.1" matches literally, not "0X12Y1"
            escaped=$(printf '%s' "$RELEASE_TAG" | sed 's/[.]/\\./g')
            body=$(awk -v ver="$escaped" '
              /^## / {
                if (found) exit
                if (match($0, "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9] — v?" ver "([[:space:]]|$)")) found = 1
                next
              }
              found { lines[++n] = $0 }
              END {
                first = 0; last = 0
                for (i = 1; i <= n; i++) {
                  if (lines[i] ~ /[^[:space:]]/) {
                    if (!first) first = i
                    last = i
                  }
                }
                if (first > 0)
                  for (i = first; i <= last; i++) print lines[i]
              }
            ' CHANGELOG.md)
          fi
          umask 077
          notes=$(mktemp "$RUNNER_TEMP/release-notes.XXXXXX")
          printf '%s\n' "$body" > "$notes"
          if [[ -z "$body" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              --raw-field "tag_name=$RELEASE_TAG" --jq .body > "$notes"
          fi
          printf 'body_path=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
            scripts
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -L .git || ( -e .git && ! -d .git ) ]]; then
            echo "::warning::.git is not a plain directory; not adding the publication checkout to its exclude file"
          elif [[ -d .git ]]; then
            gd="$(pwd -P)/.git"; exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --git-path info/exclude) || { echo "::error::git cannot read .git; refusing to edit its exclude file"; exit 1; }
            [[ "$exclude" == ".git/info/exclude" && ! -L "$gd/info" && ! -L "$gd/info/exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            exclude="$gd/info/exclude"
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Isolate ci-helpers scripts
        id: ci_lib_publication
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-publication/scripts/lib_isolate.sh .ci-helpers-publication --keep

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            tag_name: ${{ steps.resolve_tag.outputs.tag }}
            name: ${{ steps.resolve_tag.outputs.tag }}
          mode: release
          body_path: ${{ steps.notes.outputs.body_path }}

      - name: Create GitHub Release
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib_publication.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_publication.outputs.hash }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.resolve_tag.outputs.tag }}
          RELEASE_NAME: ${{ steps.resolve_tag.outputs.tag }}
          BODY_PATH: ${{ steps.ci_publication_check_1.outputs.body_path }}
          PRERELEASE: ${{ steps.resolve_tag.outputs.is_prerelease }}
          MAKE_LATEST: ${{ steps.resolve_tag.outputs.make_latest }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH GH_TOKEN TAG_NAME RELEASE_NAME BODY_PATH PRERELEASE MAKE_LATEST GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          /bin/bash "$run_lib/scripts/github_release.sh"
          CI_HELPERS_RUN
          )"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB_0: ${{ steps.ci_lib_publication.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
