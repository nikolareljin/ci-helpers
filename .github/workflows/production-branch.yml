name: update-production-tag-ref
on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"

permissions:
  contents: read

jobs:
  security-gate:
    name: Security Gate
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Bootstrap script-helpers
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive || true
          if [[ -d "scripts/script-helpers" && ! -e "vendor/script-helpers" ]]; then
            mkdir -p vendor
            ln -sfn ../scripts/script-helpers vendor/script-helpers
          fi

      - name: Check stale SHA pins
        shell: bash
        run: bash scripts/update_pinned_actions.sh --check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Detect floating action refs
        shell: bash
        run: bash scripts/check_floating_refs.sh

  production:
    needs: [security-gate]
    permissions:
      contents: write
    if: ${{ !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'RC') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One group for every workflow that moves production, so two moves never
    # run at once. create_production.sh also refuses a tag that is not a
    # release, not on main, or older than production.
    concurrency:
      group: ci-helpers-production-move-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Bootstrap script-helpers
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive || true
          if [[ -d "scripts/script-helpers" && ! -e "vendor/script-helpers" ]]; then
            mkdir -p vendor
            ln -sfn ../scripts/script-helpers vendor/script-helpers
          fi
          if [[ ! -e "vendor/script-helpers" ]]; then
            echo "vendor/script-helpers not found; ensure script-helpers is vendored or initialized." >&2
            exit 1
          fi
      - name: Update production tag ref
        shell: bash
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          ./scripts/create_production.sh -t "${GITHUB_REF_NAME}" --fetch-tags
