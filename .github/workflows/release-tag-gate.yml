name: release-tag-gate
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      fetch_depth:
        type: number
        default: 0
      release_branch:
        type: string
        default: ""
      base_branch:
        type: string
        default: ""
      default_branch:
        type: string
        default: ""

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Resolve branches
        id: branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 @ 2026-09-10
        with:
          script: |
            const inputDefault = core.getInput("default_branch");
            const payloadDefault = context.payload?.repository?.default_branch || "";
            const defaultBranch = inputDefault || payloadDefault || "main";

            const inputBase = core.getInput("base_branch");
            const payloadBase = context.payload?.pull_request?.base?.ref || "";
            const baseBranch = inputBase || payloadBase;

            const inputRelease = core.getInput("release_branch");
            const payloadRelease = context.payload?.pull_request?.head?.ref || "";
            const releaseBranch = inputRelease || payloadRelease || context.ref_name || "";

            core.setOutput("default_branch", defaultBranch);
            core.setOutput("base_branch", baseBranch);
            core.setOutput("release_branch", releaseBranch);

      - name: Decide whether to check release tag
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          default_branch="${{ steps.branches.outputs.default_branch }}"
          base_branch="${{ steps.branches.outputs.base_branch }}"
          release_branch="${{ steps.branches.outputs.release_branch }}"
          if [[ -z "$base_branch" ]]; then
            echo "Base branch is missing; skipping release tag check."
            echo "run_check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$base_branch" != "$default_branch" ]]; then
            echo "Base branch '$base_branch' does not match default '$default_branch'; skipping."
            echo "run_check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$release_branch" =~ ^release\/v?[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?$ ]]; then
            echo "Branch '$release_branch' is not a release branch; skipping."
            echo "run_check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_check=true" >> "$GITHUB_OUTPUT"

      - name: Checkout script-helpers
        if: ${{ steps.gate.outputs.run_check == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: nikolareljin/script-helpers
          # 0.28.0 -- carries check_changelog_section.sh (used below) as well as
          # check_release_tag.sh; matches vendor/.script-helpers-sha.
          ref: df62393602dbd4d628bc29235ff11f544edd16fe
          path: .script-helpers
          fetch-depth: 1

      - name: Check release tag availability
        if: ${{ steps.gate.outputs.run_check == 'true' }}
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.branches.outputs.release_branch }}
        run: |
          set -euo pipefail
          version="$(./.script-helpers/scripts/check_release_tag.sh --branch "$RELEASE_BRANCH" --repo "${GITHUB_WORKSPACE}" --fetch-tags --print-version)"
          if [[ -n "$version" ]]; then
            echo "Resolved release version: $version"
          fi

      - name: Check the CHANGELOG has a section for this release
        if: ${{ steps.gate.outputs.run_check == 'true' }}
        shell: bash
        env:
          RELEASE_BRANCH: ${{ steps.branches.outputs.release_branch }}
        run: |
          set -euo pipefail
          # The release body is the CHANGELOG section for the version. A release
          # branch whose CHANGELOG has a header but nothing under it (the empty
          # template) would ship as the body, so it fails here before merge.
          # A repository with no CHANGELOG.md is not blocked -- it gets the commit
          # list at release time -- so say so and pass.
          if [ ! -f "${GITHUB_WORKSPACE}/CHANGELOG.md" ]; then
            echo "::notice::No CHANGELOG.md; the release body will be the commit list. Not blocking this release."
            exit 0
          fi
          ./.script-helpers/scripts/check_changelog_section.sh --branch "$RELEASE_BRANCH" --repo "${GITHUB_WORKSPACE}"
