name: go-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      go_version:
        type: string
        # 1.25, not 1.24: the fleet's largest Go consumer declares `go 1.25.0`,
        # so the old default failed outright with `go.mod requires go >= 1.25.0`.
        # It passed its own version, which is why nothing caught it.
        default: "1.25"
      lint_command:
        type: string
        default: 'test -z "$(gofmt -l .)" && go vet ./...'
      test_command:
        type: string
        default: "go mod download && go test ./..."
      gosec_args:
        type: string
        default: "./..."
      # govulncheck version, pinned. A floating @latest means the gate's
      # behaviour changes without a commit here, and a new advisory class can
      # turn every consumer red on a day nobody shipped anything.
      govulncheck_version:
        type: string
        default: "v1.8.0"
      # Off by default while consumers adopt it: govulncheck reports advisories
      # in dependencies, so turning it on fleet-wide would fail repositories
      # that changed nothing.
      vulncheck:
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version }}

      - name: Go lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Go tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Gosec scan
        if: ${{ inputs.gosec_args != '' }}
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0 @ 2026-09-10
        with:
          args: ${{ inputs.gosec_args }}

      # gosec is a static analyser: it looks at this repository's own code. It
      # is not a dependency audit and says nothing about a known advisory in a
      # module this repository imports.
      - name: govulncheck
        if: ${{ inputs.vulncheck }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT_GOVULNCHECK_VERSION: ${{ inputs.govulncheck_version }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_GOVULNCHECK_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::govulncheck_version must be vX.Y.Z, got '${INPUT_GOVULNCHECK_VERSION}'." >&2
            exit 2
          fi
          go install "golang.org/x/vuln/cmd/govulncheck@${INPUT_GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" "${INPUT_PACKAGES}"
