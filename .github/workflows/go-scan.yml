name: go-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      go_version:
        type: string
        # go.mod: Go from <working_directory>/go.mod (its toolchain line when
        # present), so a caller follows its own module. A version overrides it.
        default: "go.mod"
      lint_command:
        type: string
        default: 'test -z "$(gofmt -l .)" && go vet ./...'
      test_command:
        type: string
        # -race when the runner can build it: cgo on (Go turns it off when no C
        # compiler is found) and a platform on Go's race list. Elsewhere plain
        # go test, with a notice. Keep identical in go.yml, go-pr-gate.yml and
        # go-scan.yml; self-test-compiled.yml checks that.
        default: |
          go mod download
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ]; then
            case "$(go env GOOS)/$(go env GOARCH)" in
              linux/amd64|linux/arm64|linux/ppc64le|linux/s390x|linux/loong64|darwin/amd64|darwin/arm64|freebsd/amd64|netbsd/amd64|windows/amd64) race=-race ;;
            esac
          fi
          [ -n "$race" ] || echo "::notice::go test runs without -race: it needs cgo (a C compiler) on a supported platform"
          go test $race ./...
      gosec_args:
        type: string
        default: "./..."
      # govulncheck version, pinned. A floating @latest means the gate's
      # behaviour changes without a commit here, and a new advisory class can
      # turn every consumer red on a day nobody shipped anything.
      #
      # The install builds with the module's Go, or Go 1.25.0 when the
      # module's is older. A version that needs a newer Go than 1.25.0 fails on
      # older modules; raise `floor` in the govulncheck step with it.
      govulncheck_version:
        type: string
        default: "v1.7.0"
      # Off by default while consumers adopt it: govulncheck reports advisories
      # in dependencies, so turning it on fleet-wide would fail repositories
      # that changed nothing.
      vulncheck:
        type: boolean
        default: false
      # govulncheck's own package pattern. gosec_args belongs to gosec and is
      # not interchangeable.
      vulncheck_packages:
        type: string
        default: "./..."

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version != 'go.mod' && inputs.go_version || '' }}
          go-version-file: ${{ inputs.go_version == 'go.mod' && format('{0}/go.mod', inputs.working_directory) || '' }}

      - name: Go lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Go tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Gosec scan
        if: ${{ inputs.gosec_args != '' }}
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22 # v2.30.0 @ 2026-10-23
        with:
          args: ${{ inputs.gosec_args }}

      # gosec is a static analyser: it looks at this repository's own code. It
      # is not a dependency audit and says nothing about a known advisory in a
      # module this repository imports.
      - name: govulncheck
        if: ${{ inputs.vulncheck }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT_GOVULNCHECK_VERSION: ${{ inputs.govulncheck_version }}
          INPUT_PACKAGES: ${{ inputs.vulncheck_packages }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_GOVULNCHECK_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::govulncheck_version must be vX.Y.Z, got '${INPUT_GOVULNCHECK_VERSION}'." >&2
            exit 2
          fi
          # Build with the module's Go, or with the oldest Go govulncheck
          # accepts (v1.7.0: go 1.25.0) when the module's is older. A binary
          # built with an older Go than the module's fails with "package
          # requires newer Go version". GOTOOLCHAIN=auto would pick the newest
          # Go, which moves without a commit here.
          floor=go1.25.0
          tc=local
          if [ "$(printf '%s\n' "${floor#go}" "$(go env GOVERSION | sed 's/^go//')" | sort -V | head -n1)" != "${floor#go}" ]; then
            tc="$floor"
          fi
          echo "building govulncheck with GOTOOLCHAIN=${tc} ($(go env GOVERSION) installed, floor ${floor})"
          GOTOOLCHAIN="$tc" go install "golang.org/x/vuln/cmd/govulncheck@${INPUT_GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" "${INPUT_PACKAGES}"
