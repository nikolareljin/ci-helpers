name: go-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      go_version:
        type: string
        # go.mod: Go from <working_directory>/go.mod (its toolchain line when
        # present), so a caller follows its own module. A version overrides it.
        default: "go.mod"
      lint_command:
        type: string
        default: 'test -z "$(gofmt -l .)" && go vet ./...'
      test_command:
        type: string
        # -race when the runner can build it: cgo on (Go turns it off when no C
        # compiler is found) and a platform on Go's race list. Elsewhere plain
        # go test, with a notice. Keep identical in go.yml, go-pr-gate.yml and
        # go-scan.yml; self-test-compiled.yml checks that.
        default: |
          go mod download
          race=""
          if [ "$(go env CGO_ENABLED)" = 1 ]; then
            case "$(go env GOOS)/$(go env GOARCH)" in
              linux/amd64|linux/arm64|linux/ppc64le|linux/s390x|linux/loong64|darwin/amd64|darwin/arm64|freebsd/amd64|netbsd/amd64|windows/amd64) race=-race ;;
            esac
          fi
          [ -n "$race" ] || echo "::notice::go test runs without -race: it needs cgo (a C compiler) on a supported platform"
          go test $race ./...
      gosec_args:
        type: string
        default: "./..."
      # govulncheck version, pinned. A floating @latest means the gate's
      # behaviour changes without a commit here, and a new advisory class can
      # turn every consumer red on a day nobody shipped anything.
      #
      # The install builds with the module's Go, or Go 1.25.0 when the
      # module's is older. A version that needs a newer Go than 1.25.0 fails on
      # older modules; raise `floor` in the govulncheck step with it.
      govulncheck_version:
        type: string
        default: "v1.7.0"
      # Off by default while consumers adopt it: govulncheck reports advisories
      # in dependencies, so turning it on fleet-wide would fail repositories
      # that changed nothing.
      vulncheck:
        type: boolean
        default: false
      # govulncheck's own package pattern. gosec_args belongs to gosec and is
      # not interchangeable.
      vulncheck_packages:
        type: string
        default: "./..."

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version != 'go.mod' && inputs.go_version || '' }}
          go-version-file: ${{ inputs.go_version == 'go.mod' && format('{0}/go.mod', inputs.working_directory) || '' }}

      - name: Go lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Go tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      # The library's own files at the commit of this workflow file, for the
      # gosec version pinned in scanner-pins.env. `./scripts` would resolve in
      # the caller's checkout, so the library is checked out beside it, after
      # lint and tests so neither sees it.
      - name: Check out ci-helpers scripts at this workflow's commit
        if: ${{ inputs.gosec_args != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: |
            scripts
            vendor/script-helpers
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and read today's pins after all; refuse instead.
      - name: Isolate ci-helpers scripts
        id: ci_lib_actions
        if: ${{ inputs.gosec_args != '' }}
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-actions/scripts/lib_isolate.sh .ci-helpers-actions

      # gosec built from source with `go install`, at the version pinned in
      # scanner-pins.env: the Go module checksum database verifies what is
      # built, where the container action trusted an image tag. It runs in
      # `working_directory`, as lint and tests do.
      - name: Gosec scan
        if: ${{ inputs.gosec_args != '' }}
        shell: sh
        working-directory: ${{ inputs.working_directory }}
        env:
          LIB: ${{ steps.ci_lib_actions.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_actions.outputs.hash }}
          GOSEC_ARGS: ${{ inputs.gosec_args }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GOSEC_ARGS="$GOSEC_ARGS" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          export PATH="$STEP_PATH"
          PINS="$run_lib/scanner-pins.env"
          version="$(awk -F= '$1 == "GOSEC_VERSION" { print $2; exit }' "$PINS")"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::GOSEC_VERSION in scanner-pins.env is '$version', not vX.Y.Z." >&2
            exit 2
          fi
          # Build with the module's Go, or with the oldest Go gosec accepts
          # (v2.30.0: go 1.26.0) when the module's is older; see govulncheck
          # below for why not GOTOOLCHAIN=auto. Not named `floor=`: the
          # self-test reads govulncheck's floor from this file by that name.
          gosec_floor=go1.26.0
          tc=local
          if [ "$(printf '%s\n' "${gosec_floor#go}" "$(go env GOVERSION | sed 's/^go//')" | sort -V | head -n1)" != "${gosec_floor#go}" ]; then
            tc="$gosec_floor"
          fi
          echo "building gosec ${version} with GOTOOLCHAIN=${tc} ($(go env GOVERSION) installed, floor ${gosec_floor})"
          GOTOOLCHAIN="$tc" go install "github.com/securego/gosec/v2/cmd/gosec@${version}"
          # Word-split on purpose: the input is gosec's argument list, as the
          # container action's `args` was.
          # shellcheck disable=SC2086
          "$(go env GOPATH)/bin/gosec" $GOSEC_ARGS
          CI_HELPERS_RUN
          )"

      # gosec is a static analyser: it looks at this repository's own code. It
      # is not a dependency audit and says nothing about a known advisory in a
      # module this repository imports.
      - name: govulncheck
        if: ${{ inputs.vulncheck }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT_GOVULNCHECK_VERSION: ${{ inputs.govulncheck_version }}
          INPUT_PACKAGES: ${{ inputs.vulncheck_packages }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_GOVULNCHECK_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::govulncheck_version must be vX.Y.Z, got '${INPUT_GOVULNCHECK_VERSION}'." >&2
            exit 2
          fi
          # Build with the module's Go, or with the oldest Go govulncheck
          # accepts (v1.7.0: go 1.25.0) when the module's is older. A binary
          # built with an older Go than the module's fails with "package
          # requires newer Go version". GOTOOLCHAIN=auto would pick the newest
          # Go, which moves without a commit here.
          floor=go1.25.0
          tc=local
          if [ "$(printf '%s\n' "${floor#go}" "$(go env GOVERSION | sed 's/^go//')" | sort -V | head -n1)" != "${floor#go}" ]; then
            tc="$floor"
          fi
          echo "building govulncheck with GOTOOLCHAIN=${tc} ($(go env GOVERSION) installed, floor ${floor})"
          GOTOOLCHAIN="$tc" go install "golang.org/x/vuln/cmd/govulncheck@${INPUT_GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" "${INPUT_PACKAGES}"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib_actions.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
