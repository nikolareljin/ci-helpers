name: pimcore-bundle-check

on:
  workflow_call:
    inputs:
      runner:
        type: string
        # ubuntu-24.04 until the ondrej/php PPA ships a suite for ubuntu-latest
        # (26.04); scripts/check_php_runner.py holds PHP jobs to it.
        default: ubuntu-24.04
      compose_file:
        type: string
        default: test/docker-compose.yml
      bundle_src:
        type: string
        default: "."
      bundle_src_env:
        type: string
        default: BUNDLE_SRC
      php_service:
        type: string
        default: php
      db_service:
        type: string
        default: db
      db_wait_seconds:
        type: string
        default: "20"
      out_dir:
        type: string
        default: test/tmp

      # Standalone PHP checks (PHP from apt through scripts/setup_php.sh, no Docker)
      php_version:
        type: string
        default: ""
      # Environment variable the PHP version is exported as, so the compose
      # stack can read it as a build argument. Empty exports nothing.
      php_version_env:
        type: string
        default: PHP_VERSION
      composer_command:
        type: string
        default: "composer install --no-interaction --prefer-dist"
      php_lint_command:
        type: string
        default: ""
      phpcs_standalone_command:
        type: string
        default: ""
      phpunit_standalone_command:
        type: string
        default: ""
      phpunit_working_directory:
        type: string
        default: "."

      # Commands executed inside Docker
      phpcs_command:
        type: string
        default: "vendor/bin/phpcs --standard=PSR12 --extensions=php src/"
      phpstan_command:
        type: string
        default: ""
      phpunit_command:
        type: string
        default: "vendor/bin/phpunit --testdox"
      phpunit_coverage_command:
        type: string
        default: ""

      # Behaviour
      fail_on_findings:
        type: boolean
        default: true
      cleanup:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: bundle-check-results

jobs:
  check:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: aa819e9fc9197e3f6941222ecd5141cdd152c11b # aa819e9fc9197e3f6941222ecd5141cdd152c11b
          path: .script-helpers
          fetch-depth: 1

      # Same reason as wp-plugin-check.yml: actions/checkout cannot write
      # outside the workspace, and the workspace is what `bundle_src` points
      # at. A checkout of this library sitting in the tree under test is not
      # part of the bundle.
      - name: Move script-helpers out of the bundle source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/script-helpers"
          mv .script-helpers "$RUNNER_TEMP/script-helpers"

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # PHP from apt: the image's own packages, else the ondrej/php PPA under
      # the key fingerprint pinned in the library's toolchain-pins.env; Xdebug
      # for coverage as the replaced action enabled it; Composer at the
      # release pinned there, installed after its sha256 matches.
      - name: Setup PHP (standalone)
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PHP_VERSION: ${{ inputs.php_version }}
          PHP_COVERAGE: xdebug
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" PHP_VERSION="$PHP_VERSION" PHP_COVERAGE="$PHP_COVERAGE" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_php.sh"
          CI_HELPERS_RUN
          )"

      # php_version alone only configures the optional standalone (host) PHP.
      # The Docker stack builds from the compose file, which cannot see it, so
      # the version is published to the environment for compose to interpolate
      # -- e.g. `image: php:${PHP_VERSION}-cli` or a build arg.
      - name: Export PHP version for the compose stack
        if: ${{ inputs.php_version != '' && inputs.php_version_env != '' }}
        env:
          PHP_VERSION_ENV_NAME: ${{ inputs.php_version_env }}
          PHP_VERSION_VALUE: ${{ inputs.php_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Both halves are caller-controlled. A name containing '=' or
          # whitespace, or a value containing a newline, would append extra
          # entries to GITHUB_ENV rather than the one intended -- so validate
          # before writing, as ci.yml does for db_env.
          if [[ ! "$PHP_VERSION_ENV_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::php_version_env must be a valid environment variable name; got '${PHP_VERSION_ENV_NAME}'" >&2
            exit 1
          fi
          if [[ "$PHP_VERSION_VALUE" == *$'\n'* || "$PHP_VERSION_VALUE" == *$'\r'* ]]; then
            echo "::error::php_version must not contain newlines" >&2
            exit 1
          fi

          # Heredoc form: the value is taken literally, and the delimiter is
          # unique so it cannot appear in the value.
          delimiter="php_version_$(date +%s%N)_${RANDOM}"
          {
            printf '%s<<%s\n' "$PHP_VERSION_ENV_NAME" "$delimiter"
            printf '%s\n' "$PHP_VERSION_VALUE"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Pimcore bundle check
        shell: bash
        env:
          # Every input reaches the script through env, never spliced into the
          # script text: a value with `$5`, `"` or `$(...)` stays a value. The
          # *_command inputs are code by design; ci_pimcore_bundle_check.sh
          # runs them.
          PBC_SCRIPT: ${{ runner.temp }}/script-helpers/scripts/ci_pimcore_bundle_check.sh
          PBC_COMPOSE_FILE: ${{ inputs.compose_file }}
          PBC_BUNDLE_SRC: ${{ inputs.bundle_src }}
          PBC_BUNDLE_SRC_ENV: ${{ inputs.bundle_src_env }}
          PBC_PHP_SERVICE: ${{ inputs.php_service }}
          PBC_DB_SERVICE: ${{ inputs.db_service }}
          PBC_DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
          PBC_OUT_DIR: ${{ inputs.out_dir }}
          PBC_COMPOSER_COMMAND: ${{ inputs.composer_command }}
          PBC_PHP_LINT_COMMAND: ${{ inputs.php_lint_command }}
          PBC_PHPCS_STANDALONE_COMMAND: ${{ inputs.phpcs_standalone_command }}
          PBC_PHPUNIT_STANDALONE_COMMAND: ${{ inputs.phpunit_standalone_command }}
          PBC_PHPUNIT_WORKING_DIRECTORY: ${{ inputs.phpunit_working_directory }}
          PBC_PHPCS_COMMAND: ${{ inputs.phpcs_command }}
          PBC_PHPSTAN_COMMAND: ${{ inputs.phpstan_command }}
          PBC_PHPUNIT_COMMAND: ${{ inputs.phpunit_command }}
          PBC_PHPUNIT_COVERAGE_COMMAND: ${{ inputs.phpunit_coverage_command }}
          PBC_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          PBC_CLEANUP: ${{ inputs.cleanup }}
        run: |
          set -euo pipefail
          "$PBC_SCRIPT" \
            --compose-file "$PBC_COMPOSE_FILE" \
            --bundle-src "$PBC_BUNDLE_SRC" \
            --bundle-src-env "$PBC_BUNDLE_SRC_ENV" \
            --php-service "$PBC_PHP_SERVICE" \
            --db-service "$PBC_DB_SERVICE" \
            --db-wait-seconds "$PBC_DB_WAIT_SECONDS" \
            --out-dir "$PBC_OUT_DIR" \
            --composer-command "$PBC_COMPOSER_COMMAND" \
            --php-lint-command "$PBC_PHP_LINT_COMMAND" \
            --phpcs-standalone-command "$PBC_PHPCS_STANDALONE_COMMAND" \
            --phpunit-standalone-command "$PBC_PHPUNIT_STANDALONE_COMMAND" \
            --phpunit-working-directory "$PBC_PHPUNIT_WORKING_DIRECTORY" \
            --phpcs-command "$PBC_PHPCS_COMMAND" \
            --phpstan-command "$PBC_PHPSTAN_COMMAND" \
            --phpunit-command "$PBC_PHPUNIT_COMMAND" \
            --phpunit-coverage-command "$PBC_PHPUNIT_COVERAGE_COMMAND" \
            --fail-on-findings "$PBC_FAIL_ON_FINDINGS" \
            --cleanup "$PBC_CLEANUP"

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if "$git" rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$("$git" rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}
          mode: artifact
          paths: ${{ inputs.out_dir }}

      - name: Upload test artifacts
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          if-no-files-found: warn

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
