name: pimcore-bundle-check

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      compose_file:
        type: string
        default: test/docker-compose.yml
      bundle_src:
        type: string
        default: "."
      bundle_src_env:
        type: string
        default: BUNDLE_SRC
      php_service:
        type: string
        default: php
      db_service:
        type: string
        default: db
      db_wait_seconds:
        type: string
        default: "20"
      out_dir:
        type: string
        default: test/tmp

      # Standalone PHP checks (shivammathur/setup-php, no Docker)
      php_version:
        type: string
        default: ""
      # Environment variable the PHP version is exported as, so the compose
      # stack can read it as a build argument. Empty exports nothing.
      php_version_env:
        type: string
        default: PHP_VERSION
      composer_command:
        type: string
        default: "composer install --no-interaction --prefer-dist"
      php_lint_command:
        type: string
        default: ""
      phpcs_standalone_command:
        type: string
        default: ""
      phpunit_standalone_command:
        type: string
        default: ""
      phpunit_working_directory:
        type: string
        default: "."

      # Commands executed inside Docker
      phpcs_command:
        type: string
        default: "vendor/bin/phpcs --standard=PSR12 --extensions=php src/"
      phpstan_command:
        type: string
        default: ""
      phpunit_command:
        type: string
        default: "vendor/bin/phpunit --testdox"
      phpunit_coverage_command:
        type: string
        default: ""

      # Behaviour
      fail_on_findings:
        type: boolean
        default: true
      cleanup:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: bundle-check-results

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nikolareljin/script-helpers
          ref: 3d70d24b4584997b5ef094b68a3f0d8494b3635c
          path: .script-helpers
          fetch-depth: 1

      - name: Setup PHP (standalone)
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}
          coverage: xdebug

      # php_version alone only configures the optional standalone (host) PHP.
      # The Docker stack builds from the compose file, which cannot see it, so
      # the version is published to the environment for compose to interpolate
      # -- e.g. `image: php:${PHP_VERSION}-cli` or a build arg.
      - name: Export PHP version for the compose stack
        if: ${{ inputs.php_version != '' && inputs.php_version_env != '' }}
        env:
          PHP_VERSION_ENV_NAME: ${{ inputs.php_version_env }}
          PHP_VERSION_VALUE: ${{ inputs.php_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Both halves are caller-controlled. A name containing '=' or
          # whitespace, or a value containing a newline, would append extra
          # entries to GITHUB_ENV rather than the one intended -- so validate
          # before writing, as ci.yml does for db_env.
          if [[ ! "$PHP_VERSION_ENV_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::php_version_env must be a valid environment variable name; got '${PHP_VERSION_ENV_NAME}'" >&2
            exit 1
          fi
          if [[ "$PHP_VERSION_VALUE" == *$'\n'* || "$PHP_VERSION_VALUE" == *$'\r'* ]]; then
            echo "::error::php_version must not contain newlines" >&2
            exit 1
          fi

          # Heredoc form: the value is taken literally, and the delimiter is
          # unique so it cannot appear in the value.
          delimiter="php_version_$(date +%s%N)_${RANDOM}"
          {
            printf '%s<<%s\n' "$PHP_VERSION_ENV_NAME" "$delimiter"
            printf '%s\n' "$PHP_VERSION_VALUE"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Pimcore bundle check
        shell: bash
        run: |
          set -euo pipefail
          ./.script-helpers/scripts/ci_pimcore_bundle_check.sh \
            --compose-file "${{ inputs.compose_file }}" \
            --bundle-src "${{ inputs.bundle_src }}" \
            --bundle-src-env "${{ inputs.bundle_src_env }}" \
            --php-service "${{ inputs.php_service }}" \
            --db-service "${{ inputs.db_service }}" \
            --db-wait-seconds "${{ inputs.db_wait_seconds }}" \
            --out-dir "${{ inputs.out_dir }}" \
            --php-version "${{ inputs.php_version }}" \
            --composer-command "${{ inputs.composer_command }}" \
            --php-lint-command "${{ inputs.php_lint_command }}" \
            --phpcs-standalone-command "${{ inputs.phpcs_standalone_command }}" \
            --phpunit-standalone-command "${{ inputs.phpunit_standalone_command }}" \
            --phpunit-working-directory "${{ inputs.phpunit_working_directory }}" \
            --phpcs-command "${{ inputs.phpcs_command }}" \
            --phpstan-command "${{ inputs.phpstan_command }}" \
            --phpunit-command "${{ inputs.phpunit_command }}" \
            --phpunit-coverage-command "${{ inputs.phpunit_coverage_command }}" \
            --fail-on-findings "${{ inputs.fail_on_findings }}" \
            --cleanup "${{ inputs.cleanup }}"

      - name: Upload test artifacts
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.out_dir }}
          if-no-files-found: warn
