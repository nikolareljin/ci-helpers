name: pimcore-bundle-check

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      compose_file:
        type: string
        default: test/docker-compose.yml
      bundle_src:
        type: string
        default: "."
      bundle_src_env:
        type: string
        default: BUNDLE_SRC
      php_service:
        type: string
        default: php
      db_service:
        type: string
        default: db
      db_wait_seconds:
        type: string
        default: "20"
      out_dir:
        type: string
        default: test/tmp

      # Standalone PHP checks (shivammathur/setup-php, no Docker)
      php_version:
        type: string
        default: ""
      # Environment variable the PHP version is exported as, so the compose
      # stack can read it as a build argument. Empty exports nothing.
      php_version_env:
        type: string
        default: PHP_VERSION
      composer_command:
        type: string
        default: "composer install --no-interaction --prefer-dist"
      php_lint_command:
        type: string
        default: ""
      phpcs_standalone_command:
        type: string
        default: ""
      phpunit_standalone_command:
        type: string
        default: ""
      phpunit_working_directory:
        type: string
        default: "."

      # Commands executed inside Docker
      phpcs_command:
        type: string
        default: "vendor/bin/phpcs --standard=PSR12 --extensions=php src/"
      phpstan_command:
        type: string
        default: ""
      phpunit_command:
        type: string
        default: "vendor/bin/phpunit --testdox"
      phpunit_coverage_command:
        type: string
        default: ""

      # Behaviour
      fail_on_findings:
        type: boolean
        default: true
      cleanup:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: bundle-check-results

jobs:
  check:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 1fdf01e83fb7f07529c5ec96cb9cb871fe166f7f # 0.59.0
          path: .script-helpers
          fetch-depth: 1

      # Same reason as wp-plugin-check.yml: actions/checkout cannot write
      # outside the workspace, and the workspace is what `bundle_src` points
      # at. A checkout of this library sitting in the tree under test is not
      # part of the bundle.
      - name: Move script-helpers out of the bundle source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/script-helpers"
          mv .script-helpers "$RUNNER_TEMP/script-helpers"

      - name: Setup PHP (standalone)
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_standalone_command != '' || inputs.phpunit_standalone_command != '') }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 @ 2026-10-16
        with:
          php-version: ${{ inputs.php_version }}
          coverage: xdebug

      # php_version alone only configures the optional standalone (host) PHP.
      # The Docker stack builds from the compose file, which cannot see it, so
      # the version is published to the environment for compose to interpolate
      # -- e.g. `image: php:${PHP_VERSION}-cli` or a build arg.
      - name: Export PHP version for the compose stack
        if: ${{ inputs.php_version != '' && inputs.php_version_env != '' }}
        env:
          PHP_VERSION_ENV_NAME: ${{ inputs.php_version_env }}
          PHP_VERSION_VALUE: ${{ inputs.php_version }}
        shell: bash
        run: |
          set -euo pipefail

          # Both halves are caller-controlled. A name containing '=' or
          # whitespace, or a value containing a newline, would append extra
          # entries to GITHUB_ENV rather than the one intended -- so validate
          # before writing, as ci.yml does for db_env.
          if [[ ! "$PHP_VERSION_ENV_NAME" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "::error::php_version_env must be a valid environment variable name; got '${PHP_VERSION_ENV_NAME}'" >&2
            exit 1
          fi
          if [[ "$PHP_VERSION_VALUE" == *$'\n'* || "$PHP_VERSION_VALUE" == *$'\r'* ]]; then
            echo "::error::php_version must not contain newlines" >&2
            exit 1
          fi

          # Heredoc form: the value is taken literally, and the delimiter is
          # unique so it cannot appear in the value.
          delimiter="php_version_$(date +%s%N)_${RANDOM}"
          {
            printf '%s<<%s\n' "$PHP_VERSION_ENV_NAME" "$delimiter"
            printf '%s\n' "$PHP_VERSION_VALUE"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Pimcore bundle check
        shell: bash
        env:
          # Every input reaches the script through env, never spliced into the
          # script text: a value with `$5`, `"` or `$(...)` stays a value. The
          # *_command inputs are code by design; ci_pimcore_bundle_check.sh
          # runs them.
          PBC_SCRIPT: ${{ runner.temp }}/script-helpers/scripts/ci_pimcore_bundle_check.sh
          PBC_COMPOSE_FILE: ${{ inputs.compose_file }}
          PBC_BUNDLE_SRC: ${{ inputs.bundle_src }}
          PBC_BUNDLE_SRC_ENV: ${{ inputs.bundle_src_env }}
          PBC_PHP_SERVICE: ${{ inputs.php_service }}
          PBC_DB_SERVICE: ${{ inputs.db_service }}
          PBC_DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
          PBC_OUT_DIR: ${{ inputs.out_dir }}
          PBC_COMPOSER_COMMAND: ${{ inputs.composer_command }}
          PBC_PHP_LINT_COMMAND: ${{ inputs.php_lint_command }}
          PBC_PHPCS_STANDALONE_COMMAND: ${{ inputs.phpcs_standalone_command }}
          PBC_PHPUNIT_STANDALONE_COMMAND: ${{ inputs.phpunit_standalone_command }}
          PBC_PHPUNIT_WORKING_DIRECTORY: ${{ inputs.phpunit_working_directory }}
          PBC_PHPCS_COMMAND: ${{ inputs.phpcs_command }}
          PBC_PHPSTAN_COMMAND: ${{ inputs.phpstan_command }}
          PBC_PHPUNIT_COMMAND: ${{ inputs.phpunit_command }}
          PBC_PHPUNIT_COVERAGE_COMMAND: ${{ inputs.phpunit_coverage_command }}
          PBC_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          PBC_CLEANUP: ${{ inputs.cleanup }}
        run: |
          set -euo pipefail
          "$PBC_SCRIPT" \
            --compose-file "$PBC_COMPOSE_FILE" \
            --bundle-src "$PBC_BUNDLE_SRC" \
            --bundle-src-env "$PBC_BUNDLE_SRC_ENV" \
            --php-service "$PBC_PHP_SERVICE" \
            --db-service "$PBC_DB_SERVICE" \
            --db-wait-seconds "$PBC_DB_WAIT_SECONDS" \
            --out-dir "$PBC_OUT_DIR" \
            --composer-command "$PBC_COMPOSER_COMMAND" \
            --php-lint-command "$PBC_PHP_LINT_COMMAND" \
            --phpcs-standalone-command "$PBC_PHPCS_STANDALONE_COMMAND" \
            --phpunit-standalone-command "$PBC_PHPUNIT_STANDALONE_COMMAND" \
            --phpunit-working-directory "$PBC_PHPUNIT_WORKING_DIRECTORY" \
            --phpcs-command "$PBC_PHPCS_COMMAND" \
            --phpstan-command "$PBC_PHPSTAN_COMMAND" \
            --phpunit-command "$PBC_PHPUNIT_COMMAND" \
            --phpunit-coverage-command "$PBC_PHPUNIT_COVERAGE_COMMAND" \
            --fail-on-findings "$PBC_FAIL_ON_FINDINGS" \
            --cleanup "$PBC_CLEANUP"

      - name: Upload test artifacts
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.out_dir }}
          if-no-files-found: warn
