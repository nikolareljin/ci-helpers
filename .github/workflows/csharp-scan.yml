name: csharp-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      dotnet_version:
        type: string
        default: "8.0.x"
      lint_command:
        type: string
        default: 'dotnet tool install -g dotnet-format && export PATH="$PATH:$HOME/.dotnet/tools" && dotnet-format --verify-no-changes'
      test_command:
        type: string
        default: "dotnet restore && dotnet test"
      # `dotnet list package --vulnerable` exits 0 even when it lists vulnerable
      # packages, so the default fails on its "has the following vulnerable
      # packages" line.
      vuln_command:
        type: string
        default: >-
          dotnet list package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/dotnet-vulnerable.txt";
          if grep -q 'has the following vulnerable packages' "$RUNNER_TEMP/dotnet-vulnerable.txt"; then
          echo "::error::Vulnerable NuGet packages found (listed above)"; exit 1; fi

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: .NET lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: .NET tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Vulnerable packages
        if: ${{ inputs.vuln_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.vuln_command }}
