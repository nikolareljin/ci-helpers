name: csharp-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      dotnet_version:
        type: string
        default: "8.0.x"
      project:
        description: >
          Project or solution to restore, build, test and format, relative to
          working_directory (e.g. "MyApp.csproj", "src/MyApp/MyApp.csproj",
          "MyApp.sln"). Leave empty to let dotnet pick, which only works when the
          directory holds exactly one project or solution: a directory holding
          both a .sln and a .csproj fails with MSB1011, and a project in a
          subdirectory fails with MSB1003.
        type: string
        default: ""
      lint_command:
        description: >
          Defaults to the SDK's built-in `dotnet format` against `project`. The
          previous default installed the standalone dotnet-format tool and passed
          it --verify-no-changes, a flag only the built-in accepts; the tool read
          it as a file name and exited 1, so the default could not pass anywhere.
          Set this to override the command entirely; `project` is then ignored.
        type: string
        default: ""
      test_command:
        description: >
          Defaults to restore and test of `project`. Set this to override the
          command entirely; `project` is then ignored.
        type: string
        default: ""
      # `dotnet list package --vulnerable` exits 0 even when it lists vulnerable
      # packages, so the default fails on its "has the following vulnerable
      # packages" line. The CLI language is forced to English because that line
      # is translated, and on a non-English runner the check would never match.
      vuln_command:
        type: string
        default: >-
          DOTNET_CLI_UI_LANGUAGE=en dotnet list package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/dotnet-vulnerable.txt";
          if grep -q 'has the following vulnerable packages' "$RUNNER_TEMP/dotnet-vulnerable.txt"; then
          echo "::error::Vulnerable NuGet packages found (listed above)"; exit 1; fi

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: .NET lint
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          # Neither value is spliced into the command text. An explicit
          # command is arbitrary shell by contract and runs as given; the
          # default references the path as a quoted argument, so a path
          # with a space works and a path cannot become a command.
          STAGE_COMMAND: ${{ inputs.lint_command }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [[ -n "$STAGE_COMMAND" ]]; then
            bash -c "$STAGE_COMMAND"
          elif [[ -n "$PROJECT" ]]; then
            dotnet format "$PROJECT" --verify-no-changes
          else
            dotnet format --verify-no-changes
          fi

      - name: .NET tests
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          # Neither value is spliced into the command text. An explicit
          # command is arbitrary shell by contract and runs as given; the
          # default references the path as a quoted argument, so a path
          # with a space works and a path cannot become a command.
          STAGE_COMMAND: ${{ inputs.test_command }}
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          if [[ -n "$STAGE_COMMAND" ]]; then
            bash -c "$STAGE_COMMAND"
          elif [[ -n "$PROJECT" ]]; then
            dotnet restore "$PROJECT" && dotnet test "$PROJECT"
          else
            dotnet restore && dotnet test
          fi

      - name: Vulnerable packages
        if: ${{ inputs.vuln_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.vuln_command }}
