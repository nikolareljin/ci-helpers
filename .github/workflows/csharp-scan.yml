name: csharp-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      dotnet_version:
        type: string
        default: "8.0.x"
      project:
        description: >
          Project or solution to restore, build, test and format, relative to
          working_directory (e.g. "MyApp.csproj", "src/MyApp/MyApp.csproj",
          "MyApp.sln"). Leave empty to let dotnet pick, which only works when the
          directory holds exactly one project or solution: a directory holding
          both a .sln and a .csproj fails with MSB1011, and a project in a
          subdirectory fails with MSB1003.
        type: string
        default: ""
      lint_command:
        description: >
          Defaults to the SDK's built-in `dotnet format`. Set to "" to disable
          the stage, as in every other preset here. When left at the default and
          `project` is set, the project is passed to it.
        type: string
        default: "dotnet format --verify-no-changes"
      test_command:
        description: >
          Set to "" to disable the stage. When left at the default and `project`
          is set, the project is passed to restore and test.
        type: string
        default: "dotnet restore && dotnet test"
      # `dotnet list package --vulnerable` exits 0 even when it lists vulnerable
      # packages, so the default fails on its "has the following vulnerable
      # packages" line. The CLI language is forced to English because that line
      # is translated, and on a non-English runner the check would never match.
      vuln_command:
        type: string
        default: >-
          DOTNET_CLI_UI_LANGUAGE=en dotnet list package --vulnerable --include-transitive 2>&1 | tee "$RUNNER_TEMP/dotnet-vulnerable.txt";
          if grep -q 'has the following vulnerable packages' "$RUNNER_TEMP/dotnet-vulnerable.txt"; then
          echo "::error::Vulnerable NuGet packages found (listed above)"; exit 1; fi

jobs:
  validate-inputs:
    uses: ./.github/workflows/validate-dotnet-project.yml
    with:
      project: ${{ inputs.project }}

  scan:
    needs: [validate-inputs]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: .NET lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          STAGE_COMMAND: >-
            ${{ (inputs.lint_command == 'dotnet format --verify-no-changes' && inputs.project != '')
                && format('dotnet format "{0}" --verify-no-changes', inputs.project)
                || inputs.lint_command }}
        run: |
          set -euo pipefail
          eval "$STAGE_COMMAND"

      - name: .NET tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          STAGE_COMMAND: >-
            ${{ (inputs.test_command == 'dotnet restore && dotnet test' && inputs.project != '')
                && format('dotnet restore "{0}" && dotnet test "{0}"', inputs.project)
                || inputs.test_command }}
        run: |
          set -euo pipefail
          eval "$STAGE_COMMAND"

      - name: Vulnerable packages
        if: ${{ inputs.vuln_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.vuln_command }}
