      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB_0: ${{ steps.ci_lib_publication.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

  bump-homebrew:
    name: Generate Homebrew formula
    # After upload-release: the formula points at the release assets. And
    # after every leg: a formula with a missing platform is worse than none.
    needs: [build-tarballs, upload-release]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! echo "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '${tag}' is not a version number."
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Download sha artifacts
        # NOTE: download-artifact@v8 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Update formula
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BIN_NAME: ${{ inputs.bin_name }}
          FORMULA_CLASS: ${{ inputs.formula_class }}
          DESC: ${{ inputs.desc }}
          HOMEPAGE: ${{ inputs.homepage }}
          LICENSE: ${{ inputs.license }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          sha_arm64="$(awk '{print $1}' sha256-macos-arm64.txt)"
          sha_x86_64="$(awk '{print $1}' sha256-macos-x86_64.txt)"
          sha_linux="$(awk '{print $1}'  sha256-linux-x86_64.txt)"

          TAG="$TAG" VERSION="$version" \
          SHA_ARM64="$sha_arm64" SHA_X86_64="$sha_x86_64" SHA_LINUX="$sha_linux" \
          python3 - <<'PY'
          import re, os
          from pathlib import Path

          tag       = os.environ["TAG"]
          v         = os.environ["VERSION"]
          arm64     = os.environ["SHA_ARM64"]
          x86_64    = os.environ["SHA_X86_64"]
          linux     = os.environ["SHA_LINUX"]
          bin_name  = os.environ["BIN_NAME"]
          desc      = os.environ["DESC"]
          homepage  = os.environ["HOMEPAGE"]
          license_  = os.environ["LICENSE"]

          formula_class = os.environ.get("FORMULA_CLASS", "").strip()
          if not formula_class:
              formula_class = "".join(w.capitalize() for w in bin_name.replace("-", " ").split())

          for sha, name in [(arm64, "arm64"), (x86_64, "x86_64"), (linux, "linux")]:
              if not re.match(r'^[0-9a-f]{64}$', sha):
                  raise SystemExit(f"Invalid SHA256 for {name}: {sha}")

          repo = homepage.rstrip("/")
          if repo.endswith(".git"):
              repo = repo[:-4]
          homepage = repo
          formula = Path(f"formula/{bin_name}.rb")
          formula.parent.mkdir(exist_ok=True)
          content = f'''class {formula_class} < Formula
            desc "{desc}"
            homepage "{homepage}"
            version "{v}"
            license "{license_}"
            tag = "{tag}"

            on_macos do
              if Hardware::CPU.arm?
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-macos-arm64.tar.gz"
                sha256 "{arm64}"
              else
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-macos-x86_64.tar.gz"
                sha256 "{x86_64}"
              end
            end

            on_linux do
              # Releases ship an x86_64 Linux build only.
              depends_on arch: :x86_64

              if Hardware::CPU.intel?
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-linux-x86_64.tar.gz"
                sha256 "{linux}"
              end
            end

            def install
              bin.install "{bin_name}"
            end

            test do
              assert_match "{bin_name}", shell_output("#{{bin}}/{bin_name} --help")
            end
          end
          '''
          formula.write_text(content)
          print(f"Formula written: {formula}")
          PY

      - name: Validate formula syntax
        env:
          BIN_NAME: ${{ inputs.bin_name }}
        run: ruby -c "formula/${BIN_NAME}.rb"

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if "$git" rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$("$git" rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: homebrew-formula-${{ inputs.bin_name }}
          mode: artifact
          paths: formula/${{ inputs.bin_name }}.rb

      - name: Upload formula
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        # NOTE: upload-artifact@v7 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          # Named per binary: artifact names are shared by every job of the
          # caller's run, which may upload its own.
          name: homebrew-formula-${{ inputs.bin_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          if-no-files-found: error

  # The push lives in one language-agnostic workflow shared with every other
  # formula producer. `./` resolves to ci-helpers at the ref the caller pinned.
  publish-homebrew:
    name: Publish Homebrew formula
    needs: bump-homebrew
    # The callee pushes with the tap's own deploy key or token, not this one.
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap-publish.yml
    with:
      formula_artifact: homebrew-formula-${{ inputs.bin_name }}
      formula_file: ${{ inputs.bin_name }}.rb
      tap_repo: ${{ inputs.tap_repo }}
      tap_branch: ${{ inputs.tap_branch }}
      tap_dir: ${{ inputs.tap_dir }}
      commit_message: Update ${{ inputs.bin_name }} to ${{ needs.bump-homebrew.outputs.tag }}
    secrets:
      tap_repo: ${{ secrets.tap_repo }}
      tap_deploy_key: ${{ secrets.tap_deploy_key }}
      tap_token: ${{ secrets.tap_token }}
