name: ci-helpers-rust-release-tarballs
on:
  workflow_call:
    inputs:
      bin_name:
        description: "Binary name (e.g. vellum, image-view)."
        type: string
        required: true
      formula_class:
        description: >
          Ruby class name for the Homebrew formula (e.g. ImageView).
          Derived from bin_name if omitted (hyphens removed, each word capitalised).
        type: string
        default: ""
      desc:
        description: "Homebrew formula description."
        type: string
        required: true
      homepage:
        description: >
          GitHub repository URL used as the formula homepage AND as the base
          for release download URLs (e.g. https://github.com/owner/repo).
          Trailing slashes and .git suffixes are stripped automatically.
          Must be a GitHub repo URL; non-GitHub URLs will produce incorrect
          formula download links.
        type: string
        required: true
      license:
        description: "SPDX license identifier."
        type: string
        default: "MIT"
      tap_repo:
        description: "Tap repository as owner/repo (e.g. owner/homebrew-tap). Leave empty to pass it as the tap_repo secret."
        type: string
        default: ""
      tap_dir:
        description: "Subdirectory inside the tap that holds formula files."
        type: string
        default: "Formula"
      tap_branch:
        description: "Branch to push the updated formula to."
        type: string
        default: "main"
      release_tag:
        description: >
          Tag to build tarballs for (e.g. 0.6.0). Leave empty to use the pushed tag.
          Set explicitly when triggering via workflow_dispatch for a backfill run.
        type: string
        default: ""
      rust_toolchain:
        description: "Rust toolchain channel."
        type: string
        default: "stable"
      macos_deployment_target:
        description: "MACOSX_DEPLOYMENT_TARGET for the x86_64 macOS build."
        type: string
        default: "10.13"
    secrets:
      tap_repo:
        description: "Tap repository as owner/repo, when kept as a secret instead of the tap_repo input."
        required: false
      tap_deploy_key:
        description: "SSH private key of a write deploy key on the tap (preferred; see homebrew-tap-publish.yml)."
        required: false
      tap_token:
        description: "Token with contents:write on the tap; used only when tap_deploy_key is not set."
        required: false

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The caller's crate builds here with a read-only token. upload-release
  # below holds contents: write and runs none of the caller's code.
  build-tarballs:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    # Set by the first step of every leg, from the same inputs.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-14
            platform: macos-x86_64
            rust_target: x86_64-apple-darwin
          # The oldest supported runner: the binary links against the build
          # host's glibc, and a 24.04 build needs glibc 2.34+ and warns about
          # GLIBC_2.39 symbols on 22.04 at every start.
          - os: ubuntu-22.04
            platform: linux-x86_64
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! echo "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '${tag}' is not a version number. Provide release_tag input or push to a version tag."
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          # Full history so release_notes.sh can list commits since the previous
          # tag when the CHANGELOG has no section for this version.
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Build release binary
        id: build
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
          MACOS_DEPLOYMENT_TARGET: ${{ inputs.macos_deployment_target }}
          BIN_NAME: ${{ inputs.bin_name }}
        run: |
          set -euo pipefail
          if [ -n "${RUST_TARGET:-}" ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"
            rustup target add "$RUST_TARGET"
            cargo build --release --target "$RUST_TARGET"
            bin_path="target/$RUST_TARGET/release/$BIN_NAME"
          else
            cargo build --release
            bin_path="target/release/$BIN_NAME"
          fi
          [ -f "$bin_path" ] || { echo "::error::Binary not found at $bin_path"; exit 1; }
          echo "bin_path=$bin_path" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        id: package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TAG: ${{ steps.tag.outputs.tag }}
          BIN_NAME: ${{ inputs.bin_name }}
          BIN_PATH: ${{ steps.build.outputs.bin_path }}
        run: |
          set -euo pipefail
          tarball="${BIN_NAME}-${TAG}-${PLATFORM}.tar.gz"
          bin_dir="$(dirname "$BIN_PATH")"
          tar -czf "$tarball" -C "$bin_dir" "$BIN_NAME"
          if command -v shasum >/dev/null 2>&1; then
            sha256="$(shasum -a 256 "$tarball" | awk '{print $1}')"
          else
            sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256"   >> "$GITHUB_OUTPUT"

      # Generate the notes once, on the Linux leg. The body is identical for
      # every matrix leg (same tag, same CHANGELOG), so one leg produces it and
      # upload-release sets the body once.
      - name: Checkout script-helpers for release notes
        if: runner.os == 'Linux'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 88790867d6e603bce6075c1475dc4f3fb0cfbe22 # 0.57.0
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        if: runner.os == 'Linux'
        shell: bash
        env:
          RN_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          version="${RN_VERSION:-}"
          # A non-version ref has no release to describe -- skip with no body
          # rather than fail the job (GitHub then uses its default).
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "release notes: '$version' is not a version; skipping (no body)."
            exit 0
          fi
          producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
          if [ ! -f "$producer" ]; then
            echo "release notes: $producer not found (script-helpers checkout failed)" >&2
            exit 1
          fi
          # Best-effort: never fail the release because the notes could not be
          # produced. Publish without a body and say so instead.
          if bash "$producer" --version "$version" --repo "$GITHUB_WORKSPACE" --output "$notes_file"; then
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release notes generation failed; publishing without a body."
          fi

      - name: Hand the tarball to upload-release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: release-tarball-${{ inputs.bin_name }}-${{ matrix.platform }}
          path: ${{ steps.package.outputs.tarball }}
          if-no-files-found: error
          overwrite: true

      - name: Hand the release notes to upload-release
        if: ${{ steps.notes.outputs.notes_file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: release-notes-${{ inputs.bin_name }}
          path: ${{ steps.notes.outputs.notes_file }}
          if-no-files-found: error
          overwrite: true

      - name: Write sha metadata
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          printf "%s  %s\n" "$SHA256" "$TARBALL" > "sha256-${PLATFORM}.txt"

      - name: Upload sha artifact
        # NOTE: upload-artifact@v7 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: sha256-${{ matrix.platform }}
          path: sha256-${{ matrix.platform }}.txt

  upload-release:
    name: Upload release assets
    needs: build-tarballs
    # Legs run with fail-fast: false and each used to publish its own tarball,
    # so one failed leg still let the others reach the release. Keep that.
    if: ${{ !cancelled() && needs.build-tarballs.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: release-tarball-${{ inputs.bin_name }}-*
          path: tarballs
          merge-multiple: true

      # Absent when the notes step skipped or failed; the release then keeps
      # GitHub's default body, as before.
      - name: Download release notes
        id: notes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: release-notes-${{ inputs.bin_name }}
          path: release-notes

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 @ 2026-09-10
        with:
          tag_name: ${{ needs.build-tarballs.outputs.tag }}
          body_path: ${{ steps.notes.outcome == 'success' && 'release-notes/release-notes.md' || '' }}
          files: tarballs/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bump-homebrew:
    name: Generate Homebrew formula
    # After upload-release: the formula points at the release assets. And
    # after every leg: a formula with a missing platform is worse than none.
    needs: [build-tarballs, upload-release]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! echo "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '${tag}' is not a version number."
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Download sha artifacts
        # NOTE: download-artifact@v8 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Update formula
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BIN_NAME: ${{ inputs.bin_name }}
          FORMULA_CLASS: ${{ inputs.formula_class }}
          DESC: ${{ inputs.desc }}
          HOMEPAGE: ${{ inputs.homepage }}
          LICENSE: ${{ inputs.license }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          sha_arm64="$(awk '{print $1}' sha256-macos-arm64.txt)"
          sha_x86_64="$(awk '{print $1}' sha256-macos-x86_64.txt)"
          sha_linux="$(awk '{print $1}'  sha256-linux-x86_64.txt)"

          TAG="$TAG" VERSION="$version" \
          SHA_ARM64="$sha_arm64" SHA_X86_64="$sha_x86_64" SHA_LINUX="$sha_linux" \
          python3 - <<'PY'
          import re, os
          from pathlib import Path

          tag       = os.environ["TAG"]
          v         = os.environ["VERSION"]
          arm64     = os.environ["SHA_ARM64"]
          x86_64    = os.environ["SHA_X86_64"]
          linux     = os.environ["SHA_LINUX"]
          bin_name  = os.environ["BIN_NAME"]
          desc      = os.environ["DESC"]
          homepage  = os.environ["HOMEPAGE"]
          license_  = os.environ["LICENSE"]

          formula_class = os.environ.get("FORMULA_CLASS", "").strip()
          if not formula_class:
              formula_class = "".join(w.capitalize() for w in bin_name.replace("-", " ").split())

          for sha, name in [(arm64, "arm64"), (x86_64, "x86_64"), (linux, "linux")]:
              if not re.match(r'^[0-9a-f]{64}$', sha):
                  raise SystemExit(f"Invalid SHA256 for {name}: {sha}")

          repo = homepage.rstrip("/")
          if repo.endswith(".git"):
              repo = repo[:-4]
          homepage = repo
          formula = Path(f"formula/{bin_name}.rb")
          formula.parent.mkdir(exist_ok=True)
          content = f'''class {formula_class} < Formula
            desc "{desc}"
            homepage "{homepage}"
            version "{v}"
            license "{license_}"
            tag = "{tag}"

            on_macos do
              if Hardware::CPU.arm?
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-macos-arm64.tar.gz"
                sha256 "{arm64}"
              else
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-macos-x86_64.tar.gz"
                sha256 "{x86_64}"
              end
            end

            on_linux do
              # Releases ship an x86_64 Linux build only.
              depends_on arch: :x86_64

              if Hardware::CPU.intel?
                url "{repo}/releases/download/#{{tag}}/{bin_name}-#{{tag}}-linux-x86_64.tar.gz"
                sha256 "{linux}"
              end
            end

            def install
              bin.install "{bin_name}"
            end

            test do
              assert_match "{bin_name}", shell_output("#{{bin}}/{bin_name} --help")
            end
          end
          '''
          formula.write_text(content)
          print(f"Formula written: {formula}")
          PY

      - name: Validate formula syntax
        env:
          BIN_NAME: ${{ inputs.bin_name }}
        run: ruby -c "formula/${BIN_NAME}.rb"

      - name: Upload formula
        # NOTE: upload-artifact@v7 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          # Named per binary: artifact names are shared by every job of the
          # caller's run, which may upload its own.
          name: homebrew-formula-${{ inputs.bin_name }}
          path: formula/${{ inputs.bin_name }}.rb
          if-no-files-found: error

  # The push lives in one language-agnostic workflow shared with every other
  # formula producer. `./` resolves to ci-helpers at the ref the caller pinned.
  publish-homebrew:
    name: Publish Homebrew formula
    needs: bump-homebrew
    # The callee pushes with the tap's own deploy key or token, not this one.
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap-publish.yml
    with:
      formula_artifact: homebrew-formula-${{ inputs.bin_name }}
      formula_file: ${{ inputs.bin_name }}.rb
      tap_repo: ${{ inputs.tap_repo }}
      tap_branch: ${{ inputs.tap_branch }}
      tap_dir: ${{ inputs.tap_dir }}
      commit_message: Update ${{ inputs.bin_name }} to ${{ needs.bump-homebrew.outputs.tag }}
    secrets:
      tap_repo: ${{ secrets.tap_repo }}
      tap_deploy_key: ${{ secrets.tap_deploy_key }}
      tap_token: ${{ secrets.tap_token }}
