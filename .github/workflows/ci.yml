name: ci-helpers-ci
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      node_version:
        type: string
        default: ""
      java_version:
        type: string
        default: ""
      dotnet_version:
        type: string
        default: ""
      python_version:
        type: string
        default: ""
      go_version:
        type: string
        default: ""
      flutter_version:
        type: string
        default: ""
      flutter_channel:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: ""
      rust_components:
        type: string
        default: ""
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
      e2e_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      extra_command:
        type: string
        default: ""
      # Optional database service. When db_image is set, the image is started
      # via `docker run` before the command steps (services: blocks can't be
      # conditional in a reusable job). Framework-agnostic: pick the image, the
      # container env, the published ports, and a readiness probe.
      db_image:
        type: string
        default: ""
      db_env:
        type: string
        default: ""
      db_ports:
        type: string
        default: ""
      db_health_cmd:
        type: string
        default: ""
      db_wait_seconds:
        type: number
        default: 60
      # Extra environment passed through to the Test step as one KEY=VALUE per
      # line. Values are written verbatim to $GITHUB_ENV and never re-quoted by
      # the shell, so passwords/credentials with special characters are safe.
      extra_env:
        type: string
        default: ""

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # Optional DB started early so it is warm by the time tests run. Inputs are
      # caller-defined workflow config, but we still pass them via env (never
      # interpolated into the script body) to keep the shell injection-safe.
      - name: Start database service
        if: ${{ inputs.db_image != '' }}
        shell: bash
        env:
          DB_IMAGE: ${{ inputs.db_image }}
          DB_ENV: ${{ inputs.db_env }}
          DB_PORTS: ${{ inputs.db_ports }}
          DB_HEALTH_CMD: ${{ inputs.db_health_cmd }}
          DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
        run: |
          set -euo pipefail
          # Unique container name per run so concurrent jobs on self-hosted
          # runners (which share a Docker daemon) never collide on a fixed name.
          # Exported to GITHUB_ENV so the cleanup step can tear it down.
          db_container="ci-db-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
          echo "DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          run_args=(-d --name "$db_container")
          # One KEY=VALUE per line → a -e flag each (blank lines ignored).
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"   # ltrim
            line="${line%"${line##*[![:space:]]}"}"    # rtrim
            [[ -z "$line" ]] && continue
            run_args+=(-e "$line")
          done <<< "$DB_ENV"
          # db_ports is plural: one published mapping per line → a -p flag each,
          # so callers can publish several ports (blank lines ignored).
          while IFS= read -r port; do
            port="${port#"${port%%[![:space:]]*}"}"   # ltrim
            port="${port%"${port##*[![:space:]]}"}"    # rtrim
            [[ -z "$port" ]] && continue
            run_args+=(-p "$port")
          done <<< "$DB_PORTS"
          echo "Starting database container: $DB_IMAGE ($db_container)"
          docker run "${run_args[@]}" "$DB_IMAGE"
          if [[ -n "$DB_HEALTH_CMD" ]]; then
            echo "Waiting up to ${DB_WAIT_SECONDS}s for database readiness..."
            ready=0
            for i in $(seq 1 "$DB_WAIT_SECONDS"); do
              if docker exec "$db_container" sh -c "$DB_HEALTH_CMD" >/dev/null 2>&1; then
                echo "Database ready after ${i}s"; ready=1; break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "Database not ready after ${DB_WAIT_SECONDS}s; recent logs:" >&2
              docker logs --tail 50 "$db_container" || true
              exit 1
            fi
          fi

      # Make caller-supplied KEY=VALUE pairs available to the Test step. The blob
      # arrives via env (never interpolated into the script) and each line is
      # written verbatim to $GITHUB_ENV, so the shell never re-quotes the values
      # — credentials containing quotes or other special characters pass through
      # unchanged.
      - name: Export extra env
        if: ${{ inputs.extra_env != '' }}
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"   # ltrim
            line="${line%"${line##*[![:space:]]}"}"    # rtrim
            [[ -z "$line" ]] && continue
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Java
        if: ${{ inputs.java_version != '' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup .NET
        if: ${{ inputs.dotnet_version != '' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Python
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Go
        if: ${{ inputs.go_version != '' }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ inputs.go_version }}

      - name: Setup Flutter
        if: ${{ inputs.flutter_version != '' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel != '' && inputs.flutter_channel || 'stable' }}

      - name: Setup Flutter (channel only)
        if: ${{ inputs.flutter_version == '' && inputs.flutter_channel != '' }}
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutter_channel }}

      - name: Setup Rust
        if: ${{ inputs.rust_toolchain != '' }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-22
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: ${{ inputs.rust_components }}

      - name: Setup PHP
        if: ${{ inputs.php_version != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Docker
        if: ${{ inputs.docker_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.docker_command }}

      - name: E2E
        if: ${{ inputs.e2e_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.e2e_command }}

      - name: Extra
        if: ${{ inputs.extra_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_command }}

      # Tear the DB container down regardless of outcome so it never lingers on
      # self-hosted runners. DB_CONTAINER is set by the start step above.
      - name: Stop database service
        if: ${{ always() && env.DB_CONTAINER != '' }}
        shell: bash
        run: docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
