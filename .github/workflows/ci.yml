name: ci-helpers-ci
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      concurrency_key:
        type: string
        default: ""
        description: >
          Distinguishes concurrent calls to this workflow that share a caller
          workflow, ref and working directory -- matrix legs, most often.
          Defaults to working_directory, which already separates the common
          case of one job per component.
      fetch_depth:
        type: number
        default: 0
      node_version:
        type: string
        default: ""
      java_version:
        type: string
        default: ""
      dotnet_version:
        type: string
        default: ""
      python_version:
        type: string
        default: ""
      go_version:
        type: string
        default: ""
      flutter_version:
        type: string
        default: ""
      flutter_channel:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: ""
      rust_components:
        type: string
        default: ""
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
      e2e_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      extra_command:
        type: string
        default: ""
      # Optional database service. When db_image is set, the image is started
      # via `docker run` before the command steps (services: blocks can't be
      # conditional in a reusable job). Framework-agnostic: pick the image, the
      # container env, the published ports, and a readiness probe. db_health_cmd
      # runs *inside* the container (`docker exec <container> sh -c ...`), so
      # probe a local socket/port (e.g. 127.0.0.1) — not a host URL.
      db_image:
        type: string
        default: ""
      db_env:
        type: string
        default: ""
      db_ports:
        type: string
        default: ""
      db_health_cmd:
        type: string
        default: ""
      db_wait_seconds:
        type: number
        default: 60
      # Extra environment for the subsequent command steps (lint/test/build/…),
      # one KEY=VALUE per line. Lines are written to $GITHUB_ENV without the
      # shell re-quoting the value (so special characters are safe); only a
      # trailing CR and leading indentation are stripped, and each line is
      # validated as KEY=VALUE.
      extra_env:
        type: string
        default: ""
      # A hung job otherwise bills until GitHub's six-hour default. Twenty
      # minutes covers every stack preset in this repository; raise it for a
      # genuinely long build rather than removing it.
      timeout_minutes:
        type: number
        default: 20

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Superseding pushes cancel the run they replace. The caller workflow and ref
# keep unrelated workflows and branches in this repository independent. See
# docs/private-repo-ci-strategy.md.
#
# The working directory is part of the key because a caller may invoke this
# workflow from several jobs at once -- backend and frontend, or one job per
# module. Those jobs share github.workflow and github.ref, so keying on those
# alone put them in one group and cancel-in-progress made whichever started
# second destroy the first: 0 seconds, no steps, reported as "cancelled"
# rather than failed. A repository doing that silently lost half its CI on
# every push, and greyed-out runs raise no alarm.
concurrency:
  group: ci-helpers-ci-${{ github.workflow }}-${{ inputs.concurrency_key || inputs.working_directory }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # Optional DB started early so it is warm by the time tests run. Inputs are
      # caller-defined workflow config, but we still pass them via env (never
      # interpolated into the script body) to keep the shell injection-safe.
      - name: Start database service
        if: ${{ inputs.db_image != '' }}
        shell: bash
        env:
          DB_IMAGE: ${{ inputs.db_image }}
          DB_ENV: ${{ inputs.db_env }}
          DB_PORTS: ${{ inputs.db_ports }}
          DB_HEALTH_CMD: ${{ inputs.db_health_cmd }}
          DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
        run: |
          set -euo pipefail
          # Unique container name per run so concurrent jobs on self-hosted
          # runners (which share a Docker daemon) never collide on a fixed name.
          # Exported to GITHUB_ENV so the cleanup step can tear it down.
          db_container="ci-db-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-${RANDOM}"
          echo "DB_CONTAINER=$db_container" >> "$GITHUB_ENV"
          run_args=(-d --name "$db_container")
          # One KEY=VALUE per line → a -e flag each (blank lines ignored). Strip
          # a trailing CR (Windows line endings) and leading indentation only —
          # never the value's own whitespace, since spaces are valid inside a
          # Docker env value (e.g. a password that ends in a space). Each line
          # must be KEY=VALUE: a bare key would make `docker run -e KEY` copy
          # that variable from the runner environment into the container, which
          # could leak runner secrets. Error messages stay redacted.
          while IFS= read -r line; do
            line="${line%$'\r'}"                       # strip trailing CR
            line="${line#"${line%%[![:space:]]*}"}"    # strip leading indentation
            [[ -z "$line" ]] && continue
            if [[ "$line" != *=* ]]; then
              echo "::error::db_env has a line without '=' (expected KEY=VALUE); value redacted" >&2
              exit 1
            fi
            key="${line%%=*}"
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::db_env has an invalid key '${key}' (expected KEY=VALUE)" >&2
              exit 1
            fi
            run_args+=(-e "$line")
          done <<< "$DB_ENV"
          # db_ports is plural: one published mapping per line → a -p flag each,
          # so callers can publish several ports (blank lines ignored).
          while IFS= read -r port; do
            port="${port#"${port%%[![:space:]]*}"}"   # ltrim
            port="${port%"${port##*[![:space:]]}"}"    # rtrim
            [[ -z "$port" ]] && continue
            run_args+=(-p "$port")
          done <<< "$DB_PORTS"
          echo "Starting database container: $DB_IMAGE ($db_container)"
          docker run "${run_args[@]}" "$DB_IMAGE"
          if [[ -n "$DB_HEALTH_CMD" ]]; then
            echo "Waiting up to ${DB_WAIT_SECONDS}s for database readiness..."
            if [[ ! "$DB_WAIT_SECONDS" =~ ^[0-9]+$ ]]; then
              echo "::error::db_wait_seconds must be a non-negative integer" >&2
              exit 1
            fi
            ready=0
            for ((i=1; i<=DB_WAIT_SECONDS; i++)); do
              if docker exec "$db_container" sh -c "$DB_HEALTH_CMD" >/dev/null 2>&1; then
                echo "Database ready after ${i}s"; ready=1; break
              fi
              sleep 1
            done
            if [[ "$ready" -ne 1 ]]; then
              echo "Database not ready after ${DB_WAIT_SECONDS}s; recent logs:" >&2
              docker logs --tail 50 "$db_container" || true
              exit 1
            fi
          fi

      # Make caller-supplied KEY=VALUE pairs available to the subsequent command
      # steps. The blob arrives via env (never interpolated into the script) and
      # each line is written to $GITHUB_ENV, where the shell never re-quotes the
      # value — so credentials containing quotes or other special characters
      # pass through intact. Only a trailing CR and leading indentation are
      # stripped; the value's own whitespace is preserved. Each line is
      # validated as KEY=VALUE so a malformed entry fails here with a clear
      # message instead of GitHub's generic "Invalid format" error later.
      - name: Export extra env
        if: ${{ inputs.extra_env != '' }}
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            line="${line%$'\r'}"                       # strip trailing CR
            line="${line#"${line%%[![:space:]]*}"}"    # strip leading indentation
            [[ -z "$line" ]] && continue
            # Redacted errors: never echo the value, which may be a secret.
            if [[ "$line" != *=* ]]; then
              echo "::error::extra_env has a line without '=' (expected KEY=VALUE); value redacted" >&2
              exit 1
            fi
            key="${line%%=*}"
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "::error::extra_env has an invalid key '${key}' (expected KEY=VALUE)" >&2
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Java
        if: ${{ inputs.java_version != '' }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup .NET
        if: ${{ inputs.dotnet_version != '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Python
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Go
        if: ${{ inputs.go_version != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go_version }}

      - name: Setup Flutter
        if: ${{ inputs.flutter_version != '' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel != '' && inputs.flutter_channel || 'stable' }}

      - name: Setup Flutter (channel only)
        if: ${{ inputs.flutter_version == '' && inputs.flutter_channel != '' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ inputs.flutter_channel }}

      - name: Setup Rust
        if: ${{ inputs.rust_toolchain != '' }}
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable @ 2026-08-08
        with:
          toolchain: ${{ inputs.rust_toolchain }}
          components: ${{ inputs.rust_components }}

      - name: Setup PHP
        if: ${{ inputs.php_version != '' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php_version }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Docker
        if: ${{ inputs.docker_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.docker_command }}

      - name: E2E
        if: ${{ inputs.e2e_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.e2e_command }}

      - name: Extra
        if: ${{ inputs.extra_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_command }}

      # Tear the DB container down regardless of outcome so it never lingers on
      # self-hosted runners. DB_CONTAINER is set by the start step above.
      - name: Stop database service
        if: ${{ always() && env.DB_CONTAINER != '' }}
        shell: bash
        run: docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
