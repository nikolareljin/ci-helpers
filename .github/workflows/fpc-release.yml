name: ci-helpers-fpc-release
on:
  workflow_call:
    inputs:
      bin_name:
        description: "Binary name without extension (e.g. pravkal)."
        type: string
        required: true
      build_command:
        description: >
          Shell command to build the binary. Runs on every platform after FPC is installed.
          Defaults to 'bash build.sh'. The binary must exist in working_directory after
          this command finishes.
        type: string
        default: "bash build.sh"
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      data_glob:
        description: >
          Shell glob (relative to working_directory) matching runtime data files to bundle
          alongside the binary in each archive. Example: "data/_*.KAL data/_*.MOL".
          Leave empty to bundle only the binary.
        type: string
        default: ""
      extra_files:
        description: >
          Space-separated list of extra files (relative to working_directory) to include in
          each archive. Typically documentation such as README.md and CHANGELOG.md.
        type: string
        default: "README.md CHANGELOG.md"
      release_tag:
        description: >
          Tag to build for. Defaults to the pushed tag (GITHUB_REF_NAME). Set explicitly
          when triggering via workflow_dispatch for a backfill run.
        type: string
        default: ""
      upload_to_release:
        description: >
          "auto" (default) uploads when triggered by a version tag push or when
          release_tag is provided explicitly. "true" always uploads.
          "false" never uploads (artifacts only).
        type: string
        default: "auto"
      fpc_apt_package:
        description: "apt package to install on Linux runners. Defaults to 'fpc'."
        type: string
        default: "fpc"
      fpc_brew_formula:
        description: "Homebrew formula to install on macOS runners. Defaults to 'fpc'."
        type: string
        default: "fpc"
      fpc_choco_package:
        description: "Chocolatey package to install on Windows runners. Defaults to 'freepascal'."
        type: string
        default: "freepascal"

      # ── Linux packaging ─────────────────────────────────────────────────────
      linux_packages:
        description: >
          Comma-separated list of Linux package formats to produce in addition to the
          .tar.gz archive: deb, rpm, appimage.
          Example: "deb,rpm,appimage".
          Requires package_description and package_maintainer when deb or rpm is listed.
        type: string
        default: ""
      package_maintainer:
        description: "Maintainer field for DEB/RPM (e.g. 'Full Name <email@example.com>')."
        type: string
        default: ""
      package_description:
        description: "One-line package description for DEB/RPM/AppImage metadata."
        type: string
        default: ""
      package_url:
        description: "Homepage URL for DEB/RPM metadata."
        type: string
        default: ""
      app_icon:
        description: >
          Path to a 64×64 PNG icon (relative to working_directory) for the AppImage.
          When omitted a minimal placeholder icon is generated automatically.
        type: string
        default: ""
      appimagetool_url:
        description: >
          Download URL for appimagetool. Defaults to the pinned 1.9.1 release.
          If you override it, also set appimagetool_sha256 to the digest of
          that file: the download is always verified and a mismatch fails.
        type: string
        default: "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
      appimagetool_sha256:
        description: >
          Expected SHA256 hex digest of the downloaded appimagetool binary.
          Required. The default matches the default appimagetool_url (1.9.1,
          x86_64); an empty value fails the AppImage build.
        type: string
        default: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
      appimagetool_verify:
        description: >
          Deprecated, ignored. The appimagetool download is always verified
          against appimagetool_sha256. Kept so existing callers do not break.
        type: string
        default: "true"
      appimage_runtime_url:
        description: >
          AppImage type2 runtime embedded in the AppImage. Passed to
          appimagetool as --runtime-file, so appimagetool does not fetch the
          rolling 'continuous' runtime itself. Defaults to release 20251108.
        type: string
        default: "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64"
      appimage_runtime_sha256:
        description: >
          Expected SHA256 of the file at appimage_runtime_url. Required; the
          default matches the default URL.
        type: string
        default: "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"

      # ── macOS packaging ─────────────────────────────────────────────────────
      macos_dmg:
        description: "Build a .dmg disk image on each macOS runner. Default: false."
        type: string
        default: "false"

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # The caller's build commands run here with a read-only token. The release
  # job below holds contents: write and runs none of them.
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
    # Every leg sets the same tag and skip flag from the same inputs, in its
    # first steps, so a leg that fails in the build still reports them.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            binary_suffix: ""
          - os: macos-latest
            label: macos-arm64
            binary_suffix: ""
          # Intel macOS uses macos-15-intel, the current schedulable hosted
          # label. The retired macos-13 was dropped because its runner pool
          # routinely failed to schedule, leaving the job queued until the 24h
          # timeout and failing the whole release. macos-15-intel keeps the
          # documented macos-x86_64 asset (see docs/workflows.md) building.
          - os: macos-15-intel
            label: macos-x86_64
            binary_suffix: ""
          - os: windows-latest
            label: windows-x86_64
            binary_suffix: .exe

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          if ! echo "$tag" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Resolved tag '${tag}' is not a semver. Provide release_tag or push to a version tag."
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve upload skip
        id: resolve
        if: inputs.upload_to_release != 'false'
        shell: bash
        env:
          INPUT_TAG:    ${{ inputs.release_tag }}
          UPLOAD_MODE:  ${{ inputs.upload_to_release }}
          RESOLVED_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          case "$UPLOAD_MODE" in
            auto|true|false) ;;
            *) echo "::error::upload_to_release must be 'auto', 'true', or 'false' (got '${UPLOAD_MODE}')"; exit 1 ;;
          esac
          if [[ "$UPLOAD_MODE" == "auto" ]]; then
            if [[ -z "$INPUT_TAG" ]]; then
              if [[ "${GITHUB_REF}" != refs/tags/* ]] || \
                 ! echo "$RESOLVED_TAG" | grep -qE '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
                printf 'skip=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          printf 'skip=false\n' >> "$GITHUB_OUTPUT"

      - name: Validate bin_name
        shell: bash
        env:
          BIN_NAME: ${{ inputs.bin_name }}
        run: |
          set -euo pipefail
          name="${BIN_NAME}"
          # Reject CR/LF: stripping it here would not reach later steps, which
          # read the original value, including the artifact names and paths
          # set from inputs.bin_name in their with: blocks.
          case "$name" in
            *$'\n'*|*$'\r'*)
              echo "::error::bin_name must not contain CR or LF characters."
              exit 1
              ;;
          esac
          # Reject .exe suffix (platform suffix is added by the workflow itself)
          if [[ "$name" == *.exe ]]; then
            echo "::error::bin_name must not include a .exe suffix; the workflow adds it on Windows automatically."
            exit 1
          fi
          # Must start with a letter or digit, then only safe filename chars
          if ! echo "$name" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "::error::bin_name '${name}' is invalid. Must start with a letter or digit and contain only letters, digits, hyphen, underscore, or dot."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Install FPC (Linux)
        if: runner.os == 'Linux'
        env:
          FPC_PKG: ${{ inputs.fpc_apt_package }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -- "$FPC_PKG"

      - name: Install FPC (macOS)
        if: runner.os == 'macOS'
        env:
          FPC_FORMULA: ${{ inputs.fpc_brew_formula }}
        run: brew install "$FPC_FORMULA"

      - name: Install FPC (Windows)
        if: runner.os == 'Windows'
        env:
          FPC_PKG: ${{ inputs.fpc_choco_package }}
        shell: pwsh
        run: |
          choco install "$env:FPC_PKG" -y --no-progress
          # Chocolatey updates Machine PATH in the registry, but the current process
          # doesn't inherit it. Add those entries without dropping runner tools.
          $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
          $userPath   = [System.Environment]::GetEnvironmentVariable('Path', 'User')
          $env:PATH   = "$env:PATH;$machinePath;$userPath"
          $fpcExe = Get-Command fpc -ErrorAction SilentlyContinue
          if ($fpcExe) {
            $fpcDir = Split-Path $fpcExe.Source
          } else {
            # Fallback: scan common install roots used by different FPC choco packages
            $roots = @('C:\fpc', 'C:\tools\freepascal', 'C:\ProgramData\chocolatey\lib')
            $fpcFile = $roots | ForEach-Object {
              Get-ChildItem $_ -Recurse -Depth 6 -Filter 'fpc.exe' -ErrorAction SilentlyContinue
            } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($fpcFile) {
              $fpcDir = $fpcFile.DirectoryName
            } else {
              Write-Error 'fpc.exe not found in PATH or common install locations after choco install'
              exit 1
            }
          }
          $fpcDir | Add-Content -Path $env:GITHUB_PATH
          # Derive FPC installation root (FPCDIR) so the fpc driver can locate
          # RTL units. The Chocolatey freepascal package ships a ZIP without
          # fpc.cfg, so we cannot use that file as a landmark. Instead we walk
          # up from fpc.exe's directory until we find the RTL units root.
          # The Windows package keeps RTL under <root>\units\<target>, while a
          # Unix-style tree keeps it under lib\fpc — accept either landmark.
          $p = $fpcDir
          $fpcDirFound = $false
          for ($i = 0; $i -lt 6; $i++) {
            if ((Test-Path (Join-Path $p 'units')) -or (Test-Path (Join-Path $p 'lib\fpc'))) {
              "FPCDIR=$p" | Add-Content -Path $env:GITHUB_ENV
              Write-Output "Set FPCDIR=$p (RTL landmark found at depth $i)"
              $fpcDirFound = $true
              break
            }
            $parent = Split-Path $p -Parent
            if (-not $parent -or $parent -eq $p) { break }
            $p = $parent
          }
          if (-not $fpcDirFound) {
            Write-Warning "No FPC RTL landmark (units or lib\fpc) within 6 directory levels of $fpcDir — FPCDIR not set; compilation may fail to locate RTL units."
          }
          # The Chocolatey freepascal package ships no fpc.cfg, so the driver
          # has no RTL unit search paths and aborts with "Can't find unit crt"
          # (or system, sysutils, …) even with FPCDIR set. Generate a default
          # fpc.cfg from the install tree so ppcXXX can resolve RTL units.
          # Placed next to fpc.exe, which is the first location the driver reads.
          # Resolve fpcmkcfg.exe from $fpcDir first: when fpc.exe was located by
          # the fallback scan (not Get-Command fpc), $fpcDir was only appended to
          # GITHUB_PATH for later steps and is absent from this process's PATH,
          # so Get-Command fpcmkcfg would miss the adjacent tool. Fall back to a
          # PATH lookup and use the full .Path (not .Source, which can be empty
          # for external executables) so we never invoke an empty command.
          $mkcfgPath = Join-Path $fpcDir 'fpcmkcfg.exe'
          if (-not (Test-Path $mkcfgPath)) {
            $mkcfgCmd = Get-Command fpcmkcfg -ErrorAction SilentlyContinue
            $mkcfgPath = if ($mkcfgCmd) { $mkcfgCmd.Path } else { $null }
          }
          $cfgPath = Join-Path $fpcDir 'fpc.cfg'
          if (Test-Path $cfgPath) {
            # A caller using a different package (or a preinstalled FPC) may ship
            # a customized fpc.cfg. Don't overwrite it; only generate when absent.
            Write-Output "fpc.cfg already present at $cfgPath; leaving it untouched."
          } elseif ($mkcfgPath -and (Test-Path $mkcfgPath) -and $fpcDirFound) {
            & $mkcfgPath -d "basepath=$p" -o "$cfgPath"
            if ($LASTEXITCODE -eq 0 -and (Test-Path $cfgPath)) {
              Write-Output "Generated fpc.cfg at $cfgPath (basepath=$p)"
            } else {
              Write-Warning "fpcmkcfg exited $LASTEXITCODE; fpc.cfg may be missing — RTL unit resolution could fail."
            }
          } else {
            Write-Warning "fpcmkcfg not found or FPCDIR unresolved; fpc.cfg not generated — RTL unit resolution may fail."
          }

      - name: Build
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          BUILD_CMD: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Verify binary
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          BIN_NAME:   ${{ inputs.bin_name }}
          BIN_SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          set -euo pipefail
          binary="${BIN_NAME}${BIN_SUFFIX}"
          [ -f "$binary" ] || { echo "::error::Binary not found: $binary"; exit 1; }
          echo "Binary size: $(wc -c < "$binary") bytes"

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        id: pkg_unix
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TAG:         ${{ steps.tag.outputs.tag }}
          BIN_NAME:    ${{ inputs.bin_name }}
          LABEL:       ${{ matrix.label }}
          DATA_GLOB:   ${{ inputs.data_glob }}
          EXTRA_FILES: ${{ inputs.extra_files }}
        run: |
          set -euo pipefail
          pkg="${BIN_NAME}-${TAG}-${LABEL}"
          rm -rf "dist/${pkg}"
          mkdir -p "dist/${pkg}"
          cp "./${BIN_NAME}" "dist/${pkg}/"
          if [ -n "${DATA_GLOB:-}" ]; then
            matched=0
            for f in $DATA_GLOB; do
              if [ -L "$f" ]; then echo "::error::data_glob entry '$f' is a symlink; symlinks not allowed in release archives" ; exit 1 ; fi
              if [ -f "$f" ]; then
                case "$f" in /*|..|../*|*/../*|*/..) echo "::error::data_glob entry '$f' is outside working_directory" ; exit 1 ;; esac
                cp "./$f" "dist/${pkg}/"
                matched=$((matched + 1))
              fi
            done
            [ "$matched" -eq 0 ] && echo "::warning::data_glob '${DATA_GLOB}' matched no files; archive may be incomplete"
          fi
          for ef in ${EXTRA_FILES:-}; do
            if [ -L "$ef" ]; then echo "::error::extra_files entry '$ef' is a symlink; symlinks not allowed in release archives" ; exit 1 ; fi
            if [ -f "$ef" ]; then
              case "$ef" in /*|..|../*|*/../*|*/..) echo "::error::extra_files entry '$ef' is outside working_directory" ; exit 1 ;; esac
              cp "./$ef" "dist/${pkg}/"
            else
              echo "::warning::extra_files entry '${ef}' not found; archive may be incomplete"
            fi
          done
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          printf 'asset=dist/%s.tar.gz\n' "$pkg" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        id: pkg_win
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TAG:        ${{ steps.tag.outputs.tag }}
          BIN_NAME:   ${{ inputs.bin_name }}
          BIN_SUFFIX: ${{ matrix.binary_suffix }}
          LABEL:      ${{ matrix.label }}
          DATA_GLOB:  ${{ inputs.data_glob }}
          EXTRA_FILES: ${{ inputs.extra_files }}
        run: |
          set -euo pipefail
          pkg="${BIN_NAME}-${TAG}-${LABEL}"
          rm -rf "dist/${pkg}"
          mkdir -p "dist/${pkg}"
          cp -- "${BIN_NAME}${BIN_SUFFIX}" "dist/${pkg}/"
          if [ -n "${DATA_GLOB:-}" ]; then
            matched=0
            for f in $DATA_GLOB; do
              if [ -L "$f" ]; then echo "::error::data_glob entry '$f' is a symlink; symlinks not allowed in release archives" ; exit 1 ; fi
              if [ -f "$f" ]; then
                case "$f" in *:*|*\\*|/*|..|../*|*/../*|*/..) echo "::error::data_glob entry '$f' is outside working_directory" ; exit 1 ;; esac
                cp -- "$f" "dist/${pkg}/"
                matched=$((matched + 1))
              fi
            done
            [ "$matched" -eq 0 ] && echo "::warning::data_glob '${DATA_GLOB}' matched no files; archive may be incomplete"
          fi
          for ef in ${EXTRA_FILES:-}; do
            if [ -L "$ef" ]; then echo "::error::extra_files entry '$ef' is a symlink; symlinks not allowed in release archives" ; exit 1 ; fi
            if [ -f "$ef" ]; then
              case "$ef" in *:*|*\\*|/*|..|../*|*/../*|*/..) echo "::error::extra_files entry '$ef' is outside working_directory" ; exit 1 ;; esac
              cp -- "$ef" "dist/${pkg}/"
            else
              echo "::warning::extra_files entry '${ef}' not found; archive may be incomplete"
            fi
          done
          (cd dist && powershell -Command "Compress-Archive -Path '${pkg}' -DestinationPath '${pkg}.zip'")
          # Also publish the bare .exe alongside the zip: a clickable standalone
          # binary for users who don't need the bundled data files. Export its
          # path so the upload step consumes it instead of re-deriving the name.
          cp -- "${BIN_NAME}${BIN_SUFFIX}" "dist/${pkg}.exe"
          printf 'asset=dist/%s.zip\n' "$pkg" >> "$GITHUB_OUTPUT"
          printf 'exe_asset=dist/%s.exe\n' "$pkg" >> "$GITHUB_OUTPUT"

      # ── Linux packaging: DEB / RPM / AppImage ─────────────────────────────

      - name: Install Linux packaging tools
        if: runner.os == 'Linux' && inputs.linux_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential rpm squashfs-tools wget
          sudo gem install --no-document fpm

      - name: Build Linux packages (deb / rpm / appimage)
        if: runner.os == 'Linux' && inputs.linux_packages != ''
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TAG:                   ${{ steps.tag.outputs.tag }}
          BIN_NAME:              ${{ inputs.bin_name }}
          PACKAGES:              ${{ inputs.linux_packages }}
          DATA_GLOB:             ${{ inputs.data_glob }}
          MAINTAINER:            ${{ inputs.package_maintainer }}
          DESCRIPTION:           ${{ inputs.package_description }}
          PKG_URL:               ${{ inputs.package_url }}
          ICON_PATH:             ${{ inputs.app_icon }}
          APPIMAGETOOL_URL:      ${{ inputs.appimagetool_url }}
          APPIMAGETOOL_SHA256:   ${{ inputs.appimagetool_sha256 }}
          APPIMAGE_RUNTIME_URL:    ${{ inputs.appimage_runtime_url }}
          APPIMAGE_RUNTIME_SHA256: ${{ inputs.appimage_runtime_sha256 }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist_extra

          # ── Staging tree used by DEB and RPM ──────────────────────────────
          # Binary + data files go under /usr/share/$BIN_NAME/.
          # A thin wrapper in /usr/bin/ exec's the real binary so that
          # ParamStr(0) resolves to the share dir where data files live.
          mkdir -p pkg_staging/usr/share/"${BIN_NAME}"
          mkdir -p pkg_staging/usr/bin
          cp "${BIN_NAME}" pkg_staging/usr/share/"${BIN_NAME}"/
          if [ -n "${DATA_GLOB:-}" ]; then
            for f in $DATA_GLOB; do
              if [ -L "$f" ]; then echo "::error::data_glob entry '$f' is a symlink; symlinks not allowed in package staging" ; exit 1 ; fi
              if [ -f "$f" ]; then
                case "$f" in /*|..|../*|*/../*|*/..) echo "::error::data_glob entry '$f' is outside working_directory" ; exit 1 ;; esac
                cp -- "$f" pkg_staging/usr/share/"${BIN_NAME}"/
              fi
            done
          fi
          printf '#!/bin/sh\nexec /usr/share/%s/%s "$@"\n' \
              "${BIN_NAME}" "${BIN_NAME}" \
              > pkg_staging/usr/bin/"${BIN_NAME}"
          chmod 0755 pkg_staging/usr/bin/"${BIN_NAME}"

          # Fail fast: deb/rpm require description and maintainer metadata
          if echo "${PACKAGES}" | tr ',' '\n' | grep -qE '^[[:space:]]*(deb|rpm)[[:space:]]*$'; then
            if [ -z "${DESCRIPTION:-}" ] || [ -z "${MAINTAINER:-}" ]; then
              echo "::error::package_description and package_maintainer are required when linux_packages includes deb or rpm."
              exit 1
            fi
          fi

          pkg_built=0
          IFS=',' read -ra PKGS <<< "${PACKAGES}"
          for fmt in "${PKGS[@]}"; do
            fmt="$(printf '%s' "$fmt" | tr -d '[:space:]')"
            [ -z "$fmt" ] && continue
            case "$fmt" in

              deb)
                deb_name="${BIN_NAME,,}"   # Debian names must be lowercase
                deb_name="${deb_name//_/-}" # underscores not allowed in deb names
                fpm_args=(-s dir -t deb -n "${deb_name}" -v "${version}" -a amd64)
                [ -n "${DESCRIPTION:-}" ] && fpm_args+=(--description "${DESCRIPTION}")
                [ -n "${MAINTAINER:-}" ]  && fpm_args+=(--maintainer  "${MAINTAINER}")
                [ -n "${PKG_URL:-}" ]     && fpm_args+=(--url          "${PKG_URL}")
                fpm_args+=(--package dist_extra/ -C pkg_staging usr)
                fpm "${fpm_args[@]}"
                pkg_built=$((pkg_built + 1))
                ;;

              rpm)
                fpm_args=(-s dir -t rpm -n "${BIN_NAME}" -v "${version}" -a x86_64)
                [ -n "${DESCRIPTION:-}" ] && fpm_args+=(--description "${DESCRIPTION}")
                [ -n "${MAINTAINER:-}" ]  && fpm_args+=(--maintainer  "${MAINTAINER}")
                [ -n "${PKG_URL:-}" ]     && fpm_args+=(--url          "${PKG_URL}")
                fpm_args+=(--package dist_extra/ -C pkg_staging usr)
                fpm "${fpm_args[@]}"
                pkg_built=$((pkg_built + 1))
                ;;

              appimage)
                mkdir -p AppDir/usr/share/"${BIN_NAME}"
                cp -r pkg_staging/usr/share/"${BIN_NAME}"/. \
                    AppDir/usr/share/"${BIN_NAME}"/

                # AppRun: exec binary from its own directory so ParamStr(0)
                # resolves to the share dir where the data files are bundled.
                printf '#!/bin/sh\nHERE=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)\nexec "$HERE/usr/share/%s/%s" "$@"\n' \
                    "${BIN_NAME}" "${BIN_NAME}" > AppDir/AppRun
                chmod 0755 AppDir/AppRun

                # Desktop entry (Terminal=true for TUI apps)
                {
                  printf '[Desktop Entry]\n'
                  printf 'Name=%s\n' "${BIN_NAME}"
                  [ -n "${DESCRIPTION:-}" ] && printf 'Comment=%s\n' "${DESCRIPTION}"
                  printf 'Exec=AppRun\n'
                  printf 'Icon=%s\n' "${BIN_NAME}"
                  printf 'Type=Application\n'
                  printf 'Categories=Utility;\n'
                  printf 'Terminal=true\n'
                } > AppDir/"${BIN_NAME}".desktop

                # Icon: use provided PNG or generate a 64×64 placeholder
                if [ -n "${ICON_PATH:-}" ] && [ -f "${ICON_PATH}" ]; then
                  case "${ICON_PATH}" in /*|..|../*|*/../*|*/..) echo "::error::app_icon '${ICON_PATH}' is outside working_directory" ; exit 1 ;; esac
                  cp -- "${ICON_PATH}" AppDir/"${BIN_NAME}".png
                else
                  python3 - << 'PYEOF'
          import os, struct, zlib
          name = os.environ['BIN_NAME']
          def make_png(w, h, rgb):
              def chunk(t, d):
                  return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
              row = b'\x00' + bytes(rgb) * w
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
                      + chunk(b'IDAT', zlib.compress(row * h, 9))
                      + chunk(b'IEND', b''))
          with open(f'AppDir/{name}.png', 'wb') as fh:
              fh.write(make_png(64, 64, [26, 58, 110]))
          PYEOF
                fi

                # Download appimagetool and the runtime it embeds; use
                # APPIMAGE_EXTRACT_AND_RUN=1 to avoid the FUSE requirement on
                # the CI runner. Both digests are mandatory: this job holds
                # contents: write, so it never runs or ships a binary it has
                # not verified.
                fetch_verified() { # name url sha256 dest
                  if [ -z "$3" ]; then
                    echo "::error::$1 sha256 is empty. Set it to the SHA256 of the file at its URL."
                    return 1
                  fi
                  if [ "${#3}" -ne 64 ] || [ -n "$(printf '%s' "$3" | tr -d '0-9a-f')" ]; then
                    echo "::error::$1 sha256 must be 64 lowercase hex characters."
                    return 1
                  fi
                  wget -q --timeout=60 --tries=3 --waitretry=5 -O "$4" -- "$2" \
                    || curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$4" -- "$2"
                  local actual
                  actual="$(sha256sum "$4" | awk '{print $1}')"
                  if [ "$actual" != "$3" ]; then
                    echo "::error::$1 SHA256 mismatch (expected $3, got ${actual}), aborting AppImage build"
                    rm -f "$4"
                    return 1
                  fi
                }
                fetch_verified appimagetool "${APPIMAGETOOL_URL}" "${APPIMAGETOOL_SHA256:-}" /tmp/appimagetool
                fetch_verified "AppImage runtime" "${APPIMAGE_RUNTIME_URL}" "${APPIMAGE_RUNTIME_SHA256:-}" /tmp/appimage-runtime
                chmod +x /tmp/appimagetool
                APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 \
                    /tmp/appimagetool --runtime-file /tmp/appimage-runtime AppDir \
                    "dist_extra/${BIN_NAME}-${TAG}-linux-x86_64.AppImage"
                pkg_built=$((pkg_built + 1))
                ;;

              *)
                echo "::error::Unknown linux_packages entry '${fmt}'. Valid values: deb, rpm, appimage."
                exit 1
                ;;
            esac
          done
          if [ "$pkg_built" -eq 0 ]; then
            echo "::error::linux_packages '${PACKAGES}' produced no packages — all entries were empty or whitespace."
            exit 1
          fi

      # ── macOS DMG ──────────────────────────────────────────────────────────

      - name: Build macOS DMG
        if: runner.os == 'macOS' && inputs.macos_dmg == 'true'
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          TAG:       ${{ steps.tag.outputs.tag }}
          BIN_NAME:  ${{ inputs.bin_name }}
          DATA_GLOB: ${{ inputs.data_glob }}
          LABEL:     ${{ matrix.label }}
        run: |
          set -euo pipefail
          vol="${BIN_NAME}-${TAG}-${LABEL}"
          mkdir -p "dmg_stage/${vol}"
          cp "${BIN_NAME}" "dmg_stage/${vol}/"
          if [ -n "${DATA_GLOB:-}" ]; then
            for f in $DATA_GLOB; do
              if [ -L "$f" ]; then echo "::error::data_glob entry '$f' is a symlink; symlinks not allowed in DMG staging" ; exit 1 ; fi
              if [ -f "$f" ]; then
                case "$f" in /*|..|../*|*/../*|*/..) echo "::error::data_glob entry '$f' is outside working_directory" ; exit 1 ;; esac
                cp "./$f" "dmg_stage/${vol}/"
              fi
            done
          fi
          cat > "dmg_stage/${vol}/HOW_TO_RUN.txt" << EOF
          Open Terminal and run:
            cd /Volumes/${vol}
            ./${BIN_NAME}
          EOF
          hdiutil create \
              -volname "${vol}" \
              -srcfolder "dmg_stage/${vol}" \
              -ov -format UDZO \
              "dist/${vol}.dmg"

      # ── Artifact uploads ───────────────────────────────────────────────────

      - name: Resolve asset path
        id: asset
        shell: bash
        env:
          PKG_UNIX: ${{ steps.pkg_unix.outputs.asset }}
          PKG_WIN:  ${{ steps.pkg_win.outputs.asset }}
        run: |
          set -euo pipefail
          asset="${PKG_UNIX:-$PKG_WIN}"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        id: sha
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          ASSET: ${{ steps.asset.outputs.asset }}
          LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          if command -v shasum >/dev/null 2>&1; then
            sha256="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          else
            sha256="$(sha256sum "$ASSET" | awk '{print $1}')"
          fi
          echo "$sha256  $(basename "$ASSET")" > "sha256-${LABEL}.txt"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        # NOTE: upload-artifact@v7 runs on Node.js 24; self-hosted runners must be >= 2.327.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: pkg-${{ matrix.label }}
          path: ${{ inputs.working_directory }}/${{ steps.asset.outputs.asset }}
          if-no-files-found: error

      - name: Upload SHA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: sha256-${{ matrix.label }}
          path: ${{ inputs.working_directory }}/sha256-${{ matrix.label }}.txt
          if-no-files-found: error

      - name: Upload extra Linux packages as artifacts
        if: runner.os == 'Linux' && inputs.linux_packages != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: pkgs-${{ matrix.label }}-extra
          path: ${{ inputs.working_directory }}/dist_extra/
          if-no-files-found: error

      - name: Upload macOS DMG as artifact
        if: runner.os == 'macOS' && inputs.macos_dmg == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: pkg-dmg-${{ matrix.label }}
          path: ${{ inputs.working_directory }}/dist/${{ inputs.bin_name }}-${{ steps.tag.outputs.tag }}-${{ matrix.label }}.dmg
          if-no-files-found: error

      # ── GitHub release uploads ─────────────────────────────────────────────

      # Generate the notes once, on the Linux leg. The release body is identical
      # for every matrix leg (same tag, same CHANGELOG), and the primary "Upload
      # to GitHub release" step below runs on this leg, so one leg sets the body
      # and the others upload their artifacts with an empty body_path (a no-op).
      # Restricting to Linux also avoids the Windows leg, where $RUNNER_TEMP under
      # Git Bash is a C:\ path that release_notes.sh --output would misread.
      - name: Checkout script-helpers for release notes
        if: runner.os == 'Linux' && inputs.upload_to_release != 'false' && steps.resolve.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 1fdf01e83fb7f07529c5ec96cb9cb871fe166f7f # 0.59.0
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        if: runner.os == 'Linux' && inputs.upload_to_release != 'false' && steps.resolve.outputs.skip == 'false'
        shell: bash
        env:
          RN_VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          version="${RN_VERSION:-}"
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "release notes: '$version' is not a version; skipping (no body)."
            exit 0
          fi
          producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
          if [ ! -f "$producer" ]; then
            echo "release notes: $producer not found (script-helpers checkout failed)" >&2
            exit 1
          fi
          # Best-effort: never fail the release because the notes could not be
          # produced (e.g. a shallow build checkout with no CHANGELOG section).
          # Publish without a body and say so instead.
          if bash "$producer" --version "$version" --repo "$GITHUB_WORKSPACE" --output "$notes_file"; then
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release notes generation failed; publishing without a body."
          fi

      # Exactly what softprops/action-gh-release would publish for these
      # patterns: regular files only, no dotfiles, nothing under a matched
      # directory, one asset per basename (softprops splits on
      # newlines and commas, as here). Uploading the patterns as-is would
      # also publish the contents of subdirectories.
      - name: Stage release files
        id: stage
        if: ${{ inputs.upload_to_release != 'false' && steps.resolve.outputs.skip == 'false' }}
        shell: bash
        env:
          PATTERNS: |
            ${{ inputs.working_directory }}/${{ steps.asset.outputs.asset }}
            ${{ (runner.os == 'Linux' && inputs.linux_packages != '') && format('{0}/dist_extra/*', inputs.working_directory) || '' }}
            ${{ (runner.os == 'macOS' && inputs.macos_dmg == 'true') && format('{0}/dist/{1}-{2}-{3}.dmg', inputs.working_directory, inputs.bin_name, steps.tag.outputs.tag, matrix.label) || '' }}
            ${{ runner.os == 'Windows' && format('{0}/{1}', inputs.working_directory, steps.pkg_win.outputs.exe_asset) || '' }}
        run: |
          set -euo pipefail
          # python3 can be a stub that only prints an error on Windows images.
          py=""
          for c in python3 python; do
            if command -v "$c" >/dev/null && "$c" -c 'import sys' 2>/dev/null; then py="$c"; break; fi
          done
          [ -n "$py" ] || { echo "::error::no working Python on this runner"; exit 1; }
          # Python builds the path, so it is native on Windows as well.
          "$py" - <<'PY'
          import glob, os, shutil, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "release-files")
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          seen = {}
          for line in os.environ["PATTERNS"].splitlines():
              for pat in line.split(","):
                  pat = pat.strip()
                  for f in sorted(glob.glob(pat, recursive=True)) if pat else []:
                      if not os.path.isfile(f):
                          continue
                      b = os.path.basename(f)
                      if b in seen and os.path.realpath(seen[b]) != os.path.realpath(f):
                          print(f"::error::{seen[b]} and {f} would both publish as {b}")
                          sys.exit(1)
                      seen[b] = f
                      shutil.copy2(f, os.path.join(out, b))
          print(f"{len(seen)} release file(s): {', '.join(sorted(seen))}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"dir={out}\ncount={len(seen)}\n")
          PY

      - name: Hand release files to the release job
        id: files
        if: ${{ steps.stage.outputs.count != '' && steps.stage.outputs.count != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: release-files-${{ inputs.bin_name }}-${{ matrix.label }}
          path: ${{ steps.stage.outputs.dir }}
          if-no-files-found: error
          overwrite: true

      - name: Hand release notes to the release job
        if: ${{ steps.notes.outputs.notes_file != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: release-notes-${{ inputs.bin_name }}
          path: ${{ steps.notes.outputs.notes_file }}
          if-no-files-found: error
          overwrite: true

  # One upload for every leg that finished. A failed leg still leaves the
  # others published, as when each leg uploaded its own files.
  release:
    needs: build
    if: ${{ !cancelled() && inputs.upload_to_release != 'false' && needs.build.outputs.skip == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: release-files-${{ inputs.bin_name }}-*
          merge-multiple: true
          path: release-files

      # Every leg failed before its hand-off: publish nothing, as before.
      - name: Require at least one leg's files
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find release-files -type f 2>/dev/null | head -n 1)" ]; then
            echo "::error::No build leg produced release files; nothing to publish."
            exit 1
          fi

      - name: Download release notes
        id: notes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: release-notes-${{ inputs.bin_name }}
          path: release-notes

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 @ 2026-09-10
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          body_path: ${{ steps.notes.outcome == 'success' && 'release-notes/release-notes.md' || '' }}
          files: release-files/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
