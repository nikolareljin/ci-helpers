name: wp-build
# Build a WordPress plugin into the tree and zip that ship.
#
# What ships is not what is in the repository: a plugin needs its production
# dependencies vendored, its front-end assets built, and everything that exists
# only to develop it left out. Every plugin doing that itself is how two of them
# end up shipping different things.
#
# The build lives in script-helpers' ci_wp_build.sh, not here, so the same code
# runs in CI and on a laptop -- `scripts/ci_wp_build.sh --workdir .` produces
# the same package a run of this workflow does.
#
# This workflow builds and uploads. It does not create releases or move tags:
# attaching the zip is the caller's step, with `gh release upload`, so this
# needs no `contents: write` and a plugin that only wants a build artifact is
# not made to grant it.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        # ubuntu-24.04 until the ondrej/php PPA ships a suite for ubuntu-latest
        # (26.04); scripts/check_php_runner.py holds PHP jobs to it.
        default: ubuntu-24.04
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      # false / true / recursive. Forwarded to checkout; a typo is refused by
      # the action rather than read as false.
      submodules:
        type: string
        default: "false"
      php_version:
        type: string
        default: "8.3"
      node_version:
        type: string
        default: "22"
      # Defaults to the working directory's name, which is what a plugin
      # repository is usually called. It becomes the directory inside the zip,
      # and the name WordPress installs the plugin as.
      slug:
        type: string
        default: ""
      # Empty reads it from the plugin header, which is what WordPress reads.
      # A zip named from anything else can disagree with what installs.
      version:
        type: string
        default: ""
      out_dir:
        type: string
        default: build
      composer_command:
        type: string
        default: "composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction"
      # Run only when the plugin has a package.json.
      asset_command:
        type: string
        default: "npm ci && npm run build"
      # rsync-style excludes. Empty uses the plugin's .distignore when it has
      # one, and a named default list otherwise.
      exclude_from:
        type: string
        default: ""
      zip:
        type: boolean
        default: true
      # Anything else this plugin wants checked against the staged tree, run
      # from the repository root with PACKAGE_DIR and PACKAGE_ZIP exported.
      verify_command:
        type: string
        default: ""
      upload_artifact:
        type: boolean
        default: true
      artifact_name:
        type: string
        default: wp-plugin-package
      retention_days:
        type: number
        default: 7
      # Applied as the job timeout. Without one a hung job bills until
      # GitHub's six-hour default (#132).
      timeout_minutes:
        type: number
        default: 20
    outputs:
      package_dir:
        description: The staged tree that ships.
        value: ${{ jobs.build.outputs.package_dir }}
      package_zip:
        description: The archive, empty when `zip` is false.
        value: ${{ jobs.build.outputs.package_zip }}
      version:
        description: The version the package was built as.
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      package_dir: ${{ steps.build.outputs.package_dir }}
      package_zip: ${{ steps.build.outputs.package_zip }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.submodules }}

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: aa819e9fc9197e3f6941222ecd5141cdd152c11b # aa819e9fc9197e3f6941222ecd5141cdd152c11b
          path: .script-helpers
          fetch-depth: 1

      # actions/checkout refuses a path outside the workspace, and the
      # workspace holds the plugin. A checkout of that library sitting in the
      # tree is not part of the plugin, and here it would be packaged: the
      # build rsyncs the working directory, and no exclude list names it. See
      # wp-plugin-check.yml, where leaving it produced 146 findings against
      # someone else's plugin.
      - name: Move script-helpers out of the plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/script-helpers"
          mv .script-helpers "${{ runner.temp }}/script-helpers"

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        if: ${{ inputs.composer_command != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        if: ${{ inputs.composer_command != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        if: ${{ inputs.composer_command != '' }}
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # PHP from apt: the image's own packages, else the ondrej/php PPA under
      # the key fingerprint pinned in the library's toolchain-pins.env; Xdebug
      # for coverage as the replaced action enabled it; Composer at the
      # release pinned there, installed after its sha256 matches.
      - name: Setup PHP
        if: ${{ inputs.composer_command != '' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PHP_VERSION: ${{ inputs.php_version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" PHP_VERSION="$PHP_VERSION" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_php.sh"
          CI_HELPERS_RUN
          )"

      # Only when the plugin has front-end sources. A plugin with no
      # package.json gets no Node, rather than a toolchain it never uses.
      - name: Does this plugin build assets?
        id: assets
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ steps.assets.outputs.present == 'true' && inputs.asset_command != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build the package
        id: build
        shell: bash
        # Run from the plugin directory and pass `--workdir .`, rather than
        # passing the directory and running from the repository root: the
        # script resolves `--out-dir` against its own working directory, so
        # with a plugin in a subdirectory the package landed at the repository
        # root while this step looked for it beside the plugin.
        working-directory: ${{ inputs.working_directory }}
        # Values as environment, not interpolated into the command line. A
        # plugin whose version or slug held a quote would otherwise break the
        # quoting or run as code -- the same lesson laravel.yml records for its
        # DB connection.
        env:
          SLUG: ${{ inputs.slug }}
          VERSION: ${{ inputs.version }}
          OUT_DIR: ${{ inputs.out_dir }}
          COMPOSER_COMMAND: ${{ inputs.composer_command }}
          ASSET_COMMAND: ${{ inputs.asset_command }}
          EXCLUDE_FROM: ${{ inputs.exclude_from }}
          MAKE_ZIP: ${{ inputs.zip }}
          HELPER: ${{ runner.temp }}/script-helpers/scripts/ci_wp_build.sh
        run: |
          set -euo pipefail
          args=(--workdir . --out-dir "$OUT_DIR" \
                --composer-command "$COMPOSER_COMMAND" \
                --asset-command "$ASSET_COMMAND" \
                --zip "$MAKE_ZIP")
          [[ -n "$SLUG" ]] && args+=(--slug "$SLUG")
          [[ -n "$VERSION" ]] && args+=(--version "$VERSION")
          [[ -n "$EXCLUDE_FROM" ]] && args+=(--exclude-from "$EXCLUDE_FROM")
          "$HELPER" "${args[@]}"

          # Report what was built rather than recomputing the names here: two
          # places deriving the same path is how they come to disagree.
          slug="${SLUG:-$(basename "$(pwd -P)")}"
          out="$(cd "$OUT_DIR" && pwd -P)"
          echo "package_dir=${out}/${slug}" >> "$GITHUB_OUTPUT"
          if [[ "$MAKE_ZIP" == "true" ]]; then
            # Exactly one, not the first of several. A dirty workspace on a
            # self-hosted runner keeps older versions here, and `head -1` would
            # publish an arbitrary one of them as this build's output.
            # The slug is matched literally, not as a pattern. It is only
            # constrained to hold no path characters, so a `[` or `*` in it
            # would be read as a glob by `find -name` and match nothing. The
            # quoted prefix inside [[ ]] is literal; the trailing * is not.
            zip_path=""; found=0
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              base="$(basename "$candidate")"
              [[ "$base" == "${slug}-"*.zip ]] || continue
              zip_path="$candidate"; found=$((found + 1))
            done < <(find "$out" -maxdepth 1 -type f -name '*.zip')
            if [[ "$found" -eq 0 ]]; then
              echo "::error::the build reported success but no ${slug}-*.zip is in ${out}"
              exit 1
            elif [[ "$found" -gt 1 ]]; then
              echo "::error::${found} archives match ${slug}-*.zip in ${out}; cannot tell which one this build produced"
              exit 1
            fi
            # Parameter expansion, not sed: the slug is only constrained to
            # hold no path characters, so a `[` or `*` in it would be read as
            # a regex and strip the wrong thing.
            base="$(basename "$zip_path" .zip)"
            echo "package_zip=${zip_path}" >> "$GITHUB_OUTPUT"
            echo "version=${base#"${slug}-"}" >> "$GITHUB_OUTPUT"
            # The archive, not the staged tree: upload-artifact takes the least
            # common ancestor of what it matches as the artifact root, so a
            # directory is uploaded as its *contents* and the plugin's own
            # directory name -- the name WordPress installs it as -- is lost.
            echo "artifact_path=${zip_path}" >> "$GITHUB_OUTPUT"
          else
            echo "package_zip=" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "artifact_path=${out}/${slug}" >> "$GITHUB_OUTPUT"
          fi

      # Printed, not just built. A package is read by whoever deploys it, and
      # the cheapest way to catch "it shipped node_modules again" is a listing
      # in the log.
      - name: What is in the package
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.build.outputs.package_dir }}
        run: |
          set -euo pipefail
          echo "Top level of ${PACKAGE_DIR}:"
          ls -A "$PACKAGE_DIR" | sed 's/^/  /'
          echo "Files: $(find "$PACKAGE_DIR" -type f | wc -l)"

      - name: Verify
        if: ${{ inputs.verify_command != '' }}
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.build.outputs.package_dir }}
          PACKAGE_ZIP: ${{ steps.build.outputs.package_zip }}
        run: |
          set -euo pipefail
          ${{ inputs.verify_command }}

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if "$git" rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$("$git" rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}
          mode: artifact
          paths: ${{ steps.build.outputs.artifact_path }}

      - name: Upload the package
        if: ${{ (inputs.upload_artifact) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
