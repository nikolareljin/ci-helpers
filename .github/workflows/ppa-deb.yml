name: ci-helpers-ppa-deb
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      # The job that signs and uploads. A fresh hosted runner by default: a
      # reused self-hosted machine can carry state left by the build.
      publish_runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      prebuild_command:
        type: string
        default: "make man"
      build_command:
        type: string
        default: ""
      series:
        type: string
        default: ""
      ppa_target:
        type: string
        required: true
      deb_fullname:
        type: string
        default: ""
      deb_email:
        type: string
        default: ""
      signing_key_id:
        type: string
        required: true
      extra_packages:
        type: string
        default: ""
      upload_method:
        description: >
          "ftp" (default) uploads anonymously; Launchpad accepts the upload on
          the GPG signature. "sftp" logs in as launchpad_login with
          launchpad_ssh_private_key.
        type: string
        default: "ftp"
      launchpad_login:
        description: >
          sftp only. Launchpad user the SSH key belongs to. Default: the owner
          in ppa_target (set it when the PPA belongs to a team).
        type: string
        default: ""
      launchpad_known_hosts:
        description: >
          sftp only. known_hosts line(s) for ppa.launchpad.net; ssh refuses
          any other host key. The default is Launchpad's RSA key, fingerprint
          SHA256:MGq+4hxD7RduVTcfwlwwboZnsgJC6SL/NltM8ye+gNg as published at
          https://ubuntu.com/docs/launchpad/user/reference/ssh-fingerprints/.
          Override only if Launchpad rotates it.
        type: string
        default: "ppa.launchpad.net ssh-rsa "
    secrets:
      gpg_private_key:
        required: true
      gpg_passphrase:
        required: true
      # sftp only.
      launchpad_ssh_private_key:
        required: false

jobs:
  # Runs the caller's prebuild, build and debian/rules with no key on the
  # runner. The ppa job below signs and uploads and runs none of them.
  build:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.stage.outputs.artifact }}
      changes: ${{ steps.stage.outputs.changes }}
      manifest: ${{ steps.stage.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # The packaging scripts come from script-helpers at a pinned commit, not
      # from the caller: callers keep script-helpers as a submodule that this
      # checkout does not fetch, at a path of their choosing.
      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: aa819e9fc9197e3f6941222ecd5141cdd152c11b # aa819e9fc9197e3f6941222ecd5141cdd152c11b
          path: .ppa-script-helpers
          fetch-depth: 1

      # Out of the source tree: a native source package is a tarball of the
      # whole directory and would ship it.
      - name: Move script-helpers out of the source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/ppa-script-helpers"
          mv .ppa-script-helpers "${RUNNER_TEMP}/ppa-script-helpers"

      - name: Install packaging prerequisites
        shell: bash
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dh-python \
            dput \
            python3-paramiko \
            gnupg \
            python3
          if [ -n "$EXTRA_PACKAGES" ]; then
            # Word-split on purpose: a space-separated package list.
            # shellcheck disable=SC2086
            sudo apt-get install -y $EXTRA_PACKAGES
          fi

      # The caller's prebuild and build run first, with no key on the runner.
      # The package is built unsigned and signed in the next step.
      - name: Build source package (unsigned)
        id: build
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DEBEMAIL: ${{ inputs.deb_email }}
          DEBFULLNAME: ${{ inputs.deb_fullname }}
          PPA_TARGET: ${{ inputs.ppa_target }}
          KEY_ID: ${{ inputs.signing_key_id }}
          PREBUILD: ${{ inputs.prebuild_command }}
          BUILD: ${{ inputs.build_command }}
          SERIES: ${{ inputs.series }}
          SH_DIR: ${{ runner.temp }}/ppa-script-helpers
        run: |
          set -euo pipefail
          # --dry-run builds and stops before the upload. The repo is this
          # directory: a relative --repo would resolve inside it a second time.
          "$SH_DIR/scripts/ppa_upload.sh" \
            --ppa "$PPA_TARGET" \
            --key-id "$KEY_ID" \
            --repo "$PWD" \
            --prebuild "$PREBUILD" \
            --build "${BUILD:-debuild -S -sa -us -uc}" \
            --series "$SERIES" \
            --dry-run
          # shellcheck source=/dev/null
          source "$SH_DIR/helpers.sh"
          shlib_import package_publish
          changes="$(pkg_find_changes_file "$PWD")"
          changes="$(cd "$(dirname "$changes")" && pwd)/$(basename "$changes")"
          echo "changes=$changes" >> "$GITHUB_OUTPUT"

      # Every file the .changes names, and the .changes itself, with a sha256
      # manifest the ppa job checks before it signs anything.
      - name: Stage the source package
        id: stage
        shell: bash
        env:
          CHANGES: ${{ steps.build.outputs.changes }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/ppa-out"
          rm -rf "$out"
          mkdir -p "$out"
          dir="$(dirname "$CHANGES")"
          while IFS= read -r f; do
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::$f is not a regular file."; exit 1; }
            cp -- "$f" "$out/"
          done < <(dcmd "$CHANGES")
          base="$(basename "$CHANGES")"
          [[ "$base" =~ ^[A-Za-z0-9][A-Za-z0-9.+_~-]*\.changes$ ]] || { echo "::error::unexpected changes file name '$base'."; exit 1; }
          [[ -f "$out/$base" ]] || { echo "::error::dcmd did not list $base."; exit 1; }
          echo "Staged from $dir:"; ls -l "$out"
          delim="EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "artifact=ppa-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${delim#EOF_}"
            echo "changes=$base"
            echo "manifest<<$delim"
            (cd "$out" && find . -type f | LC_ALL=C sort | while IFS= read -r f; do sha256sum -- "$f"; done)
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: ${{ runner.temp }}/ppa-out
          if-no-files-found: error
          retention-days: 1

  # Signs and uploads. No checkout of the caller's repository: the job runs
  # this workflow's own steps on the files the build job made, each checked
  # against the build job's sha256 manifest first.
  ppa:
    needs: build
    permissions: {}
    runs-on: ${{ inputs.publish_runner }}
    timeout-minutes: 30
    steps:
      - name: Download the source package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/ppa-in

      - name: Verify the source package against the build manifest
        id: verify
        shell: bash
        env:
          DIR: ${{ runner.temp }}/ppa-in
          MANIFEST: ${{ needs.build.outputs.manifest }}
          CHANGES_NAME: ${{ needs.build.outputs.changes }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9.+_~-]*\.changes$ ]] || { echo "::error::unexpected changes file name '$CHANGES_NAME'."; exit 1; }
          list="${RUNNER_TEMP}/ppa-manifest.sha256"
          printf '%s\n' "$MANIFEST" > "$list"
          if [[ ! -s "$list" ]] || grep -qvE '^[0-9a-f]{64}  \./[A-Za-z0-9][A-Za-z0-9.+_~-]*$' "$list"; then
            echo "::error::the build manifest is empty or malformed."; exit 1
          fi
          cd "$DIR"
          if [[ -n "$(find . -mindepth 1 ! -type f)" ]]; then
            echo "::error::the artifact holds something other than regular files."; exit 1
          fi
          want="$(sed -E 's/^[0-9a-f]{64}  //' "$list" | LC_ALL=C sort)"
          have="$(find . -type f | LC_ALL=C sort)"
          if [[ "$want" != "$have" ]]; then
            echo "::error::the artifact's files differ from the build manifest."; exit 1
          fi
          sha256sum --check --strict --quiet "$list"
          [[ -f "$CHANGES_NAME" ]] || { echo "::error::$CHANGES_NAME is not in the artifact."; exit 1; }
          echo "changes=$DIR/$CHANGES_NAME" >> "$GITHUB_OUTPUT"

      - name: Install signing and upload tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y devscripts dput python3-paramiko gnupg

      # The key lives in a throwaway GNUPGHOME for this step only and is gone
      # before the upload step runs.
      - name: Sign the source package
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.gpg_private_key }}
          GPG_PASSPHRASE: ${{ secrets.gpg_passphrase }}
          KEY_ID: ${{ inputs.signing_key_id }}
          CHANGES: ${{ steps.verify.outputs.changes }}
        run: |
          set -euo pipefail
          set +x
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          pass_file="$(mktemp)"
          trap 'gpgconf --kill all >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME" "$pass_file"' EXIT
          chmod 700 "$GNUPGHOME"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          printf '5\ny\n' | gpg --batch --command-fd 0 --edit-key "$KEY_ID" trust
          # On a file, not the command line, where the process list shows it.
          printf '%s' "$GPG_PASSPHRASE" > "$pass_file"
          debsign --re-sign -k"$KEY_ID" \
            -p"gpg --batch --pinentry-mode loopback --passphrase-file ${pass_file}" \
            "$CHANGES"

      # dput's built-in "ppa:" target is FTP. The host is written out here
      # either way, so the target is checked once and sftp is one line away.
      - name: Upload to PPA
        id: upload
        shell: bash
        env:
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets.launchpad_ssh_private_key }}
          LAUNCHPAD_LOGIN: ${{ inputs.launchpad_login }}
          LAUNCHPAD_KNOWN_HOSTS: ${{ inputs.launchpad_known_hosts }}
          UPLOAD_METHOD: ${{ inputs.upload_method }}
          PPA_TARGET: ${{ inputs.ppa_target }}
          CHANGES: ${{ steps.verify.outputs.changes }}
        run: |
          set -euo pipefail
          set +x
          # ppa:<owner>/<name>, or ppa:<owner>/<distribution>/<name>.
          if [[ ! "$PPA_TARGET" =~ ^ppa:([a-z0-9][a-z0-9.+-]*)/(([a-z0-9][a-z0-9.+-]*)/)?([a-z0-9][a-z0-9.+-]*)$ ]]; then
            echo "::error::ppa_target '$PPA_TARGET' is not ppa:<owner>/<name>."
            exit 1
          fi
          owner="${BASH_REMATCH[1]}"
          dist="${BASH_REMATCH[3]:-ubuntu}"
          name="${BASH_REMATCH[4]}"
          trap 'rm -f ~/.ssh/id_ed25519 ~/.dput.cf' EXIT
          case "$UPLOAD_METHOD" in
            ftp)
              login="anonymous"
              ;;
            sftp)
              login="${LAUNCHPAD_LOGIN:-$owner}"
              if [[ ! "$login" =~ ^[a-z0-9][a-z0-9.+-]*$ ]]; then
                echo "::error::launchpad_login '$login' is not a Launchpad id."
                exit 1
              fi
              if [ -z "$LAUNCHPAD_SSH_PRIVATE_KEY" ]; then
                echo "::error::upload_method sftp needs the launchpad_ssh_private_key secret."
                exit 1
              fi
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh
              printf '%s\n' "$LAUNCHPAD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
              chmod 600 ~/.ssh/id_ed25519
              # Pinned host key, never trust-on-first-use: a keyscan here
              # would accept whatever answered first.
              if [ -z "${LAUNCHPAD_KNOWN_HOSTS:-}" ]; then
                echo "::error::upload_method sftp needs launchpad_known_hosts (the known_hosts line for ppa.launchpad.net)."
                exit 1
              fi
              printf '%s\n' "$LAUNCHPAD_KNOWN_HOSTS" >> ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              # Prepended: ssh takes the first value it reads, so an earlier
              # `Host *` block in an existing config cannot relax this one.
              { printf 'Host ppa.launchpad.net\n  StrictHostKeyChecking yes\n'
                cat ~/.ssh/config 2>/dev/null || true; } > ~/.ssh/config.new
              mv ~/.ssh/config.new ~/.ssh/config
              chmod 600 ~/.ssh/config
              ;;
            *)
              echo "::error::upload_method must be 'ftp' or 'sftp'; got '$UPLOAD_METHOD'."
              exit 1
              ;;
          esac
          cat > ~/.dput.cf <<EOF
          [ci-ppa]
          fqdn = ppa.launchpad.net
          method = ${UPLOAD_METHOD}
          incoming = ~${owner}/${dist}/${name}/
          login = ${login}
          allow_unsigned_uploads = 0
          EOF
          dput ci-ppa "$CHANGES"
