name: cloudflare-build
#
# Builds a Worker and validates it with `wrangler deploy --dry-run`, without
# deploying anything. It declares NO SECRETS and no write scope, so a caller
# that checks its Worker on pull requests never writes `secrets: inherit` and
# no deploy credential is in scope while third-party build code runs.
#
# That is the whole reason this workflow exists separately from
# cloudflare-deploy.yml. GitHub validates a called workflow's declared
# permissions and secrets when the run starts, before any job-level `if:` is
# evaluated, so a single workflow containing both build and deploy would put
# the Cloudflare token in scope on every event it handles — including
# pull-request runs, where npm postinstall scripts and build plugins execute.
#
# Pair them like this:
#
#   jobs:
#     build:
#       if: ${{ github.event_name == 'pull_request' }}
#       uses: nikolareljin/ci-helpers/.github/workflows/cloudflare-build.yml@production
#       with:
#         node_version: "22"
#         build_command: "npm run build"
#         config_glob: "dist/*/wrangler.json"
#     deploy:
#       if: ${{ github.event_name == 'push' }}
#       uses: nikolareljin/ci-helpers/.github/workflows/cloudflare-deploy.yml@production
#       secrets: inherit
#       with:
#         enabled: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
#         environment: staging
#         node_version: "22"
#         build_command: "npm run build"
#         config_glob: "dist/*/wrangler.json"
#
# The deploy lane builds again rather than consuming an artifact from the build
# lane. That is deliberate: the two run on different events, and an artifact is
# only visible within the run that produced it, so a handoff between them cannot
# work without a cross-run download and a token. Building twice is the honest
# cost of keeping the credential out of the pull-request run.
#
# What the dry run does and does not prove: it validates the configuration and
# bundles the Worker, which catches a broken config, a missing entry point and
# a build that produced nothing. It does NOT check bindings, routes, or that
# the token can reach the account — none of that is reachable without calling
# the API. Treat a green build as "this would compile", not "this would
# deploy".
#
# `versions upload` has no dry run of its own, so the check is always
# `deploy --dry-run` regardless of which command the deploy lane will use. It
# validates the same config and the same bundle, which is what a pull request
# wants to know.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      timeout_minutes:
        type: number
        default: 20
      fetch_depth:
        type: number
        default: 1
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: ""
        description: Set to install Node before building.
      package_manager:
        type: string
        default: npm
        description: npm, pnpm, yarn or none.
      install_command:
        type: string
        default: ""
        description: Overrides the package_manager default install when set.
      build_command:
        type: string
        default: ""
      config_path:
        type: string
        default: ""
        description: Path to the wrangler config, relative to working_directory.
      config_glob:
        type: string
        default: ""
        description: >
          Alternative to config_path for builds that generate their deploy
          config. Must match exactly one file.
      version_file:
        type: string
        default: VERSION
      version_suffix:
        type: string
        default: sha7
      wrangler_version:
        type: string
        default: ""
        description: >
          Empty, or the pinned WRANGLER_VERSION in toolchain-pins.env. Any
          other value fails the run: the library installs one pinned wrangler.
      wrangler_command:
        type: string
        default: ""
        description: >
          REMOVED. Setting it fails the run. The dry run uses the library's
          pinned wrangler (toolchain-pins.env).
      dry_run:
        type: boolean
        default: true
        description: >
          Run `wrangler deploy --dry-run`. Needs no credentials — it does not
          call the Cloudflare API. Set false to build only.

    outputs:
      version:
        description: The version string this build would deploy.
        value: ${{ jobs.build.outputs.version }}
      config_path:
        description: The resolved deploy config path.
        value: ${{ jobs.build.outputs.config_path }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      config_path: ${{ steps.config.outputs.path }}
    steps:
      - name: Refuse removed inputs
        shell: bash
        env:
          IN_WRANGLER_COMMAND: ${{ inputs.wrangler_command }}
        run: |
          set -euo pipefail
          if [ -n "${IN_WRANGLER_COMMAND}" ]; then
            echo "::error::wrangler_command is removed: the dry run uses the library's pinned wrangler (WRANGLER_VERSION in toolchain-pins.env). Drop the input"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # corepack ships with Node; the version is the root package.json's
      # devEngines.packageManager or packageManager, whose hash corepack checks
      # on download.
      - name: Setup pnpm
        if: ${{ inputs.package_manager == 'pnpm' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_pnpm.sh"
          CI_HELPERS_RUN
          )"

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager != 'none' && inputs.package_manager || '' }}
          cache-dependency-path: ${{ inputs.working_directory != '.' && format('{0}/**/*lock*', inputs.working_directory) || '' }}

      - name: Install
        if: ${{ inputs.install_command != '' || inputs.package_manager != 'none' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          PACKAGE_MANAGER: ${{ inputs.package_manager }}
        # eval, not `bash -c`: a chained caller command must inherit
        # `set -euo pipefail`, which a fresh shell does not.
        run: |
          set -euo pipefail
          if [ -n "${INSTALL_COMMAND}" ]; then
            eval "${INSTALL_COMMAND}"
          else
            case "${PACKAGE_MANAGER}" in
              npm)  npm ci ;;
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --immutable ;;
              none) : ;;
              *)
                echo "::error::package_manager must be npm, pnpm, yarn or none, not '${PACKAGE_MANAGER}'"
                exit 1 ;;
            esac
          fi

      - name: Build
        if: ${{ inputs.build_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          eval "${BUILD_COMMAND}"

      - name: Resolve the version string
        id: version
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # An error, not a warning. This workflow exists to catch on a pull
          # request what would otherwise fail the tag deploy; tolerating a
          # condition cloudflare-deploy.yml refuses would make a green build a
          # false assurance.
          if [ ! -r "${VERSION_FILE}" ]; then
            echo "::error::version_file '${VERSION_FILE}' is not readable. Point version_file at the right path, or set version_suffix: none if this project has no version file"
            exit 1
          fi
          value="$(tr -d '[:space:]' < "${VERSION_FILE}")"
          if [ -n "${value}" ] && [ "${VERSION_SUFFIX}" = "sha7" ]; then
            value="${value}-$(printf '%s' "${COMMIT_SHA}" | cut -c1-7)"
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "version: ${value}"

      - name: Resolve the deploy config
        id: config
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          CONFIG_PATH: ${{ inputs.config_path }}
          CONFIG_GLOB: ${{ inputs.config_glob }}
        run: |
          set -euo pipefail
          path=""
          if [ -n "${CONFIG_PATH}" ]; then
            path="${CONFIG_PATH}"
            if [ ! -r "${path}" ]; then
              echo "::error::config_path '${path}' does not exist. If it is generated by the build, use config_glob instead"
              exit 1
            fi
          elif [ -n "${CONFIG_GLOB}" ]; then
            # Word splitting and globbing are the point: CONFIG_GLOB is a
            # pattern supplied as workflow configuration, and must expand.
            # shellcheck disable=SC2086
            set -- ${CONFIG_GLOB}
            if [ "$#" -eq 1 ] && [ ! -r "$1" ]; then
              echo "::error::config_glob '${CONFIG_GLOB}' matched nothing. The build may not have produced it"
              exit 1
            fi
            if [ "$#" -gt 1 ]; then
              echo "::error::config_glob '${CONFIG_GLOB}' matched $# files, and exactly one is required:"
              for m in "$@"; do echo "::error::  ${m}"; done
              exit 1
            fi
            path="$1"
          fi
          path="${path#./}"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"
          if [ -n "${path}" ]; then
            echo "deploy config: ${path}"
          fi

      # wrangler's own Node, chosen by the library, after the caller's steps
      # (the pinned wrangler needs Node 22 or later). No package cache.
      - name: Setup Node for wrangler
        if: ${{ inputs.dry_run }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: "24"
          cache: ""
          package-manager-cache: false

      # The wrangler cloudflare-deploy.yml runs: the tarball's sha256 from
      # toolchain-pins.env, every dependency by the lockfile's integrity, no
      # package script.
      - name: Install the pinned wrangler
        id: wrangler
        if: ${{ inputs.dry_run }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          IN_WRANGLER_VERSION: ${{ inputs.wrangler_version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" IN_WRANGLER_VERSION="$IN_WRANGLER_VERSION" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          pinned="$(/usr/bin/sed -n 's/^WRANGLER_VERSION=//p' "$run_lib/toolchain-pins.env")"
          if [[ -n "$IN_WRANGLER_VERSION" && "$IN_WRANGLER_VERSION" != "$pinned" ]]; then
            echo "::error::wrangler_version '$IN_WRANGLER_VERSION' is not the pinned wrangler $pinned. Leave it empty; the library installs one pinned version."
            exit 1
          fi
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_wrangler.sh"
          CI_HELPERS_RUN
          )"

      # No credentials reach this step: a dry run must not need them.
      - name: Validate with a dry run
        if: ${{ inputs.dry_run }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          NODE: ${{ steps.wrangler.outputs.node }}
          WRANGLER_JS: ${{ steps.wrangler.outputs.wrangler }}
          WORKDIR: ${{ inputs.working_directory }}
          CF_CONFIG: ${{ steps.config.outputs.path }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" NODE="$NODE" WRANGLER_JS="$WRANGLER_JS" WORKDIR="$WORKDIR" CF_CONFIG="$CF_CONFIG" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          work="$(cd "$GITHUB_WORKSPACE" && cd "$WORKDIR" && pwd -P)"
          CF_WORKDIR="$work" CF_COMMAND=deploy CF_ENV_NAME=none CF_BUNDLE_DIR="$RUNNER_TEMP/cf-dryrun" \
            /bin/bash "$run_lib/scripts/wrangler_run.sh" dryrun
          CI_HELPERS_RUN
          )"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

