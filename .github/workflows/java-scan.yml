name: java-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      java_version:
        type: string
        default: "17"
      lint_command:
        type: string
        default: "mvn -B -DskipTests checkstyle:check"
      test_command:
        type: string
        default: "mvn -B test"
      # The plugin is pinned (an unversioned goal resolves to whatever is newest)
      # and failBuildOnCVSS is set: the plugin's own default of 11 is above the
      # CVSS maximum of 10, so it never failed the build.
      dependency_check_command:
        type: string
        default: "mvn -B org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7"

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 @ 2026-09-14
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Java lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Java tests
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Dependency check
        if: ${{ inputs.dependency_check_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.dependency_check_command }}
