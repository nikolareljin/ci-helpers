name: workflow-yaml-check
#
# Every reusable workflow and composite action here is consumed by other
# repositories, so a file that does not parse is a broken release for everyone
# pinned to it. Nothing checked that until now: this repository's own PR gate
# is a release-tag check and a secret scan, neither of which reads the files it
# ships.
#
# The gap was not theoretical. wp-plugin-check/action.yml shipped invalid --
# heredoc bodies at column 0 inside an indented `run: |` block end the block
# scalar -- and both PyYAML and Ruby's Psych refused it while CI stayed green.
#
# pull_request covers branch work, including release branches, so push is
# limited to main -- listing release/* as well ran this twice on every
# release-branch pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  yaml:
    name: workflow and action YAML
    runs-on: ubuntu-latest
    # Without this a hung job bills until GitHub's six-hour default (see #132).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      # PyYAML ships on the GitHub-hosted images, so there is nothing to install.
      - name: Parse every workflow and action file
        shell: bash
        run: python3 scripts/check_workflow_yaml.py

      - name: Set up publication checker tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: '24'

      - name: Publication checks refuse unsafe upload payloads
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log=$(mktemp "$RUNNER_TEMP/publication-tests.XXXXXX")
          check_rc=0
          npm ci --prefix .github/actions/publication-check --ignore-scripts --no-audit --no-fund > "$log" 2>&1 || check_rc=$?
          if [[ "$check_rc" -eq 0 ]]; then
            node --test tests/publication_files_test.cjs >> "$log" 2>&1 || check_rc=$?
          fi
          rm -f "$log"
          if [[ "$check_rc" -ne 0 ]]; then
            source vendor/script-helpers/scripts/security_notice.sh
            security_notice Security
            exit "$check_rc"
          fi

      - name: Security publication policy
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/scan_publication_policy_test.py
          python3 scripts/check_scan_publication.py
          bash tests/sync_script_helpers_notes_test.sh
          bash tests/pre_commit_security_test.sh
          umask 077
          check_rc=0
          bash tests/gitleaks_no_publication_test.sh > "$RUNNER_TEMP/local-checks.log" 2>&1 || check_rc=$?
          rm -f "$RUNNER_TEMP/local-checks.log"
          if [[ "$check_rc" -ne 0 ]]; then
            source vendor/script-helpers/scripts/security_notice.sh
            security_notice Gitleaks
            exit "$check_rc"
          fi
          bash tests/foxguard_no_publication_test.sh > "$RUNNER_TEMP/local-checks.log" 2>&1 || check_rc=$?
          rm -f "$RUNNER_TEMP/local-checks.log"
          if [[ "$check_rc" -ne 0 ]]; then
            source vendor/script-helpers/scripts/security_notice.sh
            security_notice Foxguard
            exit "$check_rc"
          fi

      # Parsing proves a file is YAML; it says nothing about an input going
      # missing one hop down. See the script's header for what drifted.
      - name: Engine inputs are threaded through every caller
        shell: bash
        run: python3 scripts/check_engine_inputs.py

      # The CHANGELOG is the release body. Two `## Unreleased` sections, or one
      # buried below a release, drop entries from the notes without failing
      # anything -- see scripts/check_changelog_structure.py.
      - name: CHANGELOG structure
        shell: bash
        run: python3 scripts/check_changelog_structure.py

      # Here as well as in the release workflow, because there it is too late.
      # A pin without its `# <version> @ <date>` comment is a warning, warnings
      # fail that check, and the check runs on push and weekly and never on a
      # pull request -- so an unannotated pin added in #249 passed every check
      # on that pull request and failed the 0.39.0 release, after the merge.
      #
      # The comment is not decoration: `update_pinned_actions.sh` re-resolves
      # it to find the newest SHA, so a pin without one is a pin nothing can
      # refresh.
      #
      # Dependabot moves a SHA to the next release and leaves the comment, so a
      # pin may be the commit of a release tag newer than its comment; anything
      # else is still stale. Only a release branch pull request is strict: the
      # release moves those comments (docs/RELEASE_RC_PR.md). The head ref comes
      # through env, never in the script; it is empty on push.
      - name: Action pins are annotated and current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*) bash scripts/update_pinned_actions.sh --check ;;
            *) bash scripts/update_pinned_actions.sh --check --allow-newer-tag ;;
          esac

      - name: The pin check accepts a Dependabot bump and refuses everything else
        shell: bash
        run: bash tests/update_pinned_actions_newer_tag_test.sh

      - name: The runner retirement check fires on an announcement and only then
        shell: bash
        run: bash tests/check_runner_retirement_test.sh

      # Images by digest, downloads by sha256, SSH host keys checked. The
      # test runs the gate against cases it must refuse and cases it must
      # pass, then the gate runs against this tree.
      - name: Supply-chain pin check reports what it must
        shell: bash
        run: bash tests/supply_chain_pins_test.sh

      - name: Images, downloads and host keys are pinned
        shell: bash
        run: python3 scripts/check_supply_chain_pins.py

      - name: fpc-release verifies appimagetool and its runtime
        shell: bash
        run: bash tests/fpc_appimage_verify_test.sh

      - name: docs_site clean and rust_release_build refuse unsafe paths
        shell: bash
        run: bash tests/release_path_guards_test.sh

      - name: Detect floating action refs
        shell: bash
        run: bash scripts/check_floating_refs.sh

      # Consumers run these workflows for their own repositories, so a tap, an
      # app or a project of the owner is always an input, never a literal.
      - name: No hard-coded repositories
        shell: bash
        run: bash scripts/check_no_hardcoded_repos.sh

      # A workflow that calls the library's own action by @production runs
      # today's production even for a caller pinned to a SHA.
      - name: The self-reference check reports what it must
        shell: bash
        run: bash tests/check_no_self_refs_test.sh

      - name: No self-references by a floating ref
        shell: bash
        run: bash scripts/check_no_self_refs.sh

      # A published installer is never replaced; drives the real step against
      # a stub gh.
      - name: tauri-release never replaces a published installer
        shell: bash
        run: bash tests/tauri_upload_once_test.sh

      - name: run scripts take text inputs through env, never as an inline expression
        shell: bash
        run: bash tests/no_inline_expressions_in_run_test.sh

      - name: wp-plugin-check inputs reach the script as text
        shell: bash
        run: bash tests/wp_plugin_check_inputs_stay_text_test.sh

      - name: rust-release inputs reach apt-get and the artifacts as text
        shell: bash
        run: bash tests/rust_release_inputs_stay_text_test.sh

      - name: pimcore-bundle-check inputs reach the script as text
        shell: bash
        run: bash tests/pimcore_bundle_check_inputs_stay_text_test.sh

      - name: flutter-release and docker-scan inputs reach their tools as text
        shell: bash
        run: bash tests/flutter_docker_inputs_stay_text_test.sh

      - name: wp-plugin-check and pimcore-bundle-check actions pass inputs as text
        shell: bash
        run: bash tests/composite_check_actions_inputs_stay_text_test.sh

      - name: packaging workflows create no vendor/ directory
        shell: bash
        run: bash tests/packaging_no_vendor_dir_test.sh

      - name: packaging workflows find script-helpers in every caller layout
        shell: bash
        run: bash tests/packaging_lookup_test.sh

      - name: deb-build names the release after what it built
        shell: bash
        run: bash tests/deb_build_release_tag_test.sh

      - name: release-upload refuses a bad tag or files glob
        shell: bash
        run: bash tests/release_upload_check_test.sh

      - name: ppa-deb uploads over ftp by default, sftp with the Launchpad key
        shell: bash
        run: bash tests/ppa_dput_config_test.sh

      - name: sign actions export secrets only on an exact "true"
        shell: bash
        run: bash tests/sign_export_env_default_test.sh

      - name: windows-sign accepts pfx, refuses it without secrets and refuses unknown modes
        shell: bash
        run: bash tests/windows_sign_mode_test.sh

      - name: deb-build signs each published file and SHA256SUMS
        shell: bash
        run: bash tests/deb_build_sign_test.sh

      - name: deb-build replaces an unsigned package, never a signed one
        shell: bash
        run: bash tests/deb_build_publish_once_test.sh

      - name: deb-build uploads with its default artifact_glob
        shell: bash
        run: bash tests/deb_build_artifact_path_test.sh

      - name: go-deploy fails on a missing extra file and on a changed artifact before copying
        shell: bash
        run: bash tests/go_deploy_extra_files_test.sh

      - name: release-rc-pr fails on a permission 403 unless soft_fail
        shell: bash
        run: bash tests/release_rc_pr_soft_fail_test.sh

      - name: WordPress test sites get a random admin password by default
        shell: bash
        run: bash tests/wp_admin_password_test.sh

      - name: gitleaks-scan checks a digest held here, not the release's own
        shell: bash
        run: bash tests/gitleaks_pinned_digest_test.sh

      - name: foxguard-scan checks a digest held here, not the release's own
        shell: bash
        run: bash tests/foxguard_pinned_digest_test.sh

      - name: The diff actions review only what a branch adds, and fail closed
        shell: bash
        run: bash tests/scan_diff_test.sh

      - name: scan-new-findings reads its tools input before any download
        shell: bash
        run: bash tests/scan_tools_test.sh

      - name: install_trivy checks the digest pinned here and refuses the rest
        shell: bash
        run: bash tests/install_trivy_test.sh

      # Releases go through gh from scripts/github_release.sh, behind the
      # publication check, and test summaries through scripts/junit_summary.py.
      - name: github_release.sh creates, updates and uploads as the action did
        shell: bash
        run: bash tests/github_release_test.sh

      - name: junit_summary.py counts, lists failures and refuses a DOCTYPE
        shell: bash
        run: python3 tests/junit_summary_test.py

      # pnpm comes from corepack and Rust from the runner's rustup, through
      # scripts the workflows check out at their own commit; a runner without
      # rustup gets the installer pinned in toolchain-pins.env. Stub tools,
      # nothing downloaded.
      - name: setup_pnpm.sh resolves the version as the action did and keeps the hash
        shell: bash
        run: bash tests/setup_pnpm_test.sh

      - name: setup_rust.sh drives rustup as the action did and installs it only from a verified pin
        shell: bash
        run: bash tests/setup_rust_test.sh

      # Ruby comes from the runner's tool cache, matched as the action
      # matched it; nothing downloaded. In flutter-release.yml every
      # toolchain step runs before a secret is read.
      - name: setup_ruby.sh picks the cached Ruby the action would and downloads nothing
        shell: bash
        run: bash tests/setup_ruby_test.sh

      - name: flutter-release.yml reads no secret before its toolchains are installed
        shell: bash
        run: bash tests/flutter_release_secret_order_test.sh

      # Godot and Flutter come from the official release archives, checked
      # against toolchain-pins.env and the Flutter manifest's sha256. Stub
      # curl, fixture archives, nothing downloaded.
      - name: setup_godot.sh names the action's archives and installs only a pinned, verified release
        shell: bash
        run: bash tests/setup_godot_test.sh

      - name: setup_flutter.sh resolves as the action did and checks every download
        shell: bash
        run: bash tests/setup_flutter_test.sh

      # PHP comes from apt (the ondrej/php PPA under a pinned key when the
      # image lacks the version) and Composer from getcomposer.org at a
      # pinned digest. Stub apt, gpg, curl and php; nothing downloaded.
      - name: setup_php.sh installs from apt under the pinned key and keeps composer to its digest
        shell: bash
        run: bash tests/setup_php_test.sh

      # The ondrej/php PPA has no suite for ubuntu-latest (26.04) yet: every
      # PHP job defaults to ubuntu-24.04 until it does.
      - name: PHP jobs default to ubuntu-24.04
        shell: bash
        run: bash tests/php_runner_gate_test.sh

      - name: The Godot and Flutter archive caches are saved right after the verified download and never from a release job
        shell: bash
        run: bash tests/toolchain_cache_save_test.sh

      - name: rust_cache_key.sh is deterministic and follows the lockfile
        shell: bash
        run: bash tests/rust_cache_key_test.sh

      # The multi-arch Docker build runs the docker CLI from four scripts:
      # the binfmt and BuildKit images pinned in toolchain-pins.env, the
      # registry token on stdin, build secrets by environment. Stub docker.
      - name: The docker scripts build the command lines the actions built and keep secrets out of argv
        shell: bash
        run: bash tests/docker_scripts_test.sh

      # Unity tests run in the editor image pinned by digest in
      # toolchain-pins.env, from a script; the licence secrets cross to the
      # container by name. Stub docker and stub editor; no licence here.
      - name: unity_test.sh runs the pinned editor image as the action did and keeps the licence out of argv
        shell: bash
        run: bash tests/unity_test_test.sh

      # A scan job runs only allowlisted actions, digest-pinned containers and
      # token-free checkouts, inherits no secrets and writes nothing but
      # SARIF; no workflow runs a third-party action outside ALLOWED_ACTIONS.
      # The test runs the gate against what it must refuse, then the gate
      # runs against this tree.
      # A job that holds a secret, a write token or a release to ship
      # restores no cache and saves none; no job saves a cache after the
      # caller's code ran. The test runs the gate against what it must
      # refuse, then the gate runs against this tree.
      - name: Cache-trust check reports what it must
        shell: bash
        run: bash tests/check_cache_trust_test.sh

      - name: Trusted jobs restore no cache and no job saves one after caller code
        shell: bash
        run: python3 scripts/check_cache_trust.py

      - name: Scan-egress check reports what it must
        shell: bash
        run: bash tests/scan_egress_test.sh

      - name: Scan workflows send nothing out and no workflow runs an unlisted third-party action
        shell: bash
        run: python3 scripts/check_scan_egress.py

      # Library scripts run only from a copy under RUNNER_TEMP, verified at
      # job.workflow_sha and hashed again before each use. The test runs the
      # gate and lib_isolate.sh against what they must refuse, then the gate
      # runs against this tree.
      - name: Library-isolation check reports what it must
        shell: bash
        run: bash tests/check_lib_isolation_test.sh

      - name: Library scripts run only from the verified copy
        shell: bash
        run: python3 scripts/check_lib_isolation.py

      # A job that runs the caller's build, test or install code holds no
      # write permission, secret or environment; publishing and signing run
      # in a separate job on the downloaded, sha256-checked outputs.
      - name: Privileged-job check reports what it must
        shell: bash
        run: bash tests/check_privileged_jobs_test.sh

      - name: No job runs caller code with a write token or a secret
        shell: bash
        run: python3 scripts/check_privileged_jobs.py

      - name: ppa-deb hands the source package over with a checked manifest
        shell: bash
        run: bash tests/ppa_split_test.sh

  zizmor:
    # Every zizmor finding fails, among them a checkout that keeps its token,
    # a job with no permissions block and a text input spliced into a script.
    # The one exception is inputs.<name>_command, shell code by design; a
    # deliberate finding carries a zizmor ignore comment with its reason.
    # Pinned by image digest.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: The zizmor check reports what it must
        run: bash tests/check_zizmor_test.sh
      - name: No zizmor finding outside inputs.<name>_command
        run: bash scripts/check_zizmor.sh

  actionlint:
    # PyYAML proves a file parses; it does not know a runner label from a typo,
    # an expression from a string, or an input that nobody declared -- which is
    # how a startup-failure bug shipped through a green PR (#134). actionlint
    # does. Pinned by image digest, so nothing new enters the SHA pin audit.
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Lint workflows
        # shellcheck at warning and above: an error or a warning in a run:
        # block is a bug, a style note is a review comment. The gate blocks
        # on the former only.
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            -e SHELLCHECK_OPTS="-S warning" \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color=false
