name: go-deploy

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      go_version:
        type: string
        # go.mod: Go from <working_directory>/go.mod (its toolchain line when
        # present), so a caller follows its own module. A version overrides it.
        default: "go.mod"
      bin_name:
        type: string
        required: true
      main_path:
        type: string
        default: "."
      build_target:
        type: string
        default: "linux/amd64"
      ldflags:
        type: string
        default: ""
      remote_path:
        type: string
        required: true
      remote_bin_name:
        type: string
        default: ""
      extra_files:
        type: string
        default: ""
      allow_missing_extra_files:
        description: >
          When true, an extra_files entry that does not exist is skipped with
          a warning. By default it fails the deploy before anything is copied.
        type: boolean
        default: false
      post_deploy_command:
        type: string
        default: ""
    secrets:
      ssh_host:
        required: true
      ssh_user:
        required: true
      ssh_key:
        required: true
      # known_hosts line(s) for ssh_host, e.g. the output of
      # `ssh-keyscan -t ed25519 host` checked against the host's own
      # fingerprint. The deploy refuses to run without it. Not marked
      # required so a missing value fails with a message, not a parse error.
      ssh_known_hosts:
        required: false

jobs:
  deploy:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version != 'go.mod' && inputs.go_version || '' }}
          go-version-file: ${{ inputs.go_version == 'go.mod' && format('{0}/go.mod', inputs.working_directory) || '' }}

      - name: Build binary
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT_BUILD_TARGET: ${{ inputs.build_target }}
          INPUT_BIN_NAME: ${{ inputs.bin_name }}
          INPUT_LDFLAGS: ${{ inputs.ldflags }}
          INPUT_MAIN_PATH: ${{ inputs.main_path }}
        run: |
          set -euo pipefail
          target="${INPUT_BUILD_TARGET}"
          if [[ "${INPUT_MAIN_PATH}" == -* ]]; then
            echo "Invalid main_path: values starting with '-' are not allowed." >&2
            exit 2
          fi
          export GOOS="${target%%/*}"
          export GOARCH="${target##*/}"
          export CGO_ENABLED=0

          bin_name="${INPUT_BIN_NAME}"
          if [ "$GOOS" = "windows" ]; then
            bin_name="${bin_name}.exe"
          fi

          if [ -n "${INPUT_LDFLAGS}" ]; then
            go build -o "$bin_name" -ldflags "${INPUT_LDFLAGS}" "${INPUT_MAIN_PATH}"
          else
            go build -o "$bin_name" "${INPUT_MAIN_PATH}"
          fi

          echo "Built ${bin_name} for ${GOOS}/${GOARCH}"
          ls -lh "$bin_name"

      - name: Deploy to remote
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          DEPLOY_SSH_HOST: ${{ secrets.ssh_host }}
          DEPLOY_SSH_USER: ${{ secrets.ssh_user }}
          DEPLOY_SSH_KEY: ${{ secrets.ssh_key }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.ssh_known_hosts }}
          INPUT_REMOTE_PATH: ${{ inputs.remote_path }}
          INPUT_BIN_NAME: ${{ inputs.bin_name }}
          INPUT_REMOTE_BIN_NAME: ${{ inputs.remote_bin_name }}
          INPUT_EXTRA_FILES: ${{ inputs.extra_files }}
          INPUT_ALLOW_MISSING_EXTRA_FILES: ${{ inputs.allow_missing_extra_files }}
          # post_deploy_command is an intentional arbitrary shell command executed on
          # the remote; callers are trusted to supply safe values.
          INPUT_POST_DEPLOY_COMMAND: ${{ inputs.post_deploy_command }}
        run: |
          set -euo pipefail

          quote_remote_shell_arg() {
            local value="$1"
            printf "'%s'" "${value//\'/\'\\\'\'}"
          }

          if [ -z "${DEPLOY_SSH_KNOWN_HOSTS}" ]; then
            echo "::error::ssh_known_hosts secret is empty. Pass the known_hosts line(s) for ssh_host (for example from 'ssh-keyscan -t ed25519 <host>', checked against the host's fingerprint). Host keys are never trusted on first use."
            exit 2
          fi

          TMP_KEY=$(mktemp)
          TMP_KNOWN_HOSTS=$(mktemp)
          trap 'rm -f "$TMP_KEY" "$TMP_KNOWN_HOSTS"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$TMP_KNOWN_HOSTS"

          # Write SSH key without tracing to avoid leaking it. Tracing is never
          # turned back on: it was never on, and `set -x` here would trace every
          # later command, the post-deploy command included.
          set +x
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"

          # Use an array so word-splitting on the key path is never a concern.
          SSH_OPTS=(-i "$TMP_KEY" -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$TMP_KNOWN_HOSTS" -o GlobalKnownHostsFile=/dev/null
            -o BatchMode=yes)
          printf -v SSH_CMD '%q ' ssh "${SSH_OPTS[@]}"
          SSH_CMD="${SSH_CMD% }"
          REMOTE="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          REMOTE_PATH="${INPUT_REMOTE_PATH}"

          bin_name="${INPUT_BIN_NAME}"
          remote_bin="${INPUT_REMOTE_BIN_NAME}"
          if [ -z "$remote_bin" ]; then
            remote_bin="${bin_name##*/}"
          fi

          if [ -z "$REMOTE_PATH" ]; then
            echo "Invalid remote_path: value must not be empty." >&2
            exit 2
          fi

          if [[ "$REMOTE_PATH" == *$'\n'* || "$REMOTE_PATH" == *$'\r'* ]]; then
            echo "Invalid remote_path: newline characters are not allowed." >&2
            exit 2
          fi

          if [[ ! "$remote_bin" =~ ^[[:alnum:]_.-]+$ ]]; then
            echo "Invalid remote_bin_name: only alphanumeric, dot, underscore, and dash are allowed." >&2
            exit 2
          fi

          remote_path_quoted="$(quote_remote_shell_arg "$REMOTE_PATH")"
          remote_binary_target="${REMOTE_PATH}/${remote_bin}"

          # Check extra files (comma-separated list) before copying anything,
          # so a missing config file fails the deploy instead of warning.
          extras=()
          if [ -n "${INPUT_EXTRA_FILES}" ]; then
            IFS=',' read -r -a files <<< "${INPUT_EXTRA_FILES}"
            for f in "${files[@]}"; do
              # Trim only surrounding whitespace; preserve path contents verbatim.
              f="${f#"${f%%[![:space:]]*}"}"
              f="${f%"${f##*[![:space:]]}"}"
              if [ -z "$f" ]; then
                continue
              fi
              if [ -f "$f" ]; then
                extras+=("$f")
              elif [ "${INPUT_ALLOW_MISSING_EXTRA_FILES}" = "true" ]; then
                echo "::warning::extra file '$f' not found, skipping"
              else
                echo "::error::extra file '$f' not found (allow_missing_extra_files: true skips it)" >&2
                exit 1
              fi
            done
          fi

          # Ensure remote directory exists.
          ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p -- ${remote_path_quoted}"

          # Use raw rsync destination paths. quote_remote_shell_arg() is only for
          # strings embedded into a remote shell command, not rsync target specs.
          rsync -az --protect-args -e "$SSH_CMD" -- "$bin_name" "${REMOTE}:${remote_binary_target}"

          for f in ${extras[@]+"${extras[@]}"}; do
            rsync -az --protect-args -e "$SSH_CMD" -- "$f" "${REMOTE}:${REMOTE_PATH}/"
          done

          # Run post-deploy command on remote (caller-supplied, trusted).
          if [ -n "${INPUT_POST_DEPLOY_COMMAND}" ]; then
            ssh "${SSH_OPTS[@]}" "$REMOTE" "${INPUT_POST_DEPLOY_COMMAND}"
          fi

          echo "Deployed ${bin_name} to ${DEPLOY_SSH_HOST}:${REMOTE_PATH}"
