name: ci-helpers-homebrew-package
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      prebuild_command:
        type: string
        default: ""
      name:
        type: string
        required: true
      desc:
        type: string
        required: true
      homepage:
        type: string
        required: true
      license:
        type: string
        default: MIT
      deps:
        type: string
        default: ""
      entrypoint:
        type: string
        default: ""
      man_path:
        type: string
        default: ""
      use_libexec:
        type: string
        default: "false"
      env_var:
        type: string
        default: ""
      tarball_url:
        type: string
        default: ""
      release_repo:
        type: string
        default: ""
      # The release this build belongs to, e.g. 1.2.3. With publish, the tarball
      # is uploaded to it and the formula points there; publish without it (or
      # tarball_url) fails, so a push to main cannot publish unreleased code.
      release_tag:
        type: string
        default: ""
      formula_path:
        type: string
        default: ""
      dist_dir:
        type: string
        default: "dist"
      exclude_paths:
        type: string
        default: ".git,.github,dist"
      artifact_name:
        type: string
        default: "homebrew-artifacts"
      artifact_glob:
        type: string
        default: ""
      publish:
        type: string
        default: "false"
      tap_repo:
        type: string
        default: ""
      tap_branch:
        type: string
        default: "main"
      tap_dir:
        type: string
        default: "Formula"
      commit_message:
        type: string
        default: ""
    secrets:
      # Tap repository as owner/repo, when kept as a secret instead of the input.
      tap_repo:
        required: false
      # SSH private key of a write deploy key on the tap (preferred).
      tap_deploy_key:
        required: false
      # Token with contents:write on the tap; used only without tap_deploy_key.
      tap_token:
        required: false

jobs:
  brew:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    # prebuild_command is the caller's code; it never holds a write token. The
    # release upload is the separate release-asset job.
    permissions:
      contents: read
    outputs:
      formula_file: ${{ steps.formula.outputs.file }}
      upload_repo: ${{ steps.asset.outputs.repo }}
      tarball: ${{ steps.asset.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Install Homebrew packaging prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync libdigest-sha-perl

      - name: Run prebuild command
        if: ${{ inputs.prebuild_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          IN_PREBUILD_COMMAND: ${{ inputs.prebuild_command }}
        run: |
          set -euo pipefail
          bash -lc "$IN_PREBUILD_COMMAND"

      - name: Bootstrap script-helpers
        id: script_helpers
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git submodule update --init --recursive || true
          # Use script-helpers where the repository keeps it, and never create
          # vendor/: in a Go module that directory switches go build to vendor
          # mode, which fails with "inconsistent vendoring".
          dir=""
          for d in scripts/script-helpers vendor/script-helpers; do
            if [[ -f "$d/helpers.sh" ]]; then
              dir="$d"
              break
            fi
          done
          if [[ -z "$dir" ]]; then
            echo "::error::script-helpers not found at scripts/script-helpers or vendor/script-helpers; add it as a submodule." >&2
            exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Prepare Homebrew inputs
        shell: bash
        env:
          IN_ARTIFACT_GLOB: ${{ inputs.artifact_glob }}
          IN_DIST_DIR: ${{ inputs.dist_dir }}
          IN_FORMULA_PATH: ${{ inputs.formula_path }}
          IN_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
          TARBALL_URL_IN: ${{ inputs.tarball_url }}
          RELEASE_REPO_IN: ${{ inputs.release_repo }}
          NAME_IN: ${{ inputs.name }}
          SCRIPT_HELPERS: ${{ steps.script_helpers.outputs.dir }}
        run: |
          set -euo pipefail
          repo="$IN_WORKING_DIRECTORY"
          name="$NAME_IN"
          dist_dir="$IN_DIST_DIR"

          if [[ "$dist_dir" != /* ]]; then
            dist_dir="$repo/$dist_dir"
          fi

          if [[ -z "$IN_FORMULA_PATH" ]]; then
            formula_path="$repo/packaging/homebrew/${name}.rb"
          else
            formula_path="$IN_FORMULA_PATH"
            if [[ "$formula_path" != /* ]]; then
              formula_path="$repo/$formula_path"
            fi
          fi

          # name becomes a path (dist/<name>-<version>.tar.gz) and a release asset
          # name, so a slash, `..` or a quote would escape dist or break the
          # asset lookup in release-asset.
          if [[ ! "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::name '$name' must be letters, digits and . _ + - (a Homebrew formula name)."
            exit 1
          fi
          version="$(cat "$repo/VERSION")"
          # Every value below becomes a KEY=value line in GITHUB_ENV, so a VERSION
          # carrying a newline would add lines of its own (any variable, PATH
          # included). Drop a Windows line ending, then accept version
          # characters only -- anything else fails here instead.
          version="${version%$'\r'}"
          # Trailing spaces or tabs are editor noise, not part of the version.
          version="${version%"${version##*[![:space:]]}"}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]]; then
            echo "::error::$repo/VERSION must hold one version (letters, digits, . + _ -), e.g. 1.2.3; refusing to export it."
            exit 1
          fi
          tarball_path="$dist_dir/${name}-${version}.tar.gz"
          helper_scripts="$repo/${SCRIPT_HELPERS}/scripts"
          tarball_url="$TARBALL_URL_IN"
          upload_repo=""
          # The formula's sha256 is of the tarball built here, so a published
          # formula must point at that file: the one release-asset uploads.
          if [[ "$PUBLISH" == "true" && -n "$tarball_url" ]]; then
            echo "::error::publish cannot use tarball_url: its bytes may differ from the tarball hashed here. Pass release_tag instead."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ "$RELEASE_TAG" != "$version" && "$RELEASE_TAG" != "v$version" ]]; then
              echo "::error::release_tag '$RELEASE_TAG' does not match VERSION '$version'."
              exit 1
            fi
            if [[ -z "$tarball_url" ]]; then
              upload_repo="${RELEASE_REPO_IN:-$GITHUB_REPOSITORY}"
              if [[ "$upload_repo" != "$GITHUB_REPOSITORY" ]]; then
                echo "::error::release_repo '$upload_repo' is not this repository; the tarball can only be uploaded to $GITHUB_REPOSITORY."
                exit 1
              fi
              tarball_url="https://github.com/${upload_repo}/releases/download/${RELEASE_TAG}/${name}-${version}.tar.gz"
            fi
          elif [[ "$PUBLISH" == "true" ]]; then
            echo "::error::publish needs release_tag: the formula must point at a released tarball."
            exit 1
          elif [[ -z "$tarball_url" && -n "$RELEASE_REPO_IN" ]]; then
            tarball_url="https://github.com/${RELEASE_REPO_IN}/releases/download/v${version}/${name}-${version}.tar.gz"
          fi
          artifact_glob="$IN_ARTIFACT_GLOB"
          if [[ -z "$artifact_glob" ]]; then
            artifact_glob="$dist_dir/*.tar.gz"$'\n'"$formula_path"
          fi

          {
            echo "BREW_REPO=$repo"
            echo "BREW_NAME=$name"
            echo "BREW_DIST_DIR=$dist_dir"
            echo "BREW_FORMULA_PATH=$formula_path"
            echo "BREW_VERSION=$version"
            echo "BREW_TARBALL_PATH=$tarball_path"
            echo "BREW_TARBALL_URL=$tarball_url"
            echo "BREW_HELPER_SCRIPTS=$helper_scripts"
            echo "BREW_UPLOAD_REPO=$upload_repo"
          } >> "$GITHUB_ENV"
          # A random delimiter: a glob line reading exactly EOF would otherwise
          # end the value early and the rest would be parsed as more variables.
          delimiter="GH_ENV_${RANDOM}_${RANDOM}_$(date +%s)"
          while [[ "$artifact_glob" == *"$delimiter"* ]]; do
            delimiter="GH_ENV_${RANDOM}_${RANDOM}_$(date +%s)"
          done
          {
            echo "BREW_ARTIFACT_GLOB<<$delimiter"
            echo "$artifact_glob"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Build Homebrew tarball
        shell: bash
        env:
          IN_EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          set -euo pipefail
          exclude_csv="$IN_EXCLUDE_PATHS"
          IFS=',' read -r -a excludes <<< "$exclude_csv"

          args=(--name "$BREW_NAME" --repo "$BREW_REPO" --dist-dir "$BREW_DIST_DIR")
          for ex in "${excludes[@]}"; do
            ex="$(echo "$ex" | xargs)"
            [[ -z "$ex" ]] && continue
            args+=(--exclude "$ex")
          done

          bash "$BREW_HELPER_SCRIPTS/build_brew_tarball.sh" "${args[@]}"

      - name: Generate Homebrew formula
        shell: bash
        env:
          IN_DEPS: ${{ inputs.deps }}
          IN_DESC: ${{ inputs.desc }}
          IN_ENTRYPOINT: ${{ inputs.entrypoint }}
          IN_ENV_VAR: ${{ inputs.env_var }}
          IN_HOMEPAGE: ${{ inputs.homepage }}
          IN_LICENSE: ${{ inputs.license }}
          IN_MAN_PATH: ${{ inputs.man_path }}
          IN_NAME: ${{ inputs.name }}
          IN_USE_LIBEXEC: ${{ inputs.use_libexec }}
        run: |
          set -euo pipefail
          deps_csv="$IN_DEPS"
          IFS=',' read -r -a deps <<< "$deps_csv"

          args=(
            --name "$IN_NAME"
            --desc "$IN_DESC"
            --homepage "$IN_HOMEPAGE"
            --license "$IN_LICENSE"
            --tarball "$BREW_TARBALL_PATH"
            --formula-path "$BREW_FORMULA_PATH"
          )

          if [[ -n "$BREW_TARBALL_URL" ]]; then
            args+=(--url "$BREW_TARBALL_URL")
          fi

          if [[ -n "$IN_ENTRYPOINT" ]]; then
            args+=(--entrypoint "$IN_ENTRYPOINT")
          fi

          if [[ -n "$IN_MAN_PATH" ]]; then
            args+=(--man-path "$IN_MAN_PATH")
          fi

          if [[ "$IN_USE_LIBEXEC" == "true" ]]; then
            args+=(--use-libexec)
            if [[ -n "$IN_ENV_VAR" ]]; then
              args+=(--env-var "$IN_ENV_VAR")
            fi
          fi

          for dep in "${deps[@]}"; do
            dep="$(echo "$dep" | xargs)"
            [[ -z "$dep" ]] && continue
            args+=(--dep "$dep")
          done

          bash "$BREW_HELPER_SCRIPTS/gen_brew_formula.sh" "${args[@]}"

      # The formula's sha256 is of this run's tarball, so this exact file has to
      # be the release asset its url points at; release-asset uploads it.
      - name: Stage tarball for the release
        id: asset
        if: ${{ inputs.publish == 'true' && env.BREW_UPLOAD_REPO != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "repo=$BREW_UPLOAD_REPO" >> "$GITHUB_OUTPUT"
          echo "tarball=$(basename "$BREW_TARBALL_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload tarball for the release
        if: ${{ steps.asset.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}-tarball
          path: ${{ env.BREW_TARBALL_PATH }}
          if-no-files-found: error

      - name: Upload Homebrew artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.BREW_ARTIFACT_GLOB }}

      # Only the formula goes to the tap; the artifact above also carries the
      # tarballs.
      - name: Stage formula for the tap
        id: formula
        if: ${{ inputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brew-formula"
          cp "$BREW_FORMULA_PATH" "$RUNNER_TEMP/brew-formula/"
          echo "file=$(basename "$BREW_FORMULA_PATH")" >> "$GITHUB_OUTPUT"
          echo "dir=$RUNNER_TEMP/brew-formula" >> "$GITHUB_OUTPUT"

      - name: Upload formula for the tap
        if: ${{ inputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}-formula
          path: ${{ steps.formula.outputs.dir }}/${{ steps.formula.outputs.file }}
          if-no-files-found: error

  # The push lives in one language-agnostic workflow shared with every other
  # formula producer. `./` resolves to ci-helpers at the ref the caller pinned.
  # Uploads the tarball to the release. An asset of that name already there is
  # never replaced: identical bytes pass, different bytes fail, since users may
  # have fetched and verified the published one.
  release-asset:
    needs: brew
    if: ${{ inputs.publish == 'true' && needs.brew.outputs.upload_repo != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: ${{ inputs.artifact_name }}-tarball
          path: tarball
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ needs.brew.outputs.upload_repo }}
          TAG: ${{ inputs.release_tag }}
          FILE: ${{ needs.brew.outputs.tarball }}
        run: |
          set -euo pipefail
          if [[ ! "$FILE" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*\.tar\.gz$ ]]; then
            echo "::error::unexpected tarball name '$FILE'."
            exit 1
          fi
          want="sha256:$(sha256sum "tarball/$FILE" | cut -d' ' -f1)"
          # "" when no asset of that name; "unknown" for an asset GitHub has no
          # digest for (uploaded before digests existed): hash it ourselves.
          # The release may still be being created by a parallel job.
          release_json=""
          for attempt in 1 2 3 4 5 6; do
            if release_json="$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null)"; then break; fi
            release_json=""
            [[ "$attempt" -lt 6 ]] && sleep 10
          done
          if [[ -z "$release_json" ]]; then
            echo "::error::release $TAG not found in $REPO after 60s; create it before publishing."
            exit 1
          fi
          have="$(printf '%s' "$release_json" | jq -r --arg f "$FILE" \
            '[.assets[] | select(.name == $f)] | if length == 0 then "" else (.[0].digest // "unknown") end')"
          if [[ "$have" == "unknown" ]]; then
            mkdir -p published
            gh release download "$TAG" -R "$REPO" -p "$FILE" -D published
            have="sha256:$(sha256sum "published/$FILE" | cut -d' ' -f1)"
          fi
          if [[ -z "$have" ]]; then
            gh release upload "$TAG" "tarball/$FILE" -R "$REPO"
          elif [[ "$have" == "$want" ]]; then
            echo "$FILE is already on release $TAG with the same sha256."
          else
            echo "::error::$FILE is already on release $TAG with a different sha256 ($have); refusing to replace a published asset. Delete it to republish."
            exit 1
          fi

  publish:
    permissions:
      contents: read
    needs: [brew, release-asset]
    if: ${{ always() && inputs.publish == 'true' && needs.brew.result == 'success' && (needs.release-asset.result == 'success' || needs.release-asset.result == 'skipped') }}
    uses: ./.github/workflows/homebrew-tap-publish.yml
    with:
      formula_artifact: ${{ inputs.artifact_name }}-formula
      formula_file: ${{ needs.brew.outputs.formula_file }}
      tap_repo: ${{ inputs.tap_repo }}
      tap_branch: ${{ inputs.tap_branch }}
      tap_dir: ${{ inputs.tap_dir }}
      commit_message: ${{ inputs.commit_message }}
      runner: ${{ inputs.runner }}
    secrets:
      tap_repo: ${{ secrets.tap_repo }}
      tap_deploy_key: ${{ secrets.tap_deploy_key }}
      tap_token: ${{ secrets.tap_token }}
