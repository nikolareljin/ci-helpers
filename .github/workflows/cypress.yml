name: preset-cypress
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      concurrency_key:
        type: string
        default: ""
      fetch_depth:
        type: number
        default: 0
      # false / true / recursive. Forwarded to the engine's checkout; see
      # ci.yml for why a typo is refused rather than read as false.
      submodules:
        type: string
        default: "false"
      node_version:
        type: string
        default: "22"
      install_command:
        type: string
        default: ""
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      e2e_command:
        type: string
        default: "yarn install --frozen-lockfile && yarn dlx cypress install && yarn dlx start-server-and-test 'yarn dev' http://localhost:3000 'npx cypress run'"
      extra_command:
        type: string
        default: ""
      # Forwarded to the engine, which applies it as the job timeout. Without
      # one a hung job bills until GitHub's six-hour default (#132).
      timeout_minutes:
        type: number
        default: 20

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      concurrency_key: ${{ inputs.concurrency_key }}
      fetch_depth: ${{ inputs.fetch_depth }}
      node_version: ${{ inputs.node_version }}
      install_command: ${{ inputs.install_command }}
      lint_command: ${{ inputs.lint_command }}
      test_command: ${{ inputs.test_command }}
      build_command: ${{ inputs.build_command }}
      docker_command: ${{ inputs.docker_command }}
      e2e_command: ${{ inputs.e2e_command }}
      extra_command: ${{ inputs.extra_command }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      submodules: ${{ inputs.submodules }}
