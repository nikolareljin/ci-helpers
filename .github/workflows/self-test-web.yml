      - node-refuses-what-it-must
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A skipped leg is not a pass
        # `needs` itself, not a hand-written list of the same job names. The
        # two drifted the moment a job was added: the laravel legs were in
        # `needs` and absent from the list, so this step reported success
        # while one of them had been cancelled. toJSON(needs) cannot fall
        # behind what the job actually waits on.
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=0
          count=0
          while IFS=$'\t' read -r leg result; do
            count=$((count + 1))
            case "$result" in
              success) echo "$leg passed" ;;
              skipped) echo "::error::$leg was skipped; a skip is not a pass"; failed=1 ;;
              *)       echo "::error::$leg result: $result"; failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' <<<"$RESULTS_JSON")
          # Zero legs examined is the failure this gate is most likely to have:
          # a malformed object loops no times and reports success having checked
          # nothing.
          #
          # Zero, not a floor of ten. A floor is a second copy of how many legs
          # the file holds, and the suite was split into three files of 12, 19
          # and 21 -- the next move of a leg between them would have made this
          # fail on a correct suite, which is the false alarm this repository
          # keeps removing elsewhere.
          if (( count == 0 )); then
            echo "::error::no legs examined; needs is not being read"
            failed=1
          fi
          exit "$failed"