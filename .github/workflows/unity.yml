name: preset-unity
# Unity is not a variant of the C# preset and must not be folded into it. It
# needs licence activation against Unity's servers, a Library folder
# imported cold on every run (no cache: the test job holds secrets), and a macOS runner for an iOS export.
# It also bills differently: an editor run is minutes where `dotnet build` is
# seconds, which is why this workflow does nothing at all unless a repository
# variable arms it.
#
# A .NET test harness that lives outside the asset tree is NOT this preset's
# business. That harness exists precisely so some tests run on a Linux runner
# without the editor, and it keeps using `csharp.yml`. This preset is for the
# tests that need the editor.
on:
  workflow_call:
    inputs:
      # --- kill switch -------------------------------------------------------
      enabled:
        type: string
        default: ""
        description: >
          Pass the repository variable that arms Unity runs — an expression
          reading vars.UNITY_CI from the caller. Empty falls back to reading
          that same variable here. Compared against the string 'true';
          anything else, including unset, leaves this workflow inert.

          It is a variable rather than an input so that arming it is a
          deliberate act in the repository's settings, visible to anyone with
          access, rather than a line in a workflow file that a merge can
          introduce. An editor run bills by the minute.
      runner:
        type: string
        default: ubuntu-latest
        description: >
          ubuntu-latest covers editmode and playmode. The editor runs in a
          container, so the runner must be Linux with docker: a macOS runner
          is refused by the test step, as the replaced action refused it.
      project_path:
        type: string
        default: "."
        description: Directory holding Assets/ and ProjectSettings/, relative to the repository root.
      unity_version:
        type: string
        default: auto
        description: >
          'auto' reads ProjectSettings/ProjectVersion.txt, which is what keeps
          CI on the version the project actually opens with. Pin a version only
          to test an upgrade.
      test_mode:
        type: string
        default: editmode
        description: all, editmode or playmode. Refused if it is anything else.
      cache:
        type: boolean
        default: false
        description: >
          Has no effect; kept so callers keep parsing, and `true` logs a
          warning annotation. The Library folder is not
          cached: the test job holds the licence secrets, and a restored
          Library (compiled script assemblies included) is whatever the run
          that owned the key first left there (scripts/check_cache_trust.py).
          Every run imports cold, which is the slowest thing in a Unity run
          by a wide margin.
      lfs:
        type: boolean
        default: true
        description: >
          Check out Git LFS objects. Unity projects usually keep binary assets
          in LFS, and a missing object fails deep inside the import rather than
          at checkout.
      fetch_depth:
        type: number
        default: 1
        description: >
          1, not 0 as elsewhere: nothing here reads history, and a Unity
          repository is large enough that a full clone is a real cost.
      timeout_minutes:
        type: number
        default: 60
        description: >
          60, not the 20 used elsewhere: a cold Library import alone can take
          most of that. Without a timeout a hung editor bills until GitHub's
          six-hour default (#132).
      artifact_name:
        type: string
        default: unity-test-results
      concurrency_key:
        type: string
        default: ""
        description: >
          Overrides the default concurrency group. The default already
          separates runs by project_path, runner and test_mode, so a caller
          that tests several projects or modes does not cancel its own legs.

    secrets:
      UNITY_LICENSE:
        required: false
        description: >
          Contents of the .ulf licence file, for a Personal licence. Activate
          once locally, then paste the whole file into the secret. Either this
          or UNITY_SERIAL must be set when the kill switch is armed.
      UNITY_EMAIL:
        required: false
        description: Unity account email. Needed with either licence kind.
      UNITY_PASSWORD:
        required: false
        description: Unity account password. Needed with either licence kind.
      UNITY_SERIAL:
        required: false
        description: Serial for a Plus or Pro licence, instead of UNITY_LICENSE.

# Unity has no engine to inherit a group from -- it does not call ci.yml -- so
# without this two pushes a minute apart run two concurrent editor runs and bill
# for both. cancel-in-progress is true for the same reason: a superseded run is
# money being spent on an answer nobody will read.
#
# The key carries project_path, runner and test_mode, not just the ref. A caller
# testing two projects, or editmode and playmode, reaches this workflow with one
# github.ref, and a group keyed on the ref alone would have those legs cancel
# each other -- the defect ci.yml carried until 0.26.0.
concurrency:
  group: ci-helpers-unity-${{ github.workflow }}-${{ inputs.concurrency_key || format('{0}-{1}-{2}', inputs.project_path, inputs.runner, inputs.test_mode) }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on every call, costs seconds, checks out nothing. Everything that can
  # be refused is refused here, before a runner that bills by the minute starts
  # importing a Library folder.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - name: Decide whether this run does anything
        id: decide
        shell: bash
        env:
          IN_ENABLED: ${{ inputs.enabled }}
          VAR_ENABLED: ${{ vars.UNITY_CI }}
          IN_TEST_MODE: ${{ inputs.test_mode }}
          IN_PROJECT_PATH: ${{ inputs.project_path }}
          # Presence only. Never printed, never compared to a literal.
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
          HAS_SERIAL: ${{ secrets.UNITY_SERIAL != '' }}
          HAS_EMAIL: ${{ secrets.UNITY_EMAIL != '' }}
          HAS_PASSWORD: ${{ secrets.UNITY_PASSWORD != '' }}
        run: |
          set -euo pipefail

          # Refused before the kill switch, so a typo costs five seconds and
          # fails saying what it is, whether or not Unity is armed.
          case "${IN_TEST_MODE}" in
            all|editmode|playmode) ;;
            *)
              echo "::error::test_mode must be all, editmode or playmode, not '${IN_TEST_MODE}'"
              exit 1 ;;
          esac

          case "${IN_PROJECT_PATH}" in
            /*)
              echo "::error::project_path must be relative to the repository root, not '${IN_PROJECT_PATH}'"
              exit 1 ;;
            *..*)
              echo "::error::project_path must not contain '..': '${IN_PROJECT_PATH}'"
              exit 1 ;;
          esac

          enabled="${IN_ENABLED}"
          if [ -z "${enabled}" ]; then
            enabled="${VAR_ENABLED:-}"
          fi
          # Compared against the literal string. Anything else, unset included,
          # leaves Unity off.
          if [ "${enabled}" = "true" ]; then
            mode="test"
          else
            mode="disabled"
          fi

          # An enum, not a boolean. A job output is a string, so a boolean
          # crossing a job boundary arrives as "true"/"false" and `if: needs.x`
          # is truthy for both -- which is how a run that was supposed to be
          # skipped runs anyway. See cloudflare-deploy.yml, same reasoning.
          case "${mode}" in
            test|disabled) ;;
            *) echo "::error::internal: mode '${mode}' is not one of test, disabled"; exit 1 ;;
          esac

          # Credentials are checked here rather than by the editor, because the
          # editor discovers a missing licence several minutes into a billed
          # run, after the Library import, with an error that names a file
          # instead of a secret.
          if [ "${mode}" = "test" ]; then
            if [ "${HAS_LICENSE}" != "true" ] && [ "${HAS_SERIAL}" != "true" ]; then
              echo "::error::UNITY_CI is armed but neither UNITY_LICENSE nor UNITY_SERIAL is set; nothing can activate"
              exit 1
            fi
            if [ "${HAS_EMAIL}" != "true" ] || [ "${HAS_PASSWORD}" != "true" ]; then
              echo "::error::UNITY_CI is armed but UNITY_EMAIL or UNITY_PASSWORD is missing; both are needed with either licence kind"
              exit 1
            fi
          fi

          if [ "${mode}" = "disabled" ]; then
            echo "::notice::Unity is not armed on this repository. Set the repository variable UNITY_CI to 'true' to run editor tests. Nothing was billed."
            {
              echo "### Unity"
              echo ""
              echo "Not armed: repository variable \`UNITY_CI\` is not \`true\`. No editor ran."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Warn that the cache input has no effect
        if: ${{ inputs.cache }}
        shell: bash
        env:
          IN_CACHE: ${{ inputs.cache }}
        run: |
          echo "::warning title=unity.yml cache::cache: $IN_CACHE has no effect. Library is not cached, as the test job holds the licence secrets; every run imports cold. Drop the input."

  test:
    permissions:
      contents: read
    needs: decide
    if: ${{ needs.decide.outputs.mode == 'test' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          lfs: ${{ inputs.lfs }}

      # No Library cache (see the `cache` input): the editor below runs with
      # the licence secrets, and Library/ScriptAssemblies is code it loads.

      # The library's scripts and pins at this workflow's commit: the editor
      # run, the licence return and the test summary. actions/checkout can
      # only write under the workspace, and the project directory in the
      # workspace is mounted into the editor's container, so the files are
      # copied to a directory under RUNNER_TEMP, files read-only, before anything
      # runs from them, their content hash is recorded, and the checkout is
      # removed: a container (a third-party image running project code)
      # cannot rewrite a script the host runs after it. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's scripts after all; refuse instead. git
      # runs here once, before any untrusted step, with no hooks, no fsmonitor
      # and no user or system config; later steps never run git on the copy,
      # which has no .git at all. `lib` is the copy, `hash` the
      # sha256 over its files.
      - name: Isolate ci-helpers scripts
        id: ci_scripts_verify
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # The editor runs in the unityci/editor image pinned by digest in the
      # library's toolchain-pins.env for the project's editor version; a
      # version without a pin is refused with the line to add. The licence
      # secrets reach the container as `--env NAME`, never as a value in an
      # argument, and the activation log stays in the container unless
      # activation fails, when it is printed redacted. The step's exit code
      # is the editor's: 2 when a test failed, with the results written.
      #
      # Each step that runs a library script first hashes the copy again
      # with plain coreutils and compares, and fails otherwise: the step
      # before it ran a container, and this one must not run what a
      # container left behind.
      - name: Run Unity tests
        id: tests
        shell: sh
        env:
          LIB: ${{ steps.ci_scripts_verify.outputs.lib }}
          LIB_HASH: ${{ steps.ci_scripts_verify.outputs.hash }}
          PROJECT_PATH: ${{ inputs.project_path }}
          UNITY_VERSION: ${{ inputs.unity_version }}
          TEST_MODE: ${{ inputs.test_mode }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH PROJECT_PATH UNITY_VERSION TEST_MODE UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD UNITY_SERIAL GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          /bin/bash "$run_lib/scripts/unity_test.sh"
          CI_HELPERS_RUN
          )"

      # The licence a run activated is returned whatever the tests did, so a
      # timed-out or failed run does not keep a seat. Nothing activated,
      # nothing to return.
      - name: Return the Unity licence
        if: ${{ always() && steps.ci_scripts_verify.outcome == 'success' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_scripts_verify.outputs.lib }}
          LIB_HASH: ${{ steps.ci_scripts_verify.outputs.hash }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH UNITY_EMAIL UNITY_PASSWORD GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          /bin/bash "$run_lib/scripts/unity_test.sh" --return-license
          CI_HELPERS_RUN
          )"

      # The NUnit XML the editor wrote, as a table on the job summary page;
      # the action posted a check run with the job token instead.
      - name: Test summary
        if: ${{ always() && steps.tests.outputs.artifactsPath != '' && steps.ci_scripts_verify.outcome == 'success' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_scripts_verify.outputs.lib }}
          LIB_HASH: ${{ steps.ci_scripts_verify.outputs.hash }}
          ARTIFACTS_PATH: ${{ steps.tests.outputs.artifactsPath }}
          TEST_MODE: ${{ inputs.test_mode }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" ARTIFACTS_PATH="$ARTIFACTS_PATH" TEST_MODE="$TEST_MODE" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /usr/bin/python3 -I "$run_lib/scripts/junit_summary.py" --title "Unity tests (${TEST_MODE})" --glob "${ARTIFACTS_PATH}/*-results.xml"
          CI_HELPERS_RUN
          )"

      # always(), so a failing suite still uploads the results that say which
      # test failed. Without it the one run worth inspecting is the one with no
      # artifact.
      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -L .git || ( -e .git && ! -d .git ) ]]; then
            echo "::warning::.git is not a plain directory; not adding the publication checkout to its exclude file"
          elif [[ -d .git ]]; then
            gd="$(pwd -P)/.git"; exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --git-path info/exclude) || { echo "::error::git cannot read .git; refusing to edit its exclude file"; exit 1; }
            [[ "$exclude" == ".git/info/exclude" && ! -L "$gd/info" && ! -L "$gd/info/exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            exclude="$gd/info/exclude"
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ always() && steps.tests.outputs.artifactsPath != '' && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}
          mode: artifact
          paths: ${{ steps.tests.outputs.artifactsPath }}

      - if: ${{ (always() && steps.tests.outputs.artifactsPath != '') && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_scripts_verify.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
