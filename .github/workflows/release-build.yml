name: release-build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      node_version:
        type: string
        default: ""
      java_version:
        type: string
        default: ""
      dotnet_version:
        type: string
        default: ""
      python_version:
        type: string
        default: ""
      go_version:
        type: string
        default: ""
      flutter_version:
        type: string
        default: ""
      flutter_channel:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
      artifact_paths:
        type: string
        default: ""
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: "release-artifacts"
      release_tag:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_notes:
        type: string
        default: ""
      generate_release_notes:
        type: boolean
        default: true
      binary_links:
        type: string
        default: ""
      binary_base_url:
        type: string
        default: ""

      # A hung job otherwise bills until GitHub's six-hour default. Raise it for
      # a genuinely long build rather than removing it.
      timeout_minutes:
        type: number
        default: 30
# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 @ 2026-09-10
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Java
        if: ${{ inputs.java_version != '' }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1 @ 2026-09-14
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup .NET
        if: ${{ inputs.dotnet_version != '' }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0 @ 2026-09-10
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Python
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 @ 2026-09-10
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Go
        if: ${{ inputs.go_version != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version }}

      - name: Setup Flutter
        if: ${{ inputs.flutter_version != '' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 @ 2026-09-10
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel != '' && inputs.flutter_channel || 'stable' }}

      - name: Setup Flutter (channel only)
        if: ${{ inputs.flutter_version == '' && inputs.flutter_channel != '' }}
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0 @ 2026-09-10
        with:
          channel: ${{ inputs.flutter_channel }}

      - name: Setup PHP
        if: ${{ inputs.php_version != '' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2 @ 2026-09-10
        with:
          php-version: ${{ inputs.php_version }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Upload workflow artifact
        if: ${{ inputs.upload_artifact && inputs.artifact_paths != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 @ 2026-09-10
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_paths }}

      # Check out script-helpers only when the producer is actually needed --
      # not when the caller supplied its own release_notes. Pinned to the commit
      # vendored at vendor/.script-helpers-sha (tag 0.28.0); keep the two in step.
      - name: Checkout script-helpers for release notes
        if: ${{ inputs.generate_release_notes && inputs.release_notes == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: nikolareljin/script-helpers
          ref: 72ff882a7946706a59bf93829d6fcda2fbae6895 # 0.35.0
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        if: ${{ inputs.generate_release_notes || inputs.release_notes != '' }}
        shell: bash
        env:
          # Everything reaches the shell through the environment, never spliced
          # into the script: a CHANGELOG line or commit subject carrying ${{ }}
          # or a backtick cannot execute.
          RN_VERSION: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          RN_RELEASE_TAG: ${{ inputs.release_tag }}
          RN_OVERRIDE: ${{ inputs.release_notes }}
          RN_BINARY_LINKS: ${{ inputs.binary_links }}
          RN_BINARY_BASE_URL: ${{ inputs.binary_base_url }}
          RN_REPOSITORY: ${{ github.repository }}
          RN_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"

          release_tag="${RN_RELEASE_TAG:-}"
          [ -n "$release_tag" ] || release_tag="${RN_REF_NAME:-}"
          version="${RN_VERSION:-}"
          [ -n "$version" ] || version="$release_tag"

          if [ -n "${RN_OVERRIDE:-}" ]; then
            # Caller-supplied body, verbatim (binary links still appended below).
            printf '%s\n' "$RN_OVERRIDE" > "$notes_file"
          else
            # A non-version ref (a branch, or workflow_dispatch with no
            # release_tag) has no release to describe. Skip with no body rather
            # than fail the job -- GitHub then uses its own default.
            if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
              echo "release notes: '$version' is not a version; skipping (no body)."
              exit 0
            fi
            producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
            if [ ! -f "$producer" ]; then
              echo "release notes: $producer not found (script-helpers checkout failed)" >&2
              exit 1
            fi
            bash "$producer" --version "$version" --repo "$GITHUB_WORKSPACE" --output "$notes_file"
          fi

          binary_base_url="${RN_BINARY_BASE_URL:-}"
          if [ -z "$binary_base_url" ] && [ -n "$release_tag" ]; then
            binary_base_url="https://github.com/${RN_REPOSITORY}/releases/download/${release_tag}"
          fi
          if [ -n "${RN_BINARY_LINKS:-}" ] && [ -n "$binary_base_url" ]; then
            {
              echo ""
              echo "## Download Binaries"
              echo ""
              echo "| Platform | Binary |"
              echo "|----------|--------|"
            } >> "$notes_file"
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [ -n "$trimmed" ] || continue
              label="${trimmed%%|*}"
              filename="${trimmed#*|}"
              if [ -z "$label" ] || [ -z "$filename" ] || [ "$label" = "$filename" ]; then
                continue
              fi
              printf "| %s | [%s](%s/%s) |\n" "$label" "$filename" "$binary_base_url" "$filename" >> "$notes_file"
            done <<< "$RN_BINARY_LINKS"
          fi

          # A single-line path only -- the body itself never passes through an
          # output, so no heredoc and no delimiter to collide with.
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release (with files)
        if: ${{ inputs.artifact_paths != '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 @ 2026-09-10
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          # The action's input is `name`; it never had a `release_name`, so this
          # was ignored and every release was named after its tag. An empty
          # release_name keeps that (the action falls back to the existing
          # release's name, then the tag).
          name: ${{ inputs.release_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: ${{ inputs.artifact_paths }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub release (no files)
        if: ${{ inputs.artifact_paths == '' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 @ 2026-09-10
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          # The action's input is `name`; it never had a `release_name`, so this
          # was ignored and every release was named after its tag. An empty
          # release_name keeps that (the action falls back to the existing
          # release's name, then the tag).
          name: ${{ inputs.release_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
