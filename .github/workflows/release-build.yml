name: release-build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      # The job that holds contents: write. A fresh hosted runner by default:
      # a reused self-hosted machine can carry state left by the build.
      release_runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      node_version:
        type: string
        default: ""
      java_version:
        type: string
        default: ""
      dotnet_version:
        type: string
        default: ""
      python_version:
        type: string
        default: ""
      go_version:
        type: string
        # Empty: no Go. go.mod: Go from <working_directory>/go.mod.
        default: ""
      flutter_version:
        type: string
        default: ""
      flutter_channel:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: ""
      build_command:
        type: string
        default: ""
      artifact_paths:
        type: string
        default: ""
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: "release-artifacts"
      release_tag:
        type: string
        default: ""
      release_name:
        type: string
        default: ""
      release_notes:
        type: string
        default: ""
      generate_release_notes:
        type: boolean
        default: true
      binary_links:
        type: string
        default: ""
      binary_base_url:
        type: string
        default: ""

      # A hung job otherwise bills until GitHub's six-hour default. Raise it for
      # a genuinely long build rather than removing it.
      timeout_minutes:
        type: number
        default: 30
# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The caller's lint, test and build commands run here with a read-only token.
  # The release job below holds contents: write and runs none of them.
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      files_id: ${{ steps.files.outputs.artifact-id }}
      notes_id: ${{ steps.notes_up.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup Java
        if: ${{ inputs.java_version != '' }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0 @ 2026-11-06
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Setup .NET
        if: ${{ inputs.dotnet_version != '' }}
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0 @ 2026-11-06
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Python
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 @ 2026-10-22
        with:
          python-version: ${{ inputs.python_version }}

      - name: Setup Go
        if: ${{ inputs.go_version != '' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 @ 2026-09-10
        with:
          go-version: ${{ inputs.go_version != 'go.mod' && inputs.go_version || '' }}
          go-version-file: ${{ inputs.go_version == 'go.mod' && format('{0}/go.mod', inputs.working_directory) || '' }}
          # A release build restores no cache another run wrote.
          cache: false

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers scripts commit
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is empty"; exit 1; }
          [[ "$(git -C .ci-helpers-scripts rev-parse HEAD)" == "$WF_SHA" ]] || { echo "::error::ci-helpers checkout is not $WF_SHA"; exit 1; }
          if git rev-parse --git-dir >/dev/null 2>&1; then
            printf '\n/.ci-helpers-scripts/\n' >> "$(git rev-parse --git-path info/exclude)"
          fi

      # Flutter from the official release archive, checked against the
      # manifest's sha256 and, for the pinned default, the library's
      # toolchain-pins.env. An empty flutter_version on stable installs the
      # pinned release. The archive a CI job of the caller saved is
      # restored; this job publishes and saves nothing. The script checks
      # the archive's sha256 on every run and extracts it fresh, so a cache
      # entry written by another job cannot put a different SDK on PATH.
      - name: Resolve Flutter
        id: flutter_resolve
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        shell: bash
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
          FLUTTER_ARCHIVE_DIR: ${{ runner.temp }}/ci-helpers-flutter-archive
          FLUTTER_DRY_RUN: "true"
        run: bash .ci-helpers-scripts/scripts/setup_flutter.sh

      - name: Restore Flutter archive
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 @ 2026-09-21
        with:
          path: ${{ steps.flutter_resolve.outputs.cache_path }}
          key: ${{ steps.flutter_resolve.outputs.cache_key }}

      - name: Setup Flutter
        if: ${{ inputs.flutter_version != '' || inputs.flutter_channel != '' }}
        shell: bash
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
          FLUTTER_ARCHIVE_DIR: ${{ runner.temp }}/ci-helpers-flutter-archive
        run: bash .ci-helpers-scripts/scripts/setup_flutter.sh

      - name: Setup PHP
        if: ${{ inputs.php_version != '' }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 @ 2026-10-16
        with:
          php-version: ${{ inputs.php_version }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Test
        if: ${{ inputs.test_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.test_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if git rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$(git rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (inputs.upload_artifact && inputs.artifact_paths != '') && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}
          mode: artifact
          paths: ${{ inputs.artifact_paths }}


      - name: Upload workflow artifact
        if: ${{ (inputs.upload_artifact && inputs.artifact_paths != '') && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
      # Check out script-helpers only when the producer is actually needed --
      # not when the caller supplied its own release_notes. Pinned to the commit
      # vendored at vendor/.script-helpers-sha (tag 0.28.0); keep the two in step.
      - name: Checkout script-helpers for release notes
        if: ${{ inputs.generate_release_notes && inputs.release_notes == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: aa819e9fc9197e3f6941222ecd5141cdd152c11b # aa819e9fc9197e3f6941222ecd5141cdd152c11b
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        if: ${{ inputs.generate_release_notes || inputs.release_notes != '' }}
        shell: bash
        env:
          # Everything reaches the shell through the environment, never spliced
          # into the script: a CHANGELOG line or commit subject carrying ${{ }}
          # or a backtick cannot execute.
          RN_VERSION: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          RN_RELEASE_TAG: ${{ inputs.release_tag }}
          RN_OVERRIDE: ${{ inputs.release_notes }}
          RN_BINARY_LINKS: ${{ inputs.binary_links }}
          RN_BINARY_BASE_URL: ${{ inputs.binary_base_url }}
          RN_REPOSITORY: ${{ github.repository }}
          RN_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"

          release_tag="${RN_RELEASE_TAG:-}"
          [ -n "$release_tag" ] || release_tag="${RN_REF_NAME:-}"
          version="${RN_VERSION:-}"
          [ -n "$version" ] || version="$release_tag"

          if [ -n "${RN_OVERRIDE:-}" ]; then
            # Caller-supplied body, verbatim (binary links still appended below).
            printf '%s\n' "$RN_OVERRIDE" > "$notes_file"
          else
            # A non-version ref (a branch, or workflow_dispatch with no
            # release_tag) has no release to describe. Skip with no body rather
            # than fail the job -- GitHub then uses its own default.
            if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
              echo "release notes: '$version' is not a version; skipping (no body)."
              exit 0
            fi
            producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
            if [ ! -f "$producer" ]; then
              echo "release notes: $producer not found (script-helpers checkout failed)" >&2
              exit 1
            fi
            bash "$producer" --version "$version" --repo "$GITHUB_WORKSPACE" --output "$notes_file"
          fi

          binary_base_url="${RN_BINARY_BASE_URL:-}"
          if [ -z "$binary_base_url" ] && [ -n "$release_tag" ]; then
            binary_base_url="https://github.com/${RN_REPOSITORY}/releases/download/${release_tag}"
          fi
          if [ -n "${RN_BINARY_LINKS:-}" ] && [ -n "$binary_base_url" ]; then
            {
              echo ""
              echo "## Download Binaries"
              echo ""
              echo "| Platform | Binary |"
              echo "|----------|--------|"
            } >> "$notes_file"
            while IFS= read -r line; do
              trimmed="${line#"${line%%[![:space:]]*}"}"
              [ -n "$trimmed" ] || continue
              label="${trimmed%%|*}"
              filename="${trimmed#*|}"
              if [ -z "$label" ] || [ -z "$filename" ] || [ "$label" = "$filename" ]; then
                continue
              fi
              printf "| %s | [%s](%s/%s) |\n" "$label" "$filename" "$binary_base_url" "$filename" >> "$notes_file"
            done <<< "$RN_BINARY_LINKS"
          fi

          # A single-line path only -- the body itself never passes through an
          # output, so no heredoc and no delimiter to collide with.
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      # What a release upload publishes for these patterns: regular files
      # only, no dotfiles, nothing under a matched directory, one asset per
      # basename; patterns split on newlines and commas, as the release
      # action did. Uploading the patterns as-is would also publish the
      # contents of subdirectories.
      - name: Stage release files
        id: stage
        if: ${{ inputs.artifact_paths != '' }}
        shell: bash
        env:
          PATTERNS: ${{ inputs.artifact_paths }}
        run: |
          set -euo pipefail
          # python3 can be a stub that only prints an error on Windows images.
          py=""
          for c in python3 python; do
            if command -v "$c" >/dev/null && "$c" -c 'import sys' 2>/dev/null; then py="$c"; break; fi
          done
          [ -n "$py" ] || { echo "::error::no working Python on this runner"; exit 1; }
          # Python builds the path, so it is native on Windows as well.
          "$py" - <<'PY'
          import glob, os, shutil, sys
          out = os.path.join(os.environ["RUNNER_TEMP"], "release-files")
          shutil.rmtree(out, ignore_errors=True)
          os.makedirs(out)
          seen = {}
          for line in os.environ["PATTERNS"].splitlines():
              for pat in line.split(","):
                  pat = pat.strip()
                  for f in sorted(glob.glob(pat, recursive=True)) if pat else []:
                      if not os.path.isfile(f):
                          continue
                      b = os.path.basename(f)
                      if b in seen and os.path.realpath(seen[b]) != os.path.realpath(f):
                          print(f"::error::{seen[b]} and {f} would both publish as {b}")
                          sys.exit(1)
                      seen[b] = f
                      shutil.copy2(f, os.path.join(out, b))
          print(f"{len(seen)} release file(s): {', '.join(sorted(seen))}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"dir={out}\ncount={len(seen)}\n")
          PY

      - name: Check publication files
        id: ci_publication_check_2
        if: ${{ (steps.stage.outputs.count != '' && steps.stage.outputs.count != '0') && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}-release-files
          mode: artifact
          paths: ${{ steps.stage.outputs.dir }}

      - name: Hand release files to the release job
        id: files
        if: ${{ (steps.stage.outputs.count != '' && steps.stage.outputs.count != '0') && steps.ci_publication_check_2.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}-release-files
          path: ${{ steps.ci_publication_check_2.outputs.paths }}
          if-no-files-found: error
          overwrite: true

      - name: Check publication files
        id: ci_publication_check_3
        if: ${{ (steps.notes.outputs.notes_file != '') && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            name: ${{ inputs.artifact_name }}-release-notes
          mode: artifact
          paths: ${{ steps.notes.outputs.notes_file }}

      - name: Hand release notes to the release job
        id: notes_up
        if: ${{ (steps.notes.outputs.notes_file != '') && steps.ci_publication_check_3.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.artifact_name }}-release-notes
          path: ${{ steps.ci_publication_check_3.outputs.paths }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ${{ inputs.release_runner }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard

      - name: Download release files
        if: ${{ needs.build.outputs.files_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          # By id: a same-named artifact from another call in this run
          # replaces this one, and a name would fetch that call's files.
          artifact-ids: ${{ needs.build.outputs.files_id }}
          path: release-files

      - name: Download release notes
        id: notes
        if: ${{ needs.build.outputs.notes_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          artifact-ids: ${{ needs.build.outputs.notes_id }}
          path: release-notes

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
            scripts
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if git rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$(git rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (needs.build.outputs.files_id != '') && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
            name: ${{ inputs.release_name }}
          mode: release
          paths: release-files/*
          body_path: ${{ steps.notes.outcome == 'success' && 'release-notes/release-notes.md' || '' }}

      - name: Create GitHub release (with files)
        if: ${{ (needs.build.outputs.files_id != '') && steps.ci_publication_check_1.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          # Empty: a new release is named after its tag and an existing one
          # keeps its name, as before.
          RELEASE_NAME: ${{ inputs.release_name }}
          BODY_PATH: ${{ steps.ci_publication_check_1.outputs.body_path }}
          FILES: ${{ steps.ci_publication_check_1.outputs.paths }}
          OVERWRITE_FILES: "true"
        run: bash .ci-helpers-publication/scripts/github_release.sh

      - name: Check publication files
        id: ci_publication_check_2
        if: ${{ (needs.build.outputs.files_id == '') && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
            name: ${{ inputs.release_name }}
          mode: release
          body_path: ${{ steps.notes.outcome == 'success' && 'release-notes/release-notes.md' || '' }}

      - name: Create GitHub release (no files)
        if: ${{ (needs.build.outputs.files_id == '') && steps.ci_publication_check_2.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref }}
          # Empty: a new release is named after its tag and an existing one
          # keeps its name, as before.
          RELEASE_NAME: ${{ inputs.release_name }}
          BODY_PATH: ${{ steps.ci_publication_check_2.outputs.body_path }}
          OVERWRITE_FILES: "true"
        run: bash .ci-helpers-publication/scripts/github_release.sh
