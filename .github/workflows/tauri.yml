name: preset-tauri
on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. 24.04 carries libwebkit2gtk-4.1, which is what Tauri v2 links; 22.04 was needed only by v1, which linked 4.0
        type: string
        default: ubuntu-24.04
      working_directory:
        description: Cargo workspace root (relative to repo root)
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      rust_toolchain:
        type: string
        default: "stable"
      rust_components:
        type: string
        default: ""
      apt_packages:
        description: Space-separated system packages required by Tauri on Linux
        type: string
        default: >-
          libwebkit2gtk-4.1-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libgtk-3-dev
          build-essential
          curl
          wget
          file
      node_version:
        description: Node.js version (empty = skip Node setup)
        type: string
        default: ""
      frontend_dir:
        description: Frontend directory relative to working_directory (empty = skip)
        type: string
        default: ""
      frontend_install_command:
        type: string
        default: "npm ci"
      frontend_build_command:
        description: Frontend build command (empty = skip)
        type: string
        default: ""
      lint_command:
        description: Lint command (empty = skip)
        type: string
        default: ""
      test_command:
        type: string
        default: "cargo test --verbose"
      build_command:
        type: string
        default: "cargo build --verbose"

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Install Tauri Linux system dependencies
        env:
          APT_PKGS: ${{ inputs.apt_packages }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # Normalize newlines/CRs to spaces so callers can pass either
          # space-separated or newline-separated package lists.
          _pkgs="${APT_PKGS//$'\r'}"
          read -r -a pkgs <<< "${_pkgs//$'\n'/ }"
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -- "${pkgs[@]}"
          fi

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers scripts commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is empty"; exit 1; }
          [[ "$(git -C .ci-helpers-scripts rev-parse HEAD)" == "$WF_SHA" ]] || { echo "::error::ci-helpers checkout is not $WF_SHA"; exit 1; }
          if git rev-parse --git-dir >/dev/null 2>&1; then
            printf '\n/.ci-helpers-scripts/\n' >> "$(git rev-parse --git-path info/exclude)"
          fi

      # The runner's rustup; a runner without one gets rustup-init pinned by
      # version and sha256 in the library's toolchain-pins.env.
      - name: Setup Rust
        id: rust
        shell: bash
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          RUST_COMPONENTS: ${{ inputs.rust_components }}
        run: bash .ci-helpers-scripts/scripts/setup_rust.sh

      # actions/cache keyed on runner OS and architecture, job, rustc, and a
      # hash of the cargo manifests and compiler environment; a lockfile change
      # restores the previous dependencies through the restore key.
      - name: Rust cache key
        id: rust_cache_key
        shell: bash
        env:
          CARGO_WORKSPACE: ${{ inputs.working_directory }}
          # Keyed on the runner label: both Ubuntu versions are `Linux` to the
          # cache, so a 22.04 target cache is an exact hit on 24.04 otherwise.
          CACHE_KEY_EXTRA: ${{ inputs.runner }}
          RUSTC_CACHEKEY: ${{ steps.rust.outputs.cachekey }}
        run: bash .ci-helpers-scripts/scripts/rust_cache_key.sh

      - name: Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 @ 2026-09-21
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ inputs.working_directory }}/target/
          key: ${{ steps.rust_cache_key.outputs.key }}
          restore-keys: ${{ steps.rust_cache_key.outputs.restore_key }}

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          FRONTEND_INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$FRONTEND_INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          FRONTEND_BUILD_CMD: ${{ inputs.frontend_build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$FRONTEND_BUILD_CMD"

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        env:
          LINT_CMD: ${{ inputs.lint_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$LINT_CMD"

      - name: Test
        if: ${{ inputs.test_command != '' }}
        env:
          TEST_CMD: ${{ inputs.test_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$TEST_CMD"

      - name: Build
        if: ${{ inputs.build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$BUILD_CMD"
