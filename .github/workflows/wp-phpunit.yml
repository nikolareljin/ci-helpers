name: preset-wp-phpunit
# WordPress plugin tests, against the WordPress test suite.
#
# `wp-plugin-check.yml` checks how a plugin is packaged. This runs its actual
# tests: a plugin's tests/bootstrap.php is written against the WordPress test
# library, which expects WP_TESTS_DIR to hold `includes/functions.php` and a
# `wp-tests-config.php` naming a real database.
#
# The provisioning lives in script-helpers' ci_wp_phpunit.sh, not here, so the
# same code runs in CI and on a laptop. It previously sat inline in this file,
# where a developer could not run it at all, and every plugin therefore kept
# its own bin/install-wp-tests.sh as well.
#
# The script also starts the database and removes it afterwards, so this does
# not go through ci.yml's db_image: one mechanism rather than two.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        # ubuntu-24.04 until the ondrej/php PPA ships a suite for ubuntu-latest
        # (26.04); scripts/check_php_runner.py holds PHP jobs to it.
        default: ubuntu-24.04
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      # false / true / recursive. Forwarded to checkout; a typo is refused by
      # the action rather than read as false.
      submodules:
        type: string
        default: "false"
      php_version:
        type: string
        default: "8.3"
      # A full X.Y.Z, a minor like "7.1" which resolves to its newest patch, or
      # "latest". wordpress-develop tags are always X.Y.Z, so a bare minor is
      # resolved by the script rather than requested as a tag and 404ing.
      wp_version:
        type: string
        default: "latest"
      wp_multisite:
        type: string
        default: "0"
      wp_tests_dir:
        type: string
        default: "/tmp/wordpress-tests-lib"
      wp_core_dir:
        type: string
        default: "/tmp/wordpress"
      install_command:
        type: string
        default: "composer install --no-interaction --prefer-dist"
      lint_command:
        type: string
        default: ""
      # The tests themselves. Replace it to run pest, a subset, or a different
      # configuration; it runs with WP_TESTS_DIR already exported.
      test_command:
        type: string
        default: "./vendor/bin/phpunit"
      build_command:
        type: string
        default: ""
      # Anything else this plugin verifies, run after the tests. Threaded
      # through so a caller adds checks without forking this workflow.
      extra_command:
        type: string
        default: ""
      db_image:
        type: string
        default: "mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b"
      db_database:
        type: string
        default: "wordpress_test"
      db_username:
        type: string
        default: "wordpress"
      db_password:
        type: string
        default: "wordpress"
      db_port:
        type: string
        default: "3306"
      db_wait_seconds:
        type: number
        default: 60
      # Applied as the job timeout. Without one a hung job bills until
      # GitHub's six-hour default (#132).
      timeout_minutes:
        type: number
        default: 20

jobs:
  wp-phpunit:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.submodules }}

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 522db8f9e07bd09ae038db330fe2331923e20500 # 0.64.0
          path: .script-helpers
          fetch-depth: 1

      # actions/checkout refuses a path outside the workspace, and the
      # workspace holds the plugin. A checkout of that library sitting in the
      # tree under test is not part of the plugin, so it is moved before
      # anything reads the directory. See wp-plugin-check.yml, where leaving it
      # produced 146 findings against someone else's plugin.
      - name: Move script-helpers out of the plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/script-helpers"
          mv .script-helpers "${{ runner.temp }}/script-helpers"

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # PHP from apt: the image's own packages, else the ondrej/php PPA under
      # the key fingerprint pinned in the library's toolchain-pins.env; Xdebug
      # for coverage as the replaced action enabled it; Composer at the
      # release pinned there, installed after its sha256 matches.
      - name: Setup PHP
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PHP_VERSION: ${{ inputs.php_version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" PHP_VERSION="$PHP_VERSION" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_php.sh"
          CI_HELPERS_RUN
          )"

      - name: Install dependencies
        if: ${{ inputs.install_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.install_command }}

      - name: Lint
        if: ${{ inputs.lint_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_command }}

      - name: Build
        if: ${{ inputs.build_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.build_command }}

      # The script provisions the WordPress test library and core, starts the
      # database, runs the tests and removes the database afterwards. The tests
      # run on the runner's PHP, set up above, rather than in a container, so
      # --php-image is deliberately not passed.
      - name: WordPress tests
        shell: bash
        # Values as environment, not interpolated into the command line. A
        # password holding a quote would otherwise break the quoting or run as
        # code -- the same lesson laravel.yml records for its DB connection,
        # and the one this preset's provisioning had to learn.
        env:
          WP_VERSION: ${{ inputs.wp_version }}
          WP_TESTS_DIR_IN: ${{ inputs.wp_tests_dir }}
          WP_CORE_DIR_IN: ${{ inputs.wp_core_dir }}
          WP_MULTISITE_IN: ${{ inputs.wp_multisite }}
          DB_IMAGE: ${{ inputs.db_image }}
          DB_NAME: ${{ inputs.db_database }}
          DB_USER: ${{ inputs.db_username }}
          DB_PASSWORD: ${{ inputs.db_password }}
          DB_PORT: ${{ inputs.db_port }}
          DB_WAIT: ${{ inputs.db_wait_seconds }}
          WORKDIR: ${{ inputs.working_directory }}
          TEST_COMMAND: ${{ inputs.test_command }}
          HELPER: ${{ runner.temp }}/script-helpers/scripts/ci_wp_phpunit.sh
        run: |
          set -euo pipefail
          "$HELPER" \
            --wp-version "$WP_VERSION" \
            --wp-tests-dir "$WP_TESTS_DIR_IN" \
            --wp-core-dir "$WP_CORE_DIR_IN" \
            --multisite "$WP_MULTISITE_IN" \
            --db-image "$DB_IMAGE" \
            --db-name "$DB_NAME" \
            --db-user "$DB_USER" \
            --db-password "$DB_PASSWORD" \
            --db-port "$DB_PORT" \
            --db-wait-seconds "$DB_WAIT" \
            --workdir "$WORKDIR" \
            --test-command "$TEST_COMMAND"

      - name: Extra checks
        if: ${{ inputs.extra_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.extra_command }}

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
