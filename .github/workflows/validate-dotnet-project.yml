name: validate-dotnet-project

# Refuse a project/solution path that could change the meaning of the command it
# is placed into, or be read by dotnet as a flag.
#
# This is a reusable workflow rather than a composite action on purpose. A
# relative `uses: ./.github/workflows/...` resolves to THIS repository at the
# same commit as the caller, so a cross-repo consumer gets the version matching
# the preset that called it. A relative *action* path would instead resolve
# against the consumer's own checkout, where this file does not exist, and an
# absolute `@production` reference cannot work for a check that does not exist
# at `production` yet.
#
# One definition, used by csharp.yml and csharp-scan.yml. It began as two
# copies, and csharp-scan.yml had already drifted to having no check at all --
# a leading dash reached dotnet there while csharp.yml refused it.
#
# What it is NOT: a security boundary. The same caller already supplies
# lint_command, test_command, build_command and four more, every one of which
# reaches a shell by contract. This exists so a value that reads as a path
# behaves like one, and so a mistake produces a legible error instead of a
# confusing one from dotnet.

on:
  workflow_call:
    inputs:
      project:
        description: The project or solution path to check. Empty is allowed.
        type: string
        default: ""
      runner:
        description: >
          Deliberately not defaulted from the caller's runner. The whole job is
          one grep; billing a macOS (10x) or Windows (2x) minute for it on every
          run is a cost the caller did not ask for.
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    steps:
      - name: Check the project path
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail

          if [ -z "$PROJECT" ]; then
            echo "project is empty; dotnet will pick, which needs exactly one project or solution in the directory."
            exit 0
          fi

          # A leading dash is refused separately from the charset: dotnet reads
          # it as an option, and quoting the argument does not prevent that.
          case "$PROJECT" in
            -*)
              echo "::error::project '$PROJECT' may not start with '-'; dotnet would read it as a flag, and quoting does not prevent that." >&2
              exit 1
              ;;
          esac

          # A leading or trailing space passes the charset below and then fails
          # inside dotnet as "could not find file" -- the confusing failure this
          # guard exists to pre-empt.
          case "$PROJECT" in
            " "*|*" ")
              echo "::error::project '$PROJECT' has a leading or trailing space; dotnet would report the file as missing." >&2
              exit 1
              ;;
          esac

          # Letters, digits, dot, underscore, slash, dash and space. Spaces are
          # allowed because Windows project paths have them, and every use site
          # quotes the value. Everything that could terminate or extend a
          # command is refused.
          if ! printf '%s' "$PROJECT" | grep -qE '^[A-Za-z0-9._/][A-Za-z0-9._/ -]*$'; then
            echo "::error::project '$PROJECT' contains characters not allowed here. Use letters, digits, dot, underscore, slash, dash and space." >&2
            exit 1
          fi

          echo "project '$PROJECT' accepted."
