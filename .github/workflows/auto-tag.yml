name: auto-tag

# Tag-only version of the release automation: on a push to the default branch
# that is a merged `release/X.Y.Z` PR, create+push the version tag and (optionally)
# move the floating `production` tag.
#
# Least privilege: this workflow needs only `contents: write` + `pull-requests: read`.
# Unlike `auto-tag-release.yml`, it does NOT dispatch a follow-up workflow, so callers
# do NOT need to grant `actions: write`. If you need the auto-dispatch feature, use
# `auto-tag-release.yml` (which reuses this workflow and adds the dispatch job).

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      fetch_depth:
        type: number
        default: 0
      default_branch:
        type: string
        default: ""
      update_production_tag:
        description: >
          Whether to run the production job after tagging. Moving a
          floating production ref is a thing a repository
          opts into, so this defaults to false: tagging is what calling this
          workflow buys you, and nothing else happens unless you ask.

          Set it to true in a repository that carries a floating production
          tag. The job runs this library's scripts/create_production.sh from
          a verified copy; a copy in the calling repository is not run.
        type: boolean
        default: false
    outputs:
      version:
        description: >
          Release version detected from the merged release/X.Y.Z PR (empty when
          the push was not a release/* merge). Exposed so callers can gate
          follow-up jobs — e.g. creating the GitHub Release or moving a
          production branch — on `needs.<caller-job-id>.outputs.version`, where
          `<caller-job-id>` is the caller's own job that `uses:` this workflow.
        value: ${{ jobs.tag.outputs.version }}
      is_prerelease:
        description: >
          "true" when the detected version carries a pre-release suffix
          (X.Y.Z-rcN), "false" otherwise, and "false" when no release was
          detected. Exposed so a caller gating a follow-up job — publishing a
          GitHub Release, deploying — can tell a candidate from a final release
          without re-deriving the rule from the version string.
        value: ${{ jobs.tag.outputs.is_prerelease }}

permissions:
  contents: write
  pull-requests: read

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Detect release version
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 @ 2026-09-10
        env:
          INPUT_DEFAULT_BRANCH: ${{ inputs.default_branch }}
        with:
          script: |
            const sha = context.sha;
            const refName = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const inputDefault = process.env.INPUT_DEFAULT_BRANCH || '';
            const payloadDefault = context.payload?.repository?.default_branch || '';
            const defaultBranch = inputDefault || payloadDefault || 'main';
            const releaseHeadPattern = /^release\/v?(\d+\.\d+\.\d+(?:-rc\.?\d+)?)$/;
            const mergeMessagePattern = /^Merge pull request #(\d+) from (?:.+\/)?release\/v?(\d+\.\d+\.\d+(?:-rc\.?\d+)?)$/;
            // A fork can name its branch release/X.Y.Z too. Only a release
            // branch that lives in this repository counts; a merged fork PR
            // must never create a tag or move production.
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            const fromThisRepo = (pr) => {
              const headRepo = String(pr?.head?.repo?.full_name || '').toLowerCase();
              if (headRepo === thisRepo) {
                return true;
              }
              core.info(
                `PR #${pr?.number} head ${pr?.head?.ref} comes from ${headRepo || 'a deleted repository'}, ` +
                `not ${owner}/${repo}. Not treating it as a release.`
              );
              return false;
            };

            if (refName !== defaultBranch) {
              core.info(`Push landed on ${refName}; default branch is ${defaultBranch}. Skipping.`);
              core.setOutput('version', '');
              return;
            }

            let version = '';
            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

              const merged = prs.data.find(
                (pr) =>
                  pr.merged_at &&
                  pr.base.ref === defaultBranch &&
                  pr.merge_commit_sha === sha
              );
              if (merged) {
                const match = String(merged.head.ref || '').match(releaseHeadPattern);
                if (match && fromThisRepo(merged)) {
                  version = match[1];
                  core.info(`Resolved release version ${version} from PR #${merged.number}.`);
                }
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              const status = typeof error === 'object' && error !== null && 'status' in error
                ? Number(error.status)
                : NaN;
              const isPermissionOrMissing = status === 403 || status === 404;
              const isTransient = status === 429 || status >= 500;
              if (!isPermissionOrMissing && !isTransient) {
                throw error;
              }
              core.warning(
                `Unable to list pull requests associated with ${sha}. Falling back to merge-commit subject parsing, ` +
                `but final PR-based validation in this workflow also requires pull-requests: read; without it, tagging will be skipped. ` +
                `Details: ${message}`
              );
            }

            if (!version) {
              try {
                const commit = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                const message = String(commit.data.commit.message || '');
                const subject = message.split(/\r?\n/, 1)[0] || '';

                // Fallback 1: standard merge commit subject
                const stdMatch = subject.match(mergeMessagePattern);
                if (stdMatch) {
                  const prNumber = Number(stdMatch[1]);
                  const fallbackVersion = stdMatch[2];
                  try {
                    const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                    const prData = pr.data;
                    const headMatch = String(prData.head?.ref || '').match(releaseHeadPattern);
                    if (
                      prData.merged_at &&
                      prData.base?.ref === defaultBranch &&
                      prData.merge_commit_sha === sha &&
                      headMatch &&
                      headMatch[1] === fallbackVersion &&
                      fromThisRepo(prData)
                    ) {
                      version = fallbackVersion;
                      core.info(`Resolved release version ${version} from validated merge commit message fallback for PR #${prNumber}.`);
                    } else {
                      core.warning(`Merge commit message referenced PR #${prNumber}, but it did not validate against ${sha}.`);
                    }
                  } catch (error) {
                    const detail = error instanceof Error ? error.message : String(error);
                    core.warning(`Merge commit message referenced PR #${prNumber}, but the PR could not be validated: ${detail}`);
                  }
                }

                // Fallback 2: squash merge subject ends with "(#N)".
                // Uses pulls.get directly (not the eventually-consistent association index)
                // so merge_commit_sha is available immediately after the merge.
                if (!version) {
                  const squashMatch = subject.match(/\(#(\d+)\)$/);
                  if (squashMatch) {
                    const prNumber = Number(squashMatch[1]);
                    try {
                      const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                      const prData = pr.data;
                      const headMatch = String(prData.head?.ref || '').match(releaseHeadPattern);
                      if (
                        prData.merged_at &&
                        prData.base?.ref === defaultBranch &&
                        prData.merge_commit_sha === sha &&
                        headMatch
                      ) {
                        if (fromThisRepo(prData)) {
                          version = headMatch[1];
                          core.info(`Resolved release version ${version} from squash-merge fallback for PR #${prNumber}.`);
                        }
                      } else if (prData.merged_at && prData.base?.ref === defaultBranch && headMatch && fromThisRepo(prData)) {
                        core.warning(
                          `PR #${prNumber} is a release/* squash-merge but merge_commit_sha does not match push SHA yet. ` +
                          `Re-run this workflow to retry.`
                        );
                      }
                    } catch (error) {
                      const detail = error instanceof Error ? error.message : String(error);
                      core.warning(`Squash-merge fallback: could not validate PR #${prNumber}: ${detail}`);
                    }
                  }
                }
              } catch (error) {
                const detail = error instanceof Error ? error.message : String(error);
                core.info(
                  `Unable to fetch commit ${sha} or parse its message for release tagging fallback. ` +
                  `Skipping merge-commit subject based version resolution. Details: ${detail}`
                );
              }
            }

            if (!version) {
              core.info('No release/* merge detected for this push.');
            }

            // The accepted versions are X.Y.Z and X.Y.Z-rcN / X.Y.Z-rc.N, so a
            // hyphen is exactly the pre-release marker. Decided here rather
            // than by string-matching in a step condition, so the rule has one
            // definition and shows up in the log.
            const isPrerelease = version.includes('-');
            if (isPrerelease) {
              core.info(`${version} is a release candidate; production will not be moved.`);
            }

            core.setOutput('version', version);
            core.setOutput('is_prerelease', isPrerelease ? 'true' : 'false');

      - name: Check tag availability
        if: ${{ steps.release.outputs.version != '' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$AUTO_TAG_VERSION"
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists."
            exit 1
          fi

      - name: Create and push tag
        if: ${{ steps.release.outputs.version != '' }}
        shell: bash
        env:
          GIT_TOKEN: ${{ github.token }}
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          # Appended after the publication guard's core.hooksPath entry, never over it.
          gc_n="${GIT_CONFIG_COUNT:-0}"; [[ "$gc_n" =~ ^[0-9]+$ ]] || { echo "::error::GIT_CONFIG_COUNT is not a number."; exit 1; }
          export GIT_CONFIG_COUNT="$((gc_n + 1))" "GIT_CONFIG_KEY_${gc_n}=http.${GITHUB_SERVER_URL}/.extraheader" "GIT_CONFIG_VALUE_${gc_n}=AUTHORIZATION: basic ${auth}"
          version="$AUTO_TAG_VERSION"
          git tag "$version"
          git push origin "$version"

      # No update_production_tag condition: this is informational, and the
      # caller most in need of it is the one taking the default (false), who
      # would otherwise see a candidate tagged with nothing said about
      # production at all.
      - name: Note that the candidate left production alone
        if: >-
          ${{ steps.release.outputs.version != ''
              && steps.release.outputs.is_prerelease == 'true' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::Tagged ${AUTO_TAG_VERSION}. production was not moved: it advances only for a final X.Y.Z. Exercise this candidate on a pilot consumer, then promote it by cutting release/${AUTO_TAG_VERSION%%-*}."

  # `production` moves only for a final X.Y.Z. A candidate is tagged so it
  # can be exercised by a pilot consumer, and `production` stays where it
  # is until the candidate is promoted by cutting release/X.Y.Z. This is a
  # rule, not an option: a candidate that moved `production` would be live
  # the instant it was merged, which is the opposite of cutting one.
  #
  # A job of its own so it can share one concurrency group with every other
  # workflow that moves production. On the tag job the group would also queue
  # ordinary pushes, and a third queued run cancels the pending one, which
  # could drop a release tag. create_production.sh refuses an older version,
  # so the order the queue runs in cannot leave production behind.
  production:
    needs: tag
    if: >-
      ${{ needs.tag.outputs.version != ''
          && inputs.update_production_tag
          && needs.tag.outputs.is_prerelease != 'true' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: ci-helpers-production-move-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The library's own create_production.sh, from a verified copy: the
      # caller's scripts/ never runs in the job that holds the push token.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      - name: Update production tag ref
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PUSH_TOKEN: ${{ github.token }}
          # The publication guard's core.hooksPath entry, for the clean environment.
          GUARD_COUNT: ${{ env.GIT_CONFIG_COUNT }}
          GUARD_KEY: ${{ env.GIT_CONFIG_KEY_0 }}
          GUARD_HOOKS: ${{ env.GIT_CONFIG_VALUE_0 }}
          AUTO_TAG_VERSION: ${{ needs.tag.outputs.version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH PUSH_TOKEN AUTO_TAG_VERSION GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_SERVER_URL GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI GUARD_COUNT GUARD_KEY GUARD_HOOKS GITLEAKS_BIN' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          # The version came from the tag job's parse of a release/X.Y.Z branch;
          # check it again before it reaches git.
          [[ "$AUTO_TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version '$AUTO_TAG_VERSION' is not X.Y.Z."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          # The publication guard's hooks, by name: git config does not cross env -i.
          [[ "$GUARD_COUNT" == 1 && "$GUARD_KEY" == core.hooksPath && "$GUARD_HOOKS" == "$RUNNER_TEMP"/publication-hooks-*/hooks && "$GUARD_HOOKS" != *..* && -f "$GUARD_HOOKS/pre-push" && -x "$GITLEAKS_BIN" ]] || { echo "::error::the outbound guard is not configured; nothing is pushed."; exit 1; }
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0="$GUARD_HOOKS" GITLEAKS_BIN
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | /usr/bin/base64 | /usr/bin/tr -d '\n')"
          echo "::add-mask::${auth}"
          # Appended after the publication guard's core.hooksPath entry, never over it.
          gc_n="${GIT_CONFIG_COUNT:-0}"; [[ "$gc_n" =~ ^[0-9]+$ ]] || { echo "::error::GIT_CONFIG_COUNT is not a number."; exit 1; }
          export GIT_CONFIG_COUNT="$((gc_n + 1))" "GIT_CONFIG_KEY_${gc_n}=http.${GITHUB_SERVER_URL}/.extraheader" "GIT_CONFIG_VALUE_${gc_n}=AUTHORIZATION: basic ${auth}"
          /bin/bash "$run_lib/scripts/create_production.sh" -t "$AUTO_TAG_VERSION" --repo "$GITHUB_WORKSPACE" --fetch-tags
          CI_HELPERS_RUN
          )"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
