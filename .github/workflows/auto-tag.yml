name: auto-tag

# Tag-only version of the release automation: on a push to the default branch
# that is a merged `release/X.Y.Z` PR, create+push the version tag and (optionally)
# move the floating `production` tag.
#
# Least privilege: this workflow needs only `contents: write` + `pull-requests: read`.
# Unlike `auto-tag-release.yml`, it does NOT dispatch a follow-up workflow, so callers
# do NOT need to grant `actions: write`. If you need the auto-dispatch feature, use
# `auto-tag-release.yml` (which reuses this workflow and adds the dispatch job).

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      fetch_depth:
        type: number
        default: 0
      default_branch:
        type: string
        default: ""
      update_production_tag:
        description: >
          Whether to run the Bootstrap and Update production tag steps after
          tagging. Moving a floating production ref is a thing a repository
          opts into, so this defaults to false: tagging is what calling this
          workflow buys you, and nothing else happens unless you ask.

          Set it to true in a repository that carries a floating production
          tag AND ships scripts/create_production.sh, which the step runs.
          Without that script the step cannot succeed, so a true here is a
          claim about the repository's contents, not a preference.
        type: boolean
        default: false
    outputs:
      version:
        description: >
          Release version detected from the merged release/X.Y.Z PR (empty when
          the push was not a release/* merge). Exposed so callers can gate
          follow-up jobs — e.g. creating the GitHub Release or moving a
          production branch — on `needs.<caller-job-id>.outputs.version`, where
          `<caller-job-id>` is the caller's own job that `uses:` this workflow.
        value: ${{ jobs.tag.outputs.version }}
      is_prerelease:
        description: >
          "true" when the detected version carries a pre-release suffix
          (X.Y.Z-rcN), "false" otherwise, and "false" when no release was
          detected. Exposed so a caller gating a follow-up job — publishing a
          GitHub Release, deploying — can tell a candidate from a final release
          without re-deriving the rule from the version string.
        value: ${{ jobs.tag.outputs.is_prerelease }}

permissions:
  contents: write
  pull-requests: read

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Detect release version
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 @ 2026-09-10
        env:
          INPUT_DEFAULT_BRANCH: ${{ inputs.default_branch }}
        with:
          script: |
            const sha = context.sha;
            const refName = context.ref.replace('refs/heads/', '');
            const { owner, repo } = context.repo;
            const inputDefault = process.env.INPUT_DEFAULT_BRANCH || '';
            const payloadDefault = context.payload?.repository?.default_branch || '';
            const defaultBranch = inputDefault || payloadDefault || 'main';
            const releaseHeadPattern = /^release\/v?(\d+\.\d+\.\d+(?:-rc\.?\d+)?)$/;
            const mergeMessagePattern = /^Merge pull request #(\d+) from (?:.+\/)?release\/v?(\d+\.\d+\.\d+(?:-rc\.?\d+)?)$/;
            // A fork can name its branch release/X.Y.Z too. Only a release
            // branch that lives in this repository counts; a merged fork PR
            // must never create a tag or move production.
            const thisRepo = `${owner}/${repo}`.toLowerCase();
            const fromThisRepo = (pr) => {
              const headRepo = String(pr?.head?.repo?.full_name || '').toLowerCase();
              if (headRepo === thisRepo) {
                return true;
              }
              core.info(
                `PR #${pr?.number} head ${pr?.head?.ref} comes from ${headRepo || 'a deleted repository'}, ` +
                `not ${owner}/${repo}. Not treating it as a release.`
              );
              return false;
            };

            if (refName !== defaultBranch) {
              core.info(`Push landed on ${refName}; default branch is ${defaultBranch}. Skipping.`);
              core.setOutput('version', '');
              return;
            }

            let version = '';
            try {
              const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });

              const merged = prs.data.find(
                (pr) =>
                  pr.merged_at &&
                  pr.base.ref === defaultBranch &&
                  pr.merge_commit_sha === sha
              );
              if (merged) {
                const match = String(merged.head.ref || '').match(releaseHeadPattern);
                if (match && fromThisRepo(merged)) {
                  version = match[1];
                  core.info(`Resolved release version ${version} from PR #${merged.number}.`);
                }
              }
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              const status = typeof error === 'object' && error !== null && 'status' in error
                ? Number(error.status)
                : NaN;
              const isPermissionOrMissing = status === 403 || status === 404;
              const isTransient = status === 429 || status >= 500;
              if (!isPermissionOrMissing && !isTransient) {
                throw error;
              }
              core.warning(
                `Unable to list pull requests associated with ${sha}. Falling back to merge-commit subject parsing, ` +
                `but final PR-based validation in this workflow also requires pull-requests: read; without it, tagging will be skipped. ` +
                `Details: ${message}`
              );
            }

            if (!version) {
              try {
                const commit = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                const message = String(commit.data.commit.message || '');
                const subject = message.split(/\r?\n/, 1)[0] || '';

                // Fallback 1: standard merge commit subject
                const stdMatch = subject.match(mergeMessagePattern);
                if (stdMatch) {
                  const prNumber = Number(stdMatch[1]);
                  const fallbackVersion = stdMatch[2];
                  try {
                    const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                    const prData = pr.data;
                    const headMatch = String(prData.head?.ref || '').match(releaseHeadPattern);
                    if (
                      prData.merged_at &&
                      prData.base?.ref === defaultBranch &&
                      prData.merge_commit_sha === sha &&
                      headMatch &&
                      headMatch[1] === fallbackVersion &&
                      fromThisRepo(prData)
                    ) {
                      version = fallbackVersion;
                      core.info(`Resolved release version ${version} from validated merge commit message fallback for PR #${prNumber}.`);
                    } else {
                      core.warning(`Merge commit message referenced PR #${prNumber}, but it did not validate against ${sha}.`);
                    }
                  } catch (error) {
                    const detail = error instanceof Error ? error.message : String(error);
                    core.warning(`Merge commit message referenced PR #${prNumber}, but the PR could not be validated: ${detail}`);
                  }
                }

                // Fallback 2: squash merge subject ends with "(#N)".
                // Uses pulls.get directly (not the eventually-consistent association index)
                // so merge_commit_sha is available immediately after the merge.
                if (!version) {
                  const squashMatch = subject.match(/\(#(\d+)\)$/);
                  if (squashMatch) {
                    const prNumber = Number(squashMatch[1]);
                    try {
                      const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                      const prData = pr.data;
                      const headMatch = String(prData.head?.ref || '').match(releaseHeadPattern);
                      if (
                        prData.merged_at &&
                        prData.base?.ref === defaultBranch &&
                        prData.merge_commit_sha === sha &&
                        headMatch
                      ) {
                        if (fromThisRepo(prData)) {
                          version = headMatch[1];
                          core.info(`Resolved release version ${version} from squash-merge fallback for PR #${prNumber}.`);
                        }
                      } else if (prData.merged_at && prData.base?.ref === defaultBranch && headMatch && fromThisRepo(prData)) {
                        core.warning(
                          `PR #${prNumber} is a release/* squash-merge but merge_commit_sha does not match push SHA yet. ` +
                          `Re-run this workflow to retry.`
                        );
                      }
                    } catch (error) {
                      const detail = error instanceof Error ? error.message : String(error);
                      core.warning(`Squash-merge fallback: could not validate PR #${prNumber}: ${detail}`);
                    }
                  }
                }
              } catch (error) {
                const detail = error instanceof Error ? error.message : String(error);
                core.info(
                  `Unable to fetch commit ${sha} or parse its message for release tagging fallback. ` +
                  `Skipping merge-commit subject based version resolution. Details: ${detail}`
                );
              }
            }

            if (!version) {
              core.info('No release/* merge detected for this push.');
            }

            // The accepted versions are X.Y.Z and X.Y.Z-rcN / X.Y.Z-rc.N, so a
            // hyphen is exactly the pre-release marker. Decided here rather
            // than by string-matching in a step condition, so the rule has one
            // definition and shows up in the log.
            const isPrerelease = version.includes('-');
            if (isPrerelease) {
              core.info(`${version} is a release candidate; production will not be moved.`);
            }

            core.setOutput('version', version);
            core.setOutput('is_prerelease', isPrerelease ? 'true' : 'false');

      # Bootstrapping only exists to make create_production.sh runnable, so it
      # is gated exactly like the move it serves: it used to run on `if:
      # inputs.update_production_tag` alone, which meant initialising
      # submodules on every push to the default branch in a repository that
      # opts in, including the overwhelming majority that are not releases.
      #
      # It sits BEFORE the tag is created, deliberately. Its checks decide
      # whether the production move can succeed at all, and discovering that
      # after the tag has been pushed leaves a tag behind that someone has to
      # delete by hand -- which is the failure this guard exists to prevent,
      # so running it later would defeat the point of having it.
      #
      # It is NOT gated on is_prerelease, also deliberately. Whether this
      # repository can move production is a fact about the repository, not
      # about which kind of release this is. Gated on the release kind, a repo
      # could cut rc1..rc5 green and only discover a missing script on the
      # final cut -- the one moment where a stray tag costs the most.
      - name: Bootstrap script-helpers
        if: >-
          ${{ steps.release.outputs.version != ''
              && inputs.update_production_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive || true
          if [[ -d "scripts/script-helpers" && ! -e "vendor/script-helpers" ]]; then
            mkdir -p vendor
            ln -sfn ../scripts/script-helpers vendor/script-helpers
          fi
          if [[ ! -e "vendor/script-helpers" ]]; then
            echo "::error::vendor/script-helpers not found; ensure script-helpers is vendored or initialized."
            exit 1
          fi
          # update_production_tag: true asserts this repository can move a
          # production ref, and the move runs ./scripts/create_production.sh.
          # Check that here rather than let the run tag a release and then die
          # at the last step, which is what used to happen. Both conditions are
          # checked: the script is invoked as ./scripts/create_production.sh,
          # so a present-but-non-executable file fails just as surely as a
          # missing one, and says something different about what to fix.
          if [[ ! -f "scripts/create_production.sh" ]]; then
            echo "::error::update_production_tag is true but scripts/create_production.sh is missing. Either add that script, or pass update_production_tag: false to tag only."
            exit 1
          fi
          if [[ ! -x "scripts/create_production.sh" ]]; then
            echo "::error::scripts/create_production.sh is not executable. Run: chmod +x scripts/create_production.sh && git update-index --chmod=+x scripts/create_production.sh"
            exit 1
          fi

      - name: Check tag availability
        if: ${{ steps.release.outputs.version != '' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$AUTO_TAG_VERSION"
          if git rev-parse "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists."
            exit 1
          fi

      - name: Create and push tag
        if: ${{ steps.release.outputs.version != '' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$AUTO_TAG_VERSION"
          git tag "$version"
          git push origin "$version"

      # `production` moves only for a final X.Y.Z. A candidate is tagged so it
      # can be exercised by a pilot consumer, and `production` stays where it
      # is until the candidate is promoted by cutting release/X.Y.Z. This is a
      # rule, not an option: a candidate that moved `production` would be live
      # the instant it was merged, which is the opposite of cutting one.
      - name: Update production tag ref
        if: >-
          ${{ steps.release.outputs.version != ''
              && inputs.update_production_tag
              && steps.release.outputs.is_prerelease != 'true' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          version="$AUTO_TAG_VERSION"
          ./scripts/create_production.sh -t "$version" --fetch-tags

      # No update_production_tag condition: this is informational, and the
      # caller most in need of it is the one taking the default (false), who
      # would otherwise see a candidate tagged with nothing said about
      # production at all.
      - name: Note that the candidate left production alone
        if: >-
          ${{ steps.release.outputs.version != ''
              && steps.release.outputs.is_prerelease == 'true' }}
        shell: bash
        env:
          AUTO_TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          echo "::notice::Tagged ${AUTO_TAG_VERSION}. production was not moved: it advances only for a final X.Y.Z. Exercise this candidate on a pilot consumer, then promote it by cutting release/${AUTO_TAG_VERSION%%-*}."
