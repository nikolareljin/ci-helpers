name: preset-pages
#
# Stack-agnostic GitHub Pages publisher: build a static site with whatever
# generator the repository uses, then deploy it.
#
# pnpm-pages.yml stays as it is — it carries pnpm-workspace and Playwright
# capture behaviour that does not generalise. This preset covers everything
# else: MkDocs, Sphinx, Hugo, Astro, a plain `cp -r`, anything that writes a
# directory of files.
#
# The caller must grant `pages: write` and `id-token: write` even on runs where
# `deploy` is false. GitHub validates a reusable workflow's declared permissions
# when the run starts, before any job-level `if:` is evaluated, so a caller that
# grants less fails the whole run with `startup_failure` rather than skipping
# the deploy job.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      concurrency_key:
        type: string
        default: ""
        description: >
          Separates deployments that must not queue behind each other — a
          preview site and a production site in the same repository, say.
          Defaults to github.ref, which serialises every deployment to a given
          ref. Pages hosts one site per repository, so serialising is the safe
          default: two deploys racing decide the published content by whichever
          finishes last.
      fetch_depth:
        type: number
        default: 0
        description: >
          0 keeps full history, which generators that read git dates or tags
          need (mkdocs-git-revision-date, Hugo .Lastmod). Set 1 when nothing
          reads history.
      python_version:
        type: string
        default: ""
        description: Set to install Python before building.
      node_version:
        type: string
        default: ""
        description: Set to install Node before building.
      requirements_file:
        type: string
        default: ""
        description: >
          Path to a pip requirements file, relative to working_directory. When
          set and install_command is empty, it is installed for you and used as
          the pip cache key.
      install_command:
        type: string
        default: ""
        description: Overrides the requirements_file install when set.
      build_command:
        type: string
        default: ""
        description: >
          The command that writes the site into pages_path. Leave empty to
          publish a directory that is already in the repository — a plain
          HTML site needs no toolchain and no placeholder command. Whether or
          not anything is built, the site must exist and be non-empty before
          it is uploaded.
      pages_path:
        type: string
        default: "site"
        description: Directory uploaded to Pages, relative to working_directory.
      deploy:
        type: boolean
        default: true
        description: >
          Set false to build without publishing. To validate a site on every
          pull request and publish only from the default branch, pass an
          expression on github.event_name — docs/presets.md has the complete
          example. The expression delimiters cannot be written in this
          description: GitHub evaluates expressions in an input description, no
          context is available there, and the workflow fails to start.
      require_entry_file:
        type: boolean
        default: true
        description: >
          Fail when pages_path has no index.html or index.htm at its root. A
          site without one deploys successfully and then serves 404 at its own
          address, which is the same "green but useless" outcome the emptiness
          check exists to prevent. Set false for the rarer case of publishing
          assets that are only ever linked to directly.
      artifact_retention_days:
        type: number
        default: 1
        description: >
          How long the Pages artifact is kept. One day by default: the artifact
          exists to hand the site to the deploy job, and keeping build output
          beyond that stores content nobody reads.
      timeout_minutes:
        type: number
        default: 20

# Serialise Pages deployments so an older run cannot overwrite a newer one when
# two pushes arrive close together. cancel-in-progress stays false: a
# half-finished deployment is worse than a queued one.
#
# The group is namespaced with `ci-helpers-pages-` on purpose. A called
# workflow's concurrency group is evaluated alongside the caller's, so a caller
# that sets a bare `pages-<ref>` group of its own — the obvious name, and the
# one most hand-rolled Pages workflows already use — would leave these jobs
# queued behind the very run that started them. The prefix makes that collision
# impossible to hit by accident.
#
# github.workflow is deliberately *not* in the key: Pages hosts one site per
# repository, so two different caller workflows must serialise against each
# other rather than race to publish. Use concurrency_key when they genuinely
# publish different things.
concurrency:
  group: ci-helpers-pages-${{ inputs.concurrency_key || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      # Configure Pages reads the repository's Pages configuration.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # build_command may legitimately be empty — a repository can publish a
      # directory it already contains. An empty pages_path cannot: it would
      # upload the whole checkout, including .git.
      - name: Validate inputs
        shell: bash
        env:
          PAGES_PATH: ${{ inputs.pages_path }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          case "${PAGES_PATH}" in
            "")
              echo "::error::pages_path must not be empty"; exit 1 ;;
            "." | "./")
              # Uploading the checkout root publishes .git — the entire history,
              # downloadable from the site. Point at a subdirectory instead.
              echo "::error::pages_path must not be the checkout root: that publishes .git and .github. Build or copy the site into a subdirectory"
              exit 1 ;;
            /*)
              # working_directory/pages_path is what gets uploaded, so an
              # absolute path produces a nonsense join and escapes the checkout.
              echo "::error::pages_path must be relative to working_directory, not an absolute path"
              exit 1 ;;
            ".." | "../"* | *"/../"* | *"/..")
              echo "::error::pages_path must not climb above working_directory"
              exit 1 ;;
          esac
          # Checked here rather than left to the first step that uses it: a
          # working-directory that does not exist fails several steps later with
          # a message about whichever command happened to run first.
          if [ -z "${WORKING_DIRECTORY}" ]; then
            echo "::error::working_directory must not be empty — use '.' for the repository root"
            exit 1
          fi
          if [ ! -d "${WORKING_DIRECTORY}" ]; then
            echo "::error::working_directory '${WORKING_DIRECTORY}' does not exist in the checkout"
            exit 1
          fi

      # actions/configure-pages, required by the issue this preset closes. It
      # reports the site's own URL, which generators that build absolute links
      # need, and fails early and clearly when Pages is not enabled for the
      # repository.
      #
      # Only on deploying runs: a repository validating its site on pull
      # requests before ever enabling Pages would otherwise fail on the Pages
      # API rather than on anything to do with its site.
      - name: Configure Pages
        id: pages
        if: ${{ inputs.deploy }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Python
        if: ${{ inputs.python_version != '' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
          cache: ${{ inputs.requirements_file != '' && 'pip' || '' }}
          cache-dependency-path: ${{ inputs.requirements_file != '' && format('{0}/{1}', inputs.working_directory, inputs.requirements_file) || '' }}

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install
        if: ${{ inputs.install_command != '' || inputs.requirements_file != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          INSTALL_COMMAND: ${{ inputs.install_command }}
          REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        # eval, not `bash -c`, and deliberately so. A caller command is usually a
        # chain ("npm ci && npm run build"), and `bash -c` runs it in a fresh
        # shell that does not inherit `set -euo pipefail`: a failure in
        # everything but the last command is then swallowed, the step passes,
        # and an empty or stale site gets published on a green run. eval runs in
        # this shell and inherits the failure semantics.
        #
        # The input is caller-defined workflow configuration — the same trust
        # level as the workflow file itself — not user or event data.
        run: |
          set -euo pipefail
          if [ -n "${INSTALL_COMMAND}" ]; then
            eval "${INSTALL_COMMAND}"
          else
            python -m pip install --upgrade pip
            python -m pip install -r "${REQUIREMENTS_FILE}"
          fi

      - name: Build site
        if: ${{ inputs.build_command != '' }}
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
          # Available to the build command for generators that need to know the
          # site's own address (Hugo baseURL, Astro site). Empty when deploy is
          # false, because Configure Pages does not run then.
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        # eval for the same reason as the install step above: a chained command
        # must keep `set -euo pipefail` semantics, which `bash -c` discards.
        run: |
          set -euo pipefail
          eval "${BUILD_COMMAND}"

      # The real guard, and the reason build_command does not need to be
      # required: a build that "succeeds" while producing nothing, or a
      # deploy-only run pointed at a directory that is not there, would
      # otherwise publish an empty site over a working one on a green run.
      - name: Verify the site was produced
        working-directory: ${{ inputs.working_directory }}
        shell: bash
        env:
          PAGES_PATH: ${{ inputs.pages_path }}
          REQUIRE_ENTRY_FILE: ${{ inputs.require_entry_file }}
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          if [ ! -d "${PAGES_PATH}" ]; then
            # Two different mistakes, so two different messages: a generator
            # that ran and wrote nowhere useful, or a deploy-only call pointed
            # at a directory that is not in the repository.
            if [ -n "${BUILD_COMMAND}" ]; then
              echo "::error::build_command finished but ${PAGES_PATH} does not exist"
            else
              echo "::error::${PAGES_PATH} does not exist — no build_command was given, so it must already be in the repository"
            fi
            exit 1
          fi
          # cd into the directory rather than passing it to find. A pages_path
          # beginning with "-" is read by find as a predicate, and `find --`
          # does not rescue it — GNU findutils still reports "unknown
          # predicate". `cd --` does handle it.
          if [ -z "$(cd -- "${PAGES_PATH}" && find . -mindepth 1 -print -quit)" ]; then
            echo "::error::${PAGES_PATH} is empty — refusing to deploy an empty site"
            exit 1
          fi
          # A site with no entry document deploys happily and then serves 404
          # at its own address — the same green-but-useless publish the
          # emptiness check above exists to stop, one step further along.
          if [ "${REQUIRE_ENTRY_FILE}" = "true" ]; then
            if ! ( cd -- "${PAGES_PATH}" && { [ -f index.html ] || [ -f index.htm ]; } ); then
              echo "::error::${PAGES_PATH} has no index.html or index.htm at its root — the site would serve 404. Set require_entry_file: false if that is intended"
              exit 1
            fi
          fi
          echo "site: $(cd -- "${PAGES_PATH}" && find . -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ inputs.deploy }}
        with:
          path: ${{ inputs.working_directory != '.' && format('{0}/{1}', inputs.working_directory, inputs.pages_path) || inputs.pages_path }}
          retention-days: ${{ inputs.artifact_retention_days }}

  deploy:
    needs: build
    if: ${{ inputs.deploy }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
