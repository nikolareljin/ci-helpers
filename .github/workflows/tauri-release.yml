name: tauri-release
on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for the build-linux job. 24.04 carries libwebkit2gtk-4.1, which is what Tauri v2 links; 22.04 was needed only by v1, which linked 4.0
        type: string
        default: ubuntu-24.04
      version:
        description: >
          Version string used to patch tauri.conf.json and Cargo.toml before
          the build. Leave empty to skip version patching (manifests used as-is).
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: "stable"
      node_version:
        description: Node.js version for frontend build (empty = skip Node setup)
        type: string
        default: ""
      working_directory:
        description: Cargo workspace root (relative to repo root)
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      tauri_conf_path:
        description: Path to tauri.conf.json relative to working_directory
        type: string
        default: "src-tauri/tauri.conf.json"
      frontend_dir:
        description: Frontend directory relative to working_directory (empty = skip)
        type: string
        default: "."
      frontend_install_command:
        type: string
        default: "npm ci"
      frontend_build_command:
        description: Frontend build command (empty = skip explicit build step)
        type: string
        default: ""
      apt_packages:
        description: Space-separated system packages required by Tauri on Linux
        type: string
        default: >-
          libwebkit2gtk-4.1-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libgtk-3-dev
          build-essential
          curl
          wget
          file
          rpm
      sign_macos:
        description: Enable macOS codesigning (requires Apple certificate secrets)
        type: boolean
        default: true
      notarize_macos:
        description: Notarize and staple the macOS DMG (requires Apple ID secrets)
        type: boolean
        default: true
      macos_entitlements:
        description: >
          Entitlements plist for the macOS codesign, relative to
          working_directory (empty = none). The bundler's own
          bundle.macOS.entitlements is not read: sign-macos signs the app.
        type: string
        default: ""
      macos_updater_sign:
        description: >
          Write <Name>.app.tar.gz.sig with TAURI_SIGNING_PRIVATE_KEY in the
          sign-macos job (the pinned tauri-cli signer).
        type: boolean
        default: false
      macos_sign_runner:
        description: >
          Runner for sign-macos, the job that holds the Apple and updater
          secrets. A fresh hosted runner by default: a reused self-hosted
          machine can carry state left by the build.
        type: string
        default: macos-latest
      windows_sign_runner:
        description: >
          Runner for sign-windows, the job that holds the Windows and updater
          signing secrets. A fresh hosted runner by default.
        type: string
        default: windows-latest
      windows_sign_mode:
        description: >
          Windows signing mode:
            none          - no signing (default)
            tauri_updater - free ED25519 updater signatures (.msi.sig, -setup.exe.sig), written in the sign-windows job
            pfx           - Authenticode with a .pfx certificate (MSI + EXE, signed in the sign-windows job)
            azure         - paid Azure Trusted Signing (MSI + EXE, signed in the sign-windows job)
        type: string
        default: "none"
      windows_timestamp_server:
        description: RFC 3161 timestamp URL for windows_sign_mode pfx (empty uses http://timestamp.digicert.com)
        type: string
        default: ""
      windows_pfx_verify_trust:
        description: >
          windows_sign_mode pfx: require `signtool verify /pa` to pass. Set false
          for a private CA or self-signed certificate the runner does not trust;
          the signer and timestamp are still checked.
        type: boolean
        default: true
      upload_release:
        description: Create/update a GitHub Release and upload all installers
        type: boolean
        default: true
      release_tag:
        description: Tag to attach the release to (defaults to GITHUB_REF_NAME)
        type: string
        default: ""
      release_name:
        description: Release display name (defaults to "Release <tag>")
        type: string
        default: ""
      dist_repo:
        description: >
          Optional cross-repo publish target (e.g. owner/repo). When set,
          installers are uploaded there as well. A published installer is never
          replaced: the same sha256 passes, a different one fails.
        type: string
        default: ""
      winget_submit:
        description: Submit a winget manifest update after release
        type: boolean
        default: false
      winget_package_id:
        description: WinGet package identifier (e.g. OrgName.AppName)
        type: string
        default: ""
      winget_installer_url:
        description: Direct URL to the NSIS .exe installer for winget manifest
        type: string
        default: ""
      winget_installer_arch:
        description: Architecture tag for wingetcreate
        type: string
        default: "x64"
      winget_installer_type:
        description: Installer type tag for wingetcreate (nullsoft, msi, wix)
        type: string
        default: "nullsoft"
      winget_fork_owner:
        description: GitHub user/org owning the fork of microsoft/winget-pkgs
        type: string
        default: ""
      artifact_retention_days:
        description: Days to retain inter-job build artifacts
        type: number
        default: 3
    secrets:
      APPLE_CERTIFICATE:
        description: Base64-encoded Apple Developer p12 certificate
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password for the Apple p12 certificate
        required: false
      APPLE_SIGNING_IDENTITY:
        description: "Full signing identity (e.g. Developer ID Application: Name (TEAMID))"
        required: false
      APPLE_TEAM_ID:
        description: 10-character Apple Team ID
        required: false
      APPLE_ID:
        description: Apple ID email for notarytool
        required: false
      APPLE_APP_PASSWORD:
        description: App-specific password for notarytool
        required: false
      APPLE_PASSWORD:
        description: Accepted as an alias of APPLE_APP_PASSWORD, which is the name most consumers already hold (#97)
        required: false
      NOTARY_API_KEY:
        description: Base64 App Store Connect API key (.p8) for notarytool; preferred over APPLE_ID and APPLE_APP_PASSWORD
        required: false
      NOTARY_KEY_ID:
        description: Key id of NOTARY_API_KEY
        required: false
      NOTARY_ISSUER_ID:
        description: Issuer id (UUID) of NOTARY_API_KEY
        required: false
      WINDOWS_CERTIFICATE:
        description: Base64-encoded PFX for windows_sign_mode pfx (docs/windows-signing.md)
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: Password of the PFX in WINDOWS_CERTIFICATE
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        description: ED25519 private key for Tauri updater bundle signing (free)
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for the Tauri updater signing key
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_CODE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false
      DIST_REPO_TOKEN:
        description: PAT with write access to dist_repo
        required: false
      WINGET_PKGS_TOKEN:
        description: PAT for the microsoft/winget-pkgs fork
        required: false

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  # Builds the caller's app with no secret on the runner: the .app only,
  # unsigned, with no updater bundle. sign-macos below signs, notarizes and
  # packages it and runs none of the caller's code.
  build-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.list.outputs.artifact }}
      manifest: ${{ steps.list.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Patch version in tauri.conf.json and Cargo.toml
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAURI_CONF: ${{ inputs.tauri_conf_path }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          node << 'SCRIPT'
          const fs = require('fs');
          const v = process.env.VERSION;
          const conf_path = `${process.env.WORK_DIR}/${process.env.TAURI_CONF}`;
          const conf = JSON.parse(fs.readFileSync(conf_path, 'utf8'));
          conf.version = v;
          fs.writeFileSync(conf_path, JSON.stringify(conf, null, 2) + '\n');
          const path = require('path');
          const cargo_path = path.join(path.dirname(conf_path), 'Cargo.toml');
          if (fs.existsSync(cargo_path)) {
            const cargo = fs.readFileSync(cargo_path, 'utf8');
            fs.writeFileSync(cargo_path, cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`));
          }
          SCRIPT

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # The runner's rustup; a runner without one gets rustup-init pinned by
      # version and sha256 in the library's toolchain-pins.env.
      - name: Setup Rust and universal targets
        id: rust
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" RUST_TOOLCHAIN="$RUST_TOOLCHAIN" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_rust.sh"
          CI_HELPERS_RUN
          )"

      - name: Add macOS cross-compile targets
        shell: bash
        run: |
          set -euo pipefail
          # Both targets required for --target universal-apple-darwin (Tauri v2 fat binary)
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # No cargo cache in this job. It builds what the release job publishes,
      # and a cache entry is whatever the run that owned the key first left
      # under target/ and ~/.cargo; a restored one would put that into an
      # installer unread. Dependencies come from the registry on every run
      # (scripts/check_cache_trust.py).

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}
          # Off by name: setup-node 5 caches the package manager's store on its
          # own when package.json names one (scripts/check_cache_trust.py).
          cache: ""
          package-manager-cache: false

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.frontend_build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Install Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2.0' --locked

      # The .app only: the DMG and the updater bundle are made in sign-macos,
      # from the signed app. --config turns off the bundler's own signing and
      # updater signing, whatever tauri.conf.json says.
      - name: Build Tauri app (universal macOS binary, unsigned)
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          cargo tauri build --target universal-apple-darwin --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":null}}}'

      # One tarball keeps the app's symlinks and modes, which an artifact
      # drops; sign-macos unpacks it with scripts/safe_untar.py.
      - name: Pack the macOS app
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          ENTITLEMENTS: ${{ inputs.macos_entitlements }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/tauri-macos-out"
          rm -rf "$out"
          mkdir -p "$out"
          top="$(pwd -P)"
          bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          shopt -s nullglob
          apps=("$bundle"/*.app)
          shopt -u nullglob
          [[ ${#apps[@]} -eq 1 ]] || { echo "::error::expected one .app under $bundle, found ${#apps[@]}."; exit 1; }
          app="${apps[0]}"
          name="${app##*/}"
          [[ -d "$app" && ! -L "$app" ]] || { echo "::error::$app is not a directory."; exit 1; }
          [[ "$(cd "$app" && pwd -P)" == "$top"/* ]] || { echo "::error::$app resolves outside the working directory."; exit 1; }
          [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9\ ._+-]{0,99}\.app$ ]] || { echo "::error::the app name '$name' holds a character other than letters, digits, space and ._+-."; exit 1; }
          (cd "$bundle" && COPYFILE_DISABLE=1 tar -czf "$out/app.tar.gz" "$name")
          if [[ -n "$ENTITLEMENTS" ]]; then
            [[ -f "$ENTITLEMENTS" && ! -L "$ENTITLEMENTS" ]] || { echo "::error::macos_entitlements '$ENTITLEMENTS' is not a regular file (symlinks are refused)."; exit 1; }
            [[ "$(cd "$(dirname "$ENTITLEMENTS")" && pwd -P)/" == "$top"/* ]] || { echo "::error::macos_entitlements resolves outside the working directory."; exit 1; }
            cat -- "$ENTITLEMENTS" > "$out/entitlements.plist"
          fi

      # The app tarball in parts of at most 60 MiB, and a sha256 manifest
      # sign-macos checks before it unpacks anything.
      - name: List the build output
        id: list
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" RUN_ID="$RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          out="$RUNNER_TEMP/tauri-macos-out"
          /bin/bash "$run_lib/scripts/artifact_parts.sh" split "$out"
          if [[ -n "$(/usr/bin/find "$out" -mindepth 1 ! -type f ! -type d -print -quit)" ]]; then
            echo "::error::the build output holds a symlink or special file."; exit 1
          fi
          delim="EOF_$(/usr/bin/od -An -N8 -tx1 /dev/urandom | /usr/bin/tr -d ' \n')"
          {
            echo "artifact=tauri-macos-build-${RUN_ID}-${RUN_ATTEMPT}-${delim#EOF_}"
            echo "manifest<<$delim"
            (cd "$out" && /usr/bin/find . -type f | LC_ALL=C /usr/bin/sort | while IFS= read -r f; do "${h[@]}" "$f"; done)
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          CI_HELPERS_RUN
          )"

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
