name: tauri-release
on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for the build-linux job. 24.04 carries libwebkit2gtk-4.1, which is what Tauri v2 links; 22.04 was needed only by v1, which linked 4.0
        type: string
        default: ubuntu-24.04
      version:
        description: >
          Version string used to patch tauri.conf.json and Cargo.toml before
          the build. Leave empty to skip version patching (manifests used as-is).
        type: string
        default: ""
      rust_toolchain:
        type: string
        default: "stable"
      node_version:
        description: Node.js version for frontend build (empty = skip Node setup)
        type: string
        default: ""
      working_directory:
        description: Cargo workspace root (relative to repo root)
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      tauri_conf_path:
        description: Path to tauri.conf.json relative to working_directory
        type: string
        default: "src-tauri/tauri.conf.json"
      frontend_dir:
        description: Frontend directory relative to working_directory (empty = skip)
        type: string
        default: "."
      frontend_install_command:
        type: string
        default: "npm ci"
      frontend_build_command:
        description: Frontend build command (empty = skip explicit build step)
        type: string
        default: ""
      apt_packages:
        description: Space-separated system packages required by Tauri on Linux
        type: string
        default: >-
          libwebkit2gtk-4.1-dev
          libssl-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libgtk-3-dev
          build-essential
          curl
          wget
          file
          rpm
      sign_macos:
        description: Enable macOS codesigning (requires Apple certificate secrets)
        type: boolean
        default: true
      notarize_macos:
        description: Notarize and staple the macOS DMG (requires Apple ID secrets)
        type: boolean
        default: true
      windows_sign_mode:
        description: >
          Windows signing mode:
            none          — no signing (default)
            tauri_updater — free ED25519 updater bundle signing (.sig files only)
            pfx           - Authenticode with a .pfx certificate (MSI + EXE, signed in the sign-windows job)
            azure         — paid Azure Trusted Signing (MSI + EXE, post-build)
        type: string
        default: "none"
      windows_timestamp_server:
        description: RFC 3161 timestamp URL for windows_sign_mode pfx (empty uses http://timestamp.digicert.com)
        type: string
        default: ""
      windows_pfx_verify_trust:
        description: >
          windows_sign_mode pfx: require `signtool verify /pa` to pass. Set false
          for a private CA or self-signed certificate the runner does not trust;
          the signer and timestamp are still checked.
        type: boolean
        default: true
      upload_release:
        description: Create/update a GitHub Release and upload all installers
        type: boolean
        default: true
      release_tag:
        description: Tag to attach the release to (defaults to GITHUB_REF_NAME)
        type: string
        default: ""
      release_name:
        description: Release display name (defaults to "Release <tag>")
        type: string
        default: ""
      dist_repo:
        description: >
          Optional cross-repo publish target (e.g. owner/repo). When set,
          installers are uploaded there as well. A published installer is never
          replaced: the same sha256 passes, a different one fails.
        type: string
        default: ""
      winget_submit:
        description: Submit a winget manifest update after release
        type: boolean
        default: false
      winget_package_id:
        description: WinGet package identifier (e.g. OrgName.AppName)
        type: string
        default: ""
      winget_installer_url:
        description: Direct URL to the NSIS .exe installer for winget manifest
        type: string
        default: ""
      winget_installer_arch:
        description: Architecture tag for wingetcreate
        type: string
        default: "x64"
      winget_installer_type:
        description: Installer type tag for wingetcreate (nullsoft, msi, wix)
        type: string
        default: "nullsoft"
      winget_fork_owner:
        description: GitHub user/org owning the fork of microsoft/winget-pkgs
        type: string
        default: ""
      artifact_retention_days:
        description: Days to retain inter-job build artifacts
        type: number
        default: 3
    secrets:
      APPLE_CERTIFICATE:
        description: Base64-encoded Apple Developer p12 certificate
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        description: Password for the Apple p12 certificate
        required: false
      APPLE_SIGNING_IDENTITY:
        description: "Full signing identity (e.g. Developer ID Application: Name (TEAMID))"
        required: false
      APPLE_TEAM_ID:
        description: 10-character Apple Team ID
        required: false
      APPLE_ID:
        description: Apple ID email for notarytool
        required: false
      APPLE_APP_PASSWORD:
        description: App-specific password for notarytool
        required: false
      APPLE_PASSWORD:
        description: Accepted as an alias of APPLE_APP_PASSWORD, which is the name most consumers already hold (#97)
        required: false
      WINDOWS_CERTIFICATE:
        description: Base64-encoded PFX for windows_sign_mode pfx (docs/windows-signing.md)
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: Password of the PFX in WINDOWS_CERTIFICATE
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        description: ED25519 private key for Tauri updater bundle signing (free)
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        description: Password for the Tauri updater signing key
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_CODE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false
      DIST_REPO_TOKEN:
        description: PAT with write access to dist_repo
        required: false
      WINGET_PKGS_TOKEN:
        description: PAT for the microsoft/winget-pkgs fork
        required: false

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS ──────────────────────────────────────────────────────────────────
  build-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Patch version in tauri.conf.json and Cargo.toml
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAURI_CONF: ${{ inputs.tauri_conf_path }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          node << 'SCRIPT'
          const fs = require('fs');
          const v = process.env.VERSION;
          const conf_path = `${process.env.WORK_DIR}/${process.env.TAURI_CONF}`;
          const conf = JSON.parse(fs.readFileSync(conf_path, 'utf8'));
          conf.version = v;
          fs.writeFileSync(conf_path, JSON.stringify(conf, null, 2) + '\n');
          const path = require('path');
          const cargo_path = path.join(path.dirname(conf_path), 'Cargo.toml');
          if (fs.existsSync(cargo_path)) {
            const cargo = fs.readFileSync(cargo_path, 'utf8');
            fs.writeFileSync(cargo_path, cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`));
          }
          SCRIPT

      - name: Setup Rust and universal targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Add macOS cross-compile targets
        shell: bash
        run: |
          set -euo pipefail
          # Both targets required for --target universal-apple-darwin (Tauri v2 fat binary)
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 @ 2026-10-20
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.frontend_build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Install Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2.0' --locked

      # The library's own action, at the commit of this workflow file. A
      # `uses: <owner>/ci-helpers/...@production` here ran whatever production
      # is today, even for a caller pinned to a SHA; `./.github/actions` would
      # resolve in the caller's checkout, so the action is checked out beside it.
      - name: Check out ci-helpers actions at this workflow's commit
        if: ${{ inputs.sign_macos }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's actions after all; refuse instead.
      - name: Verify ci-helpers actions commit
        if: ${{ inputs.sign_macos }}
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers actions at $WF_SHA"

      - name: Configure macOS codesigning
        if: ${{ inputs.sign_macos }}
        uses: ./.ci-helpers-actions/.github/actions/macos-sign
        with:
          certificate_base64: ${{ secrets.APPLE_CERTIFICATE }}
          certificate_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing_identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          team_id: ${{ secrets.APPLE_TEAM_ID }}
          apple_id: ${{ secrets.APPLE_ID }}
          app_password: ${{ secrets.APPLE_APP_PASSWORD || secrets.APPLE_PASSWORD }}
          # The secrets go to the build step's env below, not to GITHUB_ENV.
          export_env: "false"

      # The action keeps nothing in its own directory, so the checkout is removed
      # before the build and cannot end up in a bundle.
      - name: Remove ci-helpers actions checkout
        if: ${{ always() }}
        shell: bash
        run: rm -rf .ci-helpers-actions

      # Tauri signs (and, with APPLE_ID set, notarizes) inside the build, so
      # this step gets the Apple secrets; no later step does.
      - name: Build Tauri app (universal macOS binary)
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          APPLE_CERTIFICATE: ${{ inputs.sign_macos && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.sign_macos && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.sign_macos && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.sign_macos && (secrets.APPLE_APP_PASSWORD || secrets.APPLE_PASSWORD) || '' }}
        run: |
          set -euo pipefail
          # An empty variable is not an unset one to Tauri: drop the empty ones,
          # as the action only exported what was set.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD; do
            [ -n "${!v}" ] || unset "$v"
          done
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_PASSWORD; fi
          cargo tauri build --target universal-apple-darwin

      - name: Notarize and staple DMG
        if: ${{ inputs.sign_macos && inputs.notarize_macos }}
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID }}
          APPLE_APP_PW: ${{ secrets.APPLE_APP_PASSWORD || secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find "${WORK_DIR}/src-tauri/target/universal-apple-darwin/release/bundle" \
            -name '*.dmg' | head -1)
          if [ -z "${dmg}" ]; then
            echo "No DMG found for notarization." >&2
            exit 1
          fi
          echo "Notarizing: ${dmg}"
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID_EMAIL}" \
            --password "${APPLE_APP_PW}" \
            --team-id "${TEAM_ID}" \
            --wait
          echo "Stapling notarization ticket..."
          xcrun stapler staple "${dmg}"
          echo "Verifying..."
          spctl --assess --type open --context context:primary-signature "${dmg}"

      - name: Collect macOS installers
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "${WORK_DIR}/src-tauri/target/universal-apple-darwin/release/bundle" \
            -type f \( -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp {} out/ \;
          ls -la out/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
        with:
          name: tauri-macos-artifacts
          path: out/
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Cleanup macOS keychain
        if: always()
        shell: bash
        env:
          KEYCHAIN: ${{ env.CI_MACOS_KEYCHAIN }}
        run: |
          security delete-keychain "${KEYCHAIN:-ci-build.keychain-db}" 2>/dev/null || true

  # ── Windows ────────────────────────────────────────────────────────────────
  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # Same rule as the windows-sign 'Check sign mode' step (plus 'none'),
      # run first so a bad mode fails before checkout and cargo install.
      - name: Check Windows sign mode
        shell: pwsh
        env:
          SIGN_MODE: ${{ inputs.windows_sign_mode }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          # -eq/-ne ignore case, like the `inputs.windows_sign_mode` step conditions.
          if ($env:SIGN_MODE -ne "none" -and $env:SIGN_MODE -ne "tauri_updater" -and $env:SIGN_MODE -ne "pfx" -and $env:SIGN_MODE -ne "azure") {
            Write-Output "::error::sign_mode must be none, tauri_updater, pfx or azure (got: $($env:SIGN_MODE))."
            exit 1
          }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Patch version in tauri.conf.json and Cargo.toml
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAURI_CONF: ${{ inputs.tauri_conf_path }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          node << 'SCRIPT'
          const fs = require('fs');
          const v = process.env.VERSION;
          const conf_path = `${process.env.WORK_DIR}/${process.env.TAURI_CONF}`;
          const conf = JSON.parse(fs.readFileSync(conf_path, 'utf8'));
          conf.version = v;
          fs.writeFileSync(conf_path, JSON.stringify(conf, null, 2) + '\n');
          const path = require('path');
          const cargo_path = path.join(path.dirname(conf_path), 'Cargo.toml');
          if (fs.existsSync(cargo_path)) {
            const cargo = fs.readFileSync(cargo_path, 'utf8');
            fs.writeFileSync(cargo_path, cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`));
          }
          SCRIPT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 @ 2026-10-20
        with:
          workspaces: ${{ inputs.working_directory }}

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          INSTALL_CMD: ${{ inputs.frontend_install_command }}
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.frontend_build_command }}
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Install Tauri CLI
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2.0' --locked

      # The library's own action, at the commit of this workflow file. A
      # `uses: <owner>/ci-helpers/...@production` here ran whatever production
      # is today, even for a caller pinned to a SHA; `./.github/actions` would
      # resolve in the caller's checkout, so the action is checked out beside it.
      - name: Check out ci-helpers actions at this workflow's commit
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's actions after all; refuse instead.
      - name: Verify ci-helpers actions commit
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers actions at $WF_SHA"

      # Only the updater key is used in this job: Tauri writes the .sig files
      # inside the build. The Authenticode secrets (pfx, azure) never reach a
      # job that runs the app's code; sign-windows below signs the installers.
      - name: Configure Windows signing
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        uses: ./.ci-helpers-actions/.github/actions/windows-sign
        with:
          sign_mode: tauri_updater
          tauri_signing_private_key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          tauri_signing_private_key_password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The key goes to the build step below, not to GITHUB_ENV.
          export_env: "false"

      # The action keeps nothing in its own directory, so the checkout is removed
      # before the build and cannot end up in a bundle.
      - name: Remove ci-helpers actions checkout
        if: ${{ always() }}
        shell: bash
        run: rm -rf .ci-helpers-actions

      # Tauri writes the updater signatures inside the build, so this step gets
      # the updater key; no later step does.
      - name: Build Tauri app (Windows)
        working-directory: ${{ inputs.working_directory }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.windows_sign_mode == 'tauri_updater' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.windows_sign_mode == 'tauri_updater' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          # An empty variable is not an unset one to Tauri.
          [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ] || unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          cargo tauri build

      - name: Collect Windows installers
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          mkdir -p out
          find "${WORK_DIR}/src-tauri/target/release/bundle" \
            -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*_x64-setup.exe' \) \
            -exec cp {} out/ \;
          ls -la out/

      # With pfx or azure the installers are still unsigned: sign-windows
      # takes them from tauri-windows-unsigned and publishes the signed ones
      # as tauri-windows-artifacts, the name the release job collects.
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
        with:
          name: ${{ (inputs.windows_sign_mode == 'pfx' || inputs.windows_sign_mode == 'azure') && 'tauri-windows-unsigned' || 'tauri-windows-artifacts' }}
          path: out/
          retention-days: ${{ inputs.artifact_retention_days }}

  # Authenticode signing, apart from the build. The build runs the app's own
  # code (npm scripts, cargo build scripts), which can rewrite files, PATH or
  # GITHUB_ENV for every later step of its job; a signing step there would
  # hand the certificate or the Azure secret to that code. This job checks out
  # no app code and runs none: it downloads the unsigned installers, checks
  # out only the ci-helpers actions at this workflow's commit, signs, verifies
  # and uploads. The signing secrets are passed to this job only.
  sign-windows:
    needs: build-windows
    if: ${{ inputs.windows_sign_mode == 'pfx' || inputs.windows_sign_mode == 'azure' }}
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download unsigned Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: tauri-windows-unsigned
          path: ${{ runner.temp }}/windows-installers

      # Everything in this folder is uploaded as tauri-windows-artifacts and
      # published, but only .exe and .msi files are signed. The build job ran
      # app code that could add other files, so anything else is refused
      # rather than shipped unsigned.
      - name: Only installers to sign
        shell: pwsh
        env:
          DIR: ${{ runner.temp }}/windows-installers
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $other = @(Get-ChildItem -LiteralPath $env:DIR -Recurse -File | Where-Object { $_.Extension -notin '.exe', '.msi' })
          foreach ($f in $other) { Write-Output "::error::not an installer, would ship unsigned: $($f.FullName)" }
          if ($other.Count -gt 0) { exit 1 }

      - name: Check out ci-helpers actions at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers actions commit
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers actions at $WF_SHA"

      # pfx: signs, timestamps and verifies every installer. azure: checks the
      # credentials; the Azure action below signs.
      - name: Sign Windows installers
        uses: ./.ci-helpers-actions/.github/actions/windows-sign
        with:
          sign_mode: ${{ inputs.windows_sign_mode }}
          certificate_base64: ${{ inputs.windows_sign_mode == 'pfx' && secrets.WINDOWS_CERTIFICATE || '' }}
          certificate_password: ${{ inputs.windows_sign_mode == 'pfx' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          timestamp_server: ${{ inputs.windows_timestamp_server }}
          files_folder: ${{ runner.temp }}/windows-installers
          verify_trust: ${{ inputs.windows_pfx_verify_trust && 'true' || 'false' }}
          azure_tenant_id: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          azure_client_id: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          azure_client_secret: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
          azure_endpoint: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          azure_code_signing_account: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CODE_SIGNING_ACCOUNT || '' }}
          azure_cert_profile: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CERT_PROFILE || '' }}
          export_env: "false"

      - name: Sign with Azure Artifact Signing
        if: ${{ inputs.windows_sign_mode == 'azure' }}
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0 @ 2026-05-24
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ runner.temp }}/windows-installers
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: https://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The pfx path verifies inside windows-sign; this does the same for azure.
      - name: Every installer carries a valid signature
        if: ${{ inputs.windows_sign_mode == 'azure' }}
        shell: pwsh
        env:
          DIR: ${{ runner.temp }}/windows-installers
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -LiteralPath $env:DIR -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -eq 0) { Write-Output "::error::no installers to check"; exit 1 }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne "Valid" -or -not $sig.TimeStamperCertificate) {
              Write-Output "::error::$($f.Name): signature $($sig.Status), timestamp $([bool]$sig.TimeStamperCertificate)"; $bad = 1
            } else { Write-Output "ok: $($f.Name) signed by $($sig.SignerCertificate.Subject)" }
          }
          exit $bad

      - name: Upload signed Windows installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
        with:
          name: tauri-windows-artifacts
          path: ${{ runner.temp }}/windows-installers/
          retention-days: ${{ inputs.artifact_retention_days }}

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    permissions:
      contents: read
    # The runner is an input here, as it already was in tauri.yml and
    # tauri-scan.yml. It was the one Tauri workflow a consumer could not
    # override, which is the wrong one to hardcode: it is the workflow that
    # produces release artefacts.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Patch version in tauri.conf.json and Cargo.toml
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAURI_CONF: ${{ inputs.tauri_conf_path }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          node << 'SCRIPT'
          const fs = require('fs');
          const v = process.env.VERSION;
          const conf_path = `${process.env.WORK_DIR}/${process.env.TAURI_CONF}`;
          const conf = JSON.parse(fs.readFileSync(conf_path, 'utf8'));
          conf.version = v;
          fs.writeFileSync(conf_path, JSON.stringify(conf, null, 2) + '\n');
          const path = require('path');
          const cargo_path = path.join(path.dirname(conf_path), 'Cargo.toml');
          if (fs.existsSync(cargo_path)) {
            const cargo = fs.readFileSync(cargo_path, 'utf8');
            fs.writeFileSync(cargo_path, cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`));
          }
          SCRIPT

      - name: Install Tauri Linux system dependencies
        env:
          APT_PKGS: ${{ inputs.apt_packages }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # Normalize newlines/CRs to spaces so callers can pass either
          # space-separated or newline-separated package lists.
          _pkgs="${APT_PKGS//$'\r'}"
          read -r -a pkgs <<< "${_pkgs//$'\n'/ }"
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -- "${pkgs[@]}"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable @ 2026-10-16
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 @ 2026-10-20
        with:
          workspaces: ${{ inputs.working_directory }}
          # The runner label is part of the key. -sys crates compile against the
          # image's C libraries, and a cache built on one Ubuntu handed to the
          # next looks like a successful restore followed by a link error.
          key: ${{ inputs.runner }}

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.frontend_build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Install Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2.0' --locked

      - name: Build Tauri app (Linux)
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          # The AppImage tools want to mount themselves with FUSE. The 24.04
          # image has no libfuse2 (it became libfuse2t64) and sets
          # kernel.apparmor_restrict_unprivileged_userns=1, and either alone
          # breaks that. With this set, linuxdeploy and appimagetool extract
          # and run instead, which needs neither -- and neither does the
          # package name, which is the part 26.04 will rename again. Tauri's
          # bundler sets it itself today (tauri-bundler 2.9.4,
          # linuxdeploy.rs:191); this pins that choice where a consumer can
          # see it, because a dependency's default is not a contract.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          cargo tauri build

      - name: Collect Linux installers
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "${WORK_DIR}/src-tauri/target/release/bundle" \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} out/ \;
          ls -la out/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
        with:
          name: tauri-linux-artifacts
          path: out/
          retention-days: ${{ inputs.artifact_retention_days }}

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, sign-windows, build-linux]
    # sign-windows is skipped unless windows_sign_mode is pfx or azure; a skip
    # there must not skip the release, a failure anywhere must stop it.
    if: >-
      ${{ !cancelled() && inputs.upload_release
      && needs.build-macos.result == 'success'
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
      && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: tauri-*-artifacts
          merge-multiple: false

      - name: List collected installers
        shell: bash
        run: find tauri-*-artifacts -type f | sort

      - name: Resolve release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # This job only downloads artifacts; check out the source (into a subpath
      # so the collected installers are untouched) so release_notes.sh can read
      # the CHANGELOG and history.
      - name: Checkout source for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ steps.rel.outputs.tag }}
          path: .source
          fetch-depth: 0

      - name: Checkout script-helpers for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 678efa141aa43625ebb09d8f3cd80c98b0f6adb4 # 0.55.0
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          RN_VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          version="${RN_VERSION:-}"
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "release notes: '$version' is not a version; skipping (no body)."
            exit 0
          fi
          producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
          if [ ! -f "$producer" ]; then
            echo "release notes: $producer not found (script-helpers checkout failed)" >&2
            exit 1
          fi
          # Best-effort: never fail the release because the notes could not be
          # produced. Publish without a body and say so instead.
          if bash "$producer" --version "$version" --repo "${GITHUB_WORKSPACE}/.source" --output "$notes_file"; then
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release notes generation failed; publishing without a body."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3 @ 2026-09-10
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', steps.rel.outputs.tag) }}
          body_path: ${{ steps.notes.outputs.notes_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the distribution repo release
        if: ${{ inputs.dist_repo != '' }}
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ steps.rel.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::dist_repo is set but DIST_REPO_TOKEN secret is missing. Provide a PAT with write access to '${DIST_REPO}'." >&2
            exit 1
          fi
          # Same notes as the main release; fall back to a generic line only if
          # note generation was skipped (e.g. a non-version tag).
          if [ -n "${NOTES_FILE:-}" ] && [ -f "${NOTES_FILE}" ]; then
            notes_args=(--notes-file "${NOTES_FILE}")
          else
            notes_args=(--notes "Tauri installer bundles for ${VERSION}.")
          fi
          # Ensure the release exists in the dist repo (idempotent — race-safe)
          if ! gh release view "${VERSION}" --repo "${DIST_REPO}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --repo "${DIST_REPO}" \
              --title "Release ${VERSION}" \
              "${notes_args[@]}" \
              || true
          fi

      # A published installer is never replaced: users may have fetched and
      # verified it, and a rerun builds new bytes. Same sha256 passes (a rerun
      # of this job alone), a different one fails. Delete the asset to republish.
      - name: Upload installers
        id: upload
        env:
          OWN_TOKEN: ${{ github.token }}
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          upload_once() {
            local repo="$1" json have want f name rc=0
            # Checked here: this runs on the left of ||, where set -e is off.
            json="$(gh api "repos/${repo}/releases/tags/${VERSION}")" || {
              echo "::error::release $VERSION not found in $repo."; return 1; }
            for f in tauri-*-artifacts/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              have="$(printf '%s' "$json" | jq -r --arg n "$name" \
                '[.assets[] | select(.name == $n)] | if length == 0 then "" else (.[0].digest // "unknown") end')"
              if [ "$have" = "unknown" ]; then
                rm -rf .published && mkdir -p .published
                gh release download "$VERSION" -R "$repo" -p "$name" -D .published || return 1
                have="sha256:$(sha256sum ".published/$name" | cut -d' ' -f1)"
              fi
              if [ -z "$have" ]; then
                gh release upload "$VERSION" "$f" -R "$repo" || rc=1
              elif [ "$have" = "$want" ]; then
                echo "$name is already on $repo $VERSION with the same sha256."
              else
                echo "::error::$name is already on $repo $VERSION with a different sha256 ($have); refusing to replace a published installer. Delete it to republish."
                rc=1
              fi
            done
            return "$rc"
          }
          rc=0
          GH_TOKEN="$OWN_TOKEN" upload_once "$GITHUB_REPOSITORY" || rc=1
          if [ -n "$DIST_REPO" ]; then
            GH_TOKEN="$DIST_TOKEN" upload_once "$DIST_REPO" || rc=1
          fi
          exit "$rc"

  # ── WinGet submission ──────────────────────────────────────────────────────
  winget-submit:
    permissions:
      contents: read
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.winget_submit && inputs.winget_package_id != '' && inputs.winget_installer_url != '' && inputs.winget_fork_owner != '' }}
    # Relative, not @production: a consumer pinned to a tag was getting whatever
    # `production` pointed at for this one job. A relative `uses:` resolves against
    # this repository at the ref the consumer pinned.
    uses: ./.github/workflows/winget-submit.yml
    with:
      package_id: ${{ inputs.winget_package_id }}
      version: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      installer_url: ${{ inputs.winget_installer_url }}
      installer_arch: ${{ inputs.winget_installer_arch }}
      installer_type: ${{ inputs.winget_installer_type }}
      winget_fork_owner: ${{ inputs.winget_fork_owner }}
    secrets:
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
