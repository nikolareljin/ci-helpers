            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          list="$RUNNER_TEMP/tauri-windows-manifest.sha256"
          /usr/bin/printf '%s\n' "$MANIFEST" > "$list"
          /bin/bash "$run_lib/scripts/artifact_parts.sh" verify "$RUNNER_TEMP/tauri-windows-in" "$list" '[A-Za-z0-9][A-Za-z0-9 ._+-]{0,150}\.(exe|msi)'
          CI_HELPERS_RUN
          )"

      # The signer build-signer-windows made; the name is checked as for the build.
      - name: Check the signer outputs
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        shell: bash
        env:
          ARTIFACT: ${{ needs.build-signer-windows.outputs.artifact }}
          MANIFEST: ${{ needs.build-signer-windows.outputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT" =~ ^tauri-signer-windows-[0-9]+-[0-9]+-[0-9a-f]{16}$ ]] || { echo "::error::the signer artifact name '$ARTIFACT' is not one build-signer-windows makes."; exit 1; }
          [[ -n "$MANIFEST" ]] || { echo "::error::the signer manifest is empty."; exit 1; }

      - name: Download the signer
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: ${{ needs.build-signer-windows.outputs.artifact }}
          path: ${{ runner.temp }}/tauri-signer-in

      - name: Verify the signer against its manifest
        id: signer
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          MANIFEST: ${{ needs.build-signer-windows.outputs.manifest }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" MANIFEST="$MANIFEST" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          in="$RUNNER_TEMP/tauri-signer-in"
          list="$RUNNER_TEMP/tauri-signer-manifest.sha256"
          /usr/bin/printf '%s\n' "$MANIFEST" > "$list"
          /bin/bash "$run_lib/scripts/artifact_parts.sh" verify "$in" "$list" 'cargo-tauri\.exe'
          signer="$in/cargo-tauri.exe"
          /bin/chmod 0555 "$signer"
          echo "signer=$signer" >> "$GITHUB_OUTPUT"
          CI_HELPERS_RUN
          )"

      # The library's own action, at the commit of this workflow file.
      - name: Check out ci-helpers actions at this workflow's commit
        if: ${{ inputs.windows_sign_mode == 'pfx' || inputs.windows_sign_mode == 'azure' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: .github/actions
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's actions after all; refuse instead.
      - name: Verify ci-helpers actions commit
        if: ${{ inputs.windows_sign_mode == 'pfx' || inputs.windows_sign_mode == 'azure' }}
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers actions at $WF_SHA"

      # pfx: signs, timestamps and verifies every installer. azure: checks the
      # credentials; the Azure action below signs.
      - name: Sign Windows installers
        if: ${{ inputs.windows_sign_mode == 'pfx' || inputs.windows_sign_mode == 'azure' }}
        uses: ./.ci-helpers-actions/.github/actions/windows-sign
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          sign_mode: ${{ inputs.windows_sign_mode }}
          certificate_base64: ${{ inputs.windows_sign_mode == 'pfx' && secrets.WINDOWS_CERTIFICATE || '' }}
          certificate_password: ${{ inputs.windows_sign_mode == 'pfx' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          timestamp_server: ${{ inputs.windows_timestamp_server }}
          files_folder: ${{ runner.temp }}/tauri-windows-in
          verify_trust: ${{ inputs.windows_pfx_verify_trust && 'true' || 'false' }}
          azure_tenant_id: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          azure_client_id: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          azure_client_secret: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
          azure_endpoint: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
          azure_code_signing_account: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CODE_SIGNING_ACCOUNT || '' }}
          azure_cert_profile: ${{ inputs.windows_sign_mode == 'azure' && secrets.AZURE_CERT_PROFILE || '' }}
          export_env: "false"

      - name: Sign with Azure Artifact Signing
        if: ${{ inputs.windows_sign_mode == 'azure' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0 @ 2026-11-09
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ runner.temp }}/tauri-windows-in
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: https://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The pfx path verifies inside windows-sign; this does the same for azure.
      - name: Every installer carries a valid signature
        if: ${{ inputs.windows_sign_mode == 'azure' }}
        shell: pwsh
        env:
          DIR: ${{ runner.temp }}/tauri-windows-in
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $files = @(Get-ChildItem -LiteralPath $env:DIR -Recurse -File -Force | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -eq 0) { Write-Output "::error::no installers to check"; exit 1 }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($sig.Status -ne "Valid" -or -not $sig.TimeStamperCertificate) {
              Write-Output "::error::$($f.Name): signature $($sig.Status), timestamp $([bool]$sig.TimeStamperCertificate)"; $bad = 1
            } else { Write-Output "ok: $($f.Name) signed by $($sig.SignerCertificate.Subject)" }
          }
          exit $bad

      - name: Remove ci-helpers actions checkout
        if: ${{ always() }}
        run: rm -rf .ci-helpers-actions

      - name: Write the updater signatures
        if: ${{ inputs.windows_sign_mode == 'tauri_updater' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          SIGNER: ${{ steps.signer.outputs.signer }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH SIGNER TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          shopt -s nullglob
          files=("$RUNNER_TEMP/tauri-windows-in"/*.msi "$RUNNER_TEMP/tauri-windows-in"/*.exe)
          shopt -u nullglob
          /bin/bash "$run_lib/scripts/tauri_updater_sign.sh" "${files[@]}"
          CI_HELPERS_RUN
          )"

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -e .git || -L .git ]]; then
            [[ -d .git && ! -L .git ]] || { echo "::error::.git is not a plain directory; refusing to edit its exclude file"; exit 1; }
            gd=$(cd .git && pwd -P); exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --path-format=absolute --git-path info/exclude)
            [[ ! -x /usr/bin/cygpath ]] || exclude=$(/usr/bin/cygpath -u "$exclude")
            [[ "$exclude" == "$gd/info/exclude" && ! -L "$gd/info" && ! -L "$exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: tauri-windows-artifacts
          mode: artifact
          include_hidden_files: 'true'
          paths: ${{ runner.temp }}/tauri-windows-in/

      - name: Upload Windows artifacts
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: tauri-windows-artifacts
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

  # ── Linux ──────────────────────────────────────────────────────────────────
  build-linux:
    permissions:
      contents: read
    # The runner is an input here, as it already was in tauri.yml and
    # tauri-scan.yml. It was the one Tauri workflow a consumer could not
    # override, which is the wrong one to hardcode: it is the workflow that
    # produces release artefacts.
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Patch version in tauri.conf.json and Cargo.toml
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
          TAURI_CONF: ${{ inputs.tauri_conf_path }}
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          node << 'SCRIPT'
          const fs = require('fs');
          const v = process.env.VERSION;
          const conf_path = `${process.env.WORK_DIR}/${process.env.TAURI_CONF}`;
          const conf = JSON.parse(fs.readFileSync(conf_path, 'utf8'));
          conf.version = v;
          fs.writeFileSync(conf_path, JSON.stringify(conf, null, 2) + '\n');
          const path = require('path');
          const cargo_path = path.join(path.dirname(conf_path), 'Cargo.toml');
          if (fs.existsSync(cargo_path)) {
            const cargo = fs.readFileSync(cargo_path, 'utf8');
            fs.writeFileSync(cargo_path, cargo.replace(/^version = "[^"]*"/m, `version = "${v}"`));
          }
          SCRIPT

      - name: Install Tauri Linux system dependencies
        env:
          APT_PKGS: ${{ inputs.apt_packages }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          # Normalize newlines/CRs to spaces so callers can pass either
          # space-separated or newline-separated package lists.
          _pkgs="${APT_PKGS//$'\r'}"
          read -r -a pkgs <<< "${_pkgs//$'\n'/ }"
          if [ ${#pkgs[@]} -gt 0 ]; then
            sudo apt-get install -y -- "${pkgs[@]}"
          fi

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # The runner's rustup; a runner without one gets rustup-init pinned by
      # version and sha256 in the library's toolchain-pins.env.
      - name: Setup Rust
        id: rust
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" RUST_TOOLCHAIN="$RUST_TOOLCHAIN" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_rust.sh"
          CI_HELPERS_RUN
          )"

      # No cargo cache in this job. It holds signing secrets or builds what
      # the release job publishes, and a cache entry is whatever the run that
      # owned the key first left under target/ and ~/.cargo; a restored one
      # would put that into a signed installer unread. Dependencies come from
      # the registry on every run (scripts/check_cache_trust.py).

      - name: Setup Node
        if: ${{ inputs.node_version != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: ${{ inputs.node_version }}
          # Off by name: setup-node 5 caches the package manager's store on its
          # own when package.json names one (scripts/check_cache_trust.py).
          cache: ""
          package-manager-cache: false

      - name: Frontend install
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' }}
        env:
          INSTALL_CMD: ${{ inputs.frontend_install_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$INSTALL_CMD"

      - name: Frontend build
        if: ${{ inputs.node_version != '' && inputs.frontend_dir != '' && inputs.frontend_build_command != '' }}
        env:
          BUILD_CMD: ${{ inputs.frontend_build_command }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}/${{ inputs.frontend_dir }}
        run: |
          set -euo pipefail
          bash -c "$BUILD_CMD"

      - name: Install Tauri CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2.0' --locked

      - name: Build Tauri app (Linux)
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          # The AppImage tools want to mount themselves with FUSE. The 24.04
          # image has no libfuse2 (it became libfuse2t64) and sets
          # kernel.apparmor_restrict_unprivileged_userns=1, and either alone
          # breaks that. With this set, linuxdeploy and appimagetool extract
          # and run instead, which needs neither -- and neither does the
          # package name, which is the part 26.04 will rename again. Tauri's
          # bundler sets it itself today (tauri-bundler 2.9.4,
          # linuxdeploy.rs:191); this pins that choice where a consumer can
          # see it, because a dependency's default is not a contract.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          cargo tauri build

      - name: Collect Linux installers
        env:
          WORK_DIR: ${{ inputs.working_directory }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find "${WORK_DIR}/src-tauri/target/release/bundle" \
            -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} out/ \;
          ls -la out/

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -e .git || -L .git ]]; then
            [[ -d .git && ! -L .git ]] || { echo "::error::.git is not a plain directory; refusing to edit its exclude file"; exit 1; }
            gd=$(cd .git && pwd -P); exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --path-format=absolute --git-path info/exclude)
            [[ ! -x /usr/bin/cygpath ]] || exclude=$(/usr/bin/cygpath -u "$exclude")
            [[ "$exclude" == "$gd/info/exclude" && ! -L "$gd/info" && ! -L "$exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: tauri-linux-artifacts
          mode: artifact
          paths: out/

      - name: Upload Linux artifacts
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
        with:
          include-hidden-files: true
          name: tauri-linux-artifacts
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          retention-days: ${{ inputs.artifact_retention_days }}

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    needs: [sign-macos, sign-windows, build-linux]
    if: ${{ inputs.upload_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          pattern: tauri-*-artifacts
          merge-multiple: false

      - name: List collected installers
        shell: bash
        run: find tauri-*-artifacts -type f | sort

      - name: Resolve release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      # This job only downloads artifacts; check out the source (into a subpath
      # so the collected installers are untouched) so release_notes.sh can read
      # the CHANGELOG and history.
      - name: Checkout source for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ steps.rel.outputs.tag }}
          path: .source
          fetch-depth: 0

      - name: Checkout script-helpers for release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: aa819e9fc9197e3f6941222ecd5141cdd152c11b # aa819e9fc9197e3f6941222ecd5141cdd152c11b
          path: .script-helpers
          fetch-depth: 1

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          RN_VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"
          version="${RN_VERSION:-}"
          if ! printf '%s' "$version" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "release notes: '$version' is not a version; skipping (no body)."
            exit 0
          fi
          producer="${GITHUB_WORKSPACE}/.script-helpers/scripts/release_notes.sh"
          if [ ! -f "$producer" ]; then
            echo "release notes: $producer not found (script-helpers checkout failed)" >&2
            exit 1
          fi
          # Best-effort: never fail the release because the notes could not be
          # produced. Publish without a body and say so instead.
          if bash "$producer" --version "$version" --repo "${GITHUB_WORKSPACE}/.source" --output "$notes_file"; then
            echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::release notes generation failed; publishing without a body."
          fi

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
            scripts
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -e .git || -L .git ]]; then
            [[ -d .git && ! -L .git ]] || { echo "::error::.git is not a plain directory; refusing to edit its exclude file"; exit 1; }
            gd=$(cd .git && pwd -P); exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --path-format=absolute --git-path info/exclude)
            [[ ! -x /usr/bin/cygpath ]] || exclude=$(/usr/bin/cygpath -u "$exclude")
            [[ "$exclude" == "$gd/info/exclude" && ! -L "$gd/info" && ! -L "$exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Isolate ci-helpers scripts
        id: ci_lib_publication
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-publication/scripts/lib_isolate.sh .ci-helpers-publication --keep

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            tag_name: ${{ steps.rel.outputs.tag }}
            name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', steps.rel.outputs.tag) }}
          mode: release
          body_path: ${{ steps.notes.outputs.notes_file }}

      - name: Publish GitHub Release
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib_publication.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_publication.outputs.hash }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.rel.outputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', steps.rel.outputs.tag) }}
          BODY_PATH: ${{ steps.ci_publication_check_1.outputs.body_path }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH GH_TOKEN TAG_NAME RELEASE_NAME BODY_PATH GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          /bin/bash "$run_lib/scripts/github_release.sh"
          CI_HELPERS_RUN
          )"

      - name: Create the distribution repo release
        if: ${{ inputs.dist_repo != '' }}
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ steps.rel.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::dist_repo is set but DIST_REPO_TOKEN secret is missing. Provide a PAT with write access to '${DIST_REPO}'." >&2
            exit 1
          fi
          # Same notes as the main release; fall back to a generic line only if
          # note generation was skipped (e.g. a non-version tag).
          if [ -n "${NOTES_FILE:-}" ] && [ -f "${NOTES_FILE}" ]; then
            notes_args=(--notes-file "${NOTES_FILE}")
          else
            notes_args=(--notes "Tauri installer bundles for ${VERSION}.")
          fi
          # Ensure the release exists in the dist repo (idempotent — race-safe)
          if ! gh release view "${VERSION}" --repo "${DIST_REPO}" >/dev/null 2>&1; then
            gh release create "${VERSION}" --repo "${DIST_REPO}" \
              --title "Release ${VERSION}" \
              "${notes_args[@]}" \
              || true
          fi

      # A published installer is never replaced: users may have fetched and
      # verified it, and a rerun builds new bytes. Same sha256 passes (a rerun
      # of this job alone), a different one fails. Delete the asset to republish.
      - name: Upload installers
        id: upload
        env:
          OWN_TOKEN: ${{ github.token }}
          DIST_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
          DIST_REPO: ${{ inputs.dist_repo }}
          VERSION: ${{ steps.rel.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          upload_once() {
            local repo="$1" json have want f name rc=0
            # Checked here: this runs on the left of ||, where set -e is off.
            json="$(gh api "repos/${repo}/releases/tags/${VERSION}")" || {
              echo "::error::release $VERSION not found in $repo."; return 1; }
            for f in tauri-*-artifacts/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              have="$(printf '%s' "$json" | jq -r --arg n "$name" \
                '[.assets[] | select(.name == $n)] | if length == 0 then "" else (.[0].digest // "unknown") end')"
              if [ "$have" = "unknown" ]; then
                rm -rf .published && mkdir -p .published
                gh release download "$VERSION" -R "$repo" -p "$name" -D .published || return 1
                have="sha256:$(sha256sum ".published/$name" | cut -d' ' -f1)"
              fi
              if [ -z "$have" ]; then
                gh release upload "$VERSION" "$f" -R "$repo" || rc=1
              elif [ "$have" = "$want" ]; then
                echo "$name is already on $repo $VERSION with the same sha256."
              else
                echo "::error::$name is already on $repo $VERSION with a different sha256 ($have); refusing to replace a published installer. Delete it to republish."
                rc=1
              fi
            done
            return "$rc"
          }
          rc=0
          GH_TOKEN="$OWN_TOKEN" upload_once "$GITHUB_REPOSITORY" || rc=1
          if [ -n "$DIST_REPO" ]; then
            GH_TOKEN="$DIST_TOKEN" upload_once "$DIST_REPO" || rc=1
          fi
          exit "$rc"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB_0: ${{ steps.ci_lib_publication.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

  # ── WinGet submission ──────────────────────────────────────────────────────
  winget-submit:
    permissions:
      contents: read
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.winget_submit && inputs.winget_package_id != '' && inputs.winget_installer_url != '' && inputs.winget_fork_owner != '' }}
    # Relative, not @production: a consumer pinned to a tag was getting whatever
    # `production` pointed at for this one job. A relative `uses:` resolves against
    # this repository at the ref the consumer pinned.
    uses: ./.github/workflows/winget-submit.yml
    with:
      package_id: ${{ inputs.winget_package_id }}
      version: ${{ inputs.version != '' && inputs.version || github.ref_name }}
      installer_url: ${{ inputs.winget_installer_url }}
      installer_arch: ${{ inputs.winget_installer_arch }}
      installer_type: ${{ inputs.winget_installer_type }}
      winget_fork_owner: ${{ inputs.winget_fork_owner }}
    secrets:
      WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
