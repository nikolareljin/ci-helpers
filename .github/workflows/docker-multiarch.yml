name: docker-multiarch
on:
  workflow_call:
    inputs:
      image_name:
        description: Full image name without tag (e.g. ghcr.io/owner/repo)
        type: string
        required: true
      tag:
        description: Primary version tag to push (e.g. 1.2.3)
        type: string
        required: true
      platforms:
        description: Comma-separated buildx platform list
        type: string
        default: "linux/amd64,linux/arm64"
      dockerfile:
        description: Path to the Dockerfile (relative to context)
        type: string
        default: "Dockerfile"
      context:
        description: Docker build context path
        type: string
        default: "."
      build_args:
        description: Newline-delimited ARG=VALUE pairs passed to docker build
        type: string
        default: ""
      push_latest:
        description: Also push a :latest tag (set false when rebuilding old versions)
        type: boolean
        default: false
      registry:
        description: Container registry host
        type: string
        default: "ghcr.io"
      registry_username:
        description: Registry login username (defaults to github.actor when empty)
        type: string
        default: ""
      scan_after_build:
        description: Run Trivy vulnerability scan on the pushed image
        type: boolean
        default: true
      trivy_severity:
        description: Trivy severity levels to report
        type: string
        default: "CRITICAL,HIGH"
      fail_on_scan_findings:
        description: Fail the job if Trivy finds vulnerabilities
        type: boolean
        default: false
      fetch_depth:
        type: number
        default: 0
    secrets:
      registry_token:
        description: Token for registry login (GITHUB_TOKEN or PAT)
        required: true
    outputs:
      image_digest:
        description: SHA digest of the pushed image
        value: ${{ jobs.build-push.outputs.image_digest }}
      image_ref:
        description: Full image reference (image_name:tag)
        value: ${{ jobs.build-push.outputs.image_ref }}

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.tags.outputs.primary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0 @ 2026-09-21

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 @ 2026-09-21

      - name: Log in to registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0 @ 2026-11-06
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry_username || github.actor }}
          password: ${{ secrets.registry_token }}

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          primary="${IMAGE}:${TAG}"
          tags="${primary}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "primary=${primary}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 @ 2026-09-21
        with:
          # The caller's build context; its Dockerfile runs caller code anyway.
          context: ${{ inputs.context }} # zizmor: ignore[template-injection]
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The library's own files at the commit of this workflow file: the
      # Trivy installer and its pins. `./scripts` would resolve in the
      # caller's checkout, so the library is checked out beside it.
      - name: Check out ci-helpers scripts at this workflow's commit
        if: ${{ inputs.scan_after_build }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-actions
          sparse-checkout: |
            scripts
            vendor/script-helpers
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's scripts after all; refuse instead.
      - name: Verify ci-helpers scripts commit
        if: ${{ inputs.scan_after_build }}
        shell: bash
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is '$WF_SHA', not a commit SHA."; exit 1; }
          got="$(git -C .ci-helpers-actions rev-parse HEAD)"
          [[ "$got" == "$WF_SHA" ]] || { echo "::error::checked out $got, expected $WF_SHA."; exit 1; }
          echo "ci-helpers scripts at $WF_SHA"

      # The Trivy binary, not the vendor's action: a release pinned by version
      # and sha256 in the library's scanner-pins.env, downloaded and checked
      # here. The vulnerability database is fetched in this step; the scan
      # below talks only to the registry the image was just pushed to.
      - name: Install Trivy
        if: ${{ inputs.scan_after_build }}
        id: trivy
        shell: bash
        run: bash .ci-helpers-actions/scripts/install_trivy.sh --download-db

      - name: Trivy scan (post-push)
        if: ${{ inputs.scan_after_build }}
        shell: bash
        env:
          TRIVY_BIN: ${{ steps.trivy.outputs.trivy_bin }}
          CACHE_DIR: ${{ steps.trivy.outputs.cache_dir }}
          IMAGE_REF: ${{ steps.tags.outputs.primary }}
          SEVERITY: ${{ inputs.trivy_severity }}
          EXIT_CODE: ${{ inputs.fail_on_scan_findings && '1' || '0' }}
        run: |
          set -euo pipefail
          "$TRIVY_BIN" --cache-dir "$CACHE_DIR" image \
            --skip-db-update --offline-scan --format table \
            --severity "$SEVERITY" --ignore-unfixed --exit-code "$EXIT_CODE" \
            "$IMAGE_REF"
