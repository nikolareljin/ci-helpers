    needs: build
    runs-on: ${{ inputs.push_runner }}
    timeout-minutes: 60
    permissions:
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ format('{0}:{1}', inputs.image_name, inputs.tag) }}
    steps:
      # The library's scripts and pins at this workflow's commit: the layout
      # check, login, push and the Trivy installer. `./scripts`
      # would resolve in the caller's checkout, so the library is checked out
      # beside it. A directory of that name already in the caller's tree is
      # refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
