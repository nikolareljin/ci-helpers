name: docker-multiarch
on:
  workflow_call:
    inputs:
      image_name:
        description: Full image name without tag (e.g. ghcr.io/owner/repo)
        type: string
        required: true
      tag:
        description: Primary version tag to push (e.g. 1.2.3)
        type: string
        required: true
      platforms:
        description: Comma-separated buildx platform list
        type: string
        default: "linux/amd64,linux/arm64"
      dockerfile:
        description: Path to the Dockerfile (relative to context)
        type: string
        default: "Dockerfile"
      context:
        description: Docker build context path
        type: string
        default: "."
      build_args:
        description: Newline-delimited ARG=VALUE pairs passed to docker build. Not for secrets - on a public repository the provenance attestation (mode=max) publishes every build-arg value with the image
        type: string
        default: ""
      push_latest:
        description: Also push a :latest tag (set false when rebuilding old versions)
        type: boolean
        default: false
      registry:
        description: Container registry host
        type: string
        default: "ghcr.io"
      registry_username:
        description: Registry login username (defaults to github.actor when empty)
        type: string
        default: ""
      scan_after_build:
        description: Run Trivy vulnerability scan on the pushed image
        type: boolean
        default: true
      trivy_severity:
        description: Trivy severity levels to report
        type: string
        default: "CRITICAL,HIGH"
      fail_on_scan_findings:
        description: Fail the job if Trivy finds vulnerabilities
        type: boolean
        default: false
      fetch_depth:
        type: number
        default: 0
    secrets:
      registry_token:
        description: Token for registry login (GITHUB_TOKEN or PAT)
        required: true
    outputs:
      image_digest:
        description: SHA digest of the pushed image
        value: ${{ jobs.build-push.outputs.image_digest }}
      image_ref:
        description: Full image reference (image_name:tag)
        value: ${{ jobs.build-push.outputs.image_ref }}

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.tags.outputs.primary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 @ 2026-08-24
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      # The library's scripts and pins at this workflow's commit: the QEMU,
      # buildx, login and build steps and the Trivy installer. `./scripts`
      # would resolve in the caller's checkout, so the library is checked out
      # beside it. A directory of that name already in the caller's tree is
      # refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      # An empty job.workflow_sha would make the checkout above fall back to the
      # default branch and run today's scripts after all; refuse instead.
      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # QEMU user-mode emulators from the binfmt image pinned by digest in
      # the library's toolchain-pins.env; every platform, as before.
      - name: Set up QEMU (cross-arch emulation)
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          QEMU_PLATFORMS: all
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" QEMU_PLATFORMS="$QEMU_PLATFORMS" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_qemu.sh"
          CI_HELPERS_RUN
          )"

      # A docker-container builder on the runner's buildx, running the
      # BuildKit image pinned in toolchain-pins.env.
      - name: Set up Docker Buildx
        id: buildx
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_buildx.sh"
          CI_HELPERS_RUN
          )"

      # The token reaches docker on stdin; it is in no argument and no log.
      - name: Log in to registry
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          REGISTRY: ${{ inputs.registry }}
          REGISTRY_USERNAME: ${{ inputs.registry_username || github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.registry_token }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" REGISTRY="$REGISTRY" REGISTRY_USERNAME="$REGISTRY_USERNAME" REGISTRY_PASSWORD="$REGISTRY_PASSWORD" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /bin/bash "$run_lib/scripts/docker_login.sh"
          CI_HELPERS_RUN
          )"

      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        shell: bash
        run: |
          set -euo pipefail
          primary="${IMAGE}:${TAG}"
          tags="${primary}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "primary=${primary}" >> "${GITHUB_OUTPUT}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      # Every former input, as an environment variable: the caller's build
      # context and Dockerfile, the platforms, the tags computed above, the
      # build-args, and a push. No layer cache from the Actions cache: this
      # job pushes with the registry token, and a restored layer is a layer of
      # the pushed image, built by whichever run owned the key first
      # (scripts/check_cache_trust.py). Every layer is built here.
      - name: Build and push multi-arch image
        id: build
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORMS: ${{ inputs.platforms }}
          TAGS: ${{ steps.tags.outputs.tags }}
          BUILD_ARGS: ${{ inputs.build_args }}
          BUILDER: ${{ steps.buildx.outputs.name }}
          PUSH: "true"
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" CONTEXT="$CONTEXT" DOCKERFILE="$DOCKERFILE" PLATFORMS="$PLATFORMS" TAGS="$TAGS" BUILD_ARGS="$BUILD_ARGS" BUILDER="$BUILDER" PUSH="$PUSH" REPOSITORY_PRIVATE="$REPOSITORY_PRIVATE" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /bin/bash "$run_lib/scripts/docker_build.sh"
          CI_HELPERS_RUN
          )"

      # The Trivy binary, not the vendor's action: a release pinned by version
      # and sha256 in the library's scanner-pins.env, downloaded and checked
      # here. The vulnerability database is fetched in this step; the scan
      # below talks only to the registry the image was just pushed to.
      - name: Install Trivy
        if: ${{ inputs.scan_after_build }}
        id: trivy
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          /bin/bash "$run_lib/scripts/install_trivy.sh" --download-db
          CI_HELPERS_RUN
          )"

      - name: Trivy scan (post-push)
        if: ${{ inputs.scan_after_build }}
        shell: bash
        env:
          TRIVY_BIN: ${{ steps.trivy.outputs.trivy_bin }}
          CACHE_DIR: ${{ steps.trivy.outputs.cache_dir }}
          IMAGE_REF: ${{ steps.tags.outputs.primary }}
          SEVERITY: ${{ inputs.trivy_severity }}
          EXIT_CODE: ${{ inputs.fail_on_scan_findings && '1' || '0' }}
        run: |
          set -euo pipefail
          "$TRIVY_BIN" --cache-dir "$CACHE_DIR" --disable-telemetry --skip-version-check image \
            --skip-db-update --offline-scan --format table \
            --severity "$SEVERITY" --ignore-unfixed --exit-code "$EXIT_CODE" \
            "$IMAGE_REF"

      # The registry session ends with the job, whatever the build did, as
      # the login action's post step did.
      - name: Log out of registry
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          REGISTRY: ${{ inputs.registry }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" REGISTRY="$REGISTRY" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
