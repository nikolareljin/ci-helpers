name: Flutter Release

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      flutter_version:
        type: string
        # Empty: the release pinned in the library's toolchain-pins.env on
        # the stable channel, the newest release on another. Set this to pin
        # another exact version, or `X.Y` for the newest of that line. A
        # channel name here is read as the channel, as it was before.
        default: ""
      flutter_channel:
        type: string
        default: stable
      java_version:
        type: string
        default: "17"
      ruby_version:
        type: string
        default: "3.4"
      build_android:
        type: boolean
        default: true
      build_ios:
        type: boolean
        default: false
      deploy_google_play:
        type: boolean
        default: false
      deploy_app_store:
        type: boolean
        default: false
      android_build_command:
        type: string
        default: "flutter build appbundle --release"
      ios_build_command:
        type: string
        default: "flutter build ipa --release"
      android_artifact_path:
        type: string
        default: "build/app/outputs/bundle/release/*.aab"
      ios_artifact_path:
        type: string
        default: "build/ios/ipa/*.ipa"
      upload_artifacts:
        type: boolean
        default: true
      android_artifact_name:
        type: string
        default: flutter-android
      ios_artifact_name:
        type: string
        default: flutter-ios
      fastlane_android_lane:
        type: string
        default: android_release
      fastlane_ios_lane:
        type: string
        default: ios_release
      # A hung job otherwise bills until GitHub's six-hour default, and this one
      # can run on a macOS runner at a 10x minute multiplier. Sixty minutes
      # covers a cold Flutter + fastlane build; raise it for a genuinely longer
      # one rather than removing it.
      timeout_minutes:
        type: number
        default: 60
    secrets:
      android_keystore_base64:
        required: false
      android_keystore_password:
        required: false
      android_key_alias:
        required: false
      android_key_password:
        required: false
      google_play_service_account_json:
        required: false
      app_store_connect_api_key_base64:
        required: false
      app_store_connect_key_id:
        required: false
      app_store_connect_issuer_id:
        required: false
      match_git_url:
        required: false
      match_password:
        required: false
      match_git_basic_authorization:
        required: false

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flutter_release:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working_directory }}
    # No secret at job level: `flutter pub get`, the build commands and their
    # dependencies run in this job. Each secret is env on the steps that use it.
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE_PATH: .tmp/google-play.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Validate App Store runner
        if: ${{ inputs.deploy_app_store && runner.os != 'macOS' }}
        run: |
          echo "App Store uploads require a macOS runner." >&2
          exit 1

      # Toolchains first, secrets after. Every step below that decodes a
      # secret or writes one to disk runs after the last toolchain step, so
      # an installer, a resolver or a gem never runs beside a keystore or a
      # store credential. tests/flutter_release_secret_order_test.sh holds
      # the order.
      - name: Setup Java
        if: ${{ inputs.build_android || inputs.deploy_google_play }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0 @ 2026-11-06
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify ci-helpers scripts commit
        working-directory: ${{ github.workspace }}
        env:
          WF_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$WF_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::job.workflow_sha is empty"; exit 1; }
          [[ "$(git -C .ci-helpers-scripts rev-parse HEAD)" == "$WF_SHA" ]] || { echo "::error::ci-helpers checkout is not $WF_SHA"; exit 1; }
          if git rev-parse --git-dir >/dev/null 2>&1; then
            printf '\n/.ci-helpers-scripts/\n' >> "$(git rev-parse --git-path info/exclude)"
          fi

      # Flutter from the official release archive, checked against the
      # manifest's sha256 and, for the pinned default, the library's
      # toolchain-pins.env. A channel name in flutter_version is honoured as
      # the channel, as before; flutter_channel wins when both are set.
      - name: Setup Flutter
        working-directory: ${{ github.workspace }}
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
          FLUTTER_CHANNEL: ${{ inputs.flutter_channel }}
        run: bash .ci-helpers-scripts/scripts/setup_flutter.sh

      - name: Flutter pub get
        run: flutter pub get

      # Ruby from the runner's tool cache (3.2, 3.3, 3.4 and 4.0 on the hosted
      # images), matched as the action matched it: `3.4` is the newest 3.4.z.
      # Nothing is downloaded; a version the cache lacks fails with the list.
      - name: Setup Ruby
        id: ruby
        if: ${{ inputs.deploy_google_play || inputs.deploy_app_store }}
        working-directory: ${{ github.workspace }}
        env:
          RUBY_VERSION: ${{ inputs.ruby_version }}
        run: bash .ci-helpers-scripts/scripts/setup_ruby.sh

      # The gems the lockfile names, under vendor/bundle, keyed as the
      # action's bundler-cache keyed them: platform, Ruby and the lockfile.
      - name: Cache gems
        if: ${{ (inputs.deploy_google_play || inputs.deploy_app_store) && hashFiles(format('{0}/Gemfile.lock', inputs.working_directory)) != '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 @ 2026-09-21
        with:
          path: ${{ inputs.working_directory }}/vendor/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-ruby-${{ steps.ruby.outputs.ruby_version }}-${{ hashFiles(format('{0}/Gemfile.lock', inputs.working_directory)) }}
          restore-keys: |
            gems-${{ runner.os }}-${{ runner.arch }}-ruby-${{ steps.ruby.outputs.ruby_version }}-

      # With a Gemfile.lock the install is deployment mode, as the action's
      # bundler-cache set it: the lockfile is frozen, a Gemfile that disagrees
      # fails here, not in a lane.
      - name: Install gems (Gemfile)
        if: ${{ (inputs.deploy_google_play || inputs.deploy_app_store) && hashFiles(format('{0}/Gemfile', inputs.working_directory)) != '' }}
        run: |
          set -euo pipefail
          bundle config set --local path vendor/bundle
          if [ -f Gemfile.lock ]; then
            bundle config set --local deployment true
          fi
          bundle install --jobs 4

      - name: Install Fastlane (no Gemfile)
        if: ${{ (inputs.deploy_google_play || inputs.deploy_app_store) && hashFiles(format('{0}/Gemfile', inputs.working_directory)) == '' }}
        env:
          FASTLANE_VERSION: ${{ steps.ruby.outputs.fastlane_version }}
        run: |
          set -euo pipefail
          [[ "$FASTLANE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::fastlane version '$FASTLANE_VERSION' is not X.Y.Z" >&2; exit 1; }
          gem install fastlane -N -v "$FASTLANE_VERSION"

      - name: Note for Android signing config
        if: ${{ inputs.build_android || inputs.deploy_google_play }}
        env:
          FR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          echo "Android signing expects android/key.properties at the Flutter project's android/ directory."
          echo "Ensure android/app/build.gradle loads it via: rootProject.file('key.properties')"
          echo "Path resolves relative to the android/ directory (e.g., ${GITHUB_WORKSPACE}/${FR_WORKING_DIRECTORY}/android/key.properties)."

      - name: Note for App Store deploys
        if: ${{ inputs.deploy_app_store }}
        run: |
          echo "App Store deploys expect Fastlane to build/upload in the iOS lane."
          echo "When deploy_app_store=true, the standalone iOS build step is skipped even if build_ios=true."

      # Secrets from here on. Each is env on the steps that use it and
      # nowhere else; the files are removed in the always() cleanup step.
      - name: Mask fastlane match secrets
        if: ${{ inputs.deploy_app_store && runner.os == 'macOS' }}
        env:
          MATCH_GIT_URL: ${{ secrets.match_git_url }}
          MATCH_PASSWORD: ${{ secrets.match_password }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.match_git_basic_authorization }}
        run: |
          set -euo pipefail
          set +x
          secrets_to_mask=(
            "${MATCH_GIT_URL}"
            "${MATCH_PASSWORD}"
            "${MATCH_GIT_BASIC_AUTHORIZATION}"
          )
          for secret_value in "${secrets_to_mask[@]}"; do
            if [[ -n "${secret_value}" ]]; then
              # Workflow commands are line-oriented. Escape command-data control
              # characters so multiline values stay within one mask command.
              escaped_secret="${secret_value//'%'/'%25'}"
              escaped_secret="${escaped_secret//$'\r'/'%0D'}"
              escaped_secret="${escaped_secret//$'\n'/'%0A'}"
              printf '::add-mask::%s\n' "${escaped_secret}"
            fi
          done

      - name: Validate Android signing secrets
        if: ${{ inputs.build_android || inputs.deploy_google_play }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_PASSWORD: ${{ secrets.android_key_password }}
          ANDROID_KEY_ALIAS: ${{ secrets.android_key_alias }}
          DEPLOY_GOOGLE_PLAY: ${{ inputs.deploy_google_play }}
        run: |
          set -euo pipefail
          signing_missing=false
          [[ -z "${ANDROID_KEYSTORE_BASE64}" ]] && signing_missing=true
          [[ -z "${ANDROID_KEYSTORE_PASSWORD}" ]] && signing_missing=true
          [[ -z "${ANDROID_KEY_PASSWORD}" ]] && signing_missing=true
          [[ -z "${ANDROID_KEY_ALIAS}" ]] && signing_missing=true
          if [[ "${signing_missing}" == "true" ]]; then
            if [[ "${DEPLOY_GOOGLE_PLAY}" == "true" ]]; then
              echo "Missing Android signing secrets. Provide android_keystore_base64, android_keystore_password, android_key_password, and android_key_alias." >&2
              exit 1
            fi
            # Distinguish between no secrets (expected for debug builds) and a partial set (likely misconfiguration).
            if [[ -z "${ANDROID_KEYSTORE_BASE64}" && -z "${ANDROID_KEYSTORE_PASSWORD}" && -z "${ANDROID_KEY_PASSWORD}" && -z "${ANDROID_KEY_ALIAS}" ]]; then
              echo "::warning::No Android signing secrets provided; build will use the project's default signing config."
            else
              echo "::warning::Incomplete Android signing secrets: only some of the four required secrets are set. Custom signing will be skipped and the project's default signing config will be used. To enable custom signing, provide all four: android_keystore_base64, android_keystore_password, android_key_password, and android_key_alias."
            fi
          fi

      - name: Validate Google Play credentials
        if: ${{ inputs.deploy_google_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.google_play_service_account_json }}
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET}" ]]; then
            echo "Missing Google Play service account JSON. Provide google_play_service_account_json." >&2
            exit 1
          fi

      - name: Validate App Store Connect credentials
        if: ${{ inputs.deploy_app_store }}
        env:
          FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.app_store_connect_api_key_base64 }}
          FASTLANE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.app_store_connect_key_id }}
          FASTLANE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.app_store_connect_issuer_id }}
        run: |
          set -euo pipefail
          if [[ -z "${FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64}" || -z "${FASTLANE_APP_STORE_CONNECT_KEY_ID}" || -z "${FASTLANE_APP_STORE_CONNECT_ISSUER_ID}" ]]; then
            echo "Missing App Store Connect API key secrets. Provide app_store_connect_api_key_base64, app_store_connect_key_id, and app_store_connect_issuer_id." >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            echo "App Store deploys require a macOS runner." >&2
            exit 1
          fi

      - name: Configure Android signing
        if: ${{ inputs.build_android || inputs.deploy_google_play }}
        env:
          FR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_PASSWORD: ${{ secrets.android_key_password }}
          ANDROID_KEY_ALIAS: ${{ secrets.android_key_alias }}
          DEPLOY_GOOGLE_PLAY: ${{ inputs.deploy_google_play }}
        run: |
          set -euo pipefail
          # Require all four secrets to be present before writing key.properties.
          # A partial set would produce a broken config with empty values causing
          # hard-to-diagnose Gradle failures; skip cleanly instead.
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" || -z "${ANDROID_KEYSTORE_PASSWORD}" || -z "${ANDROID_KEY_PASSWORD}" || -z "${ANDROID_KEY_ALIAS}" ]]; then
            echo "Signing secrets absent or incomplete; skipping key.properties setup."
            exit 0
          fi
          set +x
          umask 077
          {
            echo "::add-mask::${ANDROID_KEYSTORE_BASE64}"
            echo "::add-mask::${ANDROID_KEYSTORE_PASSWORD}"
            echo "::add-mask::${ANDROID_KEY_PASSWORD}"
            echo "::add-mask::${ANDROID_KEY_ALIAS}"
          }
          android_dir="${GITHUB_WORKSPACE}/${FR_WORKING_DIRECTORY}/android"
          mkdir -p "${android_dir}"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${android_dir}/upload-keystore.jks"
          printf '%s\n' \
            'storeFile=upload-keystore.jks' \
            "storePassword=${ANDROID_KEYSTORE_PASSWORD}" \
            "keyPassword=${ANDROID_KEY_PASSWORD}" \
            "keyAlias=${ANDROID_KEY_ALIAS}" \
            > "${android_dir}/key.properties"
          chmod 600 "${android_dir}/upload-keystore.jks" "${android_dir}/key.properties"
          # For Google Play deployments, validate the keystore is usable before proceeding.
          # This catches invalid/placeholder credentials early rather than failing deep in Gradle.
          if [[ "${DEPLOY_GOOGLE_PLAY}" == "true" ]]; then
            if ! keytool -list \
                -keystore "${android_dir}/upload-keystore.jks" \
                -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
                -alias "${ANDROID_KEY_ALIAS}" \
                > /dev/null 2>&1; then
              echo "Android keystore validation failed: verify that android_keystore_base64 is a valid JKS/PKCS12 keystore, android_keystore_password is correct, and the alias exists in the keystore." >&2
              exit 1
            fi
            echo "Android keystore validated for Google Play deployment."
          fi
          set -x

      - name: Build Android appbundle
        if: ${{ inputs.build_android }}
        env:
          FR_ANDROID_BUILD_COMMAND: ${{ inputs.android_build_command }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_PASSWORD: ${{ secrets.android_key_password }}
          ANDROID_KEY_ALIAS: ${{ secrets.android_key_alias }}
        run: |
          set -euo pipefail
          # Code by design, run in this shell as the inline form did.
          eval "$FR_ANDROID_BUILD_COMMAND"

      - name: Build iOS (no codesign)
        if: ${{ inputs.build_ios && !inputs.deploy_app_store }}
        env:
          FR_IOS_BUILD_COMMAND: ${{ inputs.ios_build_command }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" != "macOS" ]]; then
            echo "iOS builds require a macOS runner." >&2
            exit 1
          fi
          # Code by design, run in this shell as the inline form did.
          eval "$FR_IOS_BUILD_COMMAND"

      - name: Prepare Google Play credentials
        if: ${{ inputs.deploy_google_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.google_play_service_account_json }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          echo "::add-mask::${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET}"
          mkdir -p "$(dirname "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE_PATH}")"
          printf '%s' "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET}" > "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE_PATH}"
          chmod 600 "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE_PATH}"
          set -x

      - name: Prepare App Store Connect API key
        if: ${{ inputs.deploy_app_store && runner.os == 'macOS' }}
        env:
          FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.app_store_connect_api_key_base64 }}
          FASTLANE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.app_store_connect_key_id }}
          FASTLANE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.app_store_connect_issuer_id }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          {
            echo "::add-mask::${FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64}"
            echo "::add-mask::${FASTLANE_APP_STORE_CONNECT_KEY_ID}"
            echo "::add-mask::${FASTLANE_APP_STORE_CONNECT_ISSUER_ID}"
          }
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64}" | base64 -d > ~/.appstoreconnect/private_keys/"AuthKey_${FASTLANE_APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${FASTLANE_APP_STORE_CONNECT_KEY_ID}.p8"
          set -x

      - name: Deploy to Google Play via Fastlane
        if: ${{ inputs.deploy_google_play }}
        env:
          FR_FASTLANE_ANDROID_LANE: ${{ inputs.fastlane_android_lane }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.android_keystore_base64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.android_keystore_password }}
          ANDROID_KEY_PASSWORD: ${{ secrets.android_key_password }}
          ANDROID_KEY_ALIAS: ${{ secrets.android_key_alias }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_SECRET: ${{ secrets.google_play_service_account_json }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: .tmp/google-play.json
        run: |
          set -euo pipefail
          # A lane and its options, split as the shell would split quoted
          # words (notes:"a b" stays one), but never expanded or run.
          # A file, not a pipe, so an unbalanced quote fails the step.
          words="$(mktemp)"
          python3 -c 'import shlex, sys; sys.stdout.write("".join(w + "\0" for w in shlex.split(sys.argv[1])))' "$FR_FASTLANE_ANDROID_LANE" > "$words"
          lane=()
          while IFS= read -r -d '' w; do lane+=("$w"); done < "$words"
          if [ -f Gemfile ]; then
            bundle exec fastlane "${lane[@]}"
          else
            fastlane "${lane[@]}"
          fi

      - name: Deploy to App Store via Fastlane
        if: ${{ inputs.deploy_app_store && runner.os == 'macOS' }}
        env:
          FR_FASTLANE_IOS_LANE: ${{ inputs.fastlane_ios_lane }}
          FASTLANE_APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.app_store_connect_api_key_base64 }}
          FASTLANE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.app_store_connect_key_id }}
          FASTLANE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.app_store_connect_issuer_id }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.app_store_connect_key_id }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.app_store_connect_issuer_id }}
          # Scoped here (not job-level) so match credentials are only exposed to
          # the iOS deploy step. fastlane match reads these to sync certs/profiles.
          MATCH_GIT_URL: ${{ secrets.match_git_url }}
          MATCH_PASSWORD: ${{ secrets.match_password }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.match_git_basic_authorization }}
        run: |
          set -euo pipefail
          # A lane and its options, split as the shell would split quoted
          # words (notes:"a b" stays one), but never expanded or run.
          # A file, not a pipe, so an unbalanced quote fails the step.
          words="$(mktemp)"
          python3 -c 'import shlex, sys; sys.stdout.write("".join(w + "\0" for w in shlex.split(sys.argv[1])))' "$FR_FASTLANE_IOS_LANE" > "$words"
          lane=()
          while IFS= read -r -d '' w; do lane+=("$w"); done < "$words"
          if [ -f Gemfile ]; then
            bundle exec fastlane "${lane[@]}"
          else
            fastlane "${lane[@]}"
          fi

      - name: Cleanup signing and deploy credentials
        if: ${{ always() && (inputs.build_android || inputs.deploy_google_play || inputs.deploy_app_store) }}
        env:
          FR_WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FASTLANE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.app_store_connect_key_id }}
        run: |
          set -euo pipefail
          android_dir="${GITHUB_WORKSPACE}/${FR_WORKING_DIRECTORY}/android"
          rm -f "${android_dir}/upload-keystore.jks" "${android_dir}/key.properties"

          google_play_json="${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_FILE_PATH}"
          rm -f "${google_play_json}"

          appstore_keys_dir="${HOME}/.appstoreconnect/private_keys"
          if [ -n "${FASTLANE_APP_STORE_CONNECT_KEY_ID:-}" ]; then
            appstore_key_file="${appstore_keys_dir}/AuthKey_${FASTLANE_APP_STORE_CONNECT_KEY_ID}.p8"
            rm -f "${appstore_key_file}" || true
          fi
          rmdir "${appstore_keys_dir}" 2>/dev/null || true
          rmdir "${HOME}/.appstoreconnect" 2>/dev/null || true

      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if git rev-parse --git-dir >/dev/null 2>&1; then
            exclude=$(git rev-parse --git-path info/exclude)
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (inputs.upload_artifacts && inputs.build_android) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            name: ${{ inputs.android_artifact_name }}
          mode: artifact
          paths: ${{ inputs.working_directory }}/${{ inputs.android_artifact_path }}


      - name: Upload Android artifact
        if: ${{ (inputs.upload_artifacts && inputs.build_android) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.android_artifact_name }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
      - name: Check publication files
        id: ci_publication_check_2
        if: ${{ (inputs.upload_artifacts && inputs.build_ios && !inputs.deploy_app_store) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        with:
          metadata: |
            name: ${{ inputs.ios_artifact_name }}
          mode: artifact
          paths: ${{ inputs.working_directory }}/${{ inputs.ios_artifact_path }}

      - name: Upload iOS artifact
        if: ${{ (inputs.upload_artifacts && inputs.build_ios && !inputs.deploy_app_store) && steps.ci_publication_check_2.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ inputs.ios_artifact_name }}
          path: ${{ steps.ci_publication_check_2.outputs.paths }}
