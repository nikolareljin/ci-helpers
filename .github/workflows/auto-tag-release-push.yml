name: auto-tag-release-push
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # The same two checks production-branch.yml runs -- but that workflow is
  # triggered by a tag push, and the tag is pushed by GITHUB_TOKEN, which does
  # not fire workflows. So it never ran on the automated path, and `production`
  # advanced without a stale-pin or floating-ref check since the day the
  # automation landed. This runs them before the tag is cut.
  gate:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
      - name: Check stale SHA pins
        shell: bash
        # A merged Dependabot bump leaves its comment behind until the next
        # release branch moves it, so an ordinary merge may pass with
        # --allow-newer-tag. A release merge may not. The release detection in
        # auto-tag.yml runs after this gate, so this asks GitHub itself: only a
        # merged pull request that is this very commit and not from release/
        # relaxes the check. A direct push or a failed lookup stays strict.
        run: |
          subject="$(git log -1 --format=%s)"
          merge_pattern='^Merge pull request #([0-9]+) '
          squash_pattern='\(#([0-9]+)\)$'
          pr=""
          if [[ "$subject" =~ $merge_pattern ]] || [[ "$subject" =~ $squash_pattern ]]; then
            pr="${BASH_REMATCH[1]}"
          fi
          answer=""
          if [[ -n "$pr" ]]; then
            answer="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '"\(.merged_at != null) \(.merge_commit_sha) \(.head.ref // "")"')" || answer=""
          fi
          read -r merged merge_sha head_ref <<< "$answer"
          if [[ "$merged" == "true" && "$merge_sha" == "$GITHUB_SHA" && -n "$head_ref" && "$head_ref" != release/* ]]; then
            bash scripts/update_pinned_actions.sh --check --allow-newer-tag
          else
            rc=0
            bash scripts/update_pinned_actions.sh --check || rc=$?
            if (( rc != 0 )); then
              echo "::error::Strict pin check failed, so no tag is cut. A stale or newer pin fails the same on a re-run; a lookup warning may not. After a release merge, see 'A release merge fails the pin gate' in docs/RELEASE_RC_PR.md."
            fi
            exit "$rc"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Detect floating action refs
        shell: bash
        run: bash scripts/check_floating_refs.sh
  tag:
    needs: [gate]
    # auto-tag-release.yml declares these at its top level; a caller job must
    # grant at least as much or the run fails at startup.
    permissions:
      contents: write
      pull-requests: read
      actions: write
    uses: ./.github/workflows/auto-tag-release.yml
    with:
      release_workflow: create-github-release.yml
      # This repository carries a floating `production` ref that roughly 275
      # consumer references follow, so it opts into the move. A candidate is
      # tagged but never moves `production` -- that is a rule in auto-tag.yml,
      # not something set here.
      update_production_tag: true
