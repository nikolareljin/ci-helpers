name: php-scan
on:
  workflow_call:
    inputs:
      runner:
        type: string
        # ubuntu-24.04 until the ondrej/php PPA ships a suite for ubuntu-latest
        # (26.04); scripts/check_php_runner.py holds PHP jobs to it.
        default: ubuntu-24.04
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      php_version:
        type: string
        default: "8.4"
      composer_command:
        type: string
        default: "composer install --no-interaction --prefer-dist"
      # Dependency advisories, from the Packagist security API. On by default:
      # `composer audit` ships with Composer 2.4 and later, needs no account
      # and no key, and this preset has no call sites to surprise -- measured
      # on 2026-09-29 across every repository in the workspace, it has none at
      # all.
      #
      # What this catches that Composer does not already: Composer 2.9 blocks a
      # package with a known advisory when it *resolves* one, but `composer
      # install` from an existing `composer.lock` does not resolve. A lock
      # written while its packages were clean keeps installing after they stop
      # being clean, and nothing looks at it again. This stage is what looks.
      #
      # `--no-interaction` because a TTY-less runner must never be prompted;
      # set to "" to disable the stage, as with every other command here.
      audit_command:
        description: >
          Dependency advisories from the Packagist security API, on by default.
          Composer 2.9 already blocks a package with a known advisory when it
          *resolves* one, but `composer install` from an existing
          `composer.lock` does not resolve: a lock written while its packages
          were clean keeps installing after they stop being clean, and nothing
          looks at it again. This stage is what looks. Set to "" to disable it.
        type: string
        default: "composer audit --no-interaction"
      unit_command:
        type: string
        default: "vendor/bin/phpunit"
      lint_wp_command:
        type: string
        default: "vendor/bin/phpcs --standard=WordPress --extensions=php"
      lint_drupal_command:
        type: string
        default: "vendor/bin/phpcs --standard=Drupal --extensions=php"
      # --test reports style violations and exits non-zero; without it pint
      # rewrites the files in the runner's checkout and always succeeds.
      lint_laravel_command:
        type: string
        default: "vendor/bin/pint --test"
      lint_pimcore_command:
        type: string
        default: "vendor/bin/phpcs --standard=PSR12 --extensions=php src/"
      wp_cli_scan:
        type: boolean
        default: true
      wp_root:
        type: string
        default: "wp-cli-site"
      wp_site_url:
        type: string
        default: "http://localhost:8080"
      wp_site_title:
        type: string
        default: "CI Site"
      wp_admin_user:
        type: string
        default: "admin"
      wp_admin_password:
        description: >
          Admin password for the throwaway test site. Empty (the default) uses a
          random one per run; a value passed here is shown with the run's inputs.
        type: string
        default: ""
      wp_admin_email:
        type: string
        default: "admin@example.com"
      wp_posts_count:
        type: number
        default: 10

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # The library's scripts, at this workflow's commit. A directory of that
      # name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # PHP from apt: the image's own packages, else the ondrej/php PPA under
      # the key fingerprint pinned in the library's toolchain-pins.env; Xdebug
      # for coverage as the replaced action enabled it; Composer at the
      # release pinned there, installed after its sha256 matches.
      - name: Setup PHP
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PHP_VERSION: ${{ inputs.php_version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" PHP_VERSION="$PHP_VERSION" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          export PATH="$STEP_PATH"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_php.sh"
          CI_HELPERS_RUN
          )"

      - name: Detect WordPress/Drupal project
        id: detect_php_frameworks
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          is_wordpress=false
          is_drupal=false

          if [ -f wp-config.php ] || [ -d wp-content ] || [ -f wp-includes/version.php ]; then
            is_wordpress=true
          fi
          if [ "$is_wordpress" = "false" ] && [ -f composer.json ]; then
            if grep -qiE '"(wordpress/|johnpbloch/wordpress|wp-cli/wp-cli|roots/wordpress|roots/bedrock)"' composer.json; then
              is_wordpress=true
            fi
          fi

          if [ -f core/lib/Drupal.php ] || [ -f web/core/lib/Drupal.php ] || \
             [ -f core/modules/system/system.module ] || [ -f web/core/modules/system/system.module ]; then
            is_drupal=true
          fi
          if [ "$is_drupal" = "false" ] && [ -f composer.json ]; then
            if grep -qiE '"(drupal/core|drupal/core-recommended|drupal/recommended-project)"' composer.json; then
              is_drupal=true
            fi
          fi

          is_pimcore=false
          # `[ -f src/*Bundle.php ]` only worked when exactly one file matched:
          # with none the glob stays literal, with several -f gets more than
          # one argument and the test errors out. A loop sees each match.
          for bundle in src/*Bundle.php; do
            if [ -f "$bundle" ]; then is_pimcore=true; break; fi
          done
          if [ "$is_pimcore" = "false" ] && [ -f composer.json ]; then
            if grep -qiE '"(pimcore/pimcore|pimcore/skeleton)"' composer.json; then
              is_pimcore=true
            fi
          fi
          if [ "$is_pimcore" = "false" ] && [ -f composer.json ]; then
            if grep -qiE '"type"[[:space:]]*:[[:space:]]*"pimcore-bundle"' composer.json; then
              is_pimcore=true
            fi
          fi

          echo "is_wordpress=$is_wordpress" >> "$GITHUB_OUTPUT"
          echo "is_drupal=$is_drupal" >> "$GITHUB_OUTPUT"
          echo "is_pimcore=$is_pimcore" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: ${{ inputs.composer_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.composer_command }}

      - name: Dependency audit
        if: ${{ inputs.audit_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.audit_command }}

      - name: PHP unit tests
        if: ${{ inputs.unit_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.unit_command }}

      - name: PHP lint (WordPress)
        if: ${{ inputs.lint_wp_command != '' && steps.detect_php_frameworks.outputs.is_wordpress == 'true' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_wp_command }}

      - name: PHP lint (Drupal)
        if: ${{ inputs.lint_drupal_command != '' && steps.detect_php_frameworks.outputs.is_drupal == 'true' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_drupal_command }}

      - name: PHP lint (Laravel)
        if: ${{ inputs.lint_laravel_command != '' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_laravel_command }}

      - name: PHP lint (Pimcore)
        if: ${{ inputs.lint_pimcore_command != '' && steps.detect_php_frameworks.outputs.is_pimcore == 'true' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          ${{ inputs.lint_pimcore_command }}

      - name: WP-CLI scan
        if: ${{ inputs.wp_cli_scan && steps.detect_php_frameworks.outputs.is_wordpress == 'true' }}
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          INPUT_WP_ROOT: ${{ inputs.wp_root }}
          INPUT_WP_SITE_URL: ${{ inputs.wp_site_url }}
          INPUT_WP_SITE_TITLE: ${{ inputs.wp_site_title }}
          INPUT_WP_ADMIN_USER: ${{ inputs.wp_admin_user }}
          INPUT_WP_ADMIN_PASSWORD: ${{ inputs.wp_admin_password }}
          INPUT_WP_ADMIN_EMAIL: ${{ inputs.wp_admin_email }}
          INPUT_WP_POSTS_COUNT: ${{ inputs.wp_posts_count }}
        run: |
          set -euo pipefail
          wp_root="${INPUT_WP_ROOT}"
          # Empty (the default) gets a random password per run: an input is
          # shown with the run, and this one sits on a command line.
          if [[ -z "$INPUT_WP_ADMIN_PASSWORD" ]]; then
            INPUT_WP_ADMIN_PASSWORD="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            export INPUT_WP_ADMIN_PASSWORD
          fi

          # -f: an HTTP error must fail here, not leave an error page to run as
          # PHP. A released phar with its digest pinned here: the rolling
          # gh-pages build and a checksum fetched beside it prove nothing about
          # who published it.
          wp_cli_url="https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar"
          expected="ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c"
          curl -fsSLo wp-cli.phar "$wp_cli_url"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum wp-cli.phar | awk '{ print $1 }')
          else
            actual=$(shasum -a 256 wp-cli.phar | awk '{ print $1 }')
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::wp-cli.phar sha256 mismatch: expected '${expected}', got '${actual}'" >&2
            rm -f wp-cli.phar
            exit 1
          fi
          php wp-cli.phar --info

          mkdir -p -- "$wp_root"

          for _ in {1..30}; do
            if nc -z 127.0.0.1 3306; then
              break
            fi
            sleep 2
          done

          php wp-cli.phar core download --path="$wp_root" --allow-root
          php wp-cli.phar config create \
            --path="$wp_root" \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --dbprefix=wp_ \
            --skip-check \
            --allow-root
          php wp-cli.phar db create --path="$wp_root" --allow-root
          php wp-cli.phar core install \
            --path="$wp_root" \
            --url="${INPUT_WP_SITE_URL}" \
            --title="${INPUT_WP_SITE_TITLE}" \
            --admin_user="${INPUT_WP_ADMIN_USER}" \
            --admin_password="${INPUT_WP_ADMIN_PASSWORD}" \
            --admin_email="${INPUT_WP_ADMIN_EMAIL}" \
            --skip-email \
            --allow-root
          php wp-cli.phar post generate \
            --path="$wp_root" \
            --count="${INPUT_WP_POSTS_COUNT}" \
            --post_type=post \
            --allow-root
          php wp-cli.phar plugin list --path="$wp_root" --format=table --allow-root

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
