      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -L .git || ( -e .git && ! -d .git ) ]]; then
            echo "::warning::.git is not a plain directory; not adding the publication checkout to its exclude file"
          elif [[ -d .git ]]; then
            gd="$(pwd -P)/.git"; exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --path-format=absolute --git-path info/exclude)
            [[ ! -x /usr/bin/cygpath ]] || exclude=$(/usr/bin/cygpath -u "$exclude")
            [[ "$exclude" == "$gd/info/exclude" && ! -L "$gd/info" && ! -L "$exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            name: ${{ steps.stage.outputs.artifact }}
          mode: artifact
          include_hidden_files: 'true'
          paths: ${{ runner.temp }}/cloudflare-out

      - name: Upload the deploy bundle
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          include-hidden-files: true
          name: ${{ steps.stage.outputs.artifact }}
          path: ${{ steps.ci_publication_check_1.outputs.paths }}
          if-no-files-found: error
          retention-days: 1

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done

  # Holds the token and the Environment. Checks out nothing of the caller's:
  # it uploads the bundle the build job made, each file checked against the
  # build manifest first, with the library's pinned wrangler.
  deploy:
    needs: [resolve, build]
    if: ${{ needs.resolve.outputs.mode == 'deploy' }}
    runs-on: ${{ inputs.deploy_runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # The Environment is what carries the token, the variables and the required
    # reviewer. It is declared here, on the called workflow's job, because a
    # calling job cannot declare one; that is also why the caller must use
    # `secrets: inherit` for an environment-scoped token.
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    # Namespaced, and keyed on the environment rather than the ref: two runs
    # deploying the same environment must not race, while staging and
    # production may proceed independently. cancel-in-progress stays false:
    # a half-finished deploy is worse than a queued one.
    concurrency:
      group: ci-helpers-cloudflare-deploy-${{ inputs.concurrency_key || needs.resolve.outputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
      url: ${{ steps.smoke.outputs.url }}
    steps:
      # First, before any toolchain setup: a missing credential should cost
      # seconds, not a full dependency install.
      #
      # The account id is the reason this step exists at all. wrangler treats an
      # empty accountId as "resolve it from the token", which is correct for a
      # token scoped to one account and a coin toss otherwise, so a deploy that
      # lands on the wrong account looks exactly like a deploy that worked.
      # Reading `vars` first and `secrets` second means putting it in either
      # place works; reading only one silently yields an empty string from the
      # other.
      - name: Preflight credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail
          failed=0
          if [ -z "${CF_TOKEN}" ]; then
            echo "::error::no CLOUDFLARE_API_TOKEN for environment '${ENVIRONMENT}'. Add it as an Environment secret and call this workflow with 'secrets: inherit', or as a repository secret passed explicitly"
            failed=1
          fi
          if [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "::error::no CLOUDFLARE_ACCOUNT_ID for environment '${ENVIRONMENT}'. Set the variable (preferred: it is an identifier, not a credential) or the secret of that name. wrangler does not fail on an empty account id; it picks one, which is why this is checked here"
            failed=1
          fi
          [ "${failed}" = "0" ] || exit 1
          # Length only. A secret-sourced id would be masked anyway, and the
          # point is to prove it is non-empty, not to print it.
          echo "account id is set (${#CF_ACCOUNT_ID} characters)"

      # The library's scripts and pins at this workflow's commit. A directory
      # of that name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # Node for wrangler, chosen by the library. No package cache.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 @ 2026-10-16
        with:
          node-version: "24"
          cache: ""
          package-manager-cache: false

      - name: Download the deploy bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/cloudflare-in

      # Every file against the manifest the build job wrote, no symlink, no
      # path outside the artifact; then the config check (scripts/cloudflare_wrangler.py).
      - name: Verify the deploy bundle against the build manifest
        id: verify
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          MANIFEST: ${{ needs.build.outputs.manifest }}
          CF_COMMAND: ${{ needs.resolve.outputs.command }}
          CF_ENV_NAME: ${{ needs.resolve.outputs.wrangler_env }}
          CF_CONFIG: ${{ needs.build.outputs.config }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" MANIFEST="$MANIFEST" CF_COMMAND="$CF_COMMAND" CF_ENV_NAME="$CF_ENV_NAME" CF_CONFIG="$CF_CONFIG" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          in="$RUNNER_TEMP/cloudflare-in"
          list="$RUNNER_TEMP/cloudflare-manifest.sha256"
          /usr/bin/printf '%s\n' "$MANIFEST" > "$list"
          if [[ "$CF_COMMAND" == "pages deploy" ]]; then
            /bin/bash "$run_lib/scripts/artifact_parts.sh" verify "$in" "$list" 'site/[^[:cntrl:]\\]+'
            [[ -d "$in/site" ]] || { echo "::error::the artifact has no site/ directory."; exit 1; }
          else
            /bin/bash "$run_lib/scripts/artifact_parts.sh" verify "$in" "$list" '(tree|bundle)/[^[:cntrl:]\\]+'
            # A checked copy of the config: `build` dropped, keys off the
            # allowlist refused. Source map comments must name bundle files.
            /usr/bin/python3 -I "$run_lib/scripts/cloudflare_wrangler.py" config "$in/tree" "$CF_CONFIG" "$CF_ENV_NAME" --write > "$RUNNER_TEMP/cloudflare-config.out"
            /usr/bin/python3 -I "$run_lib/scripts/cloudflare_wrangler.py" bundle "$in/bundle"
            while IFS='=' read -r k v; do
              case "$k" in
                config) echo "config=tree/$v" ;;
                entry) [[ -f "$in/bundle/$v" ]] || { echo "::error::the bundle has no $v." >&2; exit 1; }; echo "entry=bundle/$v" ;;
              esac
            done < "$RUNNER_TEMP/cloudflare-config.out" >> "$GITHUB_OUTPUT"
          fi
          CI_HELPERS_RUN
          )"

      # The tarball's sha256 from toolchain-pins.env, every dependency by the
      # lockfile's integrity, no package script.
      - name: Install the pinned wrangler
        id: wrangler
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH"  GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
          /bin/bash "$run_lib/scripts/setup_wrangler.sh"
          CI_HELPERS_RUN
          )"

      # The token reaches wrangler through its environment, never argv, and
      # only in this step. Every argument is built by scripts/cloudflare_wrangler.py
      # from checked values.
      - name: Deploy
        id: deploy
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          NODE: ${{ steps.wrangler.outputs.node }}
          WRANGLER_JS: ${{ steps.wrangler.outputs.wrangler }}
          CF_COMMAND: ${{ needs.resolve.outputs.command }}
          CF_DEPLOY_ARGS: ${{ needs.resolve.outputs.deploy_args }}
          CF_ENV_NAME: ${{ needs.resolve.outputs.wrangler_env }}
          CF_VERSION_VAR: ${{ inputs.version_var }}
          CF_VERSION: ${{ needs.build.outputs.version }}
          CF_CONFIG: ${{ steps.verify.outputs.config }}
          CF_ENTRY: ${{ steps.verify.outputs.entry }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NODE WRANGLER_JS CF_COMMAND CF_DEPLOY_ARGS CF_ENV_NAME CF_VERSION_VAR CF_VERSION CF_CONFIG CF_ENTRY GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          CF_WORKDIR="$RUNNER_TEMP/cloudflare-in" CF_PAGES_DIR=site /bin/bash "$run_lib/scripts/wrangler_run.sh" deploy
          CI_HELPERS_RUN
          )"

      - name: Smoke test
        id: smoke
        if: ${{ inputs.smoke_path != '' }}
        shell: bash
        env:
          IN_BASE_URL: ${{ inputs.base_url }}
          VAR_BASE_URL: ${{ vars.BASE_URL }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
          SMOKE_VERSION_PATH: ${{ inputs.smoke_version_path }}
          SMOKE_VERSION_FIELD: ${{ inputs.smoke_version_field }}
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          base="${IN_BASE_URL}"
          if [ -z "${base}" ]; then
            base="${VAR_BASE_URL:-}"
          fi
          if [ -z "${base}" ]; then
            echo "::error::smoke_path is set but there is no base URL. Pass base_url:, or set the BASE_URL variable on the environment"
            exit 1
          fi
          base="${base%/}"
          echo "url=${base}" >> "${GITHUB_OUTPUT}"

          # Retries: a deploy that has just landed may not be reachable
          # everywhere yet, and failing on that is a false alarm.
          echo "checking ${base}${SMOKE_PATH}"
          # -L: without it a 301 to a login or parked page exits 0 and the
          # check passes on a site that is not the service.
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            -o /dev/null "${base}${SMOKE_PATH}"

          if [ -z "${SMOKE_VERSION_PATH}" ]; then
            echo "::warning::reachability only: something answered, but nothing proved it is the version just deployed. Set smoke_version_path to assert it"
            exit 0
          fi

          body="$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
            "${base}${SMOKE_VERSION_PATH}")"
          actual="$(printf '%s' "${body}" | jq -r --arg k "${SMOKE_VERSION_FIELD}" '.[$k] // empty')"
          if [ -z "${actual}" ]; then
            echo "::error::no '${SMOKE_VERSION_FIELD}' field in the response from ${base}${SMOKE_VERSION_PATH}"
            exit 1
          fi
          if [ "${actual}" != "${DEPLOY_VERSION}" ]; then
            # The failure this exists to catch: the service answers, with the
            # release that was already live.
            echo "::error::live version is '${actual}', expected '${DEPLOY_VERSION}': the deploy did not take effect"
            exit 1
          fi
          echo "live version is ${actual}"

      - name: Record the result
        id: result
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          # Both, not just the deploy. A failed smoke test means the version now
          # live is not the one this run deployed -- reporting deployed=true
          # there would hand a caller a green light over the exact condition the
          # smoke test exists to detect. A skipped smoke test ('' or 'skipped')
          # is not a failure: the caller chose not to verify.
          if [ "${DEPLOY_OUTCOME}" = "success" ] && [ "${SMOKE_OUTCOME}" != "failure" ]; then
            echo "deployed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deployed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          RESOLVED_REF: ${{ needs.resolve.outputs.ref }}
          DEPLOY_VERSION: ${{ needs.build.outputs.version }}
          IN_COMMAND: ${{ needs.resolve.outputs.command }}
          CONFIG_PATH: ${{ needs.build.outputs.config }}
          SMOKE_URL: ${{ steps.smoke.outputs.url }}
          SMOKE_VERSION_PATH: ${{ inputs.smoke_version_path }}
          SMOKE_PATH: ${{ inputs.smoke_path }}
          DEPLOYED: ${{ steps.result.outputs.deployed }}
        run: |
          set -euo pipefail
          {
            echo "### Cloudflare deploy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Deployed | \`${DEPLOYED}\` |"
            echo "| Environment | \`${ENVIRONMENT}\` |"
            echo "| Ref | \`${RESOLVED_REF}\` |"
            echo "| Version | \`${DEPLOY_VERSION}\` |"
            echo "| Command | \`${IN_COMMAND}\` |"
            if [ -n "${CONFIG_PATH}" ]; then
              echo "| Config | \`${CONFIG_PATH}\` |"
            fi
            if [ -n "${SMOKE_URL}" ]; then
              echo "| URL | ${SMOKE_URL} |"
            fi
            echo
            if [ -z "${SMOKE_PATH}" ]; then
              echo "No smoke test ran."
            elif [ -z "${SMOKE_VERSION_PATH}" ]; then
              echo "**Version not asserted.** The smoke test proved something answered, not that it is"
              echo "the version above. Set \`smoke_version_path\` to assert it."
            else
              echo "Version asserted against \`${SMOKE_VERSION_PATH}\`."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
