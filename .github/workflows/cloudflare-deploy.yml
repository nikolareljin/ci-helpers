          IN_VERSION: ${{ inputs.version }}
          VERSION_FILE: ${{ inputs.version_file }}
          VERSION_SUFFIX: ${{ inputs.version_suffix }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${IN_VERSION}" ]; then
            value="${IN_VERSION}"
          else
            if [ ! -r "${VERSION_FILE}" ]; then
              echo "::error::version_file '${VERSION_FILE}' is not readable. Set version: explicitly, or point version_file at the right path"
              exit 1
            fi
            value="$(tr -d '[:space:]' < "${VERSION_FILE}")"
            if [ -z "${value}" ]; then
              echo "::error::version_file '${VERSION_FILE}' is empty"
              exit 1
            fi
            if [ "${VERSION_SUFFIX}" = "sha7" ]; then
              value="${value}-$(printf '%s' "${COMMIT_SHA}" | cut -c1-7)"
            fi
          fi
          echo "value=${value}" >> "${GITHUB_OUTPUT}"
          echo "version: ${value}"

      # Runs before the build so the build can read them, and after the version
      # so the version is in them. The build reads them; the version is not
      # computed twice.
      - name: Export the deploy contract
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
          IN_COMMAND: ${{ needs.resolve.outputs.command }}
          DEPLOY_VERSION: ${{ steps.version.outputs.value }}
          RESOLVED_REF: ${{ needs.resolve.outputs.ref }}
          IN_BASE_URL: ${{ inputs.base_url }}
          VAR_BASE_URL: ${{ vars.BASE_URL }}
          IN_DEPLOY_ARGS: ${{ needs.resolve.outputs.deploy_args }}
        run: |
          set -euo pipefail
          base="${IN_BASE_URL}"
          if [ -z "${base}" ]; then
            base="${VAR_BASE_URL:-}"
          fi

          # A random delimiter, not a fixed one. These values come from
          # repository variables and caller inputs, both of which may legally
          # contain a newline — and a newline in a $GITHUB_ENV value lets the
          # rest of the line be read as a further assignment.
          # create-github-release.yml makes the same argument about CHANGELOG
          # bodies.
          delim="EOF_$(openssl rand -hex 8 2>/dev/null || date +%s%N)"
          emit() {
            printf '%s<<%s\n%s\n%s\n' "$1" "${delim}" "$2" "${delim}" >> "${GITHUB_ENV}"
          }

