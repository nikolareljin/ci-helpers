          CI_HELPERS_RUN
          )"

      # Only regular files under working_directory; a file over 60 MiB leaves
      # as parts. The deploy job checks every file against this manifest.
      - name: Split and list the deploy bundle
        id: stage
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          WORKDIR: ${{ inputs.working_directory }}
          CF_COMMAND: ${{ needs.resolve.outputs.command }}
          CF_CONFIG: ${{ steps.config.outputs.path }}
          CF_ASSETS: ${{ steps.bundle.outputs.assets }}
          CF_PAGES_DIR: ${{ steps.wrangler_inputs.outputs.pages_dir }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" WORKDIR="$WORKDIR" CF_COMMAND="$CF_COMMAND" CF_CONFIG="$CF_CONFIG" CF_ASSETS="$CF_ASSETS" CF_PAGES_DIR="$CF_PAGES_DIR" RUN_ID="$RUN_ID" RUN_ATTEMPT="$RUN_ATTEMPT" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          work="$(cd "$GITHUB_WORKSPACE" && cd "$WORKDIR" && pwd -P)"
          out="$RUNNER_TEMP/cloudflare-out"
          list="$RUNNER_TEMP/cloudflare-manifest.sha256"
          if [[ "$CF_COMMAND" == "pages deploy" ]]; then
            /bin/rm -rf -- "$out"
            /bin/mkdir -p "$out"
            /bin/bash "$run_lib/scripts/cloudflare_stage.sh" pages "$work" "$out" "$CF_PAGES_DIR" > "$list"
          else
            /bin/bash "$run_lib/scripts/cloudflare_stage.sh" workers "$work" "$out" "$CF_CONFIG" ${CF_ASSETS:+"$CF_ASSETS"} > "$list"
          fi
          delim="EOF_$(/usr/bin/od -An -N8 -tx1 /dev/urandom | /usr/bin/tr -d ' \n')"
          {
            echo "artifact=cloudflare-deploy-${RUN_ID}-${RUN_ATTEMPT}-${delim#EOF_}"
            echo "manifest<<$delim"
            /bin/cat "$list"
