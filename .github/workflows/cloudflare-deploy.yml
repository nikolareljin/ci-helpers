          # system environment variable; it selects the active environment for
          # every command that accepts --env. Exporting it for the whole job
          # would defeat `wrangler_env: none`, so it is set only on the build
          # step, which is the documented use (build tools like the Vite plugin
          # read it), and by scripts/wrangler_run.sh.
          emit CF_DEPLOY_ENV "${ENVIRONMENT}"
          emit CF_DEPLOY_COMMAND "${IN_COMMAND}"
          emit CF_DEPLOY_VERSION "${DEPLOY_VERSION}"
          emit CF_DEPLOY_REF "${RESOLVED_REF}"
          emit CF_DEPLOY_BASE_URL "${base}"
          emit CF_DEPLOY_ARGS "${IN_DEPLOY_ARGS}"

      - name: Build
