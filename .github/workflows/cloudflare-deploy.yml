name: cloudflare-deploy
#
# Deploys to Cloudflare with wrangler, behind a kill switch and a GitHub
# Environment. Workers is the path this was built and exercised against; Pages
# is an input combination (command: "pages deploy"), documented in
# docs/presets.md.
#
# Two jobs. `build` (contents: read, no Cloudflare secret) checks out the
# caller, runs install_command and build_command, bundles the Worker with
# `wrangler deploy --dry-run` (or takes the Pages directory) and uploads the
# result with a sha256 manifest. `deploy` holds the token and the Environment,
# checks out nothing of the caller's, checks the artifact against the
# manifest and runs only the library's pinned wrangler (scripts/wrangler/,
# toolchain-pins.env) with arguments built from checked inputs. The config it
# deploys with is a checked copy: `build` is dropped (it already ran), and
# every key must be on an allowlist of wrangler keys that name data, so a
# key that would make wrangler run a command or read a file outside the
# artifact is refused (scripts/cloudflare_wrangler.py).
#
# deploy_command and wrangler_command are removed; a run that sets either
# fails in `resolve` and names what replaces it.
#
# DISABLED BY DEFAULT. Nothing deploys until the kill switch reads the string
# 'true' -- either the `enabled` input, or the repository variable
# CLOUDFLARE_DEPLOY_ENABLED when that input is empty. While it is off the
# `disabled-notice` job writes a job summary saying which environment was not
# deployed and how to arm it.
#
# THE CALLER MUST USE `secrets: inherit` when the token lives on an Environment.
# A job that calls a reusable workflow cannot declare `environment:`, and
# `on.workflow_call` has no `environment` keyword, so an environment-scoped
# secret cannot be passed explicitly; it is resolved by the `environment:`
# declared on the deploy job below. An explicit `secrets:` block still works
# for a repository-level secret.
#
# The build job has no Environment, so build_command sees repository
# variables only, not the Environment's.
#
# Pair it with cloudflare-build.yml when a repository validates its Worker on
# pull requests: that workflow declares no secrets at all.

on:
  workflow_call:
    inputs:
      # --- what, and where ---------------------------------------------------
      command:
        type: string
        default: deploy
        description: >
          One of: deploy, versions upload, pages deploy. Checked against that
          allowlist before wrangler runs — an allowlist rather than a free
          string because this value becomes argv.
      environment:
        type: string
        default: ""
        description: >
          The GitHub Environment to deploy through, and the wrangler --env name.
          Required, except on a bare-SemVer tag push, which resolves to
          production_environment. There is no un-environmented mode: the
          Environment is what carries the token, the variables and the reviewer.
      wrangler_env:
        type: string
        default: ""
        description: >
          Overrides the wrangler --env name when it differs from the GitHub
          Environment name. The literal 'none' omits --env entirely, which is
          what the Pages lane needs — `wrangler pages deploy` rejects it.
      ref:
        type: string
        default: ""
        description: Git ref to check out. Empty checks out the ref the run is on.
      production_environment:
        type: string
        default: production
        description: The environment a bare-SemVer tag push deploys to.

      # --- kill switch -------------------------------------------------------
      enabled:
        type: string
        default: ""
        description: >
          Pass the repository variable that arms deploys — an expression
          reading vars.CLOUDFLARE_DEPLOY_ENABLED from the caller. Empty falls
          back to reading that same variable here. Compared against the string
          'true'; anything else, including unset, disables.

      # --- runners -----------------------------------------------------------
      runner:
        type: string
        default: ubuntu-latest
        description: Runs the resolve and build jobs.
      deploy_runner:
        type: string
        default: ubuntu-latest
        description: >
          Runs the deploy job, which holds the Cloudflare token and runs no
          caller code. Linux with python3 3.11 or later at /usr/bin/python3.

      # --- build -------------------------------------------------------------
      timeout_minutes:
        type: number
        default: 30
      fetch_depth:
        type: number
        default: 1
        description: >
          1 by default: the version string reads a file and the commit sha, not
          history. Set 0 if your build_command reads git tags or dates.
      working_directory:
        type: string
        default: "."
      node_version:
        type: string
        default: ""
        description: Set to install Node before building.
      package_manager:
        type: string
        default: npm
        description: >
          npm, pnpm, yarn or none. Selects the dependency cache and the default
          install command.
      install_command:
        type: string
        default: ""
        description: Overrides the package_manager default install when set.
      build_command:
        type: string
        default: ""
        description: >
          Runs in the build job, which holds no Cloudflare secret, with
          CLOUDFLARE_ENV (wrangler's own environment selector, which build
          plugins read) and the CF_DEPLOY_* contract exported. Leave empty
          when there is nothing to build.

      # --- the wrangler invocation -------------------------------------------
      config_path:
        type: string
        default: ""
        description: >
          Path to the wrangler config to deploy, relative to working_directory.
          Empty uses wrangler.json, wrangler.jsonc or wrangler.toml there, in
          that order. Workers lane only.
      config_glob:
        type: string
        default: ""
        description: >
          Alternative to config_path for builds that generate their deploy
          config. Must match exactly one file; zero, or two or more, is an
          error naming what it found. Workers lane only.
      version:
        type: string
        default: ""
        description: Overrides the version string entirely.
      version_file:
        type: string
        default: VERSION
      version_suffix:
        type: string
        default: sha7
        description: >
          sha7 appends -<7-char commit sha>, so a version identifies a commit.
          none uses the file verbatim.
      version_var:
        type: string
        default: VERSION
        description: >
          The name in `--var <name>:<version>`. Empty passes no --var at all.
      deploy_args:
        type: string
        default: ""
        description: >
          Extra wrangler flags, each checked against an allowlist. Pages
          lane: the directory to upload first, then --project-name, --branch,
          --commit-hash, --commit-dirty, --skip-caching ("dist --project-name
          example-site"). Workers lane: --name, --compatibility-date,
          --compatibility-flag(s), --keep-vars, --dispatch-namespace, --tag,
          --message. Anything else fails the run.
      wrangler_version:
        type: string
        default: ""
        description: >
          Empty, or the pinned WRANGLER_VERSION in toolchain-pins.env. Any
          other value fails the run: the library installs one pinned wrangler.
      wrangler_command:
        type: string
        default: ""
        description: >
          REMOVED. Setting it fails the run. The library runs its pinned
          wrangler (toolchain-pins.env); pass flags through deploy_args.
      deploy_command:
        type: string
        default: ""
        description: >
          REMOVED. Setting it fails the run. Use build_command for the build,
          and command plus deploy_args for the wrangler call; the deploy job
          runs no caller command.

      # --- smoke test --------------------------------------------------------
      base_url:
        type: string
        default: ""
        description: Empty falls back to the environment's BASE_URL variable.
      smoke_path:
        type: string
        default: /health
        description: Fetched and required to return 2xx. Empty skips the smoke test entirely.
      smoke_version_path:
        type: string
        default: ""
        description: >
          A JSON endpoint whose version field must equal the version just
          deployed. Empty means the smoke test only proves something answered —
          which is the failure this exists to catch, so the summary says so out
          loud rather than reporting a clean pass.
      smoke_version_field:
        type: string
        default: version

      concurrency_key:
        type: string
        default: ""

    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
        description: >
          Account API token. Scope for the Workers lane: Account > Workers
          Scripts > Edit, on the account that owns the Worker. Binding a KV namespace does not need
          Workers KV Storage > Edit. The Pages lane needs Account >
          Cloudflare Pages > Edit instead. Create one at
          https://dash.cloudflare.com/profile/api-tokens.
          Declared optional so a run with the kill switch off does not require
          it; a run that reaches the deploy step without one fails at an
          explicit preflight naming this secret.
      CLOUDFLARE_ACCOUNT_ID:
        required: false
        description: >
          Only if you would rather not keep the account id in a variable. The
          variable CLOUDFLARE_ACCOUNT_ID is read first and is the documented
          home — it is an identifier, not a credential, and a readable one in
          the log is what tells you a deploy landed on the wrong account.

    outputs:
      deployed:
        description: >
          'true', 'false', or EMPTY. Compare it; never test it for truth — a job
          output is a string, and every non-empty string, "false" included, is
          truthy in an `if:`. It is empty (not 'false') when the kill switch is
          off, because the deploy job is skipped and a skipped job has no
          outputs. So `== 'false'` does NOT detect "did not deploy"; use
          `!= 'true'` for that.
        value: ${{ jobs.deploy.outputs.deployed }}
      environment:
        description: The environment this run resolved to.
        value: ${{ jobs.resolve.outputs.environment }}
      version:
        description: The version string that was deployed.
        value: ${{ jobs.build.outputs.version }}
      url:
        description: The base URL the smoke test used.
        value: ${{ jobs.deploy.outputs.url }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Normalises the event into typed outputs so no later job reads the event
  # payload, and decides — once — whether this run deploys at all.
  #
  # No `environment:` here on purpose: declaring one would put this job behind
  # the production environment's required reviewer, so someone would have to
  # approve a run before we could even tell them deploys are switched off.
  resolve:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    # Nothing is checked out and nothing is called; it reads inputs and decides.
    permissions: {}
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      environment: ${{ steps.decide.outputs.environment }}
      ref: ${{ steps.decide.outputs.ref }}
      wrangler_env: ${{ steps.decide.outputs.wrangler_env }}
      command: ${{ steps.decide.outputs.command }}
      deploy_args: ${{ steps.decide.outputs.deploy_args }}
    steps:
      - name: Decide what this run deploys
        id: decide
        shell: bash
        env:
          IN_ENABLED: ${{ inputs.enabled }}
          VAR_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_PRODUCTION_ENVIRONMENT: ${{ inputs.production_environment }}
          IN_REF: ${{ inputs.ref }}
          IN_COMMAND: ${{ inputs.command }}
          IN_WRANGLER_ENV: ${{ inputs.wrangler_env }}
          IN_DEPLOY_ARGS: ${{ inputs.deploy_args }}
          IN_DEPLOY_COMMAND: ${{ inputs.deploy_command }}
          IN_CONFIG_PATH: ${{ inputs.config_path }}
          IN_CONFIG_GLOB: ${{ inputs.config_glob }}
          IN_WRANGLER_COMMAND: ${{ inputs.wrangler_command }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Removed inputs fail first, naming what replaces them.
          if [ -n "${IN_DEPLOY_COMMAND}" ]; then
            echo "::error::deploy_command is removed: the deploy job runs no caller command. Put the build in build_command and choose the wrangler call with command and deploy_args (docs/workflows.md, cloudflare-deploy)"
            exit 1
          fi
          if [ -n "${IN_WRANGLER_COMMAND}" ]; then
            echo "::error::wrangler_command is removed: the library runs its pinned wrangler (WRANGLER_VERSION in toolchain-pins.env). Drop the input; pass flags through deploy_args"
            exit 1
          fi
          if [ "${IN_COMMAND}" = "pages deploy" ] && [ -n "${IN_CONFIG_PATH}${IN_CONFIG_GLOB}" ]; then
            echo "::error::config_path and config_glob are for the Workers lane; 'pages deploy' uploads the directory named first in deploy_args"
            exit 1
          fi
          case "${IN_DEPLOY_ARGS}" in
            *$'\n'*|*$'\r'*) echo "::error::deploy_args holds a line break"; exit 1 ;;
          esac

          # Checked here, before a checkout and before the kill switch, so a
          # typo costs five seconds and fails saying what it is.
          case "${IN_COMMAND}" in
            "deploy"|"versions upload"|"pages deploy") ;;
            *)
              echo "::error::command must be 'deploy', 'versions upload' or 'pages deploy', not '${IN_COMMAND}'"
              exit 1 ;;
          esac

          environment="${IN_ENVIRONMENT}"
          if [ -z "${environment}" ]; then
            # A bare-SemVer tag is a release. Anything else — a branch push, an
            # rc tag, a dispatch — must name its environment.
            if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
              case "${REF_NAME}" in
                [0-9]*.[0-9]*.[0-9]*)
                  # The glob above still admits "1.2.3-rc1"; this rejects it.
                  if printf '%s' "${REF_NAME}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                    environment="${IN_PRODUCTION_ENVIRONMENT}"
                  fi ;;
              esac
            fi
          fi

          # Before the kill-switch decision, deliberately: a caller who forgot
          # `environment:` should be told that, not told deploys are off.
          if [ -z "${environment}" ]; then
            echo "::error::no environment to deploy to — pass environment:, or push a bare-SemVer tag to deploy production_environment"
            exit 1
          fi

          enabled="${IN_ENABLED}"
          if [ -z "${enabled}" ]; then
            enabled="${VAR_ENABLED:-}"
          fi
          # Compared against the literal string. Anything else, unset included,
          # leaves deploys off.
          if [ "${enabled}" = "true" ]; then
            mode="deploy"
          else
            mode="disabled"
          fi

          # The exact commit that triggered the run, not the branch name.
          # A branch name resolves at clone time, so a commit landing in the
          # seconds after the trigger would be deployed while the version string
          # below still stamps the triggering sha -- the build would advertise a
          # commit that is not the one running. It also cannot work on a
          # pull_request, where ref_name is "42/merge" and matches neither
          # refs/heads/ nor refs/tags/.
          ref="${IN_REF}"
          if [ -z "${ref}" ]; then
            ref="${COMMIT_SHA}"
          fi

          # An enum, not a boolean. A job output is a string, so a boolean
          # crossing a job boundary arrives as "true"/"false" and `if: needs.x`
          # is truthy for both — which is how a deploy that was supposed to be
          # skipped runs anyway. Two named states cannot be misread that way,
          # and this guard stops the enum quietly becoming a free string later.
          case "${mode}" in
            deploy|disabled) ;;
            *) echo "::error::internal: mode '${mode}' is not one of deploy, disabled"; exit 1 ;;
          esac

          # The wrangler --env name: wrangler_env, else the Environment. 'none'
          # omits it. Checked here, on a deploying run, so a bad name fails
          # before any build.
          wrangler_env="${IN_WRANGLER_ENV}"
          if [ -z "${wrangler_env}" ]; then
            wrangler_env="${environment}"
          fi
          if [ "${mode}" = "deploy" ] && [ "${wrangler_env}" != "none" ] && ! printf '%s' "${wrangler_env}" | grep -Eqx '[A-Za-z0-9][A-Za-z0-9_-]{0,63}'; then
            echo "::error::the wrangler environment '${wrangler_env}' must match [A-Za-z0-9][A-Za-z0-9_-]{0,63}; set wrangler_env to one that does, or to 'none'"
            exit 1
          fi

          {
            echo "mode=${mode}"
            echo "environment=${environment}"
            echo "ref=${ref}"
            echo "wrangler_env=${wrangler_env}"
            echo "command=${IN_COMMAND}"
            echo "deploy_args=${IN_DEPLOY_ARGS}"
          } >> "${GITHUB_OUTPUT}"

  # A visible no-op. Without this a repository with deploys switched off shows
  # a green run with every job skipped, which is indistinguishable from a
  # workflow whose `if:` conditions are wrong.
  disabled-notice:
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'disabled' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Explain why nothing was deployed
        shell: bash
        env:
          ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
        run: |
          set -euo pipefail
          {
            echo "### Cloudflare deploy is switched off"
            echo
            echo "Nothing was deployed to \`${ENVIRONMENT}\`."
            echo
            echo "This workflow is disabled until a kill switch reads the string \`true\`."
            echo "Set the repository variable \`CLOUDFLARE_DEPLOY_ENABLED\` to \`true\`,"
            echo "or pass \`enabled:\` explicitly from the calling workflow."
            echo
            echo "Settings → Secrets and variables → Actions → Variables."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Runs the caller's install and build with no Cloudflare secret and no
  # Environment, and uploads what the deploy job uploads to Cloudflare.
  build:
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'deploy' }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      config: ${{ steps.config.outputs.path }}
      artifact: ${{ steps.stage.outputs.artifact }}
      manifest: ${{ steps.stage.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: ${{ inputs.fetch_depth }}

      # The library's scripts and pins at this workflow's commit. A directory
      # of that name already in the caller's tree is refused, not reused.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # Before any caller code: a refused deploy_args word fails here, not after
      # the build.
      - name: Check the wrangler inputs
        id: wrangler_inputs
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          CF_COMMAND: ${{ needs.resolve.outputs.command }}
          CF_DEPLOY_ARGS: ${{ needs.resolve.outputs.deploy_args }}
          IN_WRANGLER_VERSION: ${{ inputs.wrangler_version }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" CF_COMMAND="$CF_COMMAND" CF_DEPLOY_ARGS="$CF_DEPLOY_ARGS" IN_WRANGLER_VERSION="$IN_WRANGLER_VERSION" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          pinned="$(/usr/bin/sed -n 's/^WRANGLER_VERSION=//p' "$run_lib/toolchain-pins.env")"
          if [[ -n "$IN_WRANGLER_VERSION" && "$IN_WRANGLER_VERSION" != "$pinned" ]]; then
            echo "::error::wrangler_version '$IN_WRANGLER_VERSION' is not the pinned wrangler $pinned. Leave it empty; the library installs one pinned version."
            exit 1
          fi
          /usr/bin/python3 -I "$run_lib/scripts/cloudflare_wrangler.py" args >> "$GITHUB_OUTPUT"
          CI_HELPERS_RUN
          )"

      # corepack ships with Node; the version is the root package.json's
      # devEngines.packageManager or packageManager, whose hash corepack checks
      # on download.
      - name: Setup pnpm
        if: ${{ inputs.package_manager == 'pnpm' }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 STEP_PATH="$PATH" LIB="$LIB" LIB_HASH="$LIB_HASH" GITHUB_ENV="$GITHUB_ENV" GITHUB_PATH="$GITHUB_PATH" GITHUB_OUTPUT="$GITHUB_OUTPUT" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" RUNNER_TOOL_CACHE="$RUNNER_TOOL_CACHE" CI="$CI" \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh"
          export TOOLCHAIN_PINS="$run_lib/toolchain-pins.env"
