name: preset-php
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      php_version:
        type: string
        default: "8.4"
      node_version:
        type: string
        default: ""
      lint_command:
        type: string
        default: "composer install --no-interaction --prefer-dist && vendor/bin/phpcs --standard=PSR12 --extensions=php"
      test_command:
        type: string
        default: "vendor/bin/phpunit"
      build_command:
        type: string
        default: ""
      e2e_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      extra_command:
        type: string
        default: ""
      # Optional database service for PHP + MySQL/Postgres test stacks. Leave
      # db_image empty for a DB-less run. See ci.yml for the mechanism.
      db_image:
        type: string
        default: ""
      db_env:
        type: string
        default: ""
      db_ports:
        type: string
        default: ""
      db_health_cmd:
        type: string
        default: ""
      db_wait_seconds:
        type: number
        default: 60
      # Extra KEY=VALUE environment exposed to the subsequent command steps
      # (lint/test/build/…) via $GITHUB_ENV. See ci.yml.
      extra_env:
        type: string
        default: ""

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      fetch_depth: ${{ inputs.fetch_depth }}
      php_version: ${{ inputs.php_version }}
      node_version: ${{ inputs.node_version }}
      lint_command: ${{ inputs.lint_command }}
      test_command: ${{ inputs.test_command }}
      build_command: ${{ inputs.build_command }}
      e2e_command: ${{ inputs.e2e_command }}
      docker_command: ${{ inputs.docker_command }}
      extra_command: ${{ inputs.extra_command }}
      db_image: ${{ inputs.db_image }}
      db_env: ${{ inputs.db_env }}
      db_ports: ${{ inputs.db_ports }}
      db_health_cmd: ${{ inputs.db_health_cmd }}
      db_wait_seconds: ${{ inputs.db_wait_seconds }}
      extra_env: ${{ inputs.extra_env }}
