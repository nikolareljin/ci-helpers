name: preset-java
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      concurrency_key:
        type: string
        default: ""
      fetch_depth:
        type: number
        default: 0
      # false / true / recursive. Forwarded to the engine's checkout; see
      # ci.yml for why a typo is refused rather than read as false.
      submodules:
        type: string
        default: "false"
      # Restore dependency caches, for the toolchains whose setup action has
      # the option. The engine decides which from the lockfiles it finds.
      cache:
        type: boolean
        default: true
      java_version:
        type: string
        default: "17"
      install_command:
        type: string
        default: ""
      # Empty, deliberately. The default was
      # `mvn -B -DskipTests checkstyle:check`, which resolves the checkstyle
      # plugin whether or not the project configures it and then applies
      # Sun's rules: measured on a conventional two-file Maven project on
      # 2026-09-28, that is 12 violations and a red build on correct code.
      #
      # A check that fires on correct input gets switched off, so it is worse
      # than one that is absent. A project with a ruleset asks for it --
      # docs/presets.md carries the line.
      lint_command:
        type: string
        default: ""
      test_command:
        type: string
        default: "mvn -B test"
      build_command:
        type: string
        default: "mvn -B package"
      e2e_command:
        type: string
        default: ""
      docker_command:
        type: string
        default: ""
      extra_command:
        type: string
        default: ""
      # Forwarded to the engine, which applies it as the job timeout. Without
      # one a hung job bills until GitHub's six-hour default (#132).
      timeout_minutes:
        type: number
        default: 20

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      runner: ${{ inputs.runner }}
      working_directory: ${{ inputs.working_directory }}
      concurrency_key: ${{ inputs.concurrency_key }}
      fetch_depth: ${{ inputs.fetch_depth }}
      java_version: ${{ inputs.java_version }}
      install_command: ${{ inputs.install_command }}
      lint_command: ${{ inputs.lint_command }}
      test_command: ${{ inputs.test_command }}
      build_command: ${{ inputs.build_command }}
      e2e_command: ${{ inputs.e2e_command }}
      docker_command: ${{ inputs.docker_command }}
      extra_command: ${{ inputs.extra_command }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      submodules: ${{ inputs.submodules }}
      cache: ${{ inputs.cache }}
