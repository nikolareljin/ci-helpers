name: ci-helpers-release-upload
# Attaches the files of one workflow artifact to a GitHub release. It adds files
# and never changes the release notes, and a release tag that does not exist yet
# is created at `commit`. It is its own workflow so the build workflows that
# feed it (rpm-build.yml) keep contents: read: a reusable workflow that holds a
# write job fails to start for a caller that grants read, even when that job
# would be skipped.
on:
  workflow_call:
    inputs:
      artifact_id:
        description: Id of the artifact holding the files (a build workflow's artifact_id output).
        type: string
        required: true
      tag:
        description: Release tag to attach the files to.
        type: string
        required: true
      commit:
        description: Commit a new tag is created at; empty uses the commit the workflow runs on.
        type: string
        default: ""
      files:
        description: Glob, relative to the downloaded artifact, of the files to attach.
        type: string
        default: "*"

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - name: Download files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 @ 2026-10-16
        with:
          # By id: a same-named artifact from another call in this run
          # replaces this one, and a name would fetch that call's files.
          artifact-ids: ${{ inputs.artifact_id }}
          path: release-files

      - name: Check the tag and the files
        id: check
        shell: bash
        env:
          IN_TAG: ${{ inputs.tag }}
          IN_FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          if [[ -z "$IN_TAG" || "$IN_TAG" == *[[:space:]]* ]]; then
            echo "::error::tag must be one non-empty word, got '${IN_TAG}'"
            exit 1
          fi
          # One pattern, no whitespace: the glob below is unquoted, and a
          # space would make a second pattern the segment check never saw.
          if [[ -z "$IN_FILES" || "$IN_FILES" == *[[:space:]]* || "$IN_FILES" == /* || "$IN_FILES" == .. || "$IN_FILES" == ../* || "$IN_FILES" == */../* || "$IN_FILES" == */.. ]]; then
            echo "::error::files must be one glob inside the artifact, got '${IN_FILES}'"
            exit 1
          fi
          root="$(realpath release-files)"
          shopt -s nullglob
          # shellcheck disable=SC2206
          matched=(release-files/$IN_FILES)
          files=()
          for f in "${matched[@]}"; do
            [[ -f "$f" ]] || continue
            # What was globbed must resolve inside the artifact (a symlink
            # pointing out of it is refused too).
            real="$(realpath "$f")"
            if [[ "$real" != "$root"/* ]]; then
              echo "::error::'${f}' resolves outside the artifact"
              exit 1
            fi
            # The upload re-reads each entry as a glob, splits on commas, and
            # this list is one path per line, so every component must be
            # plain: letters, digits and . _ + @ -, no comma, glob character,
            # whitespace or control character.
            if [[ ! "${f#release-files/}" =~ ^[A-Za-z0-9._+@-]+(/[A-Za-z0-9._+@-]+)*$ ]]; then
              echo "::error::'${f}' has a character the upload would misread (allowed: letters, digits, . _ + @ - and /); rename it"
              exit 1
            fi
            files+=("$f")
          done
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::no files match '${IN_FILES}' in the artifact"
            exit 1
          fi
          printf 'will attach: %s\n' "${files[@]}"
          # The upload takes exactly this list. Its own glob (dot: true) and
          # bash's differ on dotfiles, so passing the pattern again could
          # upload files this step never listed. The delimiter is random so
          # no file name can end the value early.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "files<<${delim}"
            printf '%s\n' "${files[@]}"
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # No body or body_path: notes another job wrote stay as they are.
      - name: Reserve trusted publication action directory
        id: ci_publication_prepare
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-publication || -L .ci-helpers-publication ]]; then
            echo "Security checks failed. Run repository checks locally first. https://nikolareljin.github.io/leak-lock/"
            exit 1
          fi

      - name: Check out trusted publication action
        id: ci_publication_checkout
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-publication
          sparse-checkout: |
            .github/actions/publication-check
            vendor/script-helpers
            scripts
          persist-credentials: false

      - name: Verify publication action revision
        id: ci_publication_verify
        if: ${{ always() && steps.ci_publication_checkout.outcome == 'success' }}
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-publication rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1
          if [[ -e .git || -L .git ]]; then
            [[ -d .git && ! -L .git ]] || { echo "::error::.git is not a plain directory; refusing to edit its exclude file"; exit 1; }
            gd="$(pwd -P)/.git"; exclude=$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null rev-parse --path-format=absolute --git-path info/exclude)
            [[ ! -x /usr/bin/cygpath ]] || exclude=$(/usr/bin/cygpath -u "$exclude")
            [[ "$exclude" == "$gd/info/exclude" && ! -L "$gd/info" && ! -L "$exclude" ]] || { echo "::error::.git/info/exclude resolves outside .git or through a symlink; refusing to edit it"; exit 1; }
            [[ -d "$gd/info" ]] || /bin/mkdir "$gd/info"
            [[ ! -e "$exclude" || ( -f "$exclude" && -z "$(/usr/bin/find "$exclude" -prune -links +1)" ) ]] || { echo "::error::.git/info/exclude is not a plain file with one link; refusing to edit it"; exit 1; }
            printf '\n/.ci-helpers-publication/\n' >> "$exclude"
          fi

      - name: Isolate ci-helpers scripts
        id: ci_lib_publication
        if: ${{ always() && steps.ci_publication_prepare.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-publication/scripts/lib_isolate.sh .ci-helpers-publication --keep

      - name: Check publication files
        id: ci_publication_check_1
        if: ${{ (success()) && steps.ci_publication_verify.outcome == 'success' }}
        uses: ./.ci-helpers-publication/.github/actions/publication-check
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        with:
          metadata: |
            tag_name: ${{ inputs.tag }}
            target_commitish: ${{ inputs.commit }}
          mode: release
          paths: ${{ steps.check.outputs.files }}

      - name: Attach files to the release
        if: ${{ (success()) && steps.ci_publication_check_1.outcome == 'success' }}
        shell: /bin/sh -e {0}
        env:
          LIB: ${{ steps.ci_lib_publication.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib_publication.outputs.hash }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          TARGET_COMMITISH: ${{ inputs.commit }}
          FILES: ${{ steps.ci_publication_check_1.outputs.paths }}
          OVERWRITE_FILES: "true"
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH GH_TOKEN TAG_NAME TARGET_COMMITISH FILES OVERWRITE_FILES GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          /bin/bash "$run_lib/scripts/github_release.sh"
          CI_HELPERS_RUN
          )"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: /bin/sh -e {0}
        env:
          LIB_0: ${{ steps.ci_lib_publication.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
