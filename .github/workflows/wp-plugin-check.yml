name: wp-plugin-check
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      compose_file:
        type: string
        default: test/docker-compose.yml
      plugin_slug:
        type: string
        required: true
      plugin_src:
        type: string
        default: .
      plugin_src_env:
        type: string
        default: PLUGIN_SRC
      wpcli_service:
        type: string
        default: wpcli
      db_service:
        type: string
        default: db
      wordpress_service:
        type: string
        default: wordpress
      host_port:
        type: string
        default: "8080"
      out_dir:
        type: string
        default: test/tmp
      db_wait_seconds:
        type: string
        default: "30"
      multisite:
        type: boolean
        default: true
      activate_network:
        type: boolean
        default: true
      admin_user:
        type: string
        default: admin
      admin_password:
        type: string
        default: admin
      admin_email:
        type: string
        default: admin@example.com
      site_title:
        type: string
        default: WP Test Site
      meta_check_script:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      php_lint_command:
        type: string
        default: ""
      phpcs_warning_command:
        type: string
        default: ""
      phpunit_command:
        type: string
        default: ""
      phpunit_working_directory:
        type: string
        default: .
      # `wp plugin check` reports every file it is given, and a repository
      # checkout is more than the plugin. The defaults name what a plugin
      # repository carries but does not ship; a caller scanning an already
      # packaged plugin passes empty strings to turn them off.
      #
      # `test` is deliberately absent: a plugin that ships a `test` directory
      # would have it silently skipped, and the compose files consumers keep
      # there are not scanned anyway.
      exclude_directories:
        type: string
        default: "vendor,node_modules,.git,.github"
      exclude_files:
        type: string
        default: ".gitignore,.gitattributes,.editorconfig,.distignore"
      fail_on_findings:
        type: boolean
        default: false
      cleanup:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: plugin-check-results

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: nikolareljin/script-helpers
          ref: c9aa9f6340772232d0ffda06c9eb08255bfe4b0d # 0.34.0
          path: .script-helpers
          fetch-depth: 1

      # actions/checkout refuses a path outside the workspace, and the
      # workspace is what `plugin_src` usually points at. Left where it lands,
      # `wp plugin check` scans all 276 files of this library and the
      # hidden_files check fires once per file: 146 errors on a plugin whose
      # own count is 1. Moving it is the fix; the exclusions below are for what
      # the caller's own repository carries.
      - name: Move script-helpers out of the plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/script-helpers"
          mv .script-helpers "${{ runner.temp }}/script-helpers"

      - name: Setup PHP
        if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_warning_command != '' || inputs.phpunit_command != '') }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2 @ 2026-09-10
        with:
          php-version: ${{ inputs.php_version }}

      - name: WordPress plugin check
        shell: bash
        run: |
          set -euo pipefail
          "${{ runner.temp }}/script-helpers/scripts/ci_wp_plugin_check.sh" \
            --compose-file "${{ inputs.compose_file }}" \
            --plugin-slug "${{ inputs.plugin_slug }}" \
            --plugin-src "${{ inputs.plugin_src }}" \
            --plugin-src-env "${{ inputs.plugin_src_env }}" \
            --wpcli-service "${{ inputs.wpcli_service }}" \
            --db-service "${{ inputs.db_service }}" \
            --wordpress-service "${{ inputs.wordpress_service }}" \
            --host-port "${{ inputs.host_port }}" \
            --out-dir "${{ inputs.out_dir }}" \
            --db-wait-seconds "${{ inputs.db_wait_seconds }}" \
            --multisite "${{ inputs.multisite }}" \
            --activate-network "${{ inputs.activate_network }}" \
            --admin-user "${{ inputs.admin_user }}" \
            --admin-password "${{ inputs.admin_password }}" \
            --admin-email "${{ inputs.admin_email }}" \
            --site-title "${{ inputs.site_title }}" \
            --meta-check-script "${{ inputs.meta_check_script }}" \
            --php-lint-command "${{ inputs.php_lint_command }}" \
            --phpcs-warning-command "${{ inputs.phpcs_warning_command }}" \
            --phpunit-command "${{ inputs.phpunit_command }}" \
            --phpunit-working-directory "${{ inputs.phpunit_working_directory }}" \
            --exclude-directories "${{ inputs.exclude_directories }}" \
            --exclude-files "${{ inputs.exclude_files }}" \
            --fail-on-findings "${{ inputs.fail_on_findings }}" \
            --cleanup "${{ inputs.cleanup }}"

      - name: Upload artifacts
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 @ 2026-09-10
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.out_dir }}
          if-no-files-found: warn
