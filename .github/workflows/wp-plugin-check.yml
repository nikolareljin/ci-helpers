name: wp-plugin-check
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      compose_file:
        type: string
        default: test/docker-compose.yml
      plugin_slug:
        type: string
        required: true
      plugin_src:
        type: string
        default: .
      plugin_src_env:
        type: string
        default: PLUGIN_SRC
      wpcli_service:
        type: string
        default: wpcli
      db_service:
        type: string
        default: db
      wordpress_service:
        type: string
        default: wordpress
      host_port:
        type: string
        default: "8080"
      out_dir:
        type: string
        default: test/tmp
      db_wait_seconds:
        type: string
        default: "30"
      multisite:
        type: boolean
        default: true
      activate_network:
        type: boolean
        default: true
      admin_user:
        type: string
        default: admin
      admin_password:
        description: >
          Admin password for the throwaway test site. Empty (the default) uses a
          random one per run; a value passed here is shown with the run's inputs.
        type: string
        default: ""
      admin_email:
        type: string
        default: admin@example.com
      site_title:
        type: string
        default: WP Test Site
      meta_check_script:
        type: string
        default: ""
      php_version:
        type: string
        default: ""
      php_lint_command:
        type: string
        default: ""
      phpcs_warning_command:
        type: string
        default: ""
      phpunit_command:
        type: string
        default: ""
      phpunit_working_directory:
        type: string
        default: .
      # `wp plugin check` reports every file it is given, and a repository
      # checkout is more than the plugin. The defaults name what a plugin
      # repository carries but does not ship; a caller scanning an already
      # packaged plugin passes empty strings to turn them off.
      #
      # `test` is deliberately absent: a plugin that ships a `test` directory
      # would have it silently skipped, and the compose files consumers keep
      # there are not scanned anyway.
      # A generated stack, so a plugin repository carries no compose file at
      # all. Three plugins wrote one each and they differed only in the
      # WordPress image tag, the mount path and the name of a port variable.
      #
      # Set `wp_version` (or `versions`) to generate. `compose_file` still wins
      # when it is set, for a repository that needs services this does not
      # describe.
      wp_version:
        type: string
        default: ""
      # Directory the plugin is mounted at, under wp-content/plugins. Defaults
      # to the first segment of `plugin_slug`, which is what a slug like
      # "my-plugin/my-plugin.php" already names.
      plugin_dir:
        type: string
        default: ""
      # JSON array of {"wp": ..., "php": ...} objects, one leg each, e.g.
      # '[{"wp":"6.2","php":"8.0"},{"wp":"7.1","php":"8.4"}]'. Empty runs a
      # single leg from wp_version / php_version.
      versions:
        type: string
        default: ""
      exclude_directories:
        type: string
        default: "vendor,node_modules,.git,.github"
      exclude_files:
        type: string
        default: ".gitignore,.gitattributes,.editorconfig,.distignore"
      fail_on_findings:
        type: boolean
        default: false
      cleanup:
        type: boolean
        default: true
      upload_artifact:
        type: boolean
        default: false
      artifact_name:
        type: string
        default: plugin-check-results

jobs:
  # One leg per {wp, php} pair, resolved here so the check job below exists
  # once rather than once per mode. With `versions` empty this yields a single
  # leg carrying wp_version / php_version, so a caller that never heard of the
  # matrix behaves exactly as before.
  resolve-versions:
    permissions:
      contents: read
    runs-on: ${{ inputs.runner }}
    # Without this a hung job bills until GitHub's six-hour default (#132).
    timeout-minutes: 5
    outputs:
      combos: ${{ steps.resolve.outputs.combos }}
    steps:
      - id: resolve
        env:
          VERSIONS: ${{ inputs.versions }}
          WP_VERSION: ${{ inputs.wp_version }}
          PHP_VERSION: ${{ inputs.php_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VERSIONS}" ]]; then
            # A label per leg. A matrix over objects otherwise names each job
            # "map[php:8.4 wp:7.1]", which is what GitHub prints for a struct.
            combos="$(jq -cn --arg wp "${WP_VERSION}" --arg php "${PHP_VERSION}" \
              '[{wp: $wp, php: $php,
                 label: ([(if $wp == "" then empty else "wp" + $wp end),
                          (if $php == "" then empty else "php" + $php end)]
                         | if length == 0 then "default" else join("-") end)}]')"
            echo "One leg: wp='${WP_VERSION}' php='${PHP_VERSION}'"
            echo "combos=${combos}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Must be a non-empty array of objects. Failing here beats letting
          # the matrix expand to nothing: an empty matrix reports as a skipped
          # job, and a skipped job reads like a pass.
          if ! printf '%s' "$VERSIONS" | jq -e '
                type == "array"
                and length > 0
                and all(.[]; type == "object" and has("wp") and (.wp | type == "string") and (.wp | test("^\\s*$") | not))
              ' >/dev/null 2>&1; then
            echo "::error::versions must be a non-empty JSON array of objects with a non-blank \"wp\", e.g. '[{\"wp\":\"7.1\",\"php\":\"8.4\"}]'" >&2
            exit 1
          fi

          # php is optional per entry; normalise it to "" so the matrix has a
          # uniform shape and `matrix.combo.php` is never null.
          combos="$(printf '%s' "$VERSIONS" | jq -c '
            [ .[] | {wp: .wp, php: (.php // "")}
              | . + {label: ([("wp" + .wp),
                              (if .php == "" then empty else "php" + .php end)]
                             | join("-"))} ]')"

          # Two legs with one name: GitHub refuses that with an error naming
          # neither the input nor the duplicate.
          #
          # Compared on the label, not on {wp, php}, because the label is what
          # becomes the job name. Distinct pairs can share one:
          # {"wp":"7.1","php":"8.4"} and {"wp":"7.1-php8.4"} both label
          # wp7.1-php8.4, and a check on the pairs lets that through.
          dupes="$(printf '%s' "$combos" | jq -r '[.[].label] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")')"
          if [ -n "$dupes" ]; then
            echo "::error::versions resolves to duplicate leg names: ${dupes}" >&2
            exit 1
          fi

          echo "Legs: $(printf '%s' "$combos" | jq -r 'map("wp" + .wp + (if .php == "" then "" else "-php" + .php end)) | join(", ")')"
          echo "combos=${combos}" >> "$GITHUB_OUTPUT"

  check:
    permissions:
      contents: read
    name: check ${{ matrix.combo.label }}
    needs: [resolve-versions]
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJSON(needs.resolve-versions.outputs.combos) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false

      - name: Checkout script-helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          repository: nikolareljin/script-helpers
          ref: 1fdf01e83fb7f07529c5ec96cb9cb871fe166f7f # 0.59.0
          path: .script-helpers
          fetch-depth: 1

      # actions/checkout refuses a path outside the workspace, and the
      # workspace is what `plugin_src` usually points at. Left where it lands,
      # `wp plugin check` scans all 276 files of this library and the
      # hidden_files check fires once per file: 146 errors on a plugin whose
      # own count is 1. Moving it is the fix; the exclusions below are for what
      # the caller's own repository carries.
      - name: Move script-helpers out of the plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/script-helpers"
          mv .script-helpers "$RUNNER_TEMP/script-helpers"

      # A plugin repository should not carry a compose file whose only
      # distinguishing feature is an image tag. Written to runner.temp so it is
      # not in the directory wp plugin check scans.
      - name: Generate the WordPress stack
        id: stack
        if: ${{ inputs.compose_file == '' || matrix.combo.wp != '' }}
        env:
          WP: ${{ matrix.combo.wp }}
          PHP: ${{ matrix.combo.php }}
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          PLUGIN_DIR: ${{ inputs.plugin_dir }}
        shell: bash
        run: |
          set -euo pipefail

          # The directory the plugin is mounted at. A slug is "dir/file.php",
          # so its first segment is the directory WordPress expects.
          dir="${PLUGIN_DIR:-${PLUGIN_SLUG%%/*}}"
          if [[ -z "$dir" || "$dir" == */* ]]; then
            echo "::error::could not derive a plugin directory from plugin_slug='${PLUGIN_SLUG}'; set plugin_dir" >&2
            exit 1
          fi

          # Tag forms the official image actually publishes: both parts, the
          # PHP part alone, or neither. Composing a tag that does not exist
          # fails at pull time with a message about the manifest, which does
          # not point back at these inputs.
          if [[ -n "$WP" && -n "$PHP" ]]; then image="wordpress:${WP}-php${PHP}-apache"
          elif [[ -n "$WP" ]];            then image="wordpress:${WP}-apache"
          elif [[ -n "$PHP" ]];           then image="wordpress:php${PHP}-apache"
          else                                 image="wordpress:latest@sha256:81a34254acaa6ff3b9a67268c2745e9a041c4094cbe5ccd35b75ed3bbdc033b5"
          fi

          out="${RUNNER_TEMP}/wp-check-compose.yml"
          cat > "$out" <<YAML
          services:
            db:
              image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
              environment:
                MARIADB_DATABASE: wordpress
                MARIADB_USER: wordpress
                MARIADB_PASSWORD: wordpress
                MARIADB_ROOT_PASSWORD: wordpress

            wordpress:
              image: ${image}
              depends_on:
                - db
              environment:
                WORDPRESS_DB_HOST: db:3306
                WORDPRESS_DB_USER: wordpress
                WORDPRESS_DB_PASSWORD: wordpress
                WORDPRESS_DB_NAME: wordpress
              ports:
                - "\${WP_CHECK_PORT:-8080}:80"
              volumes:
                - wp_core:/var/www/html
                - \${WP_CHECK_PLUGIN_SRC}:/var/www/html/wp-content/plugins/${dir}:rw

            wpcli:
              image: wordpress:cli@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
              depends_on:
                - wordpress
              user: "33:33"
              environment:
                WORDPRESS_DB_HOST: db:3306
                WORDPRESS_DB_USER: wordpress
                WORDPRESS_DB_PASSWORD: wordpress
                WORDPRESS_DB_NAME: wordpress
              working_dir: /var/www/html
              volumes:
                - wp_core:/var/www/html
                - \${WP_CHECK_PLUGIN_SRC}:/var/www/html/wp-content/plugins/${dir}:rw

          volumes:
            wp_core:
          YAML

          echo "Generated stack for ${image}, plugin at wp-content/plugins/${dir}"
          echo "compose_file=${out}" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: ${{ matrix.combo.php != '' && (inputs.php_lint_command != '' || inputs.phpcs_warning_command != '' || inputs.phpunit_command != '') }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 @ 2026-10-16
        with:
          php-version: ${{ matrix.combo.php }}

      - name: WordPress plugin check
        shell: bash
        env:
          # The generated stack reads WP_CHECK_PORT, and WP_CHECK_PLUGIN_SRC,
          # which the script sets for --plugin-src-env. A caller-supplied
          # compose file reads whatever it already declared, and is unaffected.
          WP_CHECK_PORT: ${{ inputs.host_port }}
          # Every input reaches the script through env, never spliced into the
          # script text: a value with `$5`, `"` or `$(...)` stays a value. The
          # three *_command inputs are code by design; ci_wp_plugin_check.sh
          # runs them.
          WPC_SCRIPT: ${{ runner.temp }}/script-helpers/scripts/ci_wp_plugin_check.sh
          WPC_COMPOSE_FILE: ${{ steps.stack.outputs.compose_file || inputs.compose_file }}
          WPC_PLUGIN_SLUG: ${{ inputs.plugin_slug }}
          WPC_PLUGIN_SRC: ${{ inputs.plugin_src }}
          WPC_PLUGIN_SRC_ENV: ${{ steps.stack.outputs.compose_file && 'WP_CHECK_PLUGIN_SRC' || inputs.plugin_src_env }}
          WPC_WPCLI_SERVICE: ${{ inputs.wpcli_service }}
          WPC_DB_SERVICE: ${{ inputs.db_service }}
          WPC_WORDPRESS_SERVICE: ${{ inputs.wordpress_service }}
          WPC_HOST_PORT: ${{ inputs.host_port }}
          WPC_OUT_DIR: ${{ inputs.out_dir }}
          WPC_DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
          WPC_MULTISITE: ${{ inputs.multisite }}
          WPC_ACTIVATE_NETWORK: ${{ inputs.activate_network }}
          WPC_ADMIN_USER: ${{ inputs.admin_user }}
          WPC_ADMIN_PASSWORD: ${{ inputs.admin_password }}
          WPC_ADMIN_EMAIL: ${{ inputs.admin_email }}
          WPC_SITE_TITLE: ${{ inputs.site_title }}
          WPC_META_CHECK_SCRIPT: ${{ inputs.meta_check_script }}
          WPC_PHP_LINT_COMMAND: ${{ inputs.php_lint_command }}
          WPC_PHPCS_WARNING_COMMAND: ${{ inputs.phpcs_warning_command }}
          WPC_PHPUNIT_COMMAND: ${{ inputs.phpunit_command }}
          WPC_PHPUNIT_WORKING_DIRECTORY: ${{ inputs.phpunit_working_directory }}
          WPC_EXCLUDE_DIRECTORIES: ${{ inputs.exclude_directories }}
          WPC_EXCLUDE_FILES: ${{ inputs.exclude_files }}
          WPC_FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
          WPC_CLEANUP: ${{ inputs.cleanup }}
        run: |
          set -euo pipefail
          # Empty (the default) gets a random password per run: an input is
          # shown with the run, and this one sits on a command line.
          if [[ -z "$WPC_ADMIN_PASSWORD" ]]; then
            WPC_ADMIN_PASSWORD="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            export WPC_ADMIN_PASSWORD
          fi
          "$WPC_SCRIPT" \
            --compose-file "$WPC_COMPOSE_FILE" \
            --plugin-slug "$WPC_PLUGIN_SLUG" \
            --plugin-src "$WPC_PLUGIN_SRC" \
            --plugin-src-env "$WPC_PLUGIN_SRC_ENV" \
            --wpcli-service "$WPC_WPCLI_SERVICE" \
            --db-service "$WPC_DB_SERVICE" \
            --wordpress-service "$WPC_WORDPRESS_SERVICE" \
            --host-port "$WPC_HOST_PORT" \
            --out-dir "$WPC_OUT_DIR" \
            --db-wait-seconds "$WPC_DB_WAIT_SECONDS" \
            --multisite "$WPC_MULTISITE" \
            --activate-network "$WPC_ACTIVATE_NETWORK" \
            --admin-user "$WPC_ADMIN_USER" \
            --admin-password "$WPC_ADMIN_PASSWORD" \
            --admin-email "$WPC_ADMIN_EMAIL" \
            --site-title "$WPC_SITE_TITLE" \
            --meta-check-script "$WPC_META_CHECK_SCRIPT" \
            --php-lint-command "$WPC_PHP_LINT_COMMAND" \
            --phpcs-warning-command "$WPC_PHPCS_WARNING_COMMAND" \
            --phpunit-command "$WPC_PHPUNIT_COMMAND" \
            --phpunit-working-directory "$WPC_PHPUNIT_WORKING_DIRECTORY" \
            --exclude-directories "$WPC_EXCLUDE_DIRECTORIES" \
            --exclude-files "$WPC_EXCLUDE_FILES" \
            --fail-on-findings "$WPC_FAIL_ON_FINDINGS" \
            --cleanup "$WPC_CLEANUP"

      - name: Upload artifacts
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.out_dir }}
          if-no-files-found: warn
