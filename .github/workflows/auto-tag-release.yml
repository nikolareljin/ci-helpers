name: auto-tag-release

# Release automation with auto-dispatch. On a push to the default branch that is
# a merged `release/X.Y.Z` PR, this tags the version (via the reusable auto-tag.yml)
# and — when `release_workflow` is set — dispatches a follow-up workflow.
#
# PERMISSIONS: callers of THIS workflow must grant `actions: write` (for the
# dispatch job), even if they never set `release_workflow` — GitHub validates a
# reusable workflow's declared permissions at startup regardless of job `if:`.
# If you do NOT need auto-dispatch, call the lighter `auto-tag.yml` instead, which
# needs only `contents: write` + `pull-requests: read`.

on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      fetch_depth:
        type: number
        default: 0
      default_branch:
        type: string
        default: ""
      update_production_tag:
        description: >
          When true (default), run the Bootstrap and Update production tag
          steps after tagging. Set to false in repos that do not carry a
          production floating tag (e.g. consumers of ci-helpers that only
          need version tagging).
        type: boolean
        default: true
      release_workflow:
        description: >
          Workflow file name (e.g. "release.yml") to dispatch via workflow_dispatch
          after the version tag is pushed. When set, the workflow is triggered with
          a release_tag input equal to the detected version, bypassing the GitHub
          restriction that prevents GITHUB_TOKEN-created tags from firing tag-push
          triggered workflows. Leave empty (default) to skip auto-dispatch.
          NOTE: this workflow always requires callers to grant actions: write (see
          the header). If you never dispatch, prefer auto-tag.yml.
        type: string
        default: ""
    outputs:
      version:
        description: >
          Release version detected from the merged release/X.Y.Z PR (empty when
          the push was not a release/* merge). Exposed so callers can gate
          follow-up jobs — e.g. creating the GitHub Release or moving a
          production branch — on `needs.<caller-job-id>.outputs.version`, where
          `<caller-job-id>` is the caller's own job that `uses:` this workflow
          (not this workflow's internal `tag` job), e.g.
          `needs.auto_tag.outputs.version`.
        value: ${{ jobs.tag.outputs.version }}

permissions:
  contents: write
  pull-requests: read
  # actions: write is declared here so the dispatch job can request it at the job
  # level (GitHub requires job-level permissions ⊆ workflow-level permissions).
  # Because GitHub validates a reusable workflow's declared permissions at startup
  # regardless of a job's `if:` gate, EVERY caller of this workflow must grant
  # actions: write — even callers that never set release_workflow. Callers that do
  # not need auto-dispatch should use auto-tag.yml (no actions: write required).
  actions: write

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Tagging + production-tag move are delegated to the reusable, least-privilege
  # auto-tag.yml so the logic lives in one place.
  #
  # The relative `uses: ./` is intentional and works for external (cross-repo)
  # callers. Per the GitHub docs on reusing workflows: "If you use the second
  # syntax option (without {owner}/{repo} and @{ref}) the called workflow is from
  # the same commit as the caller workflow." Here the caller workflow is THIS file
  # (auto-tag-release.yml in ci-helpers), so `./auto-tag.yml` always resolves to
  # ci-helpers at the exact ref the consumer pinned — never the consumer's own repo.
  # An absolute `nikolareljin/ci-helpers/...@ref` would be worse: `uses:` refs must
  # be literals, so it could not track the consumer's pinned ref.
  tag:
    uses: ./.github/workflows/auto-tag.yml
    with:
      runner: ${{ inputs.runner }}
      fetch_depth: ${{ inputs.fetch_depth }}
      default_branch: ${{ inputs.default_branch }}
      update_production_tag: ${{ inputs.update_production_tag }}

  dispatch:
    needs: tag
    if: ${{ needs.tag.outputs.version != '' && inputs.release_workflow != '' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: write
    steps:
      - name: Dispatch release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::gh CLI not found. Install it on your runner: https://cli.github.com/"
            exit 1
          fi
          # Validate workflow name: only safe filename characters, must end in .yml or .yaml
          if ! printf '%s' "$RELEASE_WORKFLOW" | grep -qE '^[A-Za-z0-9_.-]+\.ya?ml$'; then
            echo "::error::release_workflow '${RELEASE_WORKFLOW}' is not a valid workflow filename."
            exit 1
          fi
          echo "Dispatching ${RELEASE_WORKFLOW} for tag ${VERSION} on ref ${VERSION}"
          gh workflow run "$RELEASE_WORKFLOW" --ref "${VERSION}" -f "release_tag=${VERSION}"
