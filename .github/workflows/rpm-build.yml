name: ci-helpers-rpm-build
on:
  workflow_call:
    inputs:
      upload_to_release:
        description: >
          Whether this run's .rpm files go to a GitHub release: "true" always,
          "false" (default) never, "auto" on a version tag push or with
          release_tag (or a version-tag ref). It sets the tag and skip outputs;
          the upload itself is release-upload.yml, the one job that needs
          contents: write, so a read-only caller of this workflow still runs.
        type: string
        default: "false"
      release_tag:
        description: >
          Release to attach the .rpm files to. Empty: ref when it is set, else
          the tag the workflow runs on.
        type: string
        default: ""
      ref:
        description: >
          Git ref to build: a tag, branch or commit. Empty builds the ref the
          workflow runs on. Set it to the tag to rebuild an older release.
        type: string
        default: ""
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      prebuild_command:
        type: string
        default: ""
      spec_path:
        type: string
        default: ""
      artifact_dir:
        type: string
        default: "dist"
      extra_packages:
        type: string
        default: ""
      artifact_name:
        type: string
        default: "rpm-packages"
      artifact_glob:
        type: string
        default: "dist/*.rpm"

    outputs:
      artifact_id:
        description: Id of the uploaded .rpm artifact, for release-upload.yml.
        value: ${{ jobs.build.outputs.files_id }}
      tag:
        description: Release the .rpm files belong to (see upload_to_release).
        value: ${{ jobs.build.outputs.tag }}
      commit:
        description: The commit that was built.
        value: ${{ jobs.build.outputs.commit }}
      skip:
        description: '"true" when upload_to_release says not to upload this run.'
        value: ${{ jobs.build.outputs.skip }}

jobs:
  build:
    permissions:
      contents: read
    outputs:
      files_id: ${{ steps.files.outputs.artifact-id }}
      skip: ${{ steps.resolve.outputs.skip }}
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.built.outputs.commit }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      # The commit this run builds, which ref may make differ from github.sha.
      # A release whose tag does not exist yet gets its tag here.
      - name: Record the built commit
        id: built
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_REF: ${{ inputs.ref }}
          UPLOAD_MODE: ${{ inputs.upload_to_release }}
        run: |
          set -euo pipefail
          case "$UPLOAD_MODE" in
            auto|true|false) ;;
            *) echo "::error::upload_to_release must be 'auto', 'true', or 'false'; got '${UPLOAD_MODE}'"; exit 1 ;;
          esac
          # Always runs, so skip is "true" rather than empty when nothing uploads.
          if [[ "$UPLOAD_MODE" == "false" ]]; then
            printf 'skip=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release is named after what was built: release_tag, else ref,
          # else the ref the workflow runs on. Taking GITHUB_REF_NAME while ref
          # built another commit would attach 0.9.0's packages to release 1.0.0.
          ref="${INPUT_REF#refs/tags/}"
          tag="${INPUT_TAG:-${ref:-${GITHUB_REF_NAME}}}"
          # Strip newlines/CR to prevent GITHUB_OUTPUT injection via unvalidated input
          tag="${tag//$'\n'/}"
          tag="${tag//$'\r'/}"
          # "auto": only upload when the ref is a real tag push or release_tag was given
          if [[ "$UPLOAD_MODE" == "auto" ]]; then
            if [[ -z "$INPUT_TAG" && -n "$ref" ]]; then
              # ref chose the build: upload only when it names a version tag
              if ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tag"; then
                printf 'skip=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            elif [[ -z "$INPUT_TAG" ]]; then
              # No explicit release_tag: require both a refs/tags/* ref AND semver name
              if [[ "${GITHUB_REF}" != refs/tags/* ]] || ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tag"; then
                printf 'skip=true\n' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            # Explicit release_tag: user intent is clear; skip ref-type check
          fi
          if [[ "$UPLOAD_MODE" == "true" && -z "$INPUT_TAG" && -n "$ref" ]] && ! grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$tag"; then
            echo "::error::ref '${ref}' is not a version tag; set release_tag to name the release." >&2
            exit 1
          fi
          printf 'skip=false\n'    >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Install RPM tooling
        shell: bash
        env:
          EXTRA_PACKAGES: ${{ inputs.extra_packages }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm rsync
          if [ -n "$EXTRA_PACKAGES" ]; then
            # Word splitting is the point: a space-separated package list.
            # shellcheck disable=SC2086
            sudo apt-get install -y $EXTRA_PACKAGES
          fi

      - name: Bootstrap script-helpers
        id: script_helpers
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${GITHUB_SERVER_URL}/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          git submodule update --init --recursive || true
          # Use script-helpers where the repository keeps it (an existing
          # vendor/script-helpers first, as before), and never create
          # vendor/: in a Go module that directory switches go build to vendor
          # mode, which fails with "inconsistent vendoring".
          dir=""
          for d in vendor/script-helpers scripts/script-helpers; do
            if [[ -f "$d/helpers.sh" ]]; then
              dir="$d"
              break
            fi
          done
          if [[ -z "$dir" ]]; then
            echo "::error::script-helpers not found at vendor/script-helpers or scripts/script-helpers; add it as a submodule." >&2
            exit 1
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Build RPM artifacts
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        # Inputs reach the script through env, never spliced into it, where a
        # value such as `x; curl ...` would run as code.
        env:
          IN_SPEC_PATH: ${{ inputs.spec_path }}
          IN_PREBUILD_COMMAND: ${{ inputs.prebuild_command }}
          IN_ARTIFACT_DIR: ${{ inputs.artifact_dir }}
          SCRIPT_HELPERS: ${{ steps.script_helpers.outputs.dir }}
        run: |
          set -euo pipefail
          # rpmbuild's _topdir must be absolute, and inputs.working_directory
          # is a caller-supplied path that usually is not. This step already
          # runs in that directory, so take the absolute form from the shell
          # rather than from the input. See the 0.22.1 CHANGELOG entry for why
          # a caller cannot supply an absolute path here instead.
          repo="$(pwd)"
          spec="$IN_SPEC_PATH"
          prebuild="$IN_PREBUILD_COMMAND"
          artifact_dir="$IN_ARTIFACT_DIR"

          if [[ -n "$spec" && "$spec" != /* ]]; then
            spec="$repo/$spec"
          fi

          if [[ "$artifact_dir" != /* ]]; then
            artifact_dir="$repo/$artifact_dir"
          fi

          spec_args=()
          if [[ -n "$spec" ]]; then
            spec_args=(--spec "$spec")
          fi

          prebuild_args=()
          if [[ -n "$prebuild" ]]; then
            prebuild_args=(--prebuild "$prebuild")
          fi

          bash "./${SCRIPT_HELPERS}/scripts/build_rpm_artifacts.sh" \
            --repo "$repo" \
            "${spec_args[@]}" \
            "${prebuild_args[@]}" \
            --artifact-dir "$artifact_dir"

      - name: Upload RPM artifacts
        id: files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 @ 2026-10-07
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_glob }}

