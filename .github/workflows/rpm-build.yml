name: ci-helpers-rpm-build
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-latest
      working_directory:
        type: string
        default: "."
      fetch_depth:
        type: number
        default: 0
      prebuild_command:
        type: string
        default: ""
      spec_path:
        type: string
        default: ""
      artifact_dir:
        type: string
        default: "dist"
      extra_packages:
        type: string
        default: ""
      artifact_name:
        type: string
        default: "rpm-packages"
      artifact_glob:
        type: string
        default: "dist/*.rpm"

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          fetch-tags: true

      - name: Install RPM tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm rsync
          if [ -n "${{ inputs.extra_packages }}" ]; then
            sudo apt-get install -y ${{ inputs.extra_packages }}
          fi

      - name: Bootstrap script-helpers
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          git submodule update --init --recursive || true
          if [[ -d "scripts/script-helpers" && ! -e "vendor/script-helpers" ]]; then
            mkdir -p vendor
            ln -sfn ../scripts/script-helpers vendor/script-helpers
          fi
          if [[ ! -e "vendor/script-helpers" ]]; then
            echo "vendor/script-helpers not found; ensure script-helpers is vendored or initialized." >&2
            exit 1
          fi

      - name: Build RPM artifacts
        shell: bash
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          # Not inputs.working_directory: rpmbuild's _topdir must be absolute,
          # and this input is a caller-supplied path that usually is not. The
          # default "." made _topdir relative, so %prep resolved _builddir to
          # an absolute /packaging/rpm/build/BUILD and every build died with
          # "Bad exit status from /var/tmp/rpm-tmp.* (%prep)". Callers cannot
          # work around it with ${{ github.workspace }} either: a workflow_call
          # `with:` block is evaluated before any runner exists, so that
          # expression is the empty string and the spec is then looked for at
          # /packaging/<name>.spec. The step already runs in the requested
          # directory, so ask the shell where that is.
          repo="$(pwd)"
          spec="${{ inputs.spec_path }}"
          prebuild="${{ inputs.prebuild_command }}"
          artifact_dir="${{ inputs.artifact_dir }}"

          if [[ -n "$spec" && "$spec" != /* ]]; then
            spec="$repo/$spec"
          fi

          if [[ "$artifact_dir" != /* ]]; then
            artifact_dir="$repo/$artifact_dir"
          fi

          spec_args=()
          if [[ -n "$spec" ]]; then
            spec_args=(--spec "$spec")
          fi

          prebuild_args=()
          if [[ -n "$prebuild" ]]; then
            prebuild_args=(--prebuild "$prebuild")
          fi

          bash ./vendor/script-helpers/scripts/build_rpm_artifacts.sh \
            --repo "$repo" \
            "${spec_args[@]}" \
            "${prebuild_args[@]}" \
            --artifact-dir "$artifact_dir"

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_glob }}
