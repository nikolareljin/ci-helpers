name: update-production

# Move a floating ref (`production` by default) onto a tag you pick, by hand.
#
# This is the deliberate counterpart to auto-tag.yml. Automatic tagging never
# moves `production` for a release candidate -- that is a rule there, not an
# option -- so this is how a candidate that has been exercised on a pilot
# consumer gets promoted without waiting for a final X.Y.Z, and how a bad move
# gets rolled back onto an earlier tag.
#
# It is MANUAL and OPT-IN. Nothing calls it on a push, a merge or a schedule.
# A repository gets it only by adding a small workflow_dispatch wrapper of its
# own (see docs/workflows.md), and it does nothing until a human runs it and
# names a tag.
#
# Runs this library's scripts/create_production.sh from a verified copy, the
# same script auto-tag.yml uses. A copy in the calling repository is not run.

on:
  # Consumers call this from their own workflow_dispatch wrapper.
  workflow_call:
    inputs:
      tag:
        description: >
          Tag to point the floating ref at, e.g. 1.2.3 or 1.2.3-rc1. Release
          candidates are deliberately allowed: promoting an exercised candidate
          by hand is the main reason this exists. The tag must already exist on
          the remote.
        type: string
        required: true
      ref_name:
        description: >
          Name of the floating tag and branch to move (default: production).
          create_production.sh refuses main, master and HEAD.
        type: string
        default: production
      update_branch:
        description: >
          Move refs/heads/<ref_name> as well as refs/tags/<ref_name> (default
          true). Set false for a tag-only move.
        type: boolean
        default: true
      dry_run:
        description: >
          Resolve and report what would move, without pushing anything. Worth a
          first run whenever the target is a candidate or a rollback.
        type: boolean
        default: false
      runner:
        description: "Runner label for the job."
        type: string
        default: ubuntu-latest

  # So this repository can move its own refs from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to point the floating ref at (e.g. 1.2.3 or 1.2.3-rc1)"
        type: string
        required: true
      ref_name:
        description: "Floating tag/branch to move"
        type: string
        default: production
      update_branch:
        description: "Also move the branch, not just the tag"
        type: boolean
        default: true
      dry_run:
        description: "Report what would move, push nothing"
        type: boolean
        default: false
      runner:
        description: "Runner label for the job."
        type: string
        default: ubuntu-latest

permissions:
  contents: write

# Opt into Node.js 24 early — Node 20 actions deprecated (removed Sep 2026)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  move:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    permissions:
      contents: write
    # Two moves at once race to the same ref, and the loser wins silently.
    # Same group as the automatic paths (auto-tag.yml, production-branch.yml),
    # so a manual move also waits for a release in flight.
    concurrency:
      group: ci-helpers-production-move-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted outbound guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-security
          sparse-checkout: |
            .github/actions/publication-guard
            vendor/script-helpers
          persist-credentials: false

      - name: Verify outbound guard revision
        shell: bash
        env:
          TRUSTED_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
        run: |
          set -euo pipefail
          git=; for g in /usr/bin/git /mingw64/bin/git.exe /clangarm64/bin/git.exe /cmd/git.exe; do if [[ -x "$g" ]]; then git="$g"; break; fi; done; [[ -n "$git" ]] || { echo "::error::no git at a fixed path"; exit 1; }
          genv=(/usr/bin/env -i PATH=/usr/bin:/bin); [[ ! -x /usr/bin/cygpath ]] || genv=(/usr/bin/env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_COMMON_DIR -u GIT_CONFIG_PARAMETERS -u GIT_CONFIG_COUNT -u GIT_EXEC_PATH)
          [[ "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$("${genv[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null "$git" -c core.fsmonitor= -c core.hooksPath=/dev/null -C .ci-helpers-security rev-parse HEAD)" == "$TRUSTED_SHA" ]] || exit 1

      - name: Guard outbound Git writes
        uses: ./.ci-helpers-security/.github/actions/publication-guard
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The library's own create_production.sh, from a verified copy: no
      # script from the caller's tree runs in this job, which holds the
      # push token.
      - name: Reserve ci-helpers scripts directory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e .ci-helpers-scripts || -L .ci-helpers-scripts ]]; then
            echo "::error::.ci-helpers-scripts already exists in the checkout; the library's scripts run only from a fresh checkout at the workflow's commit"
            exit 1
          fi

      - name: Check out ci-helpers scripts at this workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 @ 2026-09-10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-helpers-scripts
          sparse-checkout: |
            scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Isolate ci-helpers scripts
        id: ci_lib
        shell: sh
        env:
          WF_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C.UTF-8 WF_SHA="$WF_SHA" RUNNER_TEMP="$RUNNER_TEMP" GITHUB_OUTPUT="$GITHUB_OUTPUT" /bin/bash --noprofile --norc .ci-helpers-scripts/scripts/lib_isolate.sh

      # inputs.tag reaches us from a manual dispatch, so it is untrusted text.
      # It is read from the environment and never interpolated into a command,
      # and it is checked against the characters git actually allows in a tag
      # before anything is done with it.
      - name: Validate and resolve
        id: resolve
        shell: bash
        env:
          GIT_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ inputs.ref_name }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          # Appended after the publication guard's core.hooksPath entry, never over it.
          gc_n="${GIT_CONFIG_COUNT:-0}"; [[ "$gc_n" =~ ^[0-9]+$ ]] || { echo "::error::GIT_CONFIG_COUNT is not a number."; exit 1; }
          export GIT_CONFIG_COUNT="$((gc_n + 1))" "GIT_CONFIG_KEY_${gc_n}=http.${GITHUB_SERVER_URL}/.extraheader" "GIT_CONFIG_VALUE_${gc_n}=AUTHORIZATION: basic ${auth}"

          if [[ -z "${TARGET_TAG// /}" ]]; then
            echo "::error::tag is empty."
            exit 1
          fi
          if ! printf '%s' "$TARGET_TAG" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::tag '${TARGET_TAG}' contains characters not allowed here."
            exit 1
          fi
          # ref_name is used as an ls-remote pattern below, so a glob
          # character changes which ref is matched. Constrain it to the
          # characters a ref name may contain before it is used anywhere.
          if ! printf '%s' "$REF_NAME" | grep -qE '^[A-Za-z0-9][A-Za-z0-9._/-]*$'; then
            echo "::error::ref_name '${REF_NAME}' contains characters not allowed here."
            exit 1
          fi
          case "$REF_NAME" in
            main|master|HEAD|refs/heads/main|refs/heads/master|"")
              echo "::error::ref_name '${REF_NAME}' is refused."
              exit 1
              ;;
          esac

          # Not `|| true`: this fetch exists because the checkout's tag
          # snapshot cannot be trusted, so proceeding on it after the fetch
          # failed would defeat the point. create_production.sh refuses here
          # for the same reason.
          if ! git fetch --force origin "refs/tags/*:refs/tags/*" >/dev/null 2>&1; then
            echo "::error::Failed to fetch tags from origin; refusing to resolve '${TARGET_TAG}' against a possibly stale checkout."
            exit 1
          fi

          if ! target="$(git rev-parse -q --verify "refs/tags/${TARGET_TAG}^{commit}")"; then
            echo "::error::tag '${TARGET_TAG}' does not exist. Push it first."
            exit 1
          fi

          # A moved tag does not update on a plain fetch, so ask the remote
          # rather than trusting whatever this checkout happens to hold.
          # An annotated tag shows twice: refs/tags/X is the tag object and
          # refs/tags/X^{} the commit it points at. Prefer the dereferenced
          # line, so the comparison below is commit-to-commit either way.
          # (`production` is lightweight today, but ref_name is an input.)
          if ! ls_out="$(git ls-remote origin "refs/tags/${REF_NAME}" "refs/tags/${REF_NAME}^{}")"; then
            echo "::error::Failed to query origin for refs/tags/${REF_NAME}."
            exit 1
          fi
          # Compare ref names exactly: ls-remote patterns match on trailing path
          # components, so a bare catch-all would report whichever ref happened
          # to sort last.
          current_commit="$(printf '%s\n' "$ls_out" \
            | awk -v d="refs/tags/${REF_NAME}^{}" '$2 == d {print $1; exit}')"
          if [[ -z "$current_commit" ]]; then
            current_commit="$(printf '%s\n' "$ls_out" \
              | awk -v n="refs/tags/${REF_NAME}" '$2 == n {print $1; exit}')"
          fi

          {
            echo "target=${target}"
            echo "current=${current_commit}"
          } >> "$GITHUB_OUTPUT"

          prerelease="no"
          case "$TARGET_TAG" in *-*) prerelease="yes";; esac

          {
            echo "### Move \`${REF_NAME}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| target tag | \`${TARGET_TAG}\` |"
            echo "| target commit | \`${target}\` |"
            echo "| \`${REF_NAME}\` is now | \`${current_commit:-<unset>}\` |"
            echo "| pre-release | ${prerelease} |"
            echo "| branch moved too | ${UPDATE_BRANCH} |"
            echo "| dry run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$current_commit" == "$target" ]]; then
            echo "::notice::${REF_NAME} already points at ${TARGET_TAG} (${target}). Nothing to do."
          fi

      - name: Report only (dry run)
        if: ${{ inputs.dry_run }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PUSH_TOKEN: ${{ github.token }}
          # The publication guard's core.hooksPath entry, for the clean environment.
          GUARD_COUNT: ${{ env.GIT_CONFIG_COUNT }}
          GUARD_KEY: ${{ env.GIT_CONFIG_KEY_0 }}
          GUARD_HOOKS: ${{ env.GIT_CONFIG_VALUE_0 }}
          TARGET_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ inputs.ref_name }}
          TARGET: ${{ steps.resolve.outputs.target }}
          CURRENT: ${{ steps.resolve.outputs.current }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH PUSH_TOKEN TARGET_TAG REF_NAME TARGET CURRENT GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_SERVER_URL GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI GUARD_COUNT GUARD_KEY GUARD_HOOKS GITLEAKS_BIN' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          # The publication guard's hooks, by name: git config does not cross env -i.
          [[ "$GUARD_COUNT" == 1 && "$GUARD_KEY" == core.hooksPath && "$GUARD_HOOKS" == "$RUNNER_TEMP"/publication-hooks-*/hooks && "$GUARD_HOOKS" != *..* && -f "$GUARD_HOOKS/pre-push" && -x "$GITLEAKS_BIN" ]] || { echo "::error::the outbound guard is not configured; nothing is pushed."; exit 1; }
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0="$GUARD_HOOKS" GITLEAKS_BIN
          # Checked again here: the values cross into git and the script's arguments.
          [[ "$TARGET_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::tag '$TARGET_TAG' contains characters not allowed here."; exit 1; }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref_name '$REF_NAME' contains characters not allowed here."; exit 1; }
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | /usr/bin/base64 | /usr/bin/tr -d '\n')"
          echo "::add-mask::${auth}"
          # Appended after the publication guard's core.hooksPath entry, never over it.
          gc_n="${GIT_CONFIG_COUNT:-0}"; [[ "$gc_n" =~ ^[0-9]+$ ]] || { echo "::error::GIT_CONFIG_COUNT is not a number."; exit 1; }
          export GIT_CONFIG_COUNT="$((gc_n + 1))" "GIT_CONFIG_KEY_${gc_n}=http.${GITHUB_SERVER_URL}/.extraheader" "GIT_CONFIG_VALUE_${gc_n}=AUTHORIZATION: basic ${auth}"
          # The script's checks (release tag, on the default branch) decide whether
          # the real run would move anything, so the dry run runs them too.
          /bin/bash "$run_lib/scripts/create_production.sh" -t "$TARGET_TAG" --name "$REF_NAME" --repo "$GITHUB_WORKSPACE" --fetch-tags \
            --allow-prerelease --allow-rollback --dry-run
          echo "::notice::Dry run. Would move ${REF_NAME} from ${CURRENT:-<unset>} to ${TARGET} (${TARGET_TAG}). Nothing was pushed."
          CI_HELPERS_RUN
          )"

      - name: Move the floating ref
        if: ${{ !inputs.dry_run }}
        shell: sh
        env:
          LIB: ${{ steps.ci_lib.outputs.lib }}
          LIB_HASH: ${{ steps.ci_lib.outputs.hash }}
          PUSH_TOKEN: ${{ github.token }}
          # The publication guard's core.hooksPath entry, for the clean environment.
          GUARD_COUNT: ${{ env.GIT_CONFIG_COUNT }}
          GUARD_KEY: ${{ env.GIT_CONFIG_KEY_0 }}
          GUARD_HOOKS: ${{ env.GIT_CONFIG_VALUE_0 }}
          TARGET_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ inputs.ref_name }}
          UPDATE_BRANCH: ${{ inputs.update_branch }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          set +xv
          case "$(/usr/bin/env)" in *BASH_FUNC_*) echo "::error::an exported shell function is in the environment; nothing runs."; exit 1 ;; esac
          exec /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u PS4 -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT -u DYLD_INSERT_LIBRARIES -u DYLD_LIBRARY_PATH /bin/bash --noprofile --norc -c 'set +xv -f +o posix; export STEP_PATH="$PATH"; keep=($1); shift; u=(); ok=0; seen=0; bad=0; m="CI_HELPERS_ENV_END.$$.$RANDOM.$RANDOM.$RANDOM"; while IFS= read -r -d "" e; do if [[ "$ok" == 1 ]]; then bad=1; elif [[ "$e" == "$m" ]]; then ok=1; elif [[ "$e" != *=* || "$e" == =* ]]; then bad=1; else n="${e%%=*}"; [[ "$n" != PATH ]] || seen=1; k=0; for a in "${keep[@]}"; do [[ "$n" != "$a" ]] || k=1; done; [[ "$k" == 1 ]] || u+=(-u "$n"); fi; done < <(/usr/bin/env -0 && printf "%s\0" "$m"); [[ "$ok" == 1 && "$seen" == 1 && "$bad" == 0 ]] || { echo "::error::could not list the environment, or it holds an entry env -u cannot remove; nothing runs."; exit 1; }; exec /usr/bin/env "${u[@]}" PATH=/usr/bin:/bin LANG=C.UTF-8 "$@"' ci-helpers-env 'HOME STEP_PATH LIB LIB_HASH PUSH_TOKEN TARGET_TAG REF_NAME UPDATE_BRANCH GITHUB_OUTPUT GITHUB_STEP_SUMMARY GITHUB_WORKSPACE GITHUB_SERVER_URL GITHUB_ACTIONS RUNNER_TEMP RUNNER_OS RUNNER_ARCH RUNNER_TOOL_CACHE CI GUARD_COUNT GUARD_KEY GUARD_HOOKS GITLEAKS_BIN' \
            /bin/bash --noprofile --norc -euo pipefail -c "$(/bin/cat <<'CI_HELPERS_RUN'
          [[ "$LIB_HASH" =~ ^[0-9a-f]{64}$ && -d "$LIB" ]] || { echo "::error::no verified library copy to run from."; exit 1; }
          [[ -z "$(/usr/bin/find "$LIB" -type f -perm -u+w -print -quit)" ]] || { echo "::error::the library copy is writable again; nothing runs from it."; exit 1; }
          run_lib="$(/usr/bin/mktemp -d "$LIB.run.XXXXXX")"
          trap '/bin/chmod -R u+w "$run_lib"; /bin/rm -rf -- "$run_lib"' EXIT
          /bin/cp -RP "$LIB/." "$run_lib/"
          [[ -z "$(cd "$run_lib" && /usr/bin/find . ! -type f ! -type d -print)" ]] || { echo "::error::the library copy holds something other than files and directories."; exit 1; }
          if [[ -x /usr/bin/sha256sum ]]; then h=(/usr/bin/sha256sum); else h=(/usr/bin/shasum -a 256); fi
          now="$(cd "$run_lib" && export LC_ALL=C && { /usr/bin/find . -type d -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 /usr/bin/printf 'd %s\n'; /usr/bin/find . -type f -print0 | /usr/bin/sort -z | /usr/bin/xargs -0 "${h[@]}"; } | "${h[@]}" | /usr/bin/cut -d' ' -f1)"
          [[ "$now" == "$LIB_HASH" ]] || { echo "::error::the library copy changed since it was verified; nothing runs from it."; exit 1; }
          . "$run_lib/scripts/lib_path.sh" secret
          # The publication guard's hooks, by name: git config does not cross env -i.
          [[ "$GUARD_COUNT" == 1 && "$GUARD_KEY" == core.hooksPath && "$GUARD_HOOKS" == "$RUNNER_TEMP"/publication-hooks-*/hooks && "$GUARD_HOOKS" != *..* && -f "$GUARD_HOOKS/pre-push" && -x "$GITLEAKS_BIN" ]] || { echo "::error::the outbound guard is not configured; nothing is pushed."; exit 1; }
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0="$GUARD_HOOKS" GITLEAKS_BIN
          # Checked again here: the values cross into git and the script's arguments.
          [[ "$TARGET_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::tag '$TARGET_TAG' contains characters not allowed here."; exit 1; }
          [[ "$REF_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || { echo "::error::ref_name '$REF_NAME' contains characters not allowed here."; exit 1; }
          # The checkout keeps no token on disk; hand it to git for this step only.
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | /usr/bin/base64 | /usr/bin/tr -d '\n')"
          echo "::add-mask::${auth}"
          # Appended after the publication guard's core.hooksPath entry, never over it.
          gc_n="${GIT_CONFIG_COUNT:-0}"; [[ "$gc_n" =~ ^[0-9]+$ ]] || { echo "::error::GIT_CONFIG_COUNT is not a number."; exit 1; }
          export GIT_CONFIG_COUNT="$((gc_n + 1))" "GIT_CONFIG_KEY_${gc_n}=http.${GITHUB_SERVER_URL}/.extraheader" "GIT_CONFIG_VALUE_${gc_n}=AUTHORIZATION: basic ${auth}"
          # This is the manual path: promoting a candidate and rolling back are
          # what it is for. The tag must still be on the default branch.
          args=(-t "$TARGET_TAG" --name "$REF_NAME" --repo "$GITHUB_WORKSPACE" --fetch-tags --allow-prerelease --allow-rollback)
          [[ "$UPDATE_BRANCH" == "true" ]] || args+=(--no-branch)
          /bin/bash "$run_lib/scripts/create_production.sh" "${args[@]}"
          echo "::notice::${REF_NAME} now points at ${TARGET_TAG}."
          CI_HELPERS_RUN
          )"

      # The copies are read-only; a self-hosted runner clears its _temp
      # between jobs and needs them writable again.
      - name: Release ci-helpers library copy
        if: ${{ always() }}
        shell: sh
        env:
          LIB_0: ${{ steps.ci_lib.outputs.lib }}
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          BASHOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
          PYTHONPATH: ""
          PYTHONSTARTUP: ""
          PERL5LIB: ""
          PERL5OPT: ""
          RUBYOPT: ""
          NODE_OPTIONS: ""
          GIT_DIR: ""
          GIT_CONFIG_PARAMETERS: ""
          GIT_EXEC_PATH: ""
        run: |
          for d in "$LIB_0" "$LIB_1"; do
            if [ -n "$d" ] && [ -d "$d" ]; then /bin/chmod -R u+w "$d"; /bin/rm -rf -- "$d"; fi
          done
