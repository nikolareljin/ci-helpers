name: semver-compare
description: Compare two semver versions (X.Y.Z) and output lt/eq/gt
inputs:
  version_a:
    description: First version to compare
    required: true
  version_b:
    description: Second version to compare
    required: true
outputs:
  result:
    description: lt, eq, or gt
    # A composite action's output needs a value mapped from a step; without it
    # `steps.<id>.outputs.result` was always empty.
    value: ${{ steps.compare.outputs.result }}
runs:
  using: composite
  steps:
    - id: compare
      shell: bash
      # Versions arrive through env, never pasted into the script: they are
      # often read from a branch name or a file a PR can change.
      env:
        INPUT_VERSION_A: ${{ inputs.version_a }}
        INPUT_VERSION_B: ${{ inputs.version_b }}
      run: |
        set -euo pipefail
        ROOT_DIR="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        result="$("$ROOT_DIR/scripts/semver_compare.sh" "$INPUT_VERSION_A" "$INPUT_VERSION_B")"
        echo "result=$result" >> "$GITHUB_OUTPUT"
