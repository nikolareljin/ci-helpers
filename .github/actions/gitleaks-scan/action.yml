name: Gitleaks Scan
description: Run Gitleaks scan and emit a report.
inputs:
  scan_path:
    description: >
      Path to scan (relative to repo root). In a git work tree `detect` reads
      the repository's history, so a subdirectory here does not narrow the scan
      -- it still covers every commit. Outside a work tree the files under this
      path are scanned instead.
    default: "."
    required: false
  report_format:
    description: "Report format: sarif (default) or json."
    default: sarif
    required: false
  output:
    description: >
      Output report file path. Defaults to results.sarif for sarif format.
      When using report_format=json, set this to a .json path (e.g. results.json)
      to avoid a misleading file extension.
    default: results.sarif
    required: false
  gitleaks_version:
    description: >
      Gitleaks release tag to download (e.g. "v8.30.1"). Pin this explicitly
      for reproducible scans and supply-chain safety.
    default: "v8.30.1"
    required: false
  gitleaks_sha256:
    description: >
      sha256 of the release archive for this runner, required with a
      gitleaks_version other than v8.30.1, whose digests are pinned here.
    default: ""
    required: false
  config_path:
    description: Optional Gitleaks config file path.
    default: ""
    required: false
  fail_on_findings:
    description: Fail when findings are detected.
    default: "false"
    required: false
  upload_artifact:
    description: Upload the report as an artifact.
    default: "false"
    required: false
  artifact_name:
    description: Artifact name when uploading the report.
    default: gitleaks-report
    required: false
outputs:
  gl_bin:
    description: Path of the gitleaks binary the action downloaded and verified.
    value: ${{ steps.install.outputs.gl_bin }}
runs:
  using: composite
  steps:
    - name: Prepare report path
      shell: bash
      env:
        OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "${OUTPUT}")"
    - name: Install gitleaks binary
      id: install
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks_version }}
        GITLEAKS_SHA256: ${{ inputs.gitleaks_sha256 }}
      run: |
        set -euo pipefail
        # Normalize: strip any leading "v" then re-add it so both "v8.30.1"
        # and "8.30.1" produce the correct release URL.
        ver="${GITLEAKS_VERSION#v}"
        tag="v${ver}"

        # Map uname output to gitleaks release asset naming
        raw_os=$(uname -s | tr '[:upper:]' '[:lower:]')
        arch=$(uname -m)
        case "${arch}" in x86_64) arch="x64" ;; aarch64|arm64) arch="arm64" ;; esac

        case "${raw_os}" in
          linux)                os="linux"   ; ext="tar.gz" ;;
          darwin)               os="darwin"  ; ext="tar.gz" ;;
          mingw*|msys*|cygwin*) os="windows" ; ext="zip"    ;;
          *)
            echo "::error::Unsupported runner OS '${raw_os}'. gitleaks-scan supports linux, darwin, and windows." >&2
            exit 1
            ;;
        esac

        archive="gitleaks_${ver}_${os}_${arch}.${ext}"
        # A private directory per run: fixed /tmp paths are shared by every job
        # on a self-hosted runner, so one job could swap another's binary.
        if [ -n "${RUNNER_TEMP:-}" ]; then
          work=$(mktemp -d "${RUNNER_TEMP}/gitleaks.XXXXXX")
        else
          work=$(mktemp -d)
        fi

        # Direct download from GitHub Releases — no API auth needed for public repos.
        # Using curl avoids the 401 that gh-cli triggers when github.token is scoped
        # to a different repo than the one being downloaded from.
        base_url="https://github.com/gitleaks/gitleaks/releases/download/${tag}"
        curl -fsSL "${base_url}/${archive}" -o "${work}/${archive}"

        # Verify against a digest held in this repository, never one fetched
        # beside the archive: a replaced release would bring its own checksums.
        # 8.30.1, from its checksums.txt, matching GitHub's asset digests.
        case "${archive}" in
          gitleaks_8.30.1_linux_x64.tar.gz)    pinned=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          gitleaks_8.30.1_linux_arm64.tar.gz)  pinned=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
          gitleaks_8.30.1_darwin_x64.tar.gz)   pinned=dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709 ;;
          gitleaks_8.30.1_darwin_arm64.tar.gz) pinned=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
          gitleaks_8.30.1_windows_x64.zip)     pinned=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          gitleaks_8.30.1_windows_arm64.zip)   pinned=b95f5e4f5c425cedca7ee203d9afd29597e692c4924a12ed42f970537c72cc0f ;;
          *) pinned="" ;;
        esac
        expected="${GITLEAKS_SHA256:-${pinned}}"
        if [ -z "${expected}" ]; then
          echo "::error::No pinned sha256 for ${archive}; pass gitleaks_sha256 (its line in that release's checksums.txt, checked against a second source). Refusing to run an unverified binary." >&2
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "${work}/${archive}" | awk '{ print $1 }')
        elif command -v shasum >/dev/null 2>&1; then
          actual=$(shasum -a 256 "${work}/${archive}" | awk '{ print $1 }')
        else
          echo "::error::Neither sha256sum nor shasum is available to verify ${archive}." >&2
          exit 1
        fi
        if [ "${actual}" != "${expected}" ]; then
          echo "::error::Checksum mismatch for ${archive}: expected ${expected}, got ${actual}." >&2
          exit 1
        fi
        echo "Verified ${archive} (sha256 ${actual})"

        if [ "${ext}" = "zip" ]; then
          unzip -q "${work}/${archive}" -d "${work}/bin"
          GL_BIN="${work}/bin/gitleaks.exe"
        else
          mkdir -p "${work}/bin"
          tar -xzf "${work}/${archive}" -C "${work}/bin" gitleaks
          GL_BIN="${work}/bin/gitleaks"
          chmod +x "${GL_BIN}"
        fi
        # An output, not GITHUB_ENV, which would also reach every later step
        # of the caller's job.
        echo "gl_bin=${GL_BIN}" >> "${GITHUB_OUTPUT}"

    # Without config_path, gitleaks loads .gitleaks.toml and .gitleaksignore
    # from the checked-out tree, so on a pull request those files come from the
    # PR itself and can allowlist the very secret it adds. Flag such changes for
    # the reviewer. Advisory only: this step never fails the job, including when
    # a shallow checkout lacks the base commit to diff against.
    - name: Check pull request for scanner config changes
      if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config_path }}
      run: |
        set -uo pipefail
        base=$(python3 -c 'import json, os; print(((json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("pull_request") or {}).get("base") or {}).get("sha") or "")' 2>/dev/null) || base=""
        if [ -z "${base}" ] || ! git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Scanner config check skipped: no pull request base or no git checkout."
          exit 0
        fi
        if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          GIT_TERMINAL_PROMPT=0 git fetch --no-tags --depth=1 origin "${base}" >/dev/null 2>&1 || true
        fi
        if ! changed=$(git diff --name-only "${base}...HEAD" 2>/dev/null) \
          && ! changed=$(git diff --name-only "${base}" HEAD 2>/dev/null); then
          echo "::notice::Could not diff against the pull request base (shallow checkout?); scanner config changes were not checked."
          exit 0
        fi
        hits=""
        while IFS= read -r f; do
          [ -z "${f}" ] && continue
          case "${f##*/}" in
            .gitleaks.toml|.gitleaksignore) hits="${hits}${hits:+, }${f}" ;;
            *) if [ -n "${CONFIG_PATH}" ] && [ "${f}" = "${CONFIG_PATH#./}" ]; then hits="${hits}${hits:+, }${f}"; fi ;;
          esac
        done <<< "${changed}"
        if [ -n "${hits}" ]; then
          echo "::warning::This pull request changes gitleaks configuration read by this scan (${hits}). Allowlist or ignore entries added here apply to the scan of this same pull request; review them before trusting a clean result."
        fi
        exit 0

    - name: Run gitleaks scan
      shell: bash
      env:
        GL_BIN: ${{ steps.install.outputs.gl_bin }}
        SCAN_PATH: ${{ inputs.scan_path }}
        OUTPUT: ${{ inputs.output }}
        CONFIG_PATH: ${{ inputs.config_path }}
        REPORT_FMT: ${{ inputs.report_format }}
      run: |
        set -euo pipefail
        # --redact keeps secret values out of the report, which is uploaded as an
        # artifact or SARIF; findings and their count are unchanged.
        args=(detect --source "${SCAN_PATH}" --report-format "${REPORT_FMT}" --report-path "${OUTPUT}" --exit-code 0 --redact)
        [ -n "${CONFIG_PATH}" ] && args+=(--config "${CONFIG_PATH}")

        # `detect` reads git history. Pointed at a directory that is not a work
        # tree -- an unpacked archive, a build output, anything generated -- it
        # logs `git error encountered`, writes an empty report and exits 0, and
        # this action then says "No Gitleaks findings detected." A secret scan
        # that scanned nothing must not read as a scan that found nothing, so
        # the files are scanned instead when there is no history to read.
        if ! git -C "${SCAN_PATH}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "::notice title=Gitleaks::${SCAN_PATH} is not inside a git work tree; scanning its files rather than the history."
          args+=(--no-git)
        fi

        log="$(mktemp)"
        "${GL_BIN}" "${args[@]}" 2>&1 | tee "${log}"

        # The other half of the same failure: a work tree whose history cannot
        # be read also ends in a partial scan and exit 0. Two spellings,
        # because the wording is not stable across gitleaks releases -- 8.30.1
        # logs `fatal: not a git repository`, other builds log `git error
        # encountered`.
        if grep -qE "git error encountered|fatal: not a git repository" "${log}"; then
          echo "::error::gitleaks could not read the git history of ${SCAN_PATH}; the scan was partial and its result means nothing." >&2
          exit 1
        fi

        # And the version-independent form of the same question: a scan that
        # examined nothing must not report that it found nothing.
        if grep -qE "scanned ~0 bytes" "${log}"; then
          echo "::error::gitleaks examined 0 bytes under ${SCAN_PATH}; it found nothing because it read nothing." >&2
          exit 1
        fi
    - name: Evaluate findings
      shell: bash
      env:
        REPORT_FORMAT: ${{ inputs.report_format }}
        OUTPUT: ${{ inputs.output }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys

        report_format = os.environ["REPORT_FORMAT"]
        output = os.environ["OUTPUT"]
        fail_on_findings = os.environ["FAIL_ON_FINDINGS"] == "true"

        count = 0
        if report_format == "sarif":
            with open(output, "r", encoding="utf-8") as fh:
                data = json.load(fh)
            runs = data.get("runs", [])
            for run in runs:
                results = run.get("results", [])
                if isinstance(results, list):
                    count += len(results)
        else:
            with open(output, "r", encoding="utf-8") as fh:
                data = json.load(fh)
            if isinstance(data, list):
                count = len(data)
            elif isinstance(data, dict):
                for key in ("findings", "leaks", "results", "issues"):
                    value = data.get(key)
                    if isinstance(value, list):
                        count += len(value)

        if count > 0:
            print(f"Gitleaks findings detected: {count}")
            print("Tip: remove leaked secrets with Leak-Lock:")
            print("  https://nikolareljin.github.io/leak-lock/")
            if fail_on_findings:
                sys.exit(3)
        else:
            print("No Gitleaks findings detected.")
        PY
    - name: Upload artifact
      if: ${{ inputs.upload_artifact == 'true' && always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 @ 2026-10-09
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.output }}
        if-no-files-found: warn
