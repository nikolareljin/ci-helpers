name: release-notes
description: >
  Produce a GitHub Release body and write it to a file. The body is the
  CHANGELOG.md section for the version, or the commits since the previous
  release tag when there is none -- never the placeholder "* No changes listed."
  Wraps the vendored script-helpers scripts/release_notes.sh, so the range is
  computed from the previous release tag rather than the tag being released.
  The notes are written to a file and exposed as a path (notes_file); pass that
  to body_path / --notes-file so the body never travels through a ${{ }} string.
inputs:
  version:
    description: "Version being released. Default: release_tag, else GITHUB_REF_NAME (a leading v is fine)."
    required: false
    default: ""
  release_tag:
    description: "Tag for this release and for binary download links. Default: GITHUB_REF_NAME."
    required: false
    default: ""
  repo_dir:
    description: "Repository root to read. Default: GITHUB_WORKSPACE."
    required: false
    default: ""
  changelog:
    description: "CHANGELOG path relative to repo_dir. Default: CHANGELOG.md."
    required: false
    default: ""
  override:
    description: >
      Explicit body text. When set it is used verbatim instead of the generated
      notes (binary links are still appended). This is the escape hatch a caller
      uses to supply its own text.
    required: false
    default: ""
  binary_links:
    description: Newline-delimited "label|filename" entries for a download table.
    required: false
    default: ""
  binary_base_url:
    description: "Base URL for binaries. Default: this repo's releases/download/<tag>."
    required: false
    default: ""
outputs:
  notes_file:
    description: Path to the file holding the release body. Pass to body_path / --notes-file.
    value: ${{ steps.produce.outputs.notes_file }}
  notes:
    description: The release body as text. Prefer notes_file; this exists for callers that still read an output.
    value: ${{ steps.produce.outputs.notes }}
runs:
  using: composite
  steps:
    # Everything reaches the shell through the environment, never interpolated
    # into the script: a ${{ }} value spliced into `run:` is expanded before the
    # shell sees it, so a CHANGELOG line or a commit subject containing `${{ }}`
    # or a backtick would run. This is the failure this action exists to end, so
    # it does not reproduce it. See GitHub's workflow-injection guidance.
    - id: produce
      shell: bash
      env:
        RN_VERSION: ${{ inputs.version }}
        RN_RELEASE_TAG: ${{ inputs.release_tag }}
        RN_REPO_DIR: ${{ inputs.repo_dir }}
        RN_CHANGELOG: ${{ inputs.changelog }}
        RN_OVERRIDE: ${{ inputs.override }}
        RN_BINARY_LINKS: ${{ inputs.binary_links }}
        RN_BINARY_BASE_URL: ${{ inputs.binary_base_url }}
        RN_ACTION_PATH: ${{ github.action_path }}
        RN_REPOSITORY: ${{ github.repository }}
        RN_REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        repo_dir="${RN_REPO_DIR:-}"
        [ -n "$repo_dir" ] || repo_dir="${GITHUB_WORKSPACE:-.}"

        release_tag="${RN_RELEASE_TAG:-}"
        [ -n "$release_tag" ] || release_tag="${RN_REF_NAME:-}"

        version="${RN_VERSION:-}"
        [ -n "$version" ] || version="$release_tag"

        notes_file="${RUNNER_TEMP:-/tmp}/release-notes.md"

        if [ -n "${RN_OVERRIDE:-}" ]; then
          # Verbatim caller text. Written through the environment, not echoed
          # from a ${{ }} expansion, for the same reason as everything else here.
          printf '%s\n' "$RN_OVERRIDE" > "$notes_file"
        else
          # The vendored producer lives at the repo root of this action's repo:
          #   .github/actions/release-notes/ -> ../../../vendor/script-helpers
          producer="$RN_ACTION_PATH/../../../vendor/script-helpers/scripts/release_notes.sh"
          if [ ! -x "$producer" ]; then
            echo "release-notes: vendored producer not found at $producer" >&2
            exit 1
          fi
          args=(--version "$version" --repo "$repo_dir" --output "$notes_file")
          [ -z "${RN_CHANGELOG:-}" ] || args+=(--changelog "$RN_CHANGELOG")
          bash "$producer" "${args[@]}"
        fi

        binary_base_url="${RN_BINARY_BASE_URL:-}"
        if [ -z "$binary_base_url" ] && [ -n "$release_tag" ]; then
          binary_base_url="https://github.com/${RN_REPOSITORY}/releases/download/${release_tag}"
        fi

        if [ -n "${RN_BINARY_LINKS:-}" ] && [ -n "$binary_base_url" ]; then
          {
            echo ""
            echo "## Download Binaries"
            echo ""
            echo "| Platform | Binary |"
            echo "|----------|--------|"
          } >> "$notes_file"

          while IFS= read -r line; do
            trimmed="${line#"${line%%[![:space:]]*}"}"
            [ -n "$trimmed" ] || continue
            label="${trimmed%%|*}"
            filename="${trimmed#*|}"
            if [ -z "$label" ] || [ -z "$filename" ] || [ "$label" = "$filename" ]; then
              continue
            fi
            printf "| %s | [%s](%s/%s) |\n" "$label" "$filename" "$binary_base_url" "$filename" >> "$notes_file"
          done <<< "$RN_BINARY_LINKS"
        fi

        {
          echo "notes_file=$notes_file"
          echo "notes<<RELEASE_NOTES_EOF"
          cat "$notes_file"
          echo "RELEASE_NOTES_EOF"
        } >> "$GITHUB_OUTPUT"
