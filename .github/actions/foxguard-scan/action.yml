name: Foxguard Scan
description: Enforce Foxguard static-analysis checks without publishing scanner output.
inputs:
  scan_path:
    description: Path to scan (relative to repo root, or an absolute path).
    default: "."
    required: false
  severity:
    description: >
      Lowest severity that fails the scan: low, medium, high or critical.
      Findings below it are not reported.
    default: medium
    required: false
  config_path:
    description: >
      Optional foxguard config file path, relative to the scanned repository.
      PR scans read it from the base commit; a config added by the pull
      request is not used. Default: `.foxguard.yml` at the base when present.
    default: ""
    required: false
  fail_on_findings:
    description: Mandatory enforcement; false is refused.
    default: "true"
    required: false
  foxguard_version:
    description: >
      Foxguard release tag to download (e.g. "v0.14.1"). Pin this explicitly
      for reproducible scans and supply-chain safety.
    default: "v0.14.1"
    required: false
  foxguard_sha256:
    description: >
      sha256 of the release binary for this runner, required with a
      foxguard_version other than the one pinned in scanner-pins.env (v0.14.1),
      whose digests are pinned there; a different digest for that version is
      refused.
    default: ""
    required: false
outputs:
  fg_bin:
    description: Path of the foxguard binary the action downloaded and verified.
    value: ${{ steps.install.outputs.fg_bin }}
runs:
  using: composite
  steps:
    - name: Enforce local-only results
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        PYTHONPATH: ""
        PYTHONSTARTUP: ""
        PERL5LIB: ""
        PERL5OPT: ""
        RUBYOPT: ""
        NODE_OPTIONS: ""
      run: |
        set -euo pipefail
        if [[ "$FAIL_ON_FINDINGS" != true ]]; then
          source "$ACTION_PATH/../../../vendor/script-helpers/scripts/security_notice.sh"
          security_notice Foxguard
          exit 1
        fi
    - name: Install foxguard binary
      id: install
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        FOXGUARD_VERSION: ${{ inputs.foxguard_version }}
        FOXGUARD_SHA256: ${{ inputs.foxguard_sha256 }}
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        PYTHONPATH: ""
        PYTHONSTARTUP: ""
        PERL5LIB: ""
        PERL5OPT: ""
        RUBYOPT: ""
        NODE_OPTIONS: ""
      # Version and digests pinned in this repository's scanner-pins.env,
      # read by the one installer the foxguard-scan and foxguard-diff actions share.
      run: /bin/bash "$ACTION_PATH/../../../scripts/install_foxguard.sh"

    - name: Security checks
      shell: /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        FG_BIN: ${{ steps.install.outputs.fg_bin }}
        SCAN_PATH: ${{ inputs.scan_path }}
        SEVERITY: ${{ inputs.severity }}
        CONFIG_PATH: ${{ inputs.config_path }}
        FAIL_ON_FINDINGS: ${{ inputs.fail_on_findings }}
        ACTION_PATH: ${{ github.action_path }}
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        PYTHONPATH: ""
        PYTHONSTARTUP: ""
        PERL5LIB: ""
        PERL5OPT: ""
        RUBYOPT: ""
        NODE_OPTIONS: ""
      run: /bin/bash "$ACTION_PATH/run.sh"
