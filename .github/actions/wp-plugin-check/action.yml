name: WordPress Plugin Check
description: Run WP plugin-check via Docker + optional PHP lint and PHPUnit.
inputs:
  compose_file:
    description: Docker Compose file for WordPress test stack.
    default: test/docker-compose.yml
    required: false
  plugin_slug:
    description: WordPress plugin slug.
    required: true
  plugin_src:
    description: Path to plugin source on the host.
    default: .
    required: false
  plugin_src_env:
    description: Environment variable name used by compose to mount plugin.
    default: PLUGIN_SRC
    required: false
  wpcli_service:
    description: Docker Compose service name for WP-CLI.
    default: wpcli
    required: false
  db_service:
    description: Docker Compose service name for DB.
    default: db
    required: false
  wordpress_service:
    description: Docker Compose service name for WordPress.
    default: wordpress
    required: false
  host_port:
    description: Host port exposed by WordPress service.
    default: "8080"
    required: false
  out_dir:
    description: Output directory for plugin check artifacts.
    default: test/tmp
    required: false
  db_wait_seconds:
    description: Seconds to wait for DB readiness.
    default: "30"
    required: false
  multisite:
    description: Install WordPress in multisite mode.
    default: "true"
    required: false
  activate_network:
    description: Network-activate plugin when multisite is enabled.
    default: "true"
    required: false
  admin_user:
    description: WordPress admin username.
    default: admin
    required: false
  admin_password:
    description: >
      Admin password for the throwaway test site. Empty (the default) uses a
      random one per run; a value passed here is shown with the run's inputs.
    default: ""
    required: false
  admin_email:
    description: WordPress admin email.
    default: admin@example.com
    required: false
  site_title:
    description: WordPress site title.
    default: WP Test Site
    required: false
  meta_check_script:
    description: Optional path to a WP-CLI eval-file script for meta checks.
    default: ""
    required: false
  php_version:
    description: PHP version for linting/PHPUnit steps.
    default: ""
    required: false
  php_lint_command:
    description: Optional PHP lint command (errors only).
    default: ""
    required: false
  phpcs_warning_command:
    description: Optional PHPCS warning command (runs without failing).
    default: ""
    required: false
  phpunit_command:
    description: Optional PHPUnit command (standalone).
    default: ""
    required: false
  phpunit_working_directory:
    description: Working directory for PHPUnit command.
    default: .
    required: false
  fail_on_findings:
    description: Fail on plugin-check or meta-check errors.
    default: "false"
    required: false
  cleanup:
    description: Run docker compose down after checks.
    default: "true"
    required: false
runs:
  using: composite
  steps:
    - name: Setup PHP
      if: ${{ inputs.php_version != '' && (inputs.php_lint_command != '' || inputs.phpcs_warning_command != '' || inputs.phpunit_command != '') }}
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0 @ 2026-10-16
      with:
        php-version: ${{ inputs.php_version }}

    - name: PHP lint (errors only)
      if: ${{ inputs.php_lint_command != '' }}
      shell: bash
      run: |
        set -euo pipefail
        ${{ inputs.php_lint_command }}

    - name: PHPCS warnings (non-blocking)
      if: ${{ inputs.phpcs_warning_command != '' }}
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        ${{ inputs.phpcs_warning_command }}

    - name: PHPUnit (standalone)
      if: ${{ inputs.phpunit_command != '' }}
      shell: bash
      working-directory: ${{ inputs.phpunit_working_directory }}
      run: |
        set -euo pipefail
        ${{ inputs.phpunit_command }}

    - name: Prepare WP-CLI config
      shell: bash
      env:
        WPC_OUT_DIR: ${{ inputs.out_dir }}
        WPC_HOST_PORT: ${{ inputs.host_port }}
      run: |
        set -euo pipefail
        out_dir="${WPC_OUT_DIR}"
        host_port="${WPC_HOST_PORT}"
        mkdir -p "$out_dir"
        cat > "$out_dir/wp-cli.yml" <<WPCLI
        path: /var/www/html
        url: http://localhost:${host_port}
        color: false
        disable_wp_cron: true
        apache_modules:
          - mod_rewrite
        WPCLI

    - name: Start WordPress stack
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
        WPC_DB_SERVICE: ${{ inputs.db_service }}
        WPC_WORDPRESS_SERVICE: ${{ inputs.wordpress_service }}
        WPC_PLUGIN_SRC_ENV: ${{ inputs.plugin_src_env }}
        WPC_PLUGIN_SRC: ${{ inputs.plugin_src }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        db_service="${WPC_DB_SERVICE}"
        wordpress_service="${WPC_WORDPRESS_SERVICE}"
        plugin_src_env="${WPC_PLUGIN_SRC_ENV}"
        plugin_src="${WPC_PLUGIN_SRC}"

        # Absolute, resolved from the workspace: Compose would otherwise resolve a
        # relative value against the compose file's directory, not the repository.
        if ! plugin_src_abs="$(cd "$plugin_src" && pwd -P)"; then
          echo "::error::Unable to resolve plugin_src directory: ${plugin_src}" >&2
          exit 1
        fi
        # Later steps run `docker compose` against the same file, and Cleanup's
        # `down` fails when that variable is unset, leaving the
        # stack running. Export the validated absolute path once, for the rest
        # of the job, instead of only inside this step.
        if [[ ! "$plugin_src_env" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
          echo "::error::plugin_src_env must be a valid environment variable name; got '${plugin_src_env}'" >&2
          exit 1
        fi
        if [[ "$plugin_src_abs" == *$'\n'* || "$plugin_src_abs" == *$'\r'* ]]; then
          echo "::error::plugin_src must not contain newlines" >&2
          exit 1
        fi
        delimiter="plugin_src_$(date +%s%N)_${RANDOM}"
        {
          printf '%s<<%s\n' "$plugin_src_env" "$delimiter"
          printf '%s\n' "$plugin_src_abs"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_ENV"
        export "$plugin_src_env"="$plugin_src_abs"
        docker compose -f "$compose_file" up -d "$db_service" "$wordpress_service"

    - name: Wait for DB
      shell: bash
      env:
        WPC_DB_WAIT_SECONDS: ${{ inputs.db_wait_seconds }}
      run: |
        set -euo pipefail
        sleep "${WPC_DB_WAIT_SECONDS}"

    - name: Install WordPress
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
        WPC_WPCLI_SERVICE: ${{ inputs.wpcli_service }}
        WPC_HOST_PORT: ${{ inputs.host_port }}
        WPC_ADMIN_USER: ${{ inputs.admin_user }}
        WPC_ADMIN_PASSWORD: ${{ inputs.admin_password }}
        WPC_ADMIN_EMAIL: ${{ inputs.admin_email }}
        WPC_SITE_TITLE: ${{ inputs.site_title }}
        WPC_MULTISITE: ${{ inputs.multisite }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        wpcli_service="${WPC_WPCLI_SERVICE}"
        multisite="${WPC_MULTISITE}"
        # Empty (the default) gets a random password per run: an input is
        # shown with the run, and this one sits on a command line.
        if [[ -z "$WPC_ADMIN_PASSWORD" ]]; then
          WPC_ADMIN_PASSWORD="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          export WPC_ADMIN_PASSWORD
        fi

        docker compose -f "$compose_file" run --rm "$wpcli_service" sh -lc 'test -f wp-config.php || wp config create --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=db:3306 --skip-check'

        if [[ "$multisite" == "true" ]]; then
          docker compose -f "$compose_file" run --rm "$wpcli_service" sh -lc 'wp config set WP_ALLOW_MULTISITE true --raw || true'
          docker compose -f "$compose_file" run --rm -e WPC_HOST_PORT -e WPC_SITE_TITLE -e WPC_ADMIN_USER -e WPC_ADMIN_PASSWORD -e WPC_ADMIN_EMAIL "$wpcli_service" sh -lc 'wp core is-installed || wp core multisite-install --url="localhost:$WPC_HOST_PORT" --title="$WPC_SITE_TITLE" --admin_user="$WPC_ADMIN_USER" --admin_password="$WPC_ADMIN_PASSWORD" --admin_email="$WPC_ADMIN_EMAIL" --skip-email --subdomains=0'
        else
          docker compose -f "$compose_file" run --rm -e WPC_HOST_PORT -e WPC_SITE_TITLE -e WPC_ADMIN_USER -e WPC_ADMIN_PASSWORD -e WPC_ADMIN_EMAIL "$wpcli_service" sh -lc 'wp core is-installed || wp core install --url="localhost:$WPC_HOST_PORT" --title="$WPC_SITE_TITLE" --admin_user="$WPC_ADMIN_USER" --admin_password="$WPC_ADMIN_PASSWORD" --admin_email="$WPC_ADMIN_EMAIL" --skip-email'
        fi

    - name: Activate plugin
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
        WPC_WPCLI_SERVICE: ${{ inputs.wpcli_service }}
        WPC_PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        WPC_ACTIVATE_NETWORK: ${{ inputs.activate_network }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        wpcli_service="${WPC_WPCLI_SERVICE}"
        activate_network="${WPC_ACTIVATE_NETWORK}"

        if [[ "$activate_network" == "true" ]]; then
          docker compose -f "$compose_file" run --rm -e WPC_PLUGIN_SLUG "$wpcli_service" sh -lc 'wp plugin activate "$WPC_PLUGIN_SLUG" --network || wp plugin activate "$WPC_PLUGIN_SLUG"'
        else
          docker compose -f "$compose_file" run --rm -e WPC_PLUGIN_SLUG "$wpcli_service" sh -lc 'wp plugin activate "$WPC_PLUGIN_SLUG"'
        fi

    # The download runs in the wp-cli container, where a DNS miss reads
    # 'Download failed. "A valid URL was not provided."'. One attempt turned
    # that blip into a failed check, so try 3 times with a pause. A plugin-check
    # that never installs is still reported by the next step.
    - name: Install plugin-check
      shell: bash
      env:
        COMPOSE_FILE_PATH: ${{ inputs.compose_file }}
        WPCLI_SERVICE: ${{ inputs.wpcli_service }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if docker compose -f "$COMPOSE_FILE_PATH" run --rm "$WPCLI_SERVICE" sh -lc "wp plugin install plugin-check --activate"; then
            exit 0
          fi
          if [[ "$attempt" -lt 3 ]]; then
            echo "::warning::plugin-check install attempt ${attempt}/3 failed; retrying in $((attempt * 5))s."
            sleep "$((attempt * 5))"
          fi
        done
        echo "::warning::plugin-check could not be installed after 3 attempts."

    - name: Run plugin-check
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
        WPC_WPCLI_SERVICE: ${{ inputs.wpcli_service }}
        WPC_PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        WPC_OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        wpcli_service="${WPC_WPCLI_SERVICE}"
        out_dir="${WPC_OUT_DIR}"

        if docker compose -f "$compose_file" run --rm "$wpcli_service" sh -lc "wp help plugin | grep -q '\\<check\\>'"; then
          docker compose -f "$compose_file" run --rm -e WPC_PLUGIN_SLUG "$wpcli_service" sh -lc 'wp plugin check "$WPC_PLUGIN_SLUG" --format=json' > "$out_dir/plugin-check.json" || true
          echo "plugin-check JSON saved to $out_dir/plugin-check.json"
        else
          echo "'wp plugin check' command not available in WP-CLI."
        fi

    - name: Run meta checks
      if: ${{ inputs.meta_check_script != '' }}
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
        WPC_WPCLI_SERVICE: ${{ inputs.wpcli_service }}
        WPC_META_CHECK_SCRIPT: ${{ inputs.meta_check_script }}
        WPC_OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        wpcli_service="${WPC_WPCLI_SERVICE}"
        out_dir="${WPC_OUT_DIR}"

        docker compose -f "$compose_file" run --rm -e WPC_META_CHECK_SCRIPT "$wpcli_service" sh -lc 'wp eval-file "/workspace/$WPC_META_CHECK_SCRIPT"' > "$out_dir/meta-check.json"
        echo "meta-check JSON saved to $out_dir/meta-check.json"

    - name: Fail on findings
      if: ${{ inputs.fail_on_findings == 'true' }}
      shell: bash
      env:
        WPC_OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -euo pipefail

        python3 - <<'PY'
        import json
        import os
        import sys
        from pathlib import Path

        out_dir = Path(os.environ["WPC_OUT_DIR"])
        plugin_check = out_dir / "plugin-check.json"
        meta_check = out_dir / "meta-check.json"

        error_count = 0

        if plugin_check.exists():
            data = json.loads(plugin_check.read_text(encoding="utf-8"))
            if isinstance(data, dict):
                if isinstance(data.get("errors"), int):
                    error_count += data.get("errors", 0)
                for key in ("results", "issues", "messages"):
                    items = data.get(key)
                    if isinstance(items, list):
                        for item in items:
                            if isinstance(item, dict):
                                level = str(item.get("severity") or item.get("level") or item.get("type") or "").lower()
                                if level in {"error", "critical", "fatal"}:
                                    error_count += 1
                            else:
                                error_count += 1
            elif isinstance(data, list):
                error_count += len(data)

        if meta_check.exists():
            data = json.loads(meta_check.read_text(encoding="utf-8"))
            checks = data.get("checks") if isinstance(data, dict) else None
            if isinstance(checks, dict):
                for value in checks.values():
                    if isinstance(value, dict) and value.get("ok") is False:
                        error_count += 1

        if error_count > 0:
            print(f"Plugin checks reported {error_count} error(s)")
            sys.exit(4)

        print("No plugin-check errors detected.")
        PY

    - name: Cleanup
      if: ${{ always() && inputs.cleanup == 'true' }}
      shell: bash
      env:
        WPC_COMPOSE_FILE: ${{ inputs.compose_file }}
      run: |
        set -euo pipefail
        compose_file="${WPC_COMPOSE_FILE}"
        docker compose -f "$compose_file" down -v
