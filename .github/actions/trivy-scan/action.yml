name: Trivy Scan
description: Run Trivy filesystem scan with optional SARIF upload.
inputs:
  scan_path:
    description: Path to scan.
    default: "."
    required: false
  format:
    description: Trivy output format.
    default: sarif
    required: false
  output:
    description: Output file path for Trivy results.
    default: trivy-results.sarif
    required: false
  severity:
    description: Comma-separated severities to report.
    default: CRITICAL,HIGH
    required: false
  ignore_unfixed:
    description: Ignore unfixed vulnerabilities.
    default: "true"
    required: false
  vuln_type:
    description: Comma-separated vulnerability types.
    default: os,library
    required: false
  fail_on_findings:
    description: Fail the workflow when findings match severity.
    default: "false"
    required: false
  scanners:
    description: >
      Comma-separated Trivy scanners. `vuln` is the default and
      was all this ever ran; `misconfig` reads Dockerfiles, compose files,
      Kubernetes manifests and Terraform, and `secret` is Trivy's own secret
      scanner (this repository's `gitleaks-scan.yml` already covers that
      ground). The rulesets ship with the binary that is already downloaded
      here, so `misconfig` costs a flag, not a tool.
    default: vuln
    required: false
  skip_dirs:
    description: >
      Comma-separated directories to leave out, passed to Trivy's
      `--skip-dirs`. Use it for fixtures that are wrong on purpose: a Security
      tab full of findings nobody is going to act on is one people stop
      reading.
    default: ""
    required: false
  upload_sarif:
    description: Upload SARIF to GitHub Security tab when format is sarif.
    default: "true"
    required: false
runs:
  using: composite
  steps:
    # An unknown scanner name is a FATAL error from Trivy, which is loud and
    # fine. An empty one is not: Trivy accepts it, scans nothing and exits 0,
    # so the step goes green having looked at nothing.
    - name: A scan has to scan something
      shell: bash
      env:
        SCANNERS: ${{ inputs.scanners }}
      run: |
        set -euo pipefail
        if [[ -z "${SCANNERS// /}" ]]; then
          echo "::error::scanners is empty. Trivy accepts that, scans nothing and exits 0, so the run would report success having looked at nothing. Name at least one of vuln, misconfig, secret, license -- or drop the call if you do not want a scan." >&2
          exit 1
        fi

    - name: Run Trivy
      uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # master @ 2026-08-24
      with:
        scan-type: fs
        scan-ref: ${{ inputs.scan_path }}
        format: ${{ inputs.format }}
        output: ${{ inputs.output }}
        severity: ${{ inputs.severity }}
        ignore-unfixed: ${{ inputs.ignore_unfixed }}
        vuln-type: ${{ inputs.vuln_type }}
        scanners: ${{ inputs.scanners }}
        skip-dirs: ${{ inputs.skip_dirs }}
        exit-code: ${{ inputs.fail_on_findings == 'true' && '1' || '0' }}
    # Not only on success: with fail_on_findings the scan step fails exactly when
    # there are findings, and those are the results the Security tab needs. But
    # only when a report was written -- a scan that failed before producing one
    # (database download, bad input) must not gain a second, misleading upload
    # error -- and not on cancellation.
    - name: Check for SARIF report
      id: sarif
      if: ${{ !cancelled() && inputs.upload_sarif == 'true' && inputs.format == 'sarif' }}
      shell: bash
      env:
        SARIF_OUTPUT: ${{ inputs.output }}
      run: |
        if [ -s "$SARIF_OUTPUT" ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No SARIF report at $SARIF_OUTPUT; skipping the upload."
        fi
    - name: Upload SARIF
      if: ${{ !cancelled() && steps.sarif.outputs.exists == 'true' }}
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2 @ 2026-09-28
      with:
        sarif_file: ${{ inputs.output }}
