version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows only; the composite actions under
    # .github/actions pin their own action SHAs and need listing too.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10
    # A release a week old has had time to be yanked if it was bad.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["actions/*"]
