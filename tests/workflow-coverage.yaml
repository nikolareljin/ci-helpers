# What exercises each reusable workflow, and what does not.
#
# Every workflow with a `workflow_call` trigger is either driven by a leg in one
# of the self-test suites or listed here with the reason it is not.
# `scripts/check_workflow_coverage.py` fails when one is in neither, when one
# listed here has since gained a leg, and when an entry names a workflow that no
# longer exists.
#
# The list exists because an unverified claim is worse than an absent one. This
# repository shipped `csharp.yml` with a lint command built on a tool delisted
# four framework versions earlier, `kotlin.yml` with Android-only tasks as its
# defaults, and `cypress.yml` with a command that could not run on either Yarn
# line -- each for its whole life, because nothing ran them. The count below is
# how much of that surface is still unexamined.
#
# Verification stops at the credential on purpose: a deliberately invalid token
# proves a failure lands at the authentication step and not before, and that is
# the most a repository without the account can honestly claim.

groups:
  credential-bound:
    reason: >-
      Declares a secret this repository does not hold -- a signing key, a store
      or registry credential, a deploy key. A self-test can go as far as the
      authentication step and no further, so nothing past it is claimed here.
    workflows:
      - cloudflare-deploy.yml
      - docker-multiarch.yml
      - flutter-release.yml
      - go-deploy.yml
      - homebrew-package.yml
      - ppa-deb.yml
      - release-rc-pr.yml
      - rust-release-tarballs.yml
      - tauri-release.yml
      - unity.yml
      - winget-submit.yml

  changes-this-repository:
    reason: >-
      Running it would tag, release, deploy or push. There is no way to execute
      it against this repository in a pull request without changing the thing
      the run is meant to observe, so the parts worth proving are covered by
      gates over their inputs instead (see `release-tag-check`,
      `changelog-structure-gate-refuses-what-it-must`).
    workflows:
      - auto-tag.yml
      - auto-tag-release.yml
      - cloudflare-build.yml
      - create-github-release.yml
      - deploy.yml
      - fpc-release.yml
      - go-release.yml
      - manifest-version.yml
      - pages.yml
      - pages-build.yml
      - pages-deploy.yml
      - pnpm-pages.yml
      - release-build.yml
      - rust-release.yml
      - update-production.yml

  not-yet:
    reason: >-
      No blocker: it needs a fixture and a leg, and has not had one written.
      Listed so the gap is countable rather than invisible. Each rung of the
      adoption-readiness work moves names out of this group.
    workflows:
      - csharp-scan.yml
      - cypress.yml
      - deb-build.yml
      - go-scan.yml
      - php.yml
      - php-scan.yml
      - pimcore.yml
      - pimcore-bundle-check.yml
      - playwright.yml
      - pnpm-cypress.yml
      - pnpm-playwright.yml
      - rpm-build.yml
      - tauri.yml
      - tauri-scan.yml

# Notes on entries whose group does not tell the whole story. A note never
# excuses an entry from its group; it records what a future leg can still reach.
notes:
  php-scan.yml: >-
    Not driven whole -- that needs a PHP project with phpunit and a framework,
    which is the php rung. Its one security stage is driven though:
    `php-audit-refuses-what-it-must` runs the shipped `audit_command` default
    against a fixture pinned to a published advisory and against a clean one,
    so the default this preset turns on for every adopter is not taken on
    trust.
  deb-build.yml: >-
    The build half is testable and the upload half is not: attaching the .deb to
    a release needs a release to attach it to.
  rpm-build.yml: >-
    As deb-build.yml -- the build is reachable, the upload is not.
  gitleaks-scan.yml: >-
    Driven at its defaults, and the action it calls is driven in both
    directions against a directory with a planted key. Two things stay
    unexercised: the SARIF upload, which needs `security-events: write` and so
    cannot run from a fork's pull request; and the action *as this branch has
    it* when reached through the preset, because the preset must reference it
    as `@production` -- a reusable workflow called from another repository
    resolves a relative `uses:` against the caller's checkout. A change to the
    action is therefore exercised by `gitleaks-refuses-what-it-must` and not by
    the preset leg.
  trivy-scan.yml: >-
    Driven against the fixture pinned to a published advisory, and the failing
    direction is driven through the action with `exit-code: 1`. The SARIF
    upload is off on purpose rather than unreachable: uploading would file
    code-scanning alerts against this repository for a dependency that is
    vulnerable by design.
  docker-scan.yml: >-
    Exercised as far as the credential: `docker-scan-defaults-can-pass` builds
    the fixture and runs Trivy, the step that decides whether Snyk *can* run is
    driven with and without a token, and the Snyk call itself is run against
    the fixture with a deliberately invalid one -- it reaches authentication,
    which is the last thing provable without the account. What stays
    unexercised is a scan that authenticates, and `fail_on_findings: true` --
    whether a scan finds anything depends on the CVE state of a public base
    image, which changes without us.
  release-rc-pr.yml: >-
    Needs `GH_PAT` because the default token cannot open a pull request that
    triggers further workflows. Its refusal path -- a 403 logged as a warning
    while the job exits 0 -- is the failure that prompted this list.
